name: WB API price check

on:
  push:
    paths:
      - '.github/workflows/wb-api-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Wildberries Prices API
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WB_API_TOKEN:-}" ]; then
            echo "WB_API_TOKEN_MISSING=1"
            exit 2
          fi

          HTTP_CODE=$(curl -sS -o /tmp/wb.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: $WB_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"nmList":[466513948]}' \
            'https://discounts-prices-api.wildberries.ru/api/v2/list/goods/filter')

          echo "WB_HTTP_STATUS=$HTTP_CODE"

          python3 - <<'PY'
          import json, sys
          p="/tmp/wb.json"
          try:
              data=json.load(open(p,encoding="utf-8"))
          except Exception as e:
              print("WB_PARSE_ERROR=1")
              sys.exit(3)

          if isinstance(data,dict) and data.get("error"):
              print("WB_API_ERROR=1")
              print("WB_ERROR_TEXT="+str(data.get("errorText",""))[:300])
              sys.exit(4)

          goods=((data.get("data") or {}).get("listGoods") or []) if isinstance(data,dict) else []
          print("WB_API_RESULT=OK")
          print("WB_ITEMS_FOUND="+str(len(goods)))

          for g in goods:
              if not isinstance(g,dict):
                  continue
              print("WB_NMID="+str(g.get("nmID","")))
              print("WB_VENDOR_CODE="+str(g.get("vendorCode","")))
              print("WB_DISCOUNT="+str(g.get("discount","")))
              print("WB_CLUB_DISCOUNT="+str(g.get("clubDiscount","")))
              print("WB_CURRENCY="+str(g.get("currencyIsoCode4217","")))
              sizes=g.get("sizes") or []
              if sizes:
                  s=sizes[0] or {}
                  print("WB_PRICE="+str(s.get("price","")))
                  print("WB_DISCOUNTED_PRICE="+str(s.get("discountedPrice","")))
                  print("WB_CLUB_DISCOUNTED_PRICE="+str(s.get("clubDiscountedPrice","")))
          PY
