name: Deploy ChatGPT browser MCP

on:
  push:
    paths:
      - '.github/workflows/browser-agent-bootstrap.yml'
      - 'infra/browser-agent/**'
      - 'scripts/deploy_browser_agent.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: browser-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy secured Playwright MCP to NetAngels VDS
        id: deploy
        continue-on-error: true
        run: python3 scripts/deploy_browser_agent.py

      - name: Save deployment status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .browser-agent/status.json ]; then
            mkdir -p .browser-agent
            printf '%s\n' '{"status":"FAILED","error":"deployer did not create status.json"}' > .browser-agent/status.json
          fi
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .browser-agent/status.json
          git commit -m "chore(browser-agent): deployment status [skip ci]" || true
          git push origin HEAD:main

      - name: Mark unsuccessful deployment
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
            exit 1
          fi
