name: Каталог — получить Norden из Ozon

on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog/run_trigger.txt'
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  export:
    if: github.event_name != 'issues' || github.event.issue.title == '[CATALOG-DATA] Ozon Norden'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Получить товары Norden из Ozon API
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python catalog/export_ozon_norden_data.py

      - name: Сохранить выгрузку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/norden_export.json
          if ! git diff --cached --quiet; then
            git commit -m "Обновить каталог Norden из Ozon"
            git push
          fi
