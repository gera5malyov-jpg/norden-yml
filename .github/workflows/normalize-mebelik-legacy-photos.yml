name: Normalize remaining Mebelik legacy photo URLs
on:
  push:
    branches: [main]
    paths:
      - scripts/normalize_mebelik_legacy_photos.py
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert existing Mebelik HTTP images in mapped old cards to HTTPS
        run: python3 -u scripts/normalize_mebelik_legacy_photos.py
