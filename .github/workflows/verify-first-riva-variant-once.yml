name: Verify first Riva variant once

on:
  push:
    branches:
      - feat/riva-kit-sync
    paths:
      - '.github/workflows/verify-first-riva-variant-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact first Riva article
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ['YANDEX_KIT_TOKEN'].strip()
          q=urllib.parse.urlencode({'name':'Л.МП-1','page':1,'per_page':100})
          req=urllib.request.Request(
              'https://api.kit.yandex.net/v1/variants?'+q,
              headers={'Authorization':f'Bearer {token}','Accept':'application/json'}
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              payload=json.load(r)
          rows=payload.get('variants',[]) if isinstance(payload,dict) else []
          exact=[row for row in rows if str(row.get('sku','')).strip()=='Л.МП-1']
          print('EXACT_MATCHES',len(exact))
          for row in exact:
              print(json.dumps({
                  'id':row.get('id'),
                  'sku':row.get('sku'),
                  'name':row.get('name'),
                  'brand':row.get('brand'),
                  'pricing':row.get('pricing'),
                  'stocks':row.get('stocks'),
                  'characteristics':row.get('characteristics'),
              },ensure_ascii=False))
          PY
