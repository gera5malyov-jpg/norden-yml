name: Ozon -> Yandex Market images only

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_yandex_market_images_from_ozon.py'
      - '.github/workflows/yandex-market-images-from-ozon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Sync ONLY pictures Ozon -> Yandex Market
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_BUSINESS_ID: "117585391"
        run: python scripts/sync_yandex_market_images_from_ozon.py
