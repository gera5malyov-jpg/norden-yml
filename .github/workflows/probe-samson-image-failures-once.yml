name: Probe Samson image failures once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-samson-image-failures-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe KIT image uploads for one failing SKU
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import os, tempfile
          from urllib.parse import urlparse
          from samson_kit.http import SafeSession
          from samson_kit.kit_client import KitClient
          from samson_kit.mapper import extract_images

          http=SafeSession(max_attempts=4)
          kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],http)
          code='105715'
          payload=http.request_json(
              'GET', f'https://api.samsonopt.ru/v1/sku/{code}',
              params={'api_key':os.environ['SAMSON_API_KEY'],'response_format':'json'},
              headers={'Accept':'application/json','User-Agent':'megapolis-samson-kit/1.0'},
          )
          envelope=payload[0] if isinstance(payload,list) and len(payload)==1 else payload
          rows=(envelope or {}).get('data') if isinstance(envelope,dict) else None
          row=(rows or [None])[0] if isinstance(rows,list) else None
          if not isinstance(row,dict):
              raise RuntimeError('Samson target row missing')
          urls=extract_images(row)
          print(f'SKU={code} SOURCE_IMAGES={len(urls)}',flush=True)
          failures=0
          for idx,url in enumerate(urls,1):
              try:
                  suffix=os.path.splitext(urlparse(url).path)[1] or '.jpg'
                  with tempfile.TemporaryDirectory(prefix='samson-kit-upload-probe-') as td:
                      path=os.path.join(td,'image'+suffix[:10])
                      http.download_to_file(url,path)
                      uploaded=kit.upload_image(path)
                  print(f'KIT_UPLOAD_OK index={idx}/{len(urls)} file_id={uploaded.get("id")} url={url}',flush=True)
              except Exception as exc:
                  failures += 1
                  print(f'KIT_UPLOAD_FAIL index={idx}/{len(urls)} error={str(exc)[:1000]} url={url}',flush=True)
          print(f'KIT_UPLOAD_FAILURES={failures}',flush=True)
          PY
