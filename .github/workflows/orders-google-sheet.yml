name: Заказы → Google Sheets

on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'orders-sheet/sync_orders_sheet.py'
      - 'orders-sheet/google_sheet_id.txt'
      - '.github/workflows/orders-google-sheet.yml'

permissions:
  contents: read

concurrency:
  group: orders-google-sheet
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install --disable-pip-version-check requests "gspread>=6.1,<7" "google-auth>=2.35,<3"

      - name: Проверить синтаксис
        run: python -m py_compile orders-sheet/sync_orders_sheet.py

      - name: Обновить таблицу недоставленных заказов
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_ORDERS_OWNER_EMAIL: 'gera5malyov@gmail.com'
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: 'https://profikompany.ru'
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          OZON_ORDER_IMPORT_CUTOFF: '2026-08-25T00:00:00Z'
          DIRECT_OZON_REFRESH: '1'
          DRY_RUN: '1'
        run: python orders-sheet/sync_orders_sheet.py

      - name: Итог
        if: always()
        shell: bash
        run: |
          if [ -f orders-sheet/runtime/last_report.json ]; then
            echo '## Таблица заказов' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path("orders-sheet/runtime/last_report.json").read_text(encoding="utf-8"))
          print(f"- Недоставленных заказов: **{d.get('orders_total', 0)}**")
          print(f"- Источники: **{d.get('counts_by_source', {})}**")
          print(f"- Таблица: {d.get('spreadsheet_url', '')}")
          for w in d.get("warnings") or []:
              print(f"- Предупреждение: {w}")
          PY
          else
            echo 'Отчёт не создан.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Сохранить отчёт запуска
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orders-google-sheet-${{ github.run_id }}
          path: orders-sheet/runtime/last_report.json
          if-no-files-found: warn
          retention-days: 30
