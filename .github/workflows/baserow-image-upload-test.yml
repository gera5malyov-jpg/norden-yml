name: Test Baserow image upload via URL

on:
  push:
    branches: [main]
    paths:
      - baserow-image-upload-test.txt

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Test upload
        run: |
          python3 - <<'PY'
          import os, requests, json
          h={'Authorization':'Token '+os.environ['BASEROW_DATABASE_TOKEN'],'Accept':'application/json'}
          url='https://avatars.mds.yandex.net/get-yastore/21497181/wdgsffbq5qjg2jzm559sx99k7j7v48mx/orig'
          r=requests.post('http://147.78.67.6/api/user-files/upload-via-url/',headers=h,json={'url':url},timeout=60)
          print('HTTP',r.status_code)
          print(r.text[:3000])
          if not r.ok:
              raise SystemExit(1)
          d=r.json()
          print('NAME',d.get('name'))
          print('IS_IMAGE',d.get('is_image'))
          PY
