name: Browser MCP SSH probe

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/browser_mcp_ssh_probe.py"
      - ".github/workflows/browser-mcp-ssh-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe VDS using temporary SSH key
        run: python3 scripts/browser_mcp_ssh_probe.py
