name: Ozon replace non-3x4 images batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-replace-3x4-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Prepare and convert non-3x4 images
        run: python ozon/replace_images_3x4_batch.py prepare

      - name: Publish converted images for Ozon import
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ozon/image_3x4_replace_batch/
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare Ozon 3x4 replacements [skip ci]"
            git push
          fi

      - name: Replace Ozon images and verify
        run: python ozon/replace_images_3x4_batch.py apply

      - name: Save final reports
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ozon/image_3x4_replace_batch/
          if ! git diff --cached --quiet; then
            git commit -m "report: Ozon batch 3x4 replacement verification [skip ci]"
            git push
          fi

      - name: Upload batch report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ozon-3x4-replacement-batch
          path: ozon/image_3x4_replace_batch/
          if-no-files-found: warn
          retention-days: 30
