name: Ozon replace non-3x4 images batch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      OZON_TEMP_BRANCH: ozon-image-temp-${{ github.run_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Prepare and convert non-3x4 images
        run: python ozon/replace_images_3x4_batch.py prepare

      - name: Publish converted images on disposable branch
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          mkdir -p "$TMP_DIR/ozon/image_3x4_replace_batch"
          find ozon/image_3x4_replace_batch -type f -name '*.jpg' -print0 | while IFS= read -r -d '' f; do
            mkdir -p "$TMP_DIR/$(dirname "$f")"
            cp "$f" "$TMP_DIR/$f"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan "$OZON_TEMP_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$TMP_DIR"/. .
          git add ozon/image_3x4_replace_batch/
          if git diff --cached --quiet; then
            echo "No converted JPG files need public staging"
          else
            git commit -m "temp: Ozon image staging [skip ci]"
            git push --force origin "HEAD:$OZON_TEMP_BRANCH"
          fi

          git switch main
          git reset --hard origin/main

      - name: Restore prepare reports
        shell: bash
        run: |
          # Prepare again after returning to main so manifest/reports exist locally.
          # Existing Ozon cards are still unchanged at this point.
          python ozon/replace_images_3x4_batch.py prepare

      - name: Replace Ozon images and verify
        run: python ozon/replace_images_3x4_batch.py apply

      - name: Wait until Ozon owns all image URLs
        run: python ozon/replace_images_3x4_batch.py wait-materialized

      - name: Remove disposable image branch
        if: success()
        shell: bash
        run: |
          git push origin --delete "$OZON_TEMP_BRANCH" || true

      - name: Save JSON reports only
        if: always()
        shell: bash
        run: |
          find ozon/image_3x4_replace_batch -type f -name '*.jpg' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ozon/image_3x4_replace_batch/
          if ! git diff --cached --quiet; then
            git commit -m "report: Ozon 3x4 verification without binaries [skip ci]"
            git push
          fi
