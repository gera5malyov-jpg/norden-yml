name: Inspect YML PRO 33krovati SKU mapping
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: ['.github/workflows/inspect-yml289-skumap.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/inspect_ymlpro_289_sku_mapping.py
