name: Afina Garden → KIT → Webasyst — ежедневно

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только проверка без записи'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: afinalux-daily-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: python -m pip install --disable-pip-version-check requests

      - name: Проверить код
        run: python -m py_compile afinalux-kit/sync_afinalux.py webasyst/client.py

      - name: Обновить Afina Garden в KIT и Webasyst
        id: sync
        continue-on-error: true
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          AFINALUX_WEBASYST_WRITE_DELAY: '0.55'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python afinalux-kit/sync_afinalux.py "${args[@]}"

      - name: Сохранить отчёт
        if: always()
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          cp afinalux-kit/last_sync_report.json /tmp/afinalux-report.json 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          if [ -f /tmp/afinalux-report.json ]; then
            mkdir -p afinalux-kit
            cp /tmp/afinalux-report.json afinalux-kit/last_sync_report.json
          fi
          git add afinalux-kit/last_sync_report.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Обновить отчёт Afina Garden'
          git push origin HEAD:main || true

      - name: Завершить с ошибкой при проблемах
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: test "$SYNC_OUTCOME" = "success"
