name: WB economics check

on:
  push:
    paths:
      - '.github/workflows/wb-economics-check.yml'
      - 'scripts/wb_economics_check.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check WB economics for nmID 466513948
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python3 scripts/wb_economics_check.py
