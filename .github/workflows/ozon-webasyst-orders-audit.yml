name: Audit Ozon orders to Webasyst

on:
  push:
    paths:
      - '.github/workflows/ozon-webasyst-orders-audit.yml'
      - 'scripts/audit_ozon_webasyst_orders.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Audit Ozon order APIs and Webasyst workflow
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python scripts/audit_ozon_webasyst_orders.py
      - name: Save sanitized audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ozon/order_sync_audit.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Audit Ozon order sync readiness"
            git push
          fi
