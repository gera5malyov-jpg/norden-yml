name: Samson repeat-id dedupe tests

on:
  push:
    branches: [fix/samson-kit-api-repeat-dedupe]
    paths:
      - 'samson-kit/tests/test_core.py'
      - 'samson-kit/samson_kit/kit_client.py'
      - '.github/workflows/samson-repeat-id-dedupe-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=samson-kit python -m unittest samson-kit/tests/test_core.py -v
