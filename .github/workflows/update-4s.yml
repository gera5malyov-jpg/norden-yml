name: Update 4s-mebel YML

on:
  schedule:
    # Weekly full 4 Seasons refresh: Sunday 00:17 UTC (03:17 Moscow).
    - cron: '17 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 4s-mebel-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-4s.txt

      - name: Install dependencies
        run: pip install -r requirements-4s.txt

      - name: Parse 4s-mebel.ru
        run: python parse_4s.py

      - name: Validate YML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('4s-mebel.yml').getroot()
          offers = root.findall('.//offer')
          if len(offers) < 20:
              raise SystemExit(f'Too few brand 4 Сезона offers: {len(offers)}')
          vendors={str(x.findtext('vendor') or '').strip() for x in offers}
          if vendors != {'4 Сезона'}:
              raise SystemExit(f'Unexpected vendors: {vendors}')
          print(f'YML valid: {len(offers)} brand 4 Сезона offers')
          PY

      - name: Commit YML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 4s-mebel.yml
          if ! git diff --cached --quiet; then
            git commit -m "Update 4s-mebel YML"
            git pull --rebase origin main
            git push
          else
            echo "No feed changes"
          fi

      - name: Sync prices and stocks to Yandex KIT
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: python 4s-kit/sync_4s_kit.py

      - name: Sync marked 4S products to Webasyst type 333
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          DRY_RUN: '0'
          FOURS_WEBASYST_WRITE_DELAY: '0.80'
        run: python webasyst/sync_4s_kit_to_webasyst.py

      - name: Print Webasyst sync report
        if: always()
        run: cat webasyst/last_4s_kit_sync_report.json || true

      - name: Print KIT sync report
        if: always()
        run: cat 4s-kit/last_sync_report.json || true
