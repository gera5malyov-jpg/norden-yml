name: Update 4s-mebel YML

on:
  schedule:
    # Weekly full 4 Seasons refresh: Sunday 00:17 UTC (03:17 Moscow).
    - cron: '17 0 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'parse_4s.py'

permissions:
  contents: write

concurrency:
  group: 4s-mebel-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-4s.txt

      - name: Install dependencies
        run: pip install -r requirements-4s.txt

      - name: Parse 4s-mebel.ru
        run: python parse_4s.py

      - name: Validate YML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('4s-mebel.yml').getroot()
          offers = root.findall('.//offer')
          if len(offers) < 20:
              raise SystemExit(f'Too few brand 4 Сезона offers: {len(offers)}')
          vendors={str(x.findtext('vendor') or '').strip() for x in offers}
          if vendors != {'4 Сезона'}:
              raise SystemExit(f'Unexpected vendors: {vendors}')
          # Reject drastic accidental catalog truncation.
          import subprocess
          previous=subprocess.run(
              ['git','show','HEAD:4s-mebel.yml'],capture_output=True,check=True,
          ).stdout
          old_count=len(ET.fromstring(previous).findall('.//offers/offer'))
          min_count=max(1800,int(old_count*0.90))
          if len(offers)<min_count:
              raise SystemExit(f'Feed unexpectedly shrank: {old_count} -> {len(offers)} (min {min_count})')
          ids=[x.get('id') for x in offers]
          if len(ids)!=len(set(ids)):
              raise SystemExit('Duplicate offer IDs in refreshed feed')
          if any(not x.findtext('price') for x in offers):
              raise SystemExit('An offer is missing price')
          print(f'YML valid: {len(offers)} brand 4 Сезона offers; previous {old_count}')
          PY

      # Publish the feed only. A separate workflow_run job updates KIT after
      # this workflow completes successfully. No direct Webasyst writes here.
      - name: Commit YML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 4s-mebel.yml
          if ! git diff --cached --quiet; then
            git commit -m "Update 4s-mebel YML"
            git pull --rebase origin main
            git push
          else
            echo "No feed changes"
          fi
