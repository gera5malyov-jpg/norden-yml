name: Diagnose 4S KIT duplicate targeted

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-4s-kit-duplicate-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Targeted duplicate diagnostics
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import importlib.util, json, os, pathlib
          path=pathlib.Path('4s-kit/sync_4s_kit.py')
          spec=importlib.util.spec_from_file_location('sync4s', path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          kit=mod.Kit(os.environ['YANDEX_KIT_TOKEN'])
          chars=kit.characteristics()
          code_site_id,article_id=mod.resolve_special_characteristics(chars)

          tests=[
              ('sku','333-1551016'),
              ('sku','333-1508664'),
              ('kit_id','1551016'),
              ('kit_id','1508664'),
              ('search','Двухъярусная кровать-диван Дакар 2'),
              ('query','Двухъярусная кровать-диван Дакар 2'),
          ]
          for key,value in tests:
              try:
                  payload=kit.request('GET','/v1/variants',params={key:value,'page':1,'per_page':100})
                  rows=kit.items(payload)
                  safe=[]
                  for v in rows:
                      name=mod.s(v.get('name'))
                      sku=mod.s(v.get('sku'))
                      kid=mod.s(v.get('kit_id'))
                      if ('дакар' in name.casefold()) or sku in {'333-1551016','333-1508664'} or kid in {'1551016','1508664'}:
                          safe.append({
                              'id':mod.s(v.get('id')),
                              'kit_id':kid,
                              'sku':sku,
                              'name':name,
                              'brand':v.get('brand'),
                              'code_site':mod.char_value(v,code_site_id),
                              'article':mod.char_value(v,article_id),
                              'product_id':mod.s(v.get('product_id')),
                              'category_ids':v.get('category_ids'),
                          })
                  print('TEST',key,value,'returned',len(rows),'total',kit.total(payload),'matches',json.dumps(safe,ensure_ascii=False))
              except Exception as exc:
                  print('TEST_ERROR',key,value,type(exc).__name__,str(exc)[:1000])
          PY
