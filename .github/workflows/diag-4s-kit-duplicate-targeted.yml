name: Diagnose 4S KIT duplicate targeted

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-4s-kit-duplicate-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect exact Dakar duplicate cards
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, requests
          base='https://api.kit.yandex.net'
          h={'Authorization':'Bearer '+os.environ['YANDEX_KIT_TOKEN'],'Accept':'application/json'}
          ids=[
            '01a0a11a-5e79-705e-8103-d0272043fcf3',
            '01a0c3e1-b1b5-798c-a512-21a9732c136b',
          ]
          for vid in ids:
              r=requests.get(base+'/v1/variants/'+vid,headers=h,timeout=60)
              print('HTTP',vid,r.status_code)
              r.raise_for_status()
              v=r.json()
              safe={k:v.get(k) for k in [
                  'id','kit_id','sku','name','brand','status','created_at','updated_at',
                  'product_id','category_ids','pricing','stocks','media'
              ] if k in v}
              safe['characteristics']=v.get('characteristics')
              print(json.dumps(safe,ensure_ascii=False,indent=2))
          PY
