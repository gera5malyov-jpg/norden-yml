name: PEK private shipment report

on:
  push:
    paths:
      - '.github/workflows/pek-private-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and encrypt PEK shipment data
        env:
          PEK_LOGIN: ${{ secrets.PEK_LOGIN }}
          PEK_API_KEY: ${{ secrets.PEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PEK_LOGIN:-}"
          test -n "${PEK_API_KEY:-}"

          cat > /tmp/pek_report.py <<'PY'
          import os, json, base64, urllib.request
          from datetime import datetime, timedelta, timezone

          login=os.environ["PEK_LOGIN"]
          key=os.environ["PEK_API_KEY"]
          auth=base64.b64encode((login+":"+key).encode()).decode()
          base="https://kabinet.pecom.ru/api/v1"

          def post(path, payload):
              raw=json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req=urllib.request.Request(base+path, data=raw, method="POST")
              req.add_header("Authorization","Basic "+auth)
              req.add_header("Content-Type","application/json; charset=utf-8")
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.loads(r.read().decode("utf-8"))

          def pick(d, *keys):
              if not isinstance(d, dict):
                  return None
              for k in keys:
                  if k in d:
                      return d[k]
              return None

          end=datetime.now(timezone.utc).date()
          begin=end-timedelta(days=30)
          listing=post("/cargos/listallorderbylogin/", {
              "selectBy":1,
              "dateBegin":str(begin),
              "dateEnd":str(end),
          })
          cargos=pick(listing,"cargos","сargos") or []
          codes=[]
          by_code={}
          for c in cargos:
              code=pick(c,"code","сode")
              if code:
                  code=str(code)
                  codes.append(code)
                  by_code[code]=c

          status_data={"cargos":[]}
          current_data={"cargos":[]}
          if codes:
              status_data=post("/cargos/status/", {"cargoCodes":codes[:15]})
              current_data=post("/cargos/currentstatus/", {"cargoCodes":codes[:15]})

          status_map={}
          for s in pick(status_data,"cargos","сargos") or []:
              cargo=pick(s,"cargo") or {}
              code=pick(cargo,"code","сode")
              if code:
                  status_map[str(code)]=s

          current_map={}
          for s in pick(current_data,"cargos","сargos") or []:
              code=pick(s,"cargoCode","cargoСode","сargoCode")
              if code:
                  current_map[str(code)]=s

          out=[]
          for code in codes:
              l=by_code.get(code,{})
              s=status_map.get(code,{})
              info=pick(s,"info") or {}
              cargo=pick(s,"cargo") or {}
              services=pick(s,"services") or {}
              sender=pick(s,"sender") or {}
              receiver=pick(s,"receiver") or {}
              sb=pick(sender,"branchInfo") or {}
              rb=pick(receiver,"branch") or {}
              if isinstance(rb,str):
                  receiver_city=rb
              else:
                  receiver_city=pick(rb,"city","name")
              current=pick(current_map.get(code,{}),"currentStatus") or {}

              items=pick(services,"items") or []
              paid_total=sum(float(pick(x,"paid") or 0) for x in items if isinstance(x,dict))

              out.append({
                  "cargoCode": code,
                  "orderNumber": pick(cargo,"orderNumber") or pick(l,"orderNumber"),
                  "orderDate": pick(l,"orderDate"),
                  "description": pick(cargo,"description") or pick(l,"description"),
                  "senderCity": pick(sb,"city") or pick(sender,"branch"),
                  "receiverCity": receiver_city,
                  "status": pick(info,"cargoStatus"),
                  "statusDetail": pick(current,"ClientStatusLevel2","clientStatusLevel2"),
                  "statusTooltip": pick(current,"Tooltip","tooltip"),
                  "arrivalPlanDateTime": pick(info,"arrivalPlanDateTime"),
                  "arrivalContractDateTime": pick(info,"arrivalContractDateTime"),
                  "deliveryPlanDate": pick(info,"deliveryPlanDate"),
                  "receivedByClientDateTime": pick(info,"receivedByClientDateTime"),
                  "amount": pick(cargo,"amount"),
                  "weightKg": pick(cargo,"weight"),
                  "volumeM3": pick(cargo,"volume"),
                  "costRub": pick(services,"sum"),
                  "paidRub": paid_total,
                  "debtRub": pick(services,"debt"),
              })

          report={
              "period":{"dateBegin":str(begin),"dateEnd":str(end)},
              "count":len(out),
              "shipments":out
          }
          with open("/tmp/pek_report.json","w",encoding="utf-8") as f:
              json.dump(report,f,ensure_ascii=False,separators=(",",":"))
          PY

          python3 /tmp/pek_report.py

          cat > /tmp/public.pem <<'PUB'
          -----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAs/yY+HGeMhQ7vbc7prkS
/RHGo2yeHs3h+Ye4XTXsy4LFl1zh19E4BU2gza6XJTtPm0HS4bwkHqHl9TbQCDQF
O2Or0EH7KwuP5g70FM6d2azLbm3Bk3h2XEAdtQy1gMFjHmDBFQZIofqB2r5D56co
7M8FdQzhWah4+xDc47hIs7sSEZaITLVOzKv7TTk9EAuLs024kOOuoCzlC1/Wa+b8
eSFpivMPiqL9o2hXgu4dwuL8a6w9q+eSypxRjW6Z7D7DUpCa/v7MMtW9du4+VEgG
eIopXiUlEiSHL8XNPe1llDk+hv9Vt218TvTpS7Q5jR8T4NJYgCaoDeULivdwRman
fwIDAQAB
-----END PUBLIC KEY-----
          PUB

          KEY_HEX="$(openssl rand -hex 32)"
          IV_HEX="$(openssl rand -hex 16)"
          printf '%s:%s' "$KEY_HEX" "$IV_HEX" > /tmp/keyiv.txt

          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in /tmp/pek_report.json -out /tmp/pek_report.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/keyiv.txt -out /tmp/keyiv.enc

          echo "PEK_ENC_KEYIV=$(base64 -w0 /tmp/keyiv.enc)"
          echo "PEK_ENC_DATA=$(base64 -w0 /tmp/pek_report.enc)"
          echo "PEK_PRIVATE_REPORT=OK"
