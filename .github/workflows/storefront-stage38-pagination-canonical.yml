name: Storefront Stage 38 - Category pagination canonical SEO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage38-pagination-canonical.yml'
      - 'storefront/stage38_pagination_canonical.py'
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical fix
        run: python -m py_compile storefront/stage38_pagination_canonical.py
      - name: Preserve indexed category pages and validate sorting isolation
        run: python storefront/stage38_pagination_canonical.py
