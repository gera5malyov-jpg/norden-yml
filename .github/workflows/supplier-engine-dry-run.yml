name: Supplier engine dry-run

on:
  workflow_dispatch:
    inputs:
      config:
        description: Supplier config path
        required: true
        default: supplier_engine/supplier.example.json
      previous_count:
        description: Previous successful source count (optional)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl pytest
      - name: Engine tests
        run: pytest -q tests/test_supplier_engine.py
      - name: Supplier dry-run
        shell: bash
        run: |
          args=( "${{ inputs.config }}" --output supplier-dry-run.json )
          if [ -n "${{ inputs.previous_count }}" ]; then
            args+=( --previous-count "${{ inputs.previous_count }}" )
          fi
          python -m supplier_engine.runner "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-dry-run
          path: supplier-dry-run.json
          if-no-files-found: warn
