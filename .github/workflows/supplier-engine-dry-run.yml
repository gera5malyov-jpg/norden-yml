name: Supplier engine validation

on:
  pull_request:
    paths:
      - 'supplier_engine/**'
      - 'tests/test_supplier_engine.py'
      - 'tests/test_megasuppliers_contract.py'
      - '.github/workflows/supplier-engine-dry-run.yml'
      - 'webasyst/megasuppliers/**'
      - 'scripts/build_megasuppliers_package.py'
  workflow_dispatch:
    inputs:
      config:
        description: Supplier config path in repository (used when config_b64 is empty)
        required: false
        default: supplier_engine/supplier.example.json
      config_b64:
        description: Base64 supplier config sent by Webasyst
        required: false
        default: ''
      mode:
        description: dry-run or apply
        required: false
        default: dry-run
      supplier_id:
        description: Webasyst supplier id
        required: false
        default: ''
      request_id:
        description: Unique Webasyst request id
        required: false
        default: ''
      previous_count:
        description: Previous successful source count
        required: false
        default: ''
      callback_url:
        description: Webasyst callback URL
        required: false
        default: ''
      bridge_url:
        description: Signed Webasyst bridge URL
        required: false
        default: ''
      webasyst_base_url:
        description: Webasyst base URL
        required: false
        default: 'https://profikompany.ru'
      source_secret:
        description: GitHub secret name containing private supplier source URL
        required: false
        default: ''
      approved_source_sha256:
        description: Source hash approved by the preceding dry-run
        required: false
        default: ''

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          coverage: none
      - run: pip install openpyxl pytest google-api-python-client google-auth requests pdfplumber reportlab
      - name: Read-only Webasyst API smoke check
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from webasyst.client import WebasystClient
          if not os.environ.get('WEBASYST_API_TOKEN','').strip():
              raise SystemExit('WEBASYST_API_TOKEN is not configured')
          payload=WebasystClient(min_request_interval=0).call(
              'shop.product.search',
              params={'limit':1,'fields':'id,name,skus'}
          )
          if not isinstance(payload,(dict,list)):
              raise SystemExit('unexpected Webasyst response')
          print('WEBASYST_READ_ONLY_SMOKE=ok')
          PY
      - name: Supplier engine tests
        run: python -m pytest -q tests/test_supplier_engine.py tests/test_megasuppliers_contract.py
      - name: PHP 7.3 syntax check
        run: find webasyst/megasuppliers/lib -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Build installable plugin package
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import io, json, os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          info=json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'])
          creds=service_account.Credentials.from_service_account_info(info,scopes=['https://www.googleapis.com/auth/drive.readonly'])
          svc=build('drive','v3',credentials=creds,cache_discovery=False)
          req=svc.files().get_media(fileId='129zSQGB1FKGrn1AgkbJg-EGIvQYylfxQ')
          with io.FileIO('/tmp/megasuppliers-base.zip','wb') as fh:
              dl=MediaIoBaseDownload(fh,req); done=False
              while not done: _,done=dl.next_chunk()
          PY
          python scripts/build_megasuppliers_package.py --base /tmp/megasuppliers-base.zip --output /tmp/megasuppliers-1.1.0.zip
          rm -rf /tmp/megasuppliers-built && mkdir /tmp/megasuppliers-built
          unzip -q /tmp/megasuppliers-1.1.0.zip -d /tmp/megasuppliers-built
          find /tmp/megasuppliers-built/megasuppliers -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          grep -q "'version' => '1.1.0'" /tmp/megasuppliers-built/megasuppliers/lib/config/plugin.php
          grep -q "megasuppliers-callback/" /tmp/megasuppliers-built/megasuppliers/lib/config/routing.php
          grep -q "megasuppliers-bridge/" /tmp/megasuppliers-built/megasuppliers/lib/config/routing.php
      - uses: actions/upload-artifact@v4
        with:
          name: megasuppliers-1.1.0
          path: /tmp/megasuppliers-1.1.0.zip
          if-no-files-found: error

  supplier-run:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPPLIER_SOURCE_URL: ${{ inputs.source_secret != '' && secrets[inputs.source_secret] || '' }}
      MEGASUPPLIERS_BRIDGE_URL: ${{ inputs.bridge_url }}
      MEGASUPPLIERS_CALLBACK_SECRET: ${{ secrets.MEGASUPPLIERS_CALLBACK_SECRET }}
      WEBASYST_BASE_URL: ${{ inputs.webasyst_base_url }}
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl requests pdfplumber
      - name: Resolve supplier config
        id: cfg
        env:
          CONFIG_B64: ${{ inputs.config_b64 }}
          CONFIG_PATH: ${{ inputs.config }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw=os.environ.get('CONFIG_B64','').strip()
          if raw:
              data=base64.b64decode(raw, validate=True)
              if len(data)>40000:
                  raise SystemExit('decoded config is too large')
              Path('/tmp/supplier-config.json').write_bytes(data)
              path='/tmp/supplier-config.json'
          else:
              path=os.environ.get('CONFIG_PATH','').strip()
              if not path or not Path(path).is_file():
                  raise SystemExit('supplier config not found')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('path='+path+'\n')
          PY
      - name: Validate dispatch contract
        env:
          RUN_MODE: ${{ inputs.mode }}
          SOURCE_SECRET_NAME: ${{ inputs.source_secret }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          BRIDGE_URL: ${{ inputs.bridge_url }}
          WEBASYST_URL: ${{ inputs.webasyst_base_url }}
          APPROVED_SOURCE_SHA256: ${{ inputs.approved_source_sha256 }}
        run: |
          python - <<'PY'
          import os, re
          from urllib.parse import urlsplit

          mode=os.environ.get('RUN_MODE','')
          if mode not in {'dry-run','apply'}:
              raise SystemExit('invalid mode')

          secret_name=os.environ.get('SOURCE_SECRET_NAME','').strip()
          if secret_name and not re.fullmatch(r'MEGASUPPLIERS_SOURCE_[A-Z0-9_]+', secret_name):
              raise SystemExit('source_secret must use MEGASUPPLIERS_SOURCE_* naming')

          expected=('https','profikompany.ru')
          for name in ('CALLBACK_URL','BRIDGE_URL','WEBASYST_URL'):
              value=os.environ.get(name,'').strip()
              if not value:
                  if mode=='apply' and name in {'BRIDGE_URL','WEBASYST_URL'}:
                      raise SystemExit(name+' is required for apply')
                  continue
              parsed=urlsplit(value)
              if (parsed.scheme.lower(), parsed.hostname or '') != expected:
                  raise SystemExit(name+' must stay on https://profikompany.ru')

          callback=os.environ.get('CALLBACK_URL','').strip()
          if callback and urlsplit(callback).path != '/megasuppliers-callback/':
              raise SystemExit('invalid callback path')
          bridge=os.environ.get('BRIDGE_URL','').strip()
          if bridge and urlsplit(bridge).path != '/megasuppliers-bridge/':
              raise SystemExit('invalid bridge path')

          approved=os.environ.get('APPROVED_SOURCE_SHA256','').strip()
          if mode=='apply' and not re.fullmatch(r'[0-9a-fA-F]{64}', approved):
              raise SystemExit('approved_source_sha256 is required for apply')
          PY
      - name: Run supplier engine
        id: engine
        shell: bash
        env:
          RUN_MODE: ${{ inputs.mode }}
          SUPPLIER_ID: ${{ inputs.supplier_id }}
          REQUEST_ID: ${{ inputs.request_id }}
          PREVIOUS_COUNT: ${{ inputs.previous_count }}
          APPROVED_SOURCE_SHA256: ${{ inputs.approved_source_sha256 }}
        run: |
          set +e
          args=( "${{ steps.cfg.outputs.path }}" --mode "$RUN_MODE" --output supplier-run.json )
          if [ -n "$SUPPLIER_ID" ]; then args+=( --supplier-id "$SUPPLIER_ID" ); fi
          if [ -n "$REQUEST_ID" ]; then args+=( --request-id "$REQUEST_ID" ); fi
          if [ -n "$PREVIOUS_COUNT" ]; then args+=( --previous-count "$PREVIOUS_COUNT" ); fi
          if [ -n "$APPROVED_SOURCE_SHA256" ]; then args+=( --approved-source-sha256 "$APPROVED_SOURCE_SHA256" ); fi
          python -m supplier_engine.runner "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-${{ inputs.mode }}-${{ inputs.request_id || github.run_id }}
          path: supplier-run.json
          if-no-files-found: error
      - name: Send signed result to Webasyst
        if: always() && inputs.callback_url != '' && hashFiles('supplier-run.json') != ''
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_SECRET: ${{ secrets.MEGASUPPLIERS_CALLBACK_SECRET }}
          SUPPLIER_ID: ${{ inputs.supplier_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          secret=os.environ.get('CALLBACK_SECRET','')
          if not secret:
              raise SystemExit('MEGASUPPLIERS_CALLBACK_SECRET is not configured')
          report=json.load(open('supplier-run.json',encoding='utf-8'))
          payload=json.dumps({
              'supplier_id': int(os.environ['SUPPLIER_ID']),
              'request_id': os.environ['REQUEST_ID'],
              'report': report,
          },ensure_ascii=False,separators=(',',':')).encode('utf-8')
          signature='sha256='+hmac.new(secret.encode('utf-8'),payload,hashlib.sha256).hexdigest()
          req=urllib.request.Request(os.environ['CALLBACK_URL'],data=payload,method='POST',headers={
              'Content-Type':'application/json; charset=utf-8',
              'X-Megasuppliers-Signature':signature,
              'User-Agent':'Megasuppliers-GitHub-Bridge/1.1',
          })
          with urllib.request.urlopen(req,timeout=30) as response:
              if response.status//100 != 2:
                  raise SystemExit('callback HTTP %s' % response.status)
          PY
      - name: Enforce supplier run result
        if: always()
        run: exit "${{ steps.engine.outputs.exit_code || '1' }}"
