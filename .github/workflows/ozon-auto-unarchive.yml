name: Restore Ozon autoarchived products
# Selection rule: is_autoarchived=true only.

on:
  workflow_dispatch:
  schedule:
    # GitHub can delay/drop schedule events. All attempts are after 03:00 MSK.
    - cron: '27 0 * * *'  # 03:27 MSK
    - cron: '37 1 * * *'  # 04:37 MSK
    - cron: '07 3 * * *'  # 06:07 MSK
    - cron: '19 4 * * *'  # 07:19 MSK
    - cron: '41 5 * * *'  # 08:41 MSK
    - cron: '53 6 * * *'  # 09:53 MSK
  # Independent trigger from a reliable, recurring workflow.
  workflow_run:
    workflows: ["Marketplace orders to Webasyst"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-auto-unarchive.yml'
      - 'scripts/ozon_restore_autoarchived.py'

permissions:
  contents: write

concurrency:
  group: ozon-auto-unarchive
  cancel-in-progress: false

jobs:
  restore:
    # The parent also runs on push/dispatch: allow only its scheduled runs.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.event == 'schedule' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      OZON_MAX_RESTORE: '100'
      OZON_REPORT_PATH: 'results/ozon-auto-unarchive-latest.json'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify script and read-only Ozon API on code changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -e
          python3 -m py_compile scripts/ozon_restore_autoarchived.py
          python3 - <<'PY'
          from scripts import ozon_restore_autoarchived as ozon
          if not ozon.CLIENT_ID or not ozon.API_KEY:
              raise SystemExit("Ozon API secrets missing")
          items, cursor, total = ozon.list_archived_page()
          ids = [int(x["product_id"]) for x in items[:5] if x.get("product_id")]
          info = ozon.get_info(ids) if ids else []
          print(f"Ozon read-only probe OK: archived_in_first_page={len(items)}, total={total}, info_records={len(info)}")
          PY

      - name: Check whether today's 100 were already restored
        if: github.event_name != 'push'
        id: quota
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          skip = False
          path = Path(os.environ["OZON_REPORT_PATH"])
          if path.exists():
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
                  started = report.get("started_at_utc")
                  restored = int(report.get("restored_count", 0) or 0)
                  limit_hit = str(report.get("limit_hit") or "")
                  if started:
                      run_dt = datetime.fromisoformat(started.replace("Z", "+00:00"))
                      msk = timezone(timedelta(hours=3))
                      same_day = run_dt.astimezone(msk).date() == datetime.now(msk).date()
                      if same_day and (restored >= 100 or limit_hit == "restore_limit_exceeded"):
                          skip = True
              except Exception:
                  pass

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          print("Daily quota already completed; skip fallback run." if skip else "Daily quota not completed; run restore.")
          PY

      - name: Restore only automatically archived products
        if: github.event_name != 'push' && steps.quota.outputs.skip != 'true'
        id: restore
        shell: bash
        run: |
          set +e
          python3 scripts/ozon_restore_autoarchived.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save redacted report
        if: github.event_name != 'push' && steps.quota.outputs.skip != 'true'
        shell: bash
        run: |
          test -f results/ozon-auto-unarchive-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ozon-auto-unarchive-latest.json
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "Update Ozon autoarchive restore report"
            git pull --rebase origin main
            git push
          fi

      - name: Attach latest restore report
        if: always() && github.event_name != 'push' && steps.quota.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ozon-autoarchive-report-${{ github.run_id }}
          path: results/ozon-auto-unarchive-latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if restore job failed
        if: github.event_name != 'push' && steps.quota.outputs.skip != 'true' && steps.restore.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.restore.outputs.exit_code }}"
