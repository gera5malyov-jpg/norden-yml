name: Restore Ozon autoarchived products
# Selection rule: is_autoarchived=true only.

on:
  workflow_dispatch:
  schedule:
    # Ozon autoarchive restore limit resets at 03:00 Moscow time.
    # Primary run at 03:27 MSK; fallbacks at 04:37 and 06:07 MSK.
    - cron: '27 0 * * *'
    - cron: '37 1 * * *'
    - cron: '07 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-auto-unarchive.yml'
      - 'scripts/ozon_restore_autoarchived.py'

permissions:
  contents: write

concurrency:
  group: ozon-auto-unarchive
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      OZON_MAX_RESTORE: '100'
      OZON_REPORT_PATH: 'results/ozon-auto-unarchive-latest.json'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether today's 100 were already restored
        id: quota
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          skip = False
          path = Path(os.environ["OZON_REPORT_PATH"])
          if path.exists():
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
                  started = report.get("started_at_utc")
                  restored = int(report.get("restored_count", 0) or 0)
                  limit_hit = str(report.get("limit_hit") or "")
                  if started:
                      run_dt = datetime.fromisoformat(started.replace("Z", "+00:00"))
                      msk = timezone(timedelta(hours=3))
                      same_day = run_dt.astimezone(msk).date() == datetime.now(msk).date()
                      if same_day and (restored >= 100 or limit_hit == "restore_limit_exceeded"):
                          skip = True
              except Exception:
                  pass

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          print("Daily quota already completed; skip fallback run." if skip else "Daily quota not completed; run restore.")
          PY

      - name: Restore only automatically archived products
        if: steps.quota.outputs.skip != 'true'
        id: restore
        shell: bash
        run: |
          set +e
          python3 scripts/ozon_restore_autoarchived.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save redacted report
        if: steps.quota.outputs.skip != 'true'
        shell: bash
        run: |
          test -f results/ozon-auto-unarchive-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ozon-auto-unarchive-latest.json
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "Update Ozon autoarchive restore report"
            git pull --rebase origin main
            git push
          fi

      - name: Fail if restore job failed
        if: steps.quota.outputs.skip != 'true' && steps.restore.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.restore.outputs.exit_code }}"
