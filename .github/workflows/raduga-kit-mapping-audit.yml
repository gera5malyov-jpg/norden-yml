name: Raduga KIT mapping audit

on:
  push:
    paths:
      - 'scripts/raduga_sheet_mapping_audit.py'
      - '.github/workflows/raduga-kit-mapping-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests gspread google-auth rapidfuzz
      - name: Audit mapping
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: '1xZUeaWUr-6O3KK0MO-1U7IGBKXXfgcmZ-EJ-w-2wWug'
        run: python scripts/raduga_sheet_mapping_audit.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raduga-mapping-audit
          path: runtime/raduga_mapping_audit.json
          if-no-files-found: warn
          retention-days: 7
