name: Komus API probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/komus-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Komus API access and regions
        env:
          KOMUS_API: ${{ secrets.KOMUS_API }}
          KOMUS_API_KEY: ${{ secrets.KOMUS_API_KEY }}
          KOMUS_TOKEN: ${{ secrets.KOMUS_TOKEN }}
          KOMUS_API_TOKEN: ${{ secrets.KOMUS_API_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error

          candidates = [
              ("KOMUS_API", os.getenv("KOMUS_API","")),
              ("KOMUS_API_KEY", os.getenv("KOMUS_API_KEY","")),
              ("KOMUS_TOKEN", os.getenv("KOMUS_TOKEN","")),
              ("KOMUS_API_TOKEN", os.getenv("KOMUS_API_TOKEN","")),
          ]
          name, token = next(((n,v.strip()) for n,v in candidates if v and v.strip()), (None,None))
          if not token:
              raise SystemExit("No Komus secret found in expected names: KOMUS_API/KOMUS_API_KEY/KOMUS_TOKEN/KOMUS_API_TOKEN")

          H={"token":token,"Accept":"application/json","User-Agent":"Megapolis-Komus-KIT/1.0"}
          def get(path, params=None):
              q=urllib.parse.urlencode(params or {})
              u="https://komus-opt.ru/api2"+path+("?" + q if q else "")
              req=urllib.request.Request(u,headers=H)
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.loads(r.read().decode("utf-8"))

          ship=get("/shipdata/",{"format":"json"})
          regions={}
          for row in ship.get("content") or []:
              info=(row or {}).get("shipmentInfo") or {}
              rid=info.get("regionID")
              rn=str(info.get("regionName") or "").strip()
              if rid is not None and rn:
                  regions[str(rid)]=rn

          elements=get("/elements",{"format":"json","page":1,"limit":5})
          sample=elements.get("content") or []
          arts=[2505358]

          stock=None
          prices=None
          props=None
          if arts:
              body=json.dumps({"artnumbers":arts}).encode()
              req=urllib.request.Request(
                  "https://komus-opt.ru/api2/stock/?format=json",
                  data=body, method="POST",
                  headers={**H,"Content-Type":"application/json"},
              )
              with urllib.request.urlopen(req,timeout=90) as r:
                  stock=json.loads(r.read().decode("utf-8"))
              req=urllib.request.Request(
                  "https://komus-opt.ru/api2/prices/?format=json",
                  data=body, method="POST",
                  headers={**H,"Content-Type":"application/json"},
              )
              with urllib.request.urlopen(req,timeout=90) as r:
                  prices=json.loads(r.read().decode("utf-8"))
              req=urllib.request.Request(
                  "https://komus-opt.ru/api2/props/?format=json&fields=parentId,description,baseprops,barcodes,images,specifications",
                  data=body, method="POST",
                  headers={**H,"Content-Type":"application/json"},
              )
              with urllib.request.urlopen(req,timeout=90) as r:
                  props=json.loads(r.read().decode("utf-8"))

          print("KOMUS_SECRET_NAME="+str(name))
          print("KOMUS_REGIONS="+json.dumps(regions,ensure_ascii=False,sort_keys=True))
          print("KOMUS_ELEMENTS_META="+json.dumps({k:elements.get(k) for k in ("count","page","next","pages")},ensure_ascii=False))
          print("KOMUS_SAMPLE="+json.dumps(sample,ensure_ascii=False)[:4000])
          print("KOMUS_STOCK_SAMPLE="+json.dumps((stock or {}).get("content") or [],ensure_ascii=False)[:4000])
          print("KOMUS_TARGET_ARTICLE=2505358")
          for label, params in (
              ("default", {"format":"json"}),
              ("region0", {"format":"json","region":0}),
              ("region1", {"format":"json","region":1}),
          ):
              try:
                  target=get("/elements/2505358", params)
                  print("KOMUS_TARGET_DIRECT_"+label.upper()+"="+json.dumps(target,ensure_ascii=False)[:8000])
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode("utf-8","replace")
                  print("KOMUS_TARGET_DIRECT_"+label.upper()+"_HTTP="+str(exc.code)+" BODY="+body[:2000])
          print("KOMUS_PRICE_SAMPLE="+json.dumps((prices or {}).get("content") or [],ensure_ascii=False)[:4000])
          print("KOMUS_PROPS_SAMPLE="+json.dumps((props or {}).get("content") or [],ensure_ascii=False)[:8000])
          targets=("pp1002ng","2505358","ct_brava","brava")
          hits=[]
          page=1
          total=0
          while True:
              payload=get("/elements",{"format":"json","page":page,"limit":1000})
              rows=payload.get("content") or []
              total += len(rows)
              hits.extend([row for row in rows if any(t in json.dumps(row,ensure_ascii=False).casefold() for t in targets)])
              nxt=payload.get("next")
              if not nxt: break
              page=int(nxt)
          print("KOMUS_V2_SCAN_TOTAL="+str(total))
          print("KOMUS_V2_SCAN_HITS="+json.dumps(hits,ensure_ascii=False)[:30000])
          PY
