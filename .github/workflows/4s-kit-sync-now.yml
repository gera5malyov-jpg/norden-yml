name: Immediate sync 4 Сезона to Yandex KIT
# corrected SKU rule: 333-<kit_id>

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/4s-kit-sync-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kit-api-write
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests

      - name: Verify eligible 4 Сезона offers
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('4s-mebel.yml').getroot()
          offers=root.findall('.//offer')
          vendors={str(x.findtext('vendor') or '').strip() for x in offers}
          if len(offers) < 2500:
              raise SystemExit(f'Too few 4 Сезона offers: {len(offers)}')
          if vendors != {'4 Сезона'}:
              raise SystemExit(f'Unsafe feed vendors: {vendors}')
          print(f'Eligible 4 Сезона offers: {len(offers)}')
          PY

      - name: Sync prices and stocks now
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          FOURS_EXISTING_ONLY: '1'
        run: python 4s-kit/sync_4s_kit.py

      - name: Commit sync report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 4s-kit/last_sync_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save immediate 4 Сезона KIT sync report"
            git pull --rebase origin main
            git push
          fi
