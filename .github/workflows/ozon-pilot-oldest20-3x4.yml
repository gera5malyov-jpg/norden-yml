name: Ozon pilot oldest 20 in-stock to 3x4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-pilot-oldest20-3x4.yml'

permissions:
  contents: write

jobs:
  pilot20:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      OZON_TEMP_BRANCH: ozon-image-temp-pilot20-${{ github.run_id }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Prepare selected 20
        run: python ozon/pilot_20/pilot20_replace.py prepare

      - name: Preserve local reports and images
        shell: bash
        run: |
          rm -rf /tmp/ozon-pilot20
          mkdir -p /tmp/ozon-pilot20
          cp -a ozon/pilot_20/run/. /tmp/ozon-pilot20/

      - name: Publish converted JPGs on disposable branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          JPG_COUNT="$(find ozon/pilot_20/run -type f -name '*.jpg' | wc -l | tr -d ' ')"
          echo "Converted JPG count: $JPG_COUNT"

          if [ "$JPG_COUNT" = "0" ]; then
            echo "No temporary image hosting needed."
            exit 0
          fi

          STAGE="$(mktemp -d)"
          find ozon/pilot_20/run -type f -name '*.jpg' -print0 | while IFS= read -r -d '' f; do
            mkdir -p "$STAGE/$(dirname "$f")"
            cp "$f" "$STAGE/$f"
          done

          git switch --orphan "$OZON_TEMP_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$STAGE"/. .
          git add ozon/pilot_20/run/
          git commit -m "temp: Ozon pilot20 image staging [skip ci]"
          git push --force origin "HEAD:$OZON_TEMP_BRANCH"

          git switch main
          git reset --hard origin/main
          rm -rf ozon/pilot_20/run
          mkdir -p ozon/pilot_20/run
          cp -a /tmp/ozon-pilot20/. ozon/pilot_20/run/

      - name: Apply replacements to Ozon and verify
        run: python ozon/pilot_20/pilot20_replace.py apply

      - name: Wait for Ozon CDN materialization
        run: python ozon/pilot_20/pilot20_replace.py wait-materialized

      - name: Delete disposable branch
        if: success()
        shell: bash
        run: |
          git push origin --delete "$OZON_TEMP_BRANCH" || true

      - name: Save JSON reports only
        if: always()
        shell: bash
        run: |
          find ozon/pilot_20/run -type f -name '*.jpg' -delete || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -A ozon/pilot_20/run/
          if ! git diff --cached --quiet; then
            git commit -m "report: Ozon oldest20 3x4 pilot verification [skip ci]"
            git push
          fi
