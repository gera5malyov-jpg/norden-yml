name: Storefront Stage 36 - Sales experience source inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage36-conversion-inspection.yml'
      - 'storefront/stage35_conversion_source_audit.py'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check script
        run: python -m py_compile storefront/stage35_conversion_source_audit.py
      - name: Inspect live storefront and conversion tooling
        run: python storefront/stage35_conversion_source_audit.py
