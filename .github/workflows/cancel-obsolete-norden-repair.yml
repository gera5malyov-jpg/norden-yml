name: Cancel obsolete Norden repair

on:
  push:
    branches: [main]
    paths:
      - 'baserow/cancel_obsolete_norden_repair.txt'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gera5malyov-jpg/norden-yml/actions/runs/36696379145/cancel
