name: Guarded archived first-aid TN VED single-SKU test Nov18
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-marking-archived-probe-20261118.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safely add one exact TN VED code to archived item and confirm archive status
        run: python ozon/marking_archived_probe_20261118.py
