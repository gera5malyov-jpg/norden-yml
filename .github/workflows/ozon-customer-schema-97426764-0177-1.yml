name: Probe Ozon customer fields 97426764-0177-1

on:
  push:
    paths:
      - '.github/workflows/ozon-customer-schema-97426764-0177-1.yml'
      - 'scripts/ozon_customer_schema_97426764_0177_1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить поля телефона Ozon без персональных данных
        env:
          TARGET_EXTERNAL_ID: '97426764-0177-1'
          SAFE_RESULT_PATH: 'ozon/order_97426764-0177-1_customer_schema.json'
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python scripts/ozon_customer_schema_97426764_0177_1.py
      - name: Сохранить безопасный результат
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ozon/order_97426764-0177-1_customer_schema.json || true
          git diff --cached --quiet || git commit -m "Store Ozon customer schema probe 97426764-0177-1"
          git push
