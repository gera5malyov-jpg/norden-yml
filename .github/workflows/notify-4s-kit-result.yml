name: Notify 4S KIT result by Gmail

on:
  workflow_run:
    workflows: ["Sync 4 Сезона to Yandex KIT"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notify-4s-kit-result.yml'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Send result to shop@office-mag.com
        if: always()
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: shop@office-mag.com
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'test' }}
          RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from pathlib import Path
          from datetime import datetime, timezone

          user = (os.getenv("GMAIL_SMTP_USER") or "").strip()
          raw_password = os.getenv("GMAIL_APP_PASSWORD") or ""
          # Google displays app passwords in groups of 4. Accept either
          # grouped or ungrouped form and remove all whitespace safely.
          password = "".join(raw_password.split())
          recipient = (os.getenv("RECIPIENT") or "").strip()
          event_name = (os.getenv("EVENT_NAME") or "").strip().lower()
          conclusion = (os.getenv("RUN_CONCLUSION") or "unknown").strip().lower()
          run_url = (os.getenv("RUN_URL") or "").strip()
          run_id = (os.getenv("RUN_ID") or "").strip()

          if not user or not password:
              raise SystemExit(
                  "Gmail notification is configured, but GitHub secrets "
                  "GMAIL_SMTP_USER and/or GMAIL_APP_PASSWORD are missing."
              )

          report_path = Path("4s-kit/last_sync_report.json")
          report = {}
          if report_path.exists():
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  report = {"report_read_error": str(exc)}

          if conclusion == "test":
              status = "ТЕСТ — НАСТРОЙКА ПОЧТЫ РАБОТАЕТ"
              subject = "[4 Сезона → KIT] Тест уведомления"
          else:
              status = "УСПЕШНО" if conclusion == "success" else f"ОШИБКА ({conclusion.upper()})"
              subject = f"[4 Сезона → KIT] {status}"

          labels = [
              ("Товаров в фиде", "feed_offers"),
              ("Уникальных товаров", "unique_offers"),
              ("Сопоставлено", "matched"),
              ("Сопоставлено вариантов", "matched_variants"),
              ("Создано новых", "created"),
              ("Обновлено цен", "price_changes"),
              ("Обновлено остатков", "stock_changes"),
              ("Заполнено Код для сайта", "code_site_filled"),
              ("Исправлено описаний", "description_repairs"),
              ("Исправлено характеристик", "characteristic_repairs"),
              ("Записано характеристик", "characteristics_written"),
              ("Исправлено изображений", "image_repairs"),
              ("Загружено изображений", "images_uploaded"),
              ("Ошибок изображений", "image_failures"),
          ]

          lines = [
              "Автоматический отчёт синхронизации 4 Сезона → Яндекс KIT",
              "",
              f"Результат GitHub Actions: {status}",
              f"Run ID: {run_id}",
          ]

          found = False
          for label, key in labels:
              if key in report:
                  lines.append(f"{label}: {report.get(key)}")
                  found = True

          errors = report.get("errors") if isinstance(report, dict) else None
          if isinstance(errors, list):
              lines.append(f"Ошибок в отчёте: {len(errors)}")
              if errors:
                  lines.append("")
                  lines.append("Первые ошибки:")
                  for item in errors[:10]:
                      if isinstance(item, dict):
                          code = item.get("source_code") or ""
                          msg = item.get("message") or ""
                          lines.append(f"- {code}: {msg}".strip())
                      else:
                          lines.append(f"- {item}")

          if not found:
              lines.extend([
                  "",
                  "Подробный JSON-отчёт в репозитории отсутствует или не содержит итоговых счётчиков."
              ])

          if run_url:
              lines.extend(["", f"GitHub Actions: {run_url}"])

          lines.extend([
              "",
              f"Время формирования письма (UTC): {datetime.now(timezone.utc).isoformat(timespec='seconds')}",
          ])

          msg = EmailMessage()
          msg["From"] = user
          msg["To"] = recipient
          msg["Subject"] = subject
          msg.set_content("\n".join(lines))

          context = ssl.create_default_context()
          print(
              "Gmail SMTP diagnostics: "
              f"user_domain={user.rsplit('@', 1)[-1] if '@' in user else '<invalid>'}, "
              f"app_password_length={len(password)}"
          )

          errors = []
          sent = False

          # Primary: STARTTLS on 587 (Google's standard submission endpoint).
          try:
              with smtplib.SMTP("smtp.gmail.com", 587, timeout=60) as smtp:
                  smtp.ehlo()
                  smtp.starttls(context=context)
                  smtp.ehlo()
                  smtp.login(user, password)
                  smtp.send_message(msg)
              sent = True
              print("Notification sent through Gmail SMTP STARTTLS/587")
          except Exception as exc:
              errors.append(f"587/STARTTLS: {type(exc).__name__}: {exc}")

          # Fallback: implicit TLS on 465.
          if not sent:
              try:
                  with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=context, timeout=60) as smtp:
                      smtp.login(user, password)
                      smtp.send_message(msg)
                  sent = True
                  print("Notification sent through Gmail SMTP SSL/465")
              except Exception as exc:
                  errors.append(f"465/SSL: {type(exc).__name__}: {exc}")

          if not sent:
              raise SystemExit("Gmail send failed. " + " | ".join(errors))

          print(f"Notification sent to {recipient}: {subject}")
          PY
