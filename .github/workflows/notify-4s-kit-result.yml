name: Notify 4S pipeline task by Gmail

on:
  workflow_run:
    workflows:
      - "Mark all 4S products Webasyst 333"
      - "Audit 4S KIT exact duplicates"
      - "Archive 4S KIT duplicates"
      - "Sync 4 Сезона to Yandex KIT"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id != 35618604987 && github.event.workflow_run.id != 35602742176) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Отправить русский отчёт на shop@office-mag.com
        if: always()
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: shop@office-mag.com
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || 'Тест уведомления' }}
          RUN_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'test' }}
          RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import smtplib
          import ssl
          from datetime import datetime, timezone
          from email.message import EmailMessage
          from pathlib import Path

          user=(os.getenv("GMAIL_SMTP_USER") or "").strip()
          password="".join((os.getenv("GMAIL_APP_PASSWORD") or "").split())
          recipient=(os.getenv("RECIPIENT") or "").strip()
          workflow=(os.getenv("WORKFLOW_NAME") or "").strip()
          conclusion=(os.getenv("RUN_CONCLUSION") or "unknown").strip().lower()
          run_url=(os.getenv("RUN_URL") or "").strip()
          run_id=(os.getenv("RUN_ID") or "").strip()

          if not user or not password:
              raise SystemExit("Не настроены GMAIL_SMTP_USER и/или GMAIL_APP_PASSWORD.")

          def read_json(path):
              p=Path(path)
              if not p.exists():
                  return {}
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  return {"report_read_error":str(exc)}

          tasks={
              "Mark all 4S products Webasyst 333":{
                  "title":"Характеристика Webasyst = 333",
                  "report":"4s-kit/webasyst_333_full_brand_report.json",
              },
              "Audit 4S KIT exact duplicates":{
                  "title":"Поиск дублей 4 Сезона по наименованию",
                  "report":"4s-kit/duplicate_audit.json",
              },
              "Archive 4S KIT duplicates":{
                  "title":"Архивация новых дублей 4 Сезона",
                  "report":"4s-kit/archive_duplicates_report.json",
              },
              "Sync 4 Сезона to Yandex KIT":{
                  "title":"Обновление каталога 4 Сезона",
                  "report":"4s-kit/last_sync_report.json",
              },
          }

          task=tasks.get(workflow,{
              "title":workflow or "Тест уведомления",
              "report":"",
          })
          report=read_json(task["report"]) if task["report"] else {}

          if conclusion=="test":
              status="ТЕСТ"
          elif conclusion=="success":
              status="УСПЕШНО"
          elif conclusion=="cancelled":
              status="ОТМЕНЕНО"
          else:
              status=f"ОШИБКА ({conclusion.upper()})"

          subject=f"[4 Сезона] {task['title']} — {status}"
          lines=[
              "Автоматический отчёт по каталогу «4 Сезона»",
              "",
              f"Задача: {task['title']}",
              f"Результат: {status}",
              f"Номер запуска GitHub: {run_id}",
          ]

          if workflow=="Mark all 4S products Webasyst 333":
              lines += [
                  "",
                  f"Активных карточек бренда 4 Сезона: {report.get('brand_4s_active','—')}",
                  f"Уже было Webasyst=333: {report.get('already_333','—')}",
                  f"Проставлено Webasyst=333: {report.get('updated_to_333','—')}",
                  f"Архивных карточек пропущено: {report.get('brand_4s_archived_skipped','—')}",
                  f"Ошибок: {report.get('errors_count',len(report.get('errors') or []))}",
              ]
          elif workflow=="Audit 4S KIT exact duplicates":
              lines += [
                  "",
                  f"Активных карточек бренда 4 Сезона: {report.get('managed_4s_variants','—')}",
                  f"Групп дублей по одинаковому наименованию: {report.get('exact_duplicate_groups','—')}",
                  f"Лишних более новых карточек: {report.get('duplicate_extra_variants','—')}",
              ]
              groups=report.get("groups") or []
              if groups:
                  lines += ["", "Первые найденные дубли:"]
                  for g in groups[:10]:
                      lines.append(
                          f"- {g.get('name','')} | оставить {((g.get('canonical') or {}).get('sku') or '—')} | "
                          f"в архив: {', '.join(str(x.get('sku') or x.get('kit_id') or '') for x in (g.get('duplicates') or []))}"
                      )
          elif workflow=="Archive 4S KIT duplicates":
              lines += [
                  "",
                  f"Групп дублей: {report.get('duplicate_groups_found','—')}",
                  f"Лишних карточек: {report.get('duplicate_extra_variants','—')}",
                  f"Перенесено новых дублей в архив: {report.get('archived','—')}",
                  f"Уже было в архиве: {report.get('already_archived','—')}",
                  f"Пропущено по защите: {report.get('skipped_unsafe','—')}",
                  f"Ошибок: {report.get('errors_count',len(report.get('errors') or []))}",
              ]
          elif workflow=="Sync 4 Сезона to Yandex KIT":
              labels=[
                  ("Товаров в исходном фиде","feed_offers_raw"),
                  ("Уникальных товаров","feed_unique_source_codes"),
                  ("Карточек KIT просмотрено","kit_variants_scanned"),
                  ("Карточек бренда 4 Сезона","existing_managed_variants"),
                  ("Сопоставлено товаров","matched"),
                  ("Создано новых карточек","created"),
                  ("Обновлено цен","price_changes"),
                  ("Обновлено остатков","stock_changes"),
                  ("Проставлено Webasyst=333","webasyst_333_marked"),
                  ("Заполнено Код для сайта","code_site_filled"),
                  ("Исправлено изображений","image_repairs"),
                  ("Обнулено отсутствующих","absent_to_zero"),
                  ("Конфликтов","collisions"),
              ]
              lines += ["", "Результат обновления каталога:"]
              for label,key in labels:
                  if key in report:
                      lines.append(f"{label}: {report.get(key)}")
              lines.append(f"Ошибок в отчёте: {len(report.get('errors') or [])}")

          errors=report.get("errors") if isinstance(report,dict) else None
          if isinstance(errors,list) and errors:
              lines += ["", "Первые ошибки:"]
              for item in errors[:10]:
                  if isinstance(item,dict):
                      name=item.get("name") or item.get("source_code") or item.get("sku") or ""
                      msg=item.get("message") or ""
                      lines.append(f"- {name}: {msg}".strip())
                  else:
                      lines.append(f"- {item}")

          if run_url:
              lines += ["", f"GitHub Actions: {run_url}"]

          lines += [
              "",
              f"Время отчёта UTC: {datetime.now(timezone.utc).isoformat(timespec='seconds')}",
          ]

          msg=EmailMessage()
          msg["From"]=user
          msg["To"]=recipient
          msg["Subject"]=subject
          msg.set_content("\n".join(lines))

          context=ssl.create_default_context()
          send_errors=[]
          sent=False
          try:
              with smtplib.SMTP("smtp.gmail.com",587,timeout=60) as smtp:
                  smtp.ehlo()
                  smtp.starttls(context=context)
                  smtp.ehlo()
                  smtp.login(user,password)
                  smtp.send_message(msg)
              sent=True
          except Exception as exc:
              send_errors.append(f"587/STARTTLS: {type(exc).__name__}: {exc}")

          if not sent:
              try:
                  with smtplib.SMTP_SSL("smtp.gmail.com",465,context=context,timeout=60) as smtp:
                      smtp.login(user,password)
                      smtp.send_message(msg)
                  sent=True
              except Exception as exc:
                  send_errors.append(f"465/SSL: {type(exc).__name__}: {exc}")

          if not sent:
              raise SystemExit("Не удалось отправить письмо. "+" | ".join(send_errors))

          print(f"Письмо отправлено на {recipient}: {subject}")
          PY
