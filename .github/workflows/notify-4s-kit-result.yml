name: Notify 4S KIT result by Gmail

on:
  workflow_run:
    workflows: ["Sync 4 Сезона to Yandex KIT"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Отправить результат на shop@office-mag.com
        if: always()
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: shop@office-mag.com
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'test' }}
          RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from pathlib import Path
          from datetime import datetime, timezone

          user = (os.getenv("GMAIL_SMTP_USER") or "").strip()
          raw_password = os.getenv("GMAIL_APP_PASSWORD") or ""
          password = "".join(raw_password.split())
          recipient = (os.getenv("RECIPIENT") or "").strip()
          conclusion = (os.getenv("RUN_CONCLUSION") or "unknown").strip().lower()
          run_url = (os.getenv("RUN_URL") or "").strip()
          run_id = (os.getenv("RUN_ID") or "").strip()

          if not user or not password:
              raise SystemExit("Не настроены GMAIL_SMTP_USER и/или GMAIL_APP_PASSWORD.")

          def read_json(path):
              p=Path(path)
              if not p.exists():
                  return {}
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  return {"ошибка_чтения": str(exc)}

          sync = read_json("4s-kit/last_sync_report.json")
          archive = read_json("4s-kit/archive_duplicates_report.json")
          audit = read_json("4s-kit/duplicate_audit.json")

          if conclusion == "test":
              status = "ТЕСТ — НАСТРОЙКА ПОЧТЫ РАБОТАЕТ"
              subject = "[4 Сезона → KIT] Тест уведомления"
          elif conclusion == "success":
              status = "УСПЕШНО"
              subject = "[4 Сезона → KIT] Обновление завершено успешно"
          elif conclusion == "cancelled":
              status = "ОТМЕНЕНО"
              subject = "[4 Сезона → KIT] Обновление отменено"
          else:
              status = "ОШИБКА"
              subject = "[4 Сезона → KIT] Обновление завершилось с ошибкой"

          lines = [
              "Автоматический отчёт: 4 Сезона → Яндекс KIT",
              "",
              f"Результат: {status}",
              f"Номер запуска GitHub: {run_id}",
          ]

          if archive:
              lines += [
                  "",
                  "Архивация дублей:",
                  f"  Найдено точных групп дублей: {archive.get('duplicate_groups_found', archive.get('exact_duplicate_groups', '—'))}",
                  f"  Отправлено новых дублей в архив: {archive.get('archived', '—')}",
                  f"  Уже было в архиве: {archive.get('already_archived', '—')}",
                  f"  Ошибок архивации: {archive.get('errors_count', len(archive.get('errors') or []))}",
              ]
          elif audit:
              lines += [
                  "",
                  "Проверка дублей:",
                  f"  Найдено точных групп дублей: {audit.get('exact_duplicate_groups', '—')}",
                  f"  Лишних карточек: {audit.get('duplicate_extra_variants', '—')}",
              ]

          labels = [
              ("Товаров в исходном фиде", "feed_offers_raw"),
              ("Уникальных товаров в фиде", "feed_unique_source_codes"),
              ("Карточек KIT просмотрено", "kit_variants_scanned"),
              ("Карточек бренда 4 Сезона", "existing_managed_variants"),
              ("Товаров сопоставлено", "matched"),
              ("Карточек сопоставлено", "matched_variants"),
              ("Сопоставлено по Коду для сайта", "matched_by_code_site"),
              ("Сопоставлено по артикулу", "matched_by_article"),
              ("Сопоставлено по названию", "matched_by_name"),
              ("Создано новых карточек", "created"),
              ("Обновлено цен", "price_changes"),
              ("Обновлено остатков", "stock_changes"),
              ("Заполнено поле Код для сайта", "code_site_filled"),
              ("Исправлено описаний", "description_repairs"),
              ("Исправлено характеристик", "characteristic_repairs"),
              ("Записано характеристик", "characteristics_written"),
              ("Исправлено изображений", "image_repairs"),
              ("Загружено изображений", "images_uploaded"),
              ("Ошибок изображений", "image_failures"),
              ("Отсутствующих товаров обнулено", "absent_to_zero"),
              ("Найдено конфликтов", "collisions"),
          ]

          if sync:
              lines += ["", "Итог синхронизации каталога:"]
              for label, key in labels:
                  if key in sync:
                      lines.append(f"  {label}: {sync.get(key)}")

              errors = sync.get("errors")
              if isinstance(errors, list):
                  lines.append(f"  Ошибок в отчёте: {len(errors)}")
                  if errors:
                      lines += ["", "Первые ошибки:"]
                      for item in errors[:10]:
                          if isinstance(item, dict):
                              code = item.get("source_code") or ""
                              msg = item.get("message") or ""
                              lines.append(f"  - {code}: {msg}".strip())
                          else:
                              lines.append(f"  - {item}")

          if run_url:
              lines += ["", f"Ссылка на запуск GitHub: {run_url}"]

          lines += [
              "",
              f"Время формирования отчёта по UTC: {datetime.now(timezone.utc).isoformat(timespec='seconds')}",
          ]

          msg = EmailMessage()
          msg["From"] = user
          msg["To"] = recipient
          msg["Subject"] = subject
          msg.set_content("\n".join(lines))

          context = ssl.create_default_context()
          errors = []
          sent = False

          try:
              with smtplib.SMTP("smtp.gmail.com", 587, timeout=60) as smtp:
                  smtp.ehlo()
                  smtp.starttls(context=context)
                  smtp.ehlo()
                  smtp.login(user, password)
                  smtp.send_message(msg)
              sent = True
              print("Письмо отправлено через Gmail SMTP 587/STARTTLS")
          except Exception as exc:
              errors.append(f"587/STARTTLS: {type(exc).__name__}: {exc}")

          if not sent:
              try:
                  with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=context, timeout=60) as smtp:
                      smtp.login(user, password)
                      smtp.send_message(msg)
                  sent = True
                  print("Письмо отправлено через Gmail SMTP 465/SSL")
              except Exception as exc:
                  errors.append(f"465/SSL: {type(exc).__name__}: {exc}")

          if not sent:
              raise SystemExit("Не удалось отправить письмо. " + " | ".join(errors))

          print(f"Письмо отправлено на {recipient}: {subject}")
          PY
