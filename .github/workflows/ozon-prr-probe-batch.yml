name: Probe Ozon lift options batch

on:
  push:
    paths:
      - '.github/workflows/ozon-prr-probe-batch.yml'
      - 'scripts/probe_ozon_prr_batch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить подъём Ozon
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          SAFE_RESULT_PATH: ozon/prr_batch_2026-09-23.json
        run: python scripts/probe_ozon_prr_batch.py
      - name: Сохранить результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add ozon/prr_batch_2026-09-23.json
          git diff --cached --quiet || git commit -m "Store Ozon lift options batch"
          git push
