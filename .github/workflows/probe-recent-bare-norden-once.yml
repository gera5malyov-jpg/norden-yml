name: Probe recent bare Norden once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-recent-bare-norden-once.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe recent variants
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request,urllib.parse,urllib.error
          H={'Authorization':'Bearer '+os.environ['YANDEX_KIT_TOKEN'],'Accept':'application/json'}
          rows=[]
          for page in range(1,8):
              u='https://api.kit.yandex.net/v1/variants?'+urllib.parse.urlencode({'page':page,'per_page':100})
              for a in range(10):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=40) as r: p=json.loads(r.read().decode())
                      break
                  except urllib.error.HTTPError as e:
                      if e.code==429:
                          time.sleep(int(e.headers.get('Retry-After') or 5)); continue
                      raise
              batch=p.get('variants') or p.get('items') or p.get('data') or []
              if isinstance(batch,dict): batch=batch.get('items') or []
              rows.extend(batch)
              time.sleep(1.5)
          out=[]
          for x in rows:
              if (x.get('brand') or '').casefold()!='norden': continue
              chars=x.get('characteristics') or []
              out.append({'id':x.get('id'),'kit_id':x.get('kit_id'),'sku':x.get('sku'),'name':x.get('name'),'media_count':len(x.get('media') or []),'char_count':len(chars),'characteristics':chars,'created_at':x.get('created_at')})
          out.sort(key=lambda x:(x.get('kit_id') or 0),reverse=True)
          os.makedirs('norden-kit',exist_ok=True)
          open('norden-kit/recent_bare_norden.json','w',encoding='utf-8').write(json.dumps(out[:300],ensure_ascii=False,indent=2))
          print(json.dumps({'count':len(out),'sample':out[:20]},ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden-kit/recent_bare_norden.json
          git commit -m 'Probe recent bare Norden' || exit 0
          git pull --rebase
          git push