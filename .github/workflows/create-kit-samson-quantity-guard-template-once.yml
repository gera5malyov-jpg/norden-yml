name: Create KIT Samson quantity guard template once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-kit-samson-quantity-guard-template-once.yml'

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git clone --depth 1 https://github.com/yandex/kit-skills.git /tmp/kit-skills
      - name: Build, dry-run and create unreferenced custom template
        env:
          KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          S=/tmp/kit-skills/skills/kit-custom-sections/scripts/section.py
          K=/tmp/kit-skills/skills/kit-storefront-constructor/scripts/kit.py
          PROMPT='Да делай. Настроить минимальный заказ по ПЗК, шаг по промежуточной упаковке и затем продолжить загрузку товаров.'
          SID='c3b223d7-6041-49cb-9b86-caf0ed67e8ba'
          COMMON=(--bff-url https://megapolis-meb.ru --skill-prompt "$PROMPT" --skill-session-id "$SID")
          rm -rf /tmp/quantity-guard
          python "$S" freeform             --html samson-kit/storefront/quantity-guard/template.hbs             --css samson-kit/storefront/quantity-guard/styles.css             --schema samson-kit/storefront/quantity-guard/schema.json             --settings samson-kit/storefront/quantity-guard/settings.product.json             --title "Samson quantity guard"             --out /tmp/quantity-guard             --confirm
          python "$S" lint /tmp/quantity-guard --json
          echo '--- TEMPLATE DRY RUN ---'
          python "$K" "${COMMON[@]}" templates create --file /tmp/quantity-guard/create.json --dry-run
          echo '--- TEMPLATE CREATE ---'
          python "$K" "${COMMON[@]}" templates create --file /tmp/quantity-guard/create.json --confirm
