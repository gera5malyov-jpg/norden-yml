name: Ozon Norden -> KIT full catalog

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ozon-norden-to-kit-full.yml'
      - 'catalog/ozon_norden_to_kit_run_trigger.txt'

permissions:
  contents: write

concurrency:
  group: ozon-norden-to-kit-full
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Compile
        run: python -m py_compile catalog/sync_all_ozon_norden_to_kit.py catalog/sync_ozon_readback_to_kit.py norden-kit/webasyst_n100_to_kit_once.py norden-kit/sync_norden_kit.py
      - name: Sync all Norden cards from Ozon to KIT
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: python catalog/sync_all_ozon_norden_to_kit.py
      - name: Save report
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add catalog/ozon_norden_to_kit_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Ozon Norden to KIT report"
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i*4))
            done
          fi
