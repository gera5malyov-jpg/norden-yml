name: Aletan safeguarded one-product no-op resave probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aletan-one-resave-probe.yml'
      - 'scripts/aletan_one_resave_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one_product:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Resave exactly one Aletan product with unchanged name
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python scripts/aletan_one_resave_probe.py
