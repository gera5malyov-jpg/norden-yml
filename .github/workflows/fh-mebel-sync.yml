name: FH-Mebel → KIT — раз в 2 недели

on:
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только проверить парсер, без записи в KIT'
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'fh-mebel-kit/sync_fh_mebel.py'
      - '.github/workflows/fh-mebel-sync.yml'

permissions:
  contents: write

concurrency:
  group: kit-api-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверить, наступила ли двухнедельная дата
        id: fortnight
        shell: bash
        run: |
          if [[ "\${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          week=$(( $(date -u +%s) / 604800 ))
          if (( week % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "На этой неделе двухнедельный импорт пропускается."
          fi

      - name: Установить зависимости
        if: steps.fortnight.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Проверить синтаксис
        if: steps.fortnight.outputs.run == 'true'
        run: python -m py_compile fh-mebel-kit/sync_fh_mebel.py

      - name: Быстрая проверка парсера
        if: steps.fortnight.outputs.run == 'true'
        run: python fh-mebel-kit/sync_fh_mebel.py --dry-run --max-pages 100 --workers 6

      - name: Загрузить FH-Mebel в KIT
        id: sync
        if: steps.fortnight.outputs.run == 'true'
        continue-on-error: true
        env:
          YANDEX_KIT_TOKEN: \${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "\${{ github.event_name }}" == "workflow_dispatch" && "\${{ inputs.dry_run }}" == "true" ]]; then
            python fh-mebel-kit/sync_fh_mebel.py --dry-run --workers 8
          else
            python fh-mebel-kit/sync_fh_mebel.py --workers 8
          fi

      - name: Сохранить отчёт
        if: always() && steps.fortnight.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          cp fh-mebel-kit/last_sync_report.json /tmp/fh-mebel-report.json 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          if [ -f /tmp/fh-mebel-report.json ]; then
            mkdir -p fh-mebel-kit
            cp /tmp/fh-mebel-report.json fh-mebel-kit/last_sync_report.json
          fi
          git add fh-mebel-kit/last_sync_report.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Обновить отчёт FH-Mebel → KIT'
          git push origin HEAD:main || true

      - name: Завершить с ошибкой, если импорт не прошёл
        if: always() && steps.fortnight.outputs.run == 'true' && steps.sync.outcome != 'success'
        run: exit 1
