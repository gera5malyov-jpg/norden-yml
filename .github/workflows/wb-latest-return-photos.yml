name: WB latest return photos

on:
  push:
    paths:
      - 'scripts/wb_latest_return_photos.py'
      - '.github/workflows/wb-latest-return-photos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Найти последнюю заявку и скачать фото
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python scripts/wb_latest_return_photos.py
      - name: Сохранить фото заявки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb-latest-return-photos
          path: wb-return-latest/
          if-no-files-found: warn
          retention-days: 3
