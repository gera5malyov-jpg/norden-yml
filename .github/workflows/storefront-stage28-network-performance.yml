name: Storefront Stage 28 - Network and performance diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage28-network-performance.yml'
      - 'storefront/stage28_network_performance_audit.py'
permissions:
  contents: read
concurrency:
  group: storefront-network-performance
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate audit script
        run: python -m py_compile storefront/stage28_network_performance_audit.py
      - name: Install Chrome automation
        run: python -m pip install playwright==1.55.0
      - name: Diagnose failed requests and speed in desktop and mobile Chrome
        run: python storefront/stage28_network_performance_audit.py
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-stage28-network-performance
          path: storefront-stage28-reports/stage28-report.json
          retention-days: 30
          if-no-files-found: warn
