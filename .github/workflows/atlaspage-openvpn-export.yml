name: AtlasPage export all OpenVPN configs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/atlaspage-openvpn-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATLASPAGE_ID: ${{ secrets.ATLASPAGE_ID }}

    steps:
      - name: Check AtlasPage ID
        shell: bash
        run: |
          test -n "$ATLASPAGE_ID" || { echo "ATLASPAGE_ID: MISSING"; exit 11; }
          echo "ATLASPAGE_ID: present"

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium --with-deps >/dev/null

      - name: Download every OpenVPN configuration
        shell: bash
        run: |
          cat > /tmp/export-openvpn.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const userId = process.env.ATLASPAGE_ID || '';
          const outDir = path.resolve('openvpn-configs');
          fs.mkdirSync(outDir, { recursive: true });

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const clean = s => (s || '').replace(/\s+/g, ' ').trim();
          const safeName = s => clean(s)
            .replace(/OpenVPN/ig, '')
            .replace(/[\\/:*?"<>|]+/g, '_')
            .replace(/\s+/g, '_')
            .replace(/^_+|_+$/g, '')
            .slice(0, 120) || 'server';

          async function clickExactText(page, re) {
            const candidates = [
              page.getByRole('button', { name: re }),
              page.getByRole('tab', { name: re }),
              page.getByText(re, { exact: true })
            ];
            for (const loc of candidates) {
              try {
                const el = loc.first();
                if (await el.isVisible({ timeout: 700 })) {
                  await el.click({ timeout: 4000 });
                  return true;
                }
              } catch (_) {}
            }
            return false;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              locale: 'ru-RU',
              acceptDownloads: true,
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
            });
            const page = await context.newPage();

            try {
              const response = await page.goto('https://atlaspage51.com/lk', {
                waitUntil: 'domcontentloaded',
                timeout: 45000
              });
              if (!response || response.status() >= 500) throw new Error('AtlasPage unavailable');
              await sleep(1800);

              const idModeCandidates = [
                page.getByRole('button', { name: /^по\s+id$/i }),
                page.getByRole('tab', { name: /^по\s+id$/i }),
                page.getByText(/^по\s+id$/i, { exact: true }),
                page.getByRole('button', { name: /вход\s+по\s+id/i }),
                page.getByRole('tab', { name: /вход\s+по\s+id/i }),
                page.getByText(/вход\s+по\s+id/i, { exact: false }),
                page.getByRole('button', { name: /^id$/i }),
                page.getByRole('tab', { name: /^id$/i }),
                page.getByText(/^id$/i, { exact: true })
              ];

              let idModeSelected = false;
              for (const locator of idModeCandidates) {
                try {
                  const first = locator.first();
                  if (await first.isVisible({ timeout: 800 })) {
                    await first.click({ timeout: 3000 });
                    idModeSelected = true;
                    await sleep(700);
                    break;
                  }
                } catch (_) {}
              }
              if (!idModeSelected) throw new Error('Could not select "По ID" login mode');

              let idInput = page.locator([
                'input:visible[name="id"]',
                'input:visible[name*="user_id" i]',
                'input:visible[name*="account_id" i]',
                'input:visible[id="id"]',
                'input:visible[id*="user_id" i]',
                'input:visible[placeholder*="ID" i]'
              ].join(',')).first();

              if (await idInput.count() === 0 || !(await idInput.isVisible().catch(() => false))) {
                idInput = page.locator(
                  'input:visible:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="password"])'
                ).first();
              }
              if (await idInput.count() === 0 || !(await idInput.isVisible().catch(() => false))) {
                throw new Error('ID input not found');
              }

              await idInput.fill(userId);

              let login = page.locator('button:visible[type="submit"], input:visible[type="submit"]').first();
              if (await login.count() === 0 || !(await login.isVisible().catch(() => false))) {
                login = page.getByRole('button', { name: /войти|продолжить|login|далее/i }).first();
              }
              if (await login.count() === 0 || !(await login.isVisible().catch(() => false))) {
                throw new Error('Login button not found');
              }

              await login.click({ timeout: 5000 });
              await Promise.race([
                page.waitForLoadState('networkidle', { timeout: 20000 }).catch(() => {}),
                page.waitForTimeout(5000)
              ]);
              await sleep(1800);
              console.log('LOGIN_POST_URL:', page.url());

              await page.goto('https://atlaspage51.com/lk/connect', {
                waitUntil: 'domcontentloaded',
                timeout: 45000
              });
              await sleep(1800);

              console.log('CONNECT_URL:', page.url());
              if (/\/login(?:\?|$)/i.test(page.url())) {
                throw new Error('AtlasPage ID login did not persist to /lk/connect');
              }
              console.log('LOGIN_SUCCESS: yes');
              const connectControls = await page.locator('button:visible, [role="button"]:visible, [role="tab"]:visible, a:visible').allTextContents().catch(() => []);
              console.log('CONNECT_CONTROLS:', JSON.stringify(connectControls.map(clean).filter(Boolean).slice(0, 120)));

              let openVpnSelected = await clickExactText(page, /^OpenVPN$/i);

              if (!openVpnSelected) {
                const chooseProtocol = page.getByRole('button', { name: /выбрать протокол/i }).first();
                if (await chooseProtocol.isVisible({ timeout: 1500 }).catch(() => false)) {
                  await chooseProtocol.click({ timeout: 4000 });
                  await sleep(1200);
                  console.log('PROTOCOL_PICKER_OPENED: yes');
                  openVpnSelected = await clickExactText(page, /^OpenVPN$/i);
                }
              }

              if (!openVpnSelected) {
                const openVpnButtons = page.locator('button, [role="button"], [role="tab"], a').filter({ hasText: /^OpenVPN$/i });
                const cnt = await openVpnButtons.count();
                for (let i = 0; i < cnt && !openVpnSelected; i++) {
                  const el = openVpnButtons.nth(i);
                  if (await el.isVisible().catch(() => false)) {
                    await el.click({ timeout: 4000 });
                    openVpnSelected = true;
                  }
                }
              }

              if (!openVpnSelected) {
                const bodySample = clean(await page.locator('body').innerText().catch(() => '')).slice(0, 1600);
                console.log('CONNECT_BODY_SAMPLE:', bodySample);
                throw new Error('OpenVPN protocol tab not found');
              }
              await sleep(1500);

              const knownCountry = page.getByText(/^(Финляндия|Израиль|США|Россия|Швеция|Казахстан|Чехия|Нидерланды|Беларусь|Испания|Турция|Италия|Британия)$/i).first();
              if (await knownCountry.isVisible({ timeout: 1500 }).catch(() => false)) {
                const chain = await knownCountry.evaluate(el => {
                  const out = [];
                  let n = el;
                  for (let i = 0; i < 8 && n; i++, n = n.parentElement) {
                    out.push({
                      tag: n.tagName,
                      cls: n.className || '',
                      role: n.getAttribute && n.getAttribute('role'),
                      tabindex: n.getAttribute && n.getAttribute('tabindex'),
                      onclick: n.getAttribute && n.getAttribute('onclick'),
                      text: (n.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 260)
                    });
                  }
                  return out;
                });
                console.log('SERVER_ROW_ANCESTORS:', JSON.stringify(chain));
              }

              const clickableSummary = await page.locator('button:visible, a:visible, [role="button"]:visible, [tabindex]:visible').evaluateAll(nodes =>
                nodes.map(n => ({
                  tag: n.tagName,
                  cls: n.className || '',
                  role: n.getAttribute('role') || '',
                  tabindex: n.getAttribute('tabindex') || '',
                  text: (n.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 180)
                })).filter(x => x.text)
              );
              console.log('OPENVPN_CLICKABLES:', JSON.stringify(clickableSummary.slice(0, 160)));

              const serverRows = page.locator('button[class*="serverItemClickable"]');
              const serverCount = await serverRows.count();
              const serverLabels = [];
              for (let i = 0; i < serverCount; i++) {
                serverLabels.push(clean(await serverRows.nth(i).innerText().catch(() => '')));
              }

              console.log('OPENVPN_SERVER_ROWS:', serverCount);
              console.log('OPENVPN_SERVERS:', JSON.stringify(serverLabels.map(s => s.slice(0, 160))));

              if (!serverCount) throw new Error('No OpenVPN server buttons discovered');

              let saved = 0;
              const seenHashes = new Set();

              async function saveConfig(buffer, label) {
                if (!buffer || !buffer.length) return false;
                const txt = buffer.toString('utf8');
                if (!/(^|\n)client(\r?\n|$)/m.test(txt) || !/(^|\n)remote\s+/m.test(txt)) return false;

                const crypto = require('crypto');
                const hash = crypto.createHash('sha256').update(buffer).digest('hex');
                if (seenHashes.has(hash)) return false;
                seenHashes.add(hash);

                const tidyLabel = clean(label)
                  .replace(/OpenVPN/ig, '')
                  .replace(/\b\d+\s*Мбит\/с\b/ig, '')
                  .trim();
                const filename = safeName(tidyLabel) + '.ovpn';
                let target = path.join(outDir, filename);
                let n = 2;
                while (fs.existsSync(target)) {
                  target = path.join(outDir, filename.replace(/\.ovpn$/i, '') + '_' + n++ + '.ovpn');
                }
                fs.writeFileSync(target, buffer);
                saved++;
                console.log('SAVED_CONFIG:', path.basename(target));
                return true;
              }

              for (let i = 0; i < serverCount; i++) {
                const row = serverRows.nth(i);
                const label = serverLabels[i] || ('server_' + (i + 1));
                console.log('SERVER_BEGIN:', i + 1, '/', serverCount, label.slice(0, 150));

                let captured = false;

                const responseHandler = async (resp) => {
                  if (captured) return;
                  try {
                    if (resp.status() !== 200) return;
                    const headers = await resp.allHeaders();
                    const ct = (headers['content-type'] || '').toLowerCase();
                    const cd = (headers['content-disposition'] || '').toLowerCase();
                    if (!(/openvpn|octet-stream|text\/plain/.test(ct) || /attachment|\.ovpn/.test(cd) || /\.ovpn(?:\?|$)/i.test(resp.url()))) return;
                    const body = await resp.body();
                    if (await saveConfig(body, label)) captured = true;
                  } catch (_) {}
                };

                page.on('response', responseHandler);

                try {
                  await row.scrollIntoViewIfNeeded().catch(() => {});
                  await row.click({ timeout: 5000 });
                  await sleep(700);

                  let downloadControl = null;
                  const candidates = [
                    page.getByRole('button', { name: /скачать\s*\.?ovpn/i }).first(),
                    page.getByRole('link', { name: /скачать\s*\.?ovpn/i }).first(),
                    page.locator('button, a, [role="button"]').filter({ hasText: /скачать.*ovpn/i }).first()
                  ];

                  for (const candidate of candidates) {
                    if (await candidate.isVisible({ timeout: 700 }).catch(() => false)) {
                      downloadControl = candidate;
                      break;
                    }
                  }

                  if (!downloadControl) {
                    const afterSelect = await page.locator('button:visible, a:visible, [role="button"]:visible').allTextContents().catch(() => []);
                    console.log('DOWNLOAD_CONTROLS_NOT_FOUND:', JSON.stringify(afterSelect.map(clean).filter(Boolean).slice(-60)));
                  } else {
                    const dlPromise = page.waitForEvent('download', { timeout: 9000 }).catch(() => null);
                    await downloadControl.click({ timeout: 5000 });
                    const dl = await dlPromise;

                    if (dl) {
                      const tmp = await dl.path();
                      if (tmp) {
                        const body = fs.readFileSync(tmp);
                        if (await saveConfig(body, label)) captured = true;
                      }
                    }

                    await sleep(1200);
                  }

                  if (!captured) {
                    const texts = await page.locator('pre, code, textarea').allTextContents().catch(() => []);
                    for (const t of texts) {
                      if (await saveConfig(Buffer.from(t, 'utf8'), label)) {
                        captured = true;
                        break;
                      }
                    }
                  }

                  console.log('SERVER_RESULT:', captured ? 'downloaded' : 'not-found', label.slice(0, 150));
                } finally {
                  page.off('response', responseHandler);
                }
              }

              console.log('OPENVPN_CONFIGS_SAVED:', saved);
              if (!saved) throw new Error('No OpenVPN configs were downloaded');
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error('EXPORT_ERROR:', err && err.message ? err.message : String(err));
            process.exit(1);
          });
          NODE

          NODE_PATH="$(npm root)" node /tmp/export-openvpn.js

      - name: Pack and encrypt configs for private transfer
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find openvpn-configs -type f -name '*.ovpn' -print -quit)"

          mkdir -p transfer
          tar -czf /tmp/atlaspage-openvpn-configs.tar.gz openvpn-configs

          cat > /tmp/transfer-public.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAzPzF9L0agWId7FCqWaWD
          WIwWVZHs/ZMvaxIrGOifIDeT6VKUa+dV0rH51/G7XARWQdn/wjGlz2r33dCn1F+E
          6Dv6mEts7cmsUtZ9G9g/yo+mtN8F7EgF4hmj6VZ/8/KEoQBQHc7ktrvTgxs/Avq0
          0PzN8BUj91CcIggKbh1jLfDKXlvZsQEz4g378oHQE8E2gpcjySGp4RGLOD+vbM86
          rMxQ3h2dmfaXl73BvnxHvcP95ev4t8KahSnCKDICZEZ45bCrfdY3BiDY10c1KA6P
          deatwGPbx+YJyjJMVtyvL7kJ1ddGkbAdqJ9JKC39CIyBTxnVzlm624iar85Oxocw
          68CSLZNAqdAY1AZWVovKpc7YncHA9ESmA0o2gK/dCuzQmQJM8/jTqVbC74BqQWsb
          TVer8WCIUU84Zc9ZJu67uEDjdMVFtPiydoV5Z8yG3m6yw21QiQXM3OOaJ4cApCnQ
          dlEk9WQS1RTEXjGMjy2HIo6c3dllEmzgf9PuGMlxDRs9AgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY

          openssl rand 32 > /tmp/aes.key
          openssl rand 16 > /tmp/aes.iv
          cat /tmp/aes.key /tmp/aes.iv > /tmp/keyiv.bin

          KEYHEX="$(xxd -p -c 256 /tmp/aes.key)"
          IVHEX="$(xxd -p -c 256 /tmp/aes.iv)"

          openssl enc -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX" \
            -in /tmp/atlaspage-openvpn-configs.tar.gz \
            -out transfer/configs.enc

          openssl pkeyutl -encrypt \
            -pubin -inkey /tmp/transfer-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/keyiv.bin \
            -out transfer/keyiv.enc

          printf 'files='
          find openvpn-configs -type f -name '*.ovpn' | wc -l

          rm -f /tmp/aes.key /tmp/aes.iv /tmp/keyiv.bin /tmp/atlaspage-openvpn-configs.tar.gz

      - name: Upload encrypted transfer package
        uses: actions/upload-artifact@v4
        with:
          name: atlaspage-openvpn-encrypted
          path: transfer/
          if-no-files-found: error
          retention-days: 1
