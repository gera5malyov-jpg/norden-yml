name: Kenner feature units verified
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kenner-verified-feature-units.yml'
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile storefront/feature_unit_label_precision.py
      - run: python3 storefront/feature_unit_label_precision.py
