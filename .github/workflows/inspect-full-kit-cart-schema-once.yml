name: Inspect full KIT cart schema once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-full-kit-cart-schema-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git clone --depth 1 https://github.com/yandex/kit-skills.git /tmp/kit-skills
      - name: Print native cart skeleton and full settings definition
        env:
          KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          K=/tmp/kit-skills/skills/kit-storefront-constructor/scripts/kit.py
          PROMPT='Проверить возможность запретить ручное изменение количества в штатной корзине KIT.'
          SID='c3b223d7-6041-49cb-9b86-caf0ed67e8ba'
          COMMON=(--bff-url https://megapolis-meb.ru --skill-prompt "$PROMPT" --skill-session-id "$SID")
          python "$K" "${COMMON[@]}" schema fetch
          echo '--- SKELETON ---'
          python "$K" "${COMMON[@]}" schema widget --name YandexKit.ShoppingCart --skeleton
          CACHE=$(find "$HOME/.yandex-kit-skills/cache" -name 'bff-schema-megapolis-meb.ru.json' -print -quit)
          echo '--- MATCHES ---'
          python - "$CACHE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          def walk(obj,path='root'):
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      p=f'{path}.{k}'
                      if any(s in str(k).lower() for s in ('quantity','counter','stepper','snippet','amount')):
                          print(p,'=',json.dumps(v,ensure_ascii=False)[:5000])
                      walk(v,p)
              elif isinstance(obj,list):
                  for i,v in enumerate(obj): walk(v,f'{path}[{i}]')
          # restrict output to objects containing ShoppingCartSettings when possible
          def find(obj):
              if isinstance(obj,dict):
                  if obj.get('title')=='ShoppingCartSettings' or obj.get('$id')=='ShoppingCartSettings':
                      print('SHOPPING_CART_DEF=',json.dumps(obj,ensure_ascii=False)[:30000])
                  for v in obj.values(): find(v)
              elif isinstance(obj,list):
                  for v in obj: find(v)
          find(x)
          walk(x)
          PY
