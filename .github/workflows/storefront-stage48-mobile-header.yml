name: Storefront Stage 48 - Clean mobile header and preserve both phones
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage48-mobile-header.yml'
      - 'storefront/stage48_cleanup_mobile_header.py'
permissions:
  contents: read
concurrency:
  group: storefront-header-ux
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate safe deployment code
        run: python -m py_compile storefront/stage48_cleanup_mobile_header.py
      - name: Back up theme, remove header callback and redundant mobile icon, verify pages
        run: python storefront/stage48_cleanup_mobile_header.py
