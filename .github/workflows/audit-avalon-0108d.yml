name: Audit Avalon 0108D external image (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'storefront/audit_avalon_0108d.py'
      - '.github/workflows/audit-avalon-0108d.yml'
permissions:
  contents: read
concurrency:
  group: audit-avalon-photo-0108d
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile guarded read-only audit
        run: python -m py_compile storefront/audit_avalon_0108d.py
      - name: Read Webasyst product image metadata
        run: python storefront/audit_avalon_0108d.py
