name: Inspect duplicate Riva articles

on:
  push:
    branches:
      - feat/riva-kit-sync
    paths:
      - '.github/workflows/riva-duplicate-sample.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RIVA_FEED_URL: ${{ secrets.RIVA_FEED_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect duplicate article rows
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.request, xml.etree.ElementTree as ET, collections

          targets = {'Л.МП-1', 'SN-6A.SRG-013.M(L)'}
          found = {t: [] for t in targets}
          req = urllib.request.Request(os.environ['RIVA_FEED_URL'], headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=240) as r:
              for _, elem in ET.iterparse(r, events=('end',)):
                  if elem.tag.split('}')[-1] != 'offer':
                      continue
                  article = None
                  row = {'id': elem.attrib.get('id',''), 'group_id':elem.attrib.get('group_id','')}
                  params = {}
                  pics = []
                  for child in list(elem):
                      tag = child.tag.split('}')[-1]
                      text = (child.text or '').strip()
                      if tag == 'param':
                          name = str(child.attrib.get('name','')).strip()
                          params.setdefault(name, []).append(text)
                          if name.casefold() == 'артикул':
                              article = text
                      elif tag in {'name','price','categoryId','count','barcode','weight'}:
                          row[tag] = text
                      elif tag == 'picture' and text:
                          pics.append(text)
                  if article in targets and len(found[article]) < 12:
                      row['article'] = article
                      row['color'] = params.get('Цвет изделия', [])
                      row['size'] = params.get('Размер', [])
                      row['site_code'] = params.get('Код для сайта', [])
                      row['spb'] = params.get('Количество на складе «Склад СПБ»', [])
                      row['moscow'] = params.get('Количество на складе «1 Склад Москва(Видное)»', [])
                      row['pics'] = len(pics)
                      found[article].append(row)
                  if all(len(v) >= 8 for v in found.values()):
                      break
                  elem.clear()
          for article, rows in found.items():
              print('ARTICLE', article, 'ROWS', len(rows))
              for row in rows:
                  print(repr(row))
          PY
