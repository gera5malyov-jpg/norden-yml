name: Resolve existing Norden codes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-existing-norden-codes-once.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Resolve brand Norden variants against saved source
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, time, unicodedata, xml.etree.ElementTree as ET
          import requests
          SOURCE='https://raw.githubusercontent.com/gera5malyov-jpg/norden-yml/b3d07c22c6093ed2ffd71953e75e7e3ce4937039/norden.yml'
          token=os.environ['YANDEX_KIT_TOKEN']; h={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def req(params):
              for i in range(12):
                  r=requests.get('https://api.kit.yandex.net/v1/variants',headers=h,params=params,timeout=120)
                  if r.status_code==429:
                      time.sleep(float(r.headers.get('Retry-After') or min(20,2**i))); continue
                  if r.status_code>=500:
                      time.sleep(min(20,2**i)); continue
                  r.raise_for_status(); return r.json()
              raise RuntimeError('retries exhausted')
          def norm(s):
              s=unicodedata.normalize('NFKC',str(s or '')).casefold()
              return re.sub(r'[^0-9a-zа-яё]+','',s)
          src=requests.get(SOURCE,timeout=120); src.raise_for_status(); root=ET.fromstring(src.content)
          offers=[]
          for o in root.findall('.//offer'):
              code=(o.findtext('vendorCode') or o.attrib.get('id') or '').strip()
              name=(o.findtext('name') or '').strip()
              if code: offers.append({'code':code,'name':name,'code_n':norm(code),'name_n':norm(name)})
          variants=[]; page=1; seen=0
          while True:
              p=req({'page':page,'per_page':100})
              rows=p.get('variants') or p.get('items') or p.get('results') or p.get('data') or []
              if isinstance(rows,dict): rows=rows.get('items') or []
              if not rows: break
              for row in rows:
                  seen+=1
                  if str(row.get('brand','')).strip().casefold()=='norden':
                      variants.append(row)
              total=p.get('total_count') or p.get('total') or (p.get('meta') or {}).get('total_count') or (p.get('meta') or {}).get('total')
              if total is not None and seen>=int(total): break
              if len(rows)<100: break
              page+=1
          resolved=[]; unresolved=[]; ambiguous=[]
          for v in variants:
              vn=norm(v.get('name'))
              exact=[o for o in offers if o['code_n'] and o['code_n'] in vn]
              if len(exact)==1:
                  resolved.append({'variant_id':v.get('id'),'kit_id':v.get('kit_id'),'sku':v.get('sku'),'name':v.get('name'),'code':exact[0]['code'],'method':'code_in_name'})
                  continue
              if len(exact)>1:
                  # Prefer longest source code; this resolves prefix codes deterministically.
                  exact=sorted(exact,key=lambda x:len(x['code_n']),reverse=True)
                  if len(exact)==1 or len(exact[0]['code_n'])>len(exact[1]['code_n']):
                      resolved.append({'variant_id':v.get('id'),'kit_id':v.get('kit_id'),'sku':v.get('sku'),'name':v.get('name'),'code':exact[0]['code'],'method':'longest_code_in_name'})
                  else:
                      ambiguous.append({'kit_id':v.get('kit_id'),'sku':v.get('sku'),'name':v.get('name'),'candidates':[x['code'] for x in exact[:20]]})
                  continue
              # Model-name fallback only when it selects a unique source offer.
              byname=[o for o in offers if o['name_n'] and o['name_n'] in vn]
              if len(byname)==1:
                  resolved.append({'variant_id':v.get('id'),'kit_id':v.get('kit_id'),'sku':v.get('sku'),'name':v.get('name'),'code':byname[0]['code'],'method':'unique_model_name'})
              else:
                  unresolved.append({'kit_id':v.get('kit_id'),'sku':v.get('sku'),'name':v.get('name'),'candidate_count':len(byname),'candidate_codes':[x['code'] for x in byname[:20]]})
          codes={}
          dup_resolved=[]
          for x in resolved:
              if x['code'] in codes: dup_resolved.append([codes[x['code']],x])
              else: codes[x['code']]=x
          report={'source_offers':len(offers),'brand_norden_variants':len(variants),'resolved_count':len(resolved),'unresolved_count':len(unresolved),'ambiguous_count':len(ambiguous),'duplicate_resolved_codes':len(dup_resolved),'unresolved':unresolved[:100],'ambiguous':ambiguous[:100],'resolved_sample':resolved[:30]}
          os.makedirs('norden-kit',exist_ok=True)
          with open('norden-kit/resolve_existing_codes_analysis.json','w',encoding='utf-8') as f: json.dump(report,f,ensure_ascii=False,indent=2)
          with open('norden-kit/resolved_existing_codes.json','w',encoding='utf-8') as f: json.dump(resolved,f,ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit analysis
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden-kit/resolve_existing_codes_analysis.json norden-kit/resolved_existing_codes.json
          git commit -m "Resolve existing Norden KIT codes" || exit 0
          git pull --rebase
          git push
