name: Check integration secret names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-integration-secret-names.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SECRET_MAP: ${{ toJSON(secrets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Save integration secret names only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          data=json.loads(os.environ.get("SECRET_MAP","{}") or "{}")
          keys=sorted(k for k in data.keys() if any(x in k.upper() for x in ["GOOGLE","GDRIVE","DRIVE","GCP","SERVICE_ACCOUNT"]))
          os.makedirs("ozon/pilot_20",exist_ok=True)
          open("ozon/pilot_20/integration_secret_names.json","w").write(json.dumps({"matching_secret_names":keys},indent=2))
          print(json.dumps({"matching_secret_names":keys}))
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ozon/pilot_20/integration_secret_names.json
          git commit -m "report: integration secret names [skip ci]" || exit 0
          git push
