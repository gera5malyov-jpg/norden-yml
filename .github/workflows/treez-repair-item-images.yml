name: TREEZ — точечно исправить фото товара

on:
  workflow_dispatch:
    inputs:
      source_code:
        description: 'Артикул поставщика Treez'
        required: true
        default: '10.11957N'
        type: string
  push:
    branches: [main]
    paths:
      - 'treez-kit/repair_treez_item_images.py'
      - '.github/workflows/treez-repair-item-images.yml'

permissions:
  contents: write

jobs:
  repair-one:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: python -m pip install --disable-pip-version-check requests openpyxl playwright

      - name: Исправить фото товара TREEZ
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          TREEZ_SOURCE_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.source_code || '10.11957N' }}
        run: python treez-kit/repair_treez_item_images.py

      - name: Сохранить отчёт
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          cp treez-kit/item_image_repair_report.json /tmp/treez-item-image-report.json 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/treez-item-image-report.json treez-kit/item_image_repair_report.json 2>/dev/null || true
          git add treez-kit/item_image_repair_report.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Обновить отчёт точечного ремонта фото TREEZ'
          git push origin HEAD:main || true
