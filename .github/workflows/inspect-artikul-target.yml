name: Inspect Artikul Target

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-artikul-target.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect target characteristics
        run: |
          python - <<'PY'
          import time, requests
          from bs4 import BeautifulSoup
          url='https://artikul-mebel.ru/catalog/detail/stul-uchenicheskiy-reguliruemyy-praym-plastik/?oID=3295'
          r=None
          for i in range(5):
              r=requests.get(url,timeout=60,headers={'User-Agent':'Mozilla/5.0'})
              if r.status_code==200: break
              time.sleep(3*(i+1))
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          node=soup.select_one('#chars')
          print(node.prettify()[:50000] if node else 'CHARS NOT FOUND')
          PY
