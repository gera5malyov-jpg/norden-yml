name: Map89 locate Yandex constructor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map89-source-readonly.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/map89_source_readonly.py
      - run: python storefront/map89_source_readonly.py
