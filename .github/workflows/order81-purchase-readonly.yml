name: Order81 - Read-only Webasyst purchase state
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/order81-purchase-readonly.yml'
      - 'storefront/order81_product_template_readonly.py'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/order81_product_template_readonly.py
      - run: python storefront/order81_product_template_readonly.py
