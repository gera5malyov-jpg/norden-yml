name: Marketplace orders to Webasyst
# live sync: yandex buyer and delivery repair

on:
  push:
    paths:
      - '.github/workflows/marketplace-orders-webasyst.yml'
      - 'webasyst/marketplace_order_sync.py'
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

concurrency:
  group: marketplace-orders-webasyst-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить синтаксис синхронизации
        run: python -m py_compile webasyst/marketplace_order_sync.py
      - name: Перенести заказы маркетплейсов в Webasyst
        id: sync_orders
        env:
          DRY_RUN: '0'
          CHAT_AUTOMATION_START: '2026-09-23T19:35:00Z'
          SYNC_SOURCES: 'yandex_market,yandex_kit,ozon'
          OZON_ORDER_IMPORT_CUTOFF: '2026-09-22T11:08:40Z'
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python webasyst/marketplace_order_sync.py

      - name: Проверить проблемы заказов и уведомить в Baserow
        if: always()
        env:
          BASEROW_URL: http://147.78.67.6
          BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
        run: python baserow/evaluate_order_sync_notifications.py || true

      - name: Уведомить, если синхронизация упала до создания отчёта
        if: always() && steps.sync_orders.outcome == 'failure'
        env:
          BASEROW_URL: http://147.78.67.6
          BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
        run: |
          python baserow/notify_baserow.py \
            --severity red \
            --code order_sync_failed \
            --title "Синхронизация заказов в Webasyst завершилась ошибкой" \
            --message "Один из источников Ozon/Яндекс/KIT не обработан. Проверь GitHub Actions." \
            --dedupe-key "orders:webasyst:workflow-failed" \
            --target-url "/database/49/table/494" || true
