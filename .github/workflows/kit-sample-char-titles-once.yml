name: KIT sample characteristic titles once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kit-sample-char-titles-once.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch characteristic titles
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,time
          ids=['01980d43-2488-7cd0-a701-434197ad9d18','01a0a9bd-0c4f-7269-9c3a-44ec58d5cdac','01a0b0be-a877-7ea8-a3da-37762d79f8c0','01a0b0be-aea6-7474-93de-da3b743ace10','01a0b0be-afda-7082-8108-f7ac66e416d6','01a0b0be-c132-7645-a7de-c57bf0b8dd57','01a0b41e-7a1c-72a1-b7e0-1e71f55d3d8e','01a0b475-cc2b-7f1c-8bfa-f15de34c5420','01a0b475-cd41-7bf5-b85e-293d2f4f2bfc','01a0b475-d329-7d14-b258-0171d79daa79','01a0b475-d429-720f-9d7b-6054634b2a6b','01a0b475-da0c-7716-a85f-763730b4f9e2']
          h={'Authorization':'Bearer '+os.environ['YANDEX_KIT_TOKEN'],'Accept':'application/json'}
          out=[]
          for cid in ids:
              url='https://api.kit.yandex.net/v1/characteristics/'+cid
              try:
                  req=urllib.request.Request(url,headers=h)
                  with urllib.request.urlopen(req,timeout=120) as r:
                      out.append(json.loads(r.read().decode()))
              except Exception as e:
                  out.append({'id':cid,'error':repr(e)})
          os.makedirs('norden-kit',exist_ok=True)
          with open('norden-kit/sample_characteristic_titles.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden-kit/sample_characteristic_titles.json
          git commit -m "Probe KIT sample characteristic titles" || exit 0
          git pull --rebase
          git push
