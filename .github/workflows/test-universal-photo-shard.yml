name: Test universal YML photo shard discovery
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/test-universal-photo-shard.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
      UNIVERSAL_SHARD: '2'
      UNIVERSAL_SHARD_COUNT: '12'
      UNIVERSAL_APPLY: '0'
      UNIVERSAL_STRICT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/run_universal_ymlpro_photos.py
