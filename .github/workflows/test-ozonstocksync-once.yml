name: Test ozonstocksync once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-ozonstocksync-once.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Lint and contract checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          {
            echo "TEST=ozonstocksync-1.7.0"
            echo "--- PHP LINT ---"
            find webasyst/ozonstocksync -name '*.php' -print0 | while IFS= read -r -d '' f; do php -l "$f"; done
            echo "--- CONTRACT ---"
            python3 - <<'PY'
          from pathlib import Path
          root=Path('webasyst/ozonstocksync')
          plugin=(root/'lib/shopOzonstocksync.plugin.php').read_text(encoding='utf-8')
          sync=(root/'lib/classes/shopOzonstocksyncPluginSync.class.php').read_text(encoding='utf-8')
          settings=(root/'lib/config/settings.php').read_text(encoding='utf-8')
          info=(root/'lib/config/plugin.php').read_text(encoding='utf-8')
          checks={
              'version_1_7_0': "'version' => '1.7.0'" in info,
              'custom_getControls': 'function getControls' in plugin,
              'type_margin_ui': 'type_margin_percent' in plugin,
              'type_margin_setting': "'type_margin_percent'" in settings,
              'type_margin_price_logic': 'getTargetMarkupPercentForTip' in sync,
              'hidden_stock_zero': '$stock = 0;' in sync,
              'force_price_touch': 'getForcePriceTouchDelta' in sync,
              'retry_429': '429' in sync and 'ResourceExhausted' in sync,
              'price_batch_max_guard': "'price_batch_size' => array(1, 100, 50)" in plugin,
              'multi_stock_sum_sql': 'SUM(COALESCE(count, 0)) AS stock_count' in sync and 'stock_id IN (i:stock_ids)' in sync,
              'multi_stock_parser': 'normalizeStockIdsString' in sync and 'parseStockIds' in sync,
              'multi_stock_ui': 'renderMappingsEditor' in plugin and 'ozs-stock-picker' in plugin,
              'mapping_serializer': 'serializeMappingRows' in plugin and '_mapping_rows_present' in plugin,
              'single_create_allowlist': "const CREATE_SET_ID = 'ozon_upload'" in sync and "const CREATE_SET_NAME = 'Грузить в Ozon'" in sync,
              'allowlist_is_only_permission': 'collectCreateCandidates' in sync and "sp.set_id = s:set_id" in sync and "'set_id' => self::CREATE_SET_ID" in sync,
              'no_extra_create_permission_setting': 'create_permission' not in settings and 'create_enabled' not in settings and 'upload_to_ozon' not in settings,
              'existing_remote_offer_guard': 'CREATE_SKIP_REMOTE_EXISTS' in sync and 'PRODUCT_LIST_URL' in sync,
              'saved_id_remote_guard': 'saved_ozon_product_id' in sync and 'PRODUCT_INFO_LIST_URL' in sync and "'product_id:'" in sync,
              'ozon_sku_remote_guard': "'sku:'" in sync and "array('product_id' => $product_ids, 'sku' => $sku_ids)" in sync,
              'double_preimport_guard': 'CREATE_ABORT_SECOND_EXISTENCE_CHECK' in sync and sync.count('getRemoteExistingOfferIds(') >= 3,
              'native_ozon_generator': "new ozonProduct($product_id)" in sync and 'getOzonOffers($sku_id, false, $generator_errors)' in sync,
              'create_before_stock_price': sync.find('createMissingProductsForAccount($account') < sync.find("foreach ($account['mappings'] as $mapping)"),
              'single_primary_creation_account': "const CREATE_PRIMARY_ACCOUNT_INDEX = 1" in sync and 'CREATE_ROUTE_SKIP_NON_PRIMARY' in sync and 'CREATE_ROUTE_PRIMARY' in sync,
              'creation_not_routed_by_old_sets': 'route_sets=' not in sync and 'CREATE_ROUTE_ERROR' not in sync,
              'create_only_active_in_stock': 'AND p.status = 1' in sync and 'AND s.status = 1' in sync and 'AND s.available = 1' in sync and 'AND COALESCE(s.count, 0) > 0' in sync,
              'create_logs_in_stock_rows': 'in_stock_active_sku_rows=' in sync,
              'package_fallback_in_memory': 'applyCreatePackageFallback' in sync and 'CREATE_PACKAGE_FALLBACK' in sync and 'persisted=0' in sync,
              'package_fallback_defaults': 'CREATE_FALLBACK_DEPTH_CM = 50' in sync and 'CREATE_FALLBACK_HEIGHT_CM = 100' in sync and 'CREATE_FALLBACK_WIDTH_CM = 50' in sync and 'CREATE_FALLBACK_WEIGHT_KG = 31' in sync,
              'single_item_create_batch': 'const CREATE_BATCH_SIZE = 1' in sync,
              'create_error_names_offer': "offers=' . implode(',', array_column($final, 'offer_id'))" in sync,
              'seller_offer_not_internal_sku': "Seller offer identifiers must not be sent as Ozon internal SKU ids." in sync and "saved offer_id are seller offer identifiers, not Ozon's" in sync,
              'create_extimg_images': 'getCreateExternalImageUrls' in sync and 'CREATE_EXTIMG_IMAGES' in sync and "stripos($summary, '[extimg]')" in sync,
              'extimg_only_create_payload': "$offer['images'] = array_values($merged_images);" in sync and 'array_merge($native_images, $external_images)' in sync,
          }
          for k,v in checks.items():
              print(f'{k}={"OK" if v else "FAIL"}')
          if not all(checks.values()):
              raise SystemExit(2)
          PY
            echo "TEST_STATUS=OK"
          } > .deploy-probe/ozonstocksync-test.txt 2>&1
          cat .deploy-probe/ozonstocksync-test.txt
      - name: Save report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy-probe/ozonstocksync-test.txt || echo "TEST_STATUS=FAILED_NO_REPORT" > .deploy-probe/ozonstocksync-test.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/ozonstocksync-test.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save ozonstocksync test report [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
