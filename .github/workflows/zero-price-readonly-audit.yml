name: Zero price theme readonly audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zero-price-readonly-audit.yml'
      - 'storefront/zero_price_readonly_audit.py'
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile storefront/zero_price_readonly_audit.py
      - name: Inspect active zero-price markup without modifications
        run: python3 storefront/zero_price_readonly_audit.py
