name: Perf71 - Feature filter selectivity audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf71-feature-selectivity.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/perf71_feature_selectivity_readonly.py
      - run: python storefront/perf71_feature_selectivity_readonly.py
