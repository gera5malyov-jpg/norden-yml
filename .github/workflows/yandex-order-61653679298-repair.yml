name: Repair Yandex order 61653679298
# retry buyer name and normalized deadline

on:
  push:
    paths:
      - '.github/workflows/yandex-order-61653679298-repair.yml'
  workflow_dispatch:

concurrency:
  group: yandex-order-61653679298-repair
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Исправить заказ Яндекс в Webasyst
        env:
          DRY_RUN: '0'
          SYNC_SOURCES: 'yandex_market'
          TARGET_EXTERNAL_ID: '61653679298'
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python webasyst/marketplace_order_sync.py
