name: Сравнить отсутствующие кресла Norden
on:
  push:
    paths:
      - 'catalog/missing_chairs_compare_trigger.txt'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python catalog/norden_missing_instock_chairs_compare.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add catalog/norden_missing_instock_chairs.json
          git diff --cached --quiet || (git commit -m "Обновить список отсутствующих кресел Norden" && git push)
