name: Samson KIT full dry run once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-full-dry-run-once.yml'

permissions:
  contents: read

concurrency:
  group: samson-kit-full-dry-run-once
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
      - name: Full Samson dry run
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python -m samson_kit.cli --dry-run --report /tmp/samson-full-dry-run.json
          echo 'FULL_DRY_RUN_REPORT_BEGIN'
          cat /tmp/samson-full-dry-run.json
          echo 'FULL_DRY_RUN_REPORT_END'
