name: Ozon marking 27 archived-product read-only audit Nov18
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-marking-archive-audit-20261118.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read archived marking items
        run: python ozon/marking_27_archive_audit_20261118.py
