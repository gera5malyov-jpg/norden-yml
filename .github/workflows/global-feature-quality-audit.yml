name: Global Webasyst feature quality audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-feature-quality-audit.yml'
      - 'storefront/features_global_readonly_audit.py'
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python3 -m py_compile storefront/features_global_readonly_audit.py
      - name: Read-only feature audit
        run: python3 storefront/features_global_readonly_audit.py
