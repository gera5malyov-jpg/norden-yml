name: Ozon AF-31646769 pricing strategy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-af31646769-pricing-strategy.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install requests
        run: python -m pip install requests
      - name: Enable best-price strategy
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, requests, sys
          PID="5610536251"
          H={"Client-Id":os.environ["OZON_CLIENT_ID"],"Api-Key":os.environ["OZON_API_KEY"],"Content-Type":"application/json"}
          S=requests.Session(); S.headers.update(H)
          BASE="https://api-seller.ozon.ru"
          def call(path,body):
              for a in range(8):
                  r=S.post(BASE+path,json=body,timeout=60)
                  print("HTTP",path,r.status_code)
                  if r.status_code==429:
                      time.sleep(1+a);continue
                  try:d=r.json() if r.content else {}
                  except Exception:d={"raw":r.text}
                  if r.status_code>=400: print("ERROR",json.dumps(d,ensure_ascii=False))
                  return d,r
              return {},r

          listed,lr=call("/v1/pricing-strategy/list",{"page":1,"limit":50})
          print("STRATEGIES",json.dumps(listed,ensure_ascii=False,sort_keys=True))
          current,cr=call("/v1/pricing-strategy/strategy-ids-by-product-ids",{"product_id":[PID]})
          print("CURRENT_STRATEGY",json.dumps(current,ensure_ascii=False,sort_keys=True))

          strategies=(listed or {}).get("strategies") or []
          system=[x for x in strategies if x.get("type")=="MIN_EXT_PRICE"]
          if not system:
              print("NO_SYSTEM_STRATEGY")
              raise SystemExit(2)
          # Prefer the already-enabled system strategy; otherwise first system strategy.
          chosen=next((x for x in system if x.get("enabled") is True),system[0])
          sid=str(chosen.get("id"))
          print("CHOSEN",json.dumps(chosen,ensure_ascii=False,sort_keys=True))

          # Enable system strategy if needed.
          if not chosen.get("enabled"):
              st,sr=call("/v1/pricing-strategy/status",{"strategy_id":sid,"enabled":True})
              print("ENABLE_STRATEGY",json.dumps(st,ensure_ascii=False,sort_keys=True))
              if sr.status_code>=400: raise SystemExit("strategy enable failed")

          # Add the product if not already linked to the chosen strategy.
          infos=(((current or {}).get("result") or {}).get("products_info") or [])
          linked=next((x for x in infos if str(x.get("product_id"))==PID),None)
          if not linked or str(linked.get("strategy_id") or "")!=sid:
              add,ar=call("/v1/pricing-strategy/products/add",{"strategy_id":sid,"product_id":[PID]})
              print("ADD_PRODUCT",json.dumps(add,ensure_ascii=False,sort_keys=True))
              if ar.status_code>=400: raise SystemExit("product strategy add failed")

          verify,_=call("/v1/pricing-strategy/strategy-ids-by-product-ids",{"product_id":[PID]})
          print("VERIFY_STRATEGY",json.dumps(verify,ensure_ascii=False,sort_keys=True))
          PY
