name: ТД Андрей — остановить ошибочный запуск

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tdandrey-cancel-current.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Остановить первичную загрузку
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/35980179603/cancel
