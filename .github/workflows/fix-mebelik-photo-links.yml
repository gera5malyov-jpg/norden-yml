name: Repair Mebelik external product images
on:
  push:
    branches: [main]
    paths:
      - scripts/fix_mebelik_photo_links.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mebelik-photo-link-fix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safely normalize Mebelik image URLs and refresh mapped cards
        run: python3 -u scripts/fix_mebelik_photo_links.py
