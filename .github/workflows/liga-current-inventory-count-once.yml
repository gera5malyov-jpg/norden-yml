name: Liga current inventory count once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liga-current-inventory-count-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Count current Liga variants
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python - <<'PY'
          import os, json
          from liga_kit.http import SafeSession
          from liga_kit.kit_client import KitClient

          kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],SafeSession())
          idx,dups=kit.index_liga_variants()
          keys=sorted(idx)
          sample=[]
          for sku in keys[:5] + keys[-5:]:
              if sku in [x.get('sku') for x in sample]:
                  continue
              v=idx[sku]
              d=kit.get_variant(v['id'])
              sample.append({
                  'sku':sku,
                  'id':v['id'],
                  'name':d.get('name'),
                  'status':d.get('status'),
                  'image_count':len([m for m in (d.get('media') or []) if isinstance(m,dict) and str(m.get('type','')).upper()=='IMAGE']),
              })
          print('LIGA_COUNT='+str(len(idx)))
          print('LIGA_DUPLICATES='+str(len(dups)))
          print('LIGA_FIRST='+json.dumps(keys[:20],ensure_ascii=False))
          print('LIGA_LAST='+json.dumps(keys[-20:],ensure_ascii=False))
          print('LIGA_SAMPLE='+json.dumps(sample,ensure_ascii=False))
          PY
