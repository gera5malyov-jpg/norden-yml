name: Test Riva dedupe fix once
# rerun 2
on:
  push:
    branches: ['feat/riva-kit-sync']
    paths: ['.github/workflows/test-riva-dedupe-fix-once.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Riva tests
        run: PYTHONPATH=liga-kit:riva-kit python -m unittest discover -s riva-kit/tests -v