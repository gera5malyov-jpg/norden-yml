name: Komus personal download probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/komus-personal-download-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Komus personal page and possible ZIP links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request

          url = "https://komus-opt.ru/personal/"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 Megapolis-Komus-Probe/1.0",
              "Accept": "text/html,application/xhtml+xml",
          })
          with urllib.request.urlopen(req, timeout=90) as r:
              body = r.read().decode("utf-8", "replace")
              print("STATUS=", r.status)
              print("FINAL_URL=", r.geturl())
              print("CONTENT_TYPE=", r.headers.get("Content-Type"))
              print("CONTENT_DISPOSITION=", r.headers.get("Content-Disposition"))

          phrases = [
              "Полный ассортимент со специальными ценами",
              "Полный товарный каталог в XML",
              "zip-архив",
              "Войти",
          ]
          for phrase in phrases:
              print("PHRASE", repr(phrase), "FOUND=", phrase.casefold() in body.casefold())

          hrefs = re.findall(r'href=["\']([^"\']+)["\']', body, flags=re.I)
          interesting = [
              h for h in hrefs
              if any(x in h.casefold() for x in ("zip", "xml", "price", "catalog", "download"))
          ]
          print("INTERESTING_HREFS=", interesting[:100])
          print("BODY_LEN=", len(body))
          PY
