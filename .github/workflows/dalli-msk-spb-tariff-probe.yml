name: Dalli MSK-SPB tariff probe

on:
  push:
    paths:
      - '.github/workflows/dalli-msk-spb-tariff-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DALLI_TOKEN_MSK: ${{ secrets.DALLI_TOKEN_MSK }}
      DALLI_ACCOUNT: msk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe tariff grid
        run: |
          python - <<'PY'
          import json
          from dalli.dalli_api import DalliClient, DalliApiError

          client = DalliClient.from_env()
          rows = []
          address = "Санкт-Петербург, Невский проспект, 1"
          for vw in range(20, 201, 20):
              # 100*50*H / 5000 = H kg volumetric weight
              pkg = {
                  "weight_kg": 1,
                  "length_cm": 100,
                  "width_cm": 50,
                  "height_cm": vw,
              }
              try:
                  result = client.delivery_cost(
                      address,
                      [pkg],
                      order_price=0,
                      insurance_price=0,
                      output_x2=True,
                  )
                  rows.append({
                      "volumetric_weight_kg": vw,
                      "actual_weight_kg": 1,
                      "dimensions_cm": f"100x50x{vw}",
                      "response": result,
                  })
              except Exception as e:
                  rows.append({
                      "volumetric_weight_kg": vw,
                      "actual_weight_kg": 1,
                      "dimensions_cm": f"100x50x{vw}",
                      "error": str(e),
                  })

          out = {
              "account": "MSK",
              "endpoint": client.base_url,
              "destination": address,
              "method": "deliverycost output=x2",
              "volumetric_formula": "L*W*H/5000",
              "rows": rows,
          }
          with open("dalli/msk_spb_tariff_probe_2026-09-27.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dalli/msk_spb_tariff_probe_2026-09-27.json
          git commit -m "Probe Dalli MSK-SPB tariff grid [skip ci]" || exit 0
          git push
