name: 4sis gallery check (manual only)
# Automatic 12-hour gallery monitoring disabled by owner on 2026-10-19.
# Retain manual diagnostics only; no scheduled or push triggers.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-4sis-gallery-healthcheck
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual public product image and three thumbnails
        run: python -u storefront/smoke_4sis_live_gallery.py
