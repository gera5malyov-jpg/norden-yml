name: Yandex Market — probe campaigns

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yandex-campaign-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Получить список кампаний
        env:
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, requests
          h={"Api-Key":os.environ["YANDEX_MARKET_API_KEY"],"Accept":"application/json"}
          r=requests.get("https://api.partner.market.yandex.ru/v2/campaigns",headers=h,params={"limit":100},timeout=60)
          r.raise_for_status()
          d=r.json()
          rows=d.get("campaigns") or (d.get("result") or {}).get("campaigns") or []
          safe=[]
          for c in rows:
              b=c.get("business") or {}
              safe.append({
                  "campaign_id":c.get("id"),
                  "business_id":b.get("id") or c.get("businessId"),
                  "business_name":b.get("name"),
                  "domain":c.get("domain"),
                  "placementType":c.get("placementType"),
                  "apiAvailability":c.get("apiAvailability"),
              })
          with open("catalog/yandex_campaigns_probe.json","w",encoding="utf-8") as f:
              json.dump(safe,f,ensure_ascii=False,indent=2); f.write("\n")
          print(json.dumps(safe,ensure_ascii=False,indent=2))
          PY
      - name: Проверить один Norden SKU и тариф DBS
        env:
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, requests
          h={"Api-Key":os.environ["YANDEX_MARKET_API_KEY"],"Accept":"application/json","Content-Type":"application/json"}
          base="https://api.partner.market.yandex.ru"
          sku="AF-31391082"; bid=20806099; cid=89405839
          m=requests.post(f"{base}/v2/businesses/{bid}/offer-mappings",headers=h,json={"offerIds":[sku]},timeout=60)
          m.raise_for_status(); md=m.json()
          co=requests.post(f"{base}/v2/campaigns/{cid}/offers",headers=h,json={"offerIds":[sku]},timeout=60)
          co.raise_for_status(); cd=co.json()
          result={"sku":sku,"mapping":md,"campaign_offer":cd}
          rows=((md.get("result") or {}).get("offerMappings") or [])
          offers=((cd.get("result") or {}).get("offers") or [])
          if rows and offers:
              off=rows[0].get("offer") or {}
              mp=rows[0].get("mapping") or {}
              wd=off.get("weightDimensions") or {}
              cat=off.get("marketCategoryId") or mp.get("marketCategoryId")
              po=offers[0]
              price=((po.get("campaignPrice") or {}).get("value") or (po.get("basicPrice") or {}).get("value"))
              if cat and price and all(float(wd.get(k) or 0)>0 for k in ("length","width","height","weight")):
                  body={"parameters":{"campaignId":cid,"currency":"RUR"},"offers":[{
                    "categoryId":int(cat),"price":float(price),"length":float(wd["length"]),"width":float(wd["width"]),
                    "height":float(wd["height"]),"weight":float(wd["weight"]),"quantity":1}]}
                  tr=requests.post(f"{base}/v2/tariffs/calculate",headers=h,json=body,timeout=60)
                  result["tariff_status"]=tr.status_code
                  try: result["tariff"]=tr.json()
                  except: result["tariff_raw"]=tr.text
          with open("catalog/yandex_norden_tariff_probe.json","w",encoding="utf-8") as fh:
              json.dump(result,fh,ensure_ascii=False,indent=2); fh.write("\n")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Сохранить результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/yandex_campaigns_probe.json catalog/yandex_norden_tariff_probe.json
          git commit -m "Обновить диагностику кампаний Яндекс Маркета" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
