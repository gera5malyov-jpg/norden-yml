name: Direct Samson stock probe 106225 106203 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-samson-stock-probe-106225-106203-once.yml'

permissions:
  contents: read

concurrency:
  group: direct-samson-stock-probe-examples
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Direct Samson raw stock probe
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import os, json
          from samson_kit.http import SafeSession

          http=SafeSession()
          base='https://api.samsonopt.ru/v1'
          key=os.environ['SAMSON_API_KEY']
          for code in ('106225','106203'):
              product=http.request_json(
                  'GET',f'{base}/sku/{code}',
                  params={'api_key':key,'response_format':'json'},
                  headers={'Accept':'application/json','User-Agent':'MegapolisSamsonKit/1.0'})
              stock=http.request_json(
                  'GET',f'{base}/sku/{code}/stock',
                  params={'api_key':key,'response_format':'json'},
                  headers={'Accept':'application/json','User-Agent':'MegapolisSamsonKit/1.0'})
              print('PRODUCT_RAW_'+code+'='+json.dumps(product,ensure_ascii=False)[:12000])
              print('STOCK_RAW_'+code+'='+json.dumps(stock,ensure_ascii=False)[:12000])
          PY
