name: Verify installed Universal Import
on:
  push:
    branches:
      - feature/universal-yml-import-20261015
    paths:
      - '.github/workflows/verify-univimport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only plugin boot and storefront checks
        run: python -u scripts/verify_univimport.py
