name: Norden KIT -> Webasyst daily sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'KIT sync mode'
        required: false
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - full
          - price-stock
          - preflight
      rebuild_map:
        description: 'Rebuild KIT mapping by scanning variants'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: norden-kit-webasyst-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update Norden in Yandex KIT
        id: kit
        continue-on-error: true
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python norden-kit/sync_norden_kit.py \
              --mode scheduled \
              --no-create \
              --time-budget-seconds 17000
          else
            ARGS="--mode ${{ inputs.mode }} --no-create --time-budget-seconds 17000"
            if [ "${{ inputs.rebuild_map }}" = "true" ]; then
              ARGS="$ARGS --rebuild-map"
            fi
            python norden-kit/sync_norden_kit.py $ARGS
          fi

      - name: Update existing NORDEN-100 in Webasyst from KIT
        id: webasyst
        if: steps.kit.outcome == 'success' && (github.event_name == 'schedule' || inputs.mode != 'preflight')
        continue-on-error: true
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
          NORDEN_WEBASYST_WRITE_DELAY: '0.60'
        run: python webasyst/sync_norden_to_webasyst.py

      - name: Commit Norden state and reports
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

          mkdir -p /tmp/norden-chain-state
          cp norden-kit/kit_mapping.json /tmp/norden-chain-state/kit_mapping.json 2>/dev/null || true
          cp norden-kit/last_sync_report.json /tmp/norden-chain-state/kit_report.json 2>/dev/null || true
          cp webasyst/last_norden_webasyst_sync.json /tmp/norden-chain-state/wa_report.json 2>/dev/null || true

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/norden-chain-state/kit_mapping.json norden-kit/kit_mapping.json 2>/dev/null || true
          cp /tmp/norden-chain-state/kit_report.json norden-kit/last_sync_report.json 2>/dev/null || true
          cp /tmp/norden-chain-state/wa_report.json webasyst/last_norden_webasyst_sync.json 2>/dev/null || true

          git add norden-kit/kit_mapping.json norden-kit/last_sync_report.json webasyst/last_norden_webasyst_sync.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Norden KIT and Webasyst sync state"
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i * 5))
            done
          fi

      - name: Send combined Norden report
        if: always() && (github.event_name == 'schedule' || inputs.mode != 'preflight')
        env:
          SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: shop@office-mag.com
          PHASE: daily
          KIT_OUTCOME: ${{ steps.kit.outcome }}
          WA_OUTCOME: ${{ steps.webasyst.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python webasyst/send_norden_chain_report.py

      - name: Fail if daily chain failed
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          KIT_OUTCOME: ${{ steps.kit.outcome }}
          WA_OUTCOME: ${{ steps.webasyst.outcome }}
        run: |
          test "$KIT_OUTCOME" = "success"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$MODE" != "preflight" ]; then
            test "$WA_OUTCOME" = "success"
          fi
