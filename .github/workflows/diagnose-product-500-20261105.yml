name: Diagnose one Webasyst product HTTP 500 (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-product-500-20261105.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - name: Read-only inspection of failing product and PHP errors
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,subprocess,tempfile,urllib.parse,urllib.request
          from pathlib import Path
          def api(url, method="GET", data=None, headers=None):
              req=urllib.request.Request(url,method=method,data=data,headers=headers or {})
              with urllib.request.urlopen(req,timeout=25) as r:
                  body=r.read().decode()
                  return json.loads(body) if body else {}
          secret=os.environ.get("NETANGELS_API_KEY","").strip()
          if not secret:
              raise RuntimeError("NETANGELS_API_KEY not configured")
          auth=api("https://panel.netangels.ru/api/gateway/token/","POST",urllib.parse.urlencode({"api_key":secret}).encode(),{"Content-Type":"application/x-www-form-urlencoded"})["token"]
          headers={"Authorization":"Bearer "+auth,"Content-Type":"application/json"}
          with tempfile.TemporaryDirectory() as td:
              key=td+"/tempkey"
              subprocess.run(["ssh-keygen","-q","-t","ed25519","-N","","-f",key],check=True)
              created=api("https://api-ms.netangels.ru/api/v1/cloud/vms/44780/ssh/create/","POST",json.dumps({"key":Path(key+".pub").read_text().strip(),"name":"product-500-inspect-"+os.environ.get("GITHUB_RUN_ID","manual")}).encode(),headers)
              key_id=created["id"]
              try:
                  script=r'''set +e
                  ROOT=/home/web/vm-23f9aff9.na4u.ru/www
                  echo "===DATE==="; date -Is
                  echo "===BEFORE LOG MTIMES==="
                  find "$ROOT/wa-log" -maxdepth 3 -type f -mmin -20 -printf '%TY-%Tm-%TdT%TH:%TM %s %p\n' 2>/dev/null | sort -r | head -35
                  echo "===PRODUCT GET (loopback origin)==="
                  curl -sS -L --max-time 18 -o /dev/null --resolve profikompany.ru:443:127.0.0.1 -w 'product http=%{http_code} total=%{time_total}\n' 'https://profikompany.ru/stul-barnyy-750-venskiy-tverdyy-belenyy-dub/'
                  echo "===HOME GET==="
                  curl -sS -L --max-time 18 -o /dev/null --resolve profikompany.ru:443:127.0.0.1 -w 'home http=%{http_code} total=%{time_total}\n' 'https://profikompany.ru/'
                  sleep 2
                  echo "===RECENT RELEVANT LOGS (LAST 120 LINES PER LOG)==="
                  find "$ROOT/wa-log" -maxdepth 4 -type f -mmin -15 \( -name '*.log' -o -name '*.txt' \) -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -20 | cut -d' ' -f2- | while IFS= read -r f; do
                    echo "FILE $f"
                    tail -n 120 "$f" 2>/dev/null | grep -Ei -B 2 -A 7 'Fatal error|Uncaught|exception|PHP (Warning|Parse error|Notice)|Smarty|error:|stul-barnyy-750-venskiy|shopFrontendProduct|product.html' | tail -45 | cut -c 1-250 | sed -E 's/([A-Za-z0-9_.+-]+)@([A-Za-z0-9.-]+)/[EMAIL]/g;s/(token|password|key|secret|authorization)[[:space:]]*[:=][[:space:]]*[^ ,;]+/\1=[REDACTED]/Ig;s/([?&][[:alnum:]_-]+)=([^& ]+)/\1=[REDACTED]/g' || true
                  done
                  echo "===PHP/NGINX LOGS==="
                  for p in /var/log/nginx/error.log /var/log/apache2/error.log /var/log/php8.1-fpm.log /var/log/php8.2-fpm.log /var/log/php8.3-fpm.log /var/log/php8.4-fpm.log; do
                    if [ -f "$p" ]; then echo "FILE $p"; tail -n 180 "$p" | grep -Ei 'fatal|uncaught|upstream|error|exception|php message' | tail -18 | cut -c 1-250 | sed -E 's/([A-Za-z0-9_.+-]+)@([A-Za-z0-9.-]+)/[EMAIL]/g' ; fi
                  done
                  echo "===PRODUCT-COMPARISON==="
                  for slug in stul-barnyy-750-venskiy-tverdyy-belenyy-dub stul-barnyy-dobrin-kruger-arm-black-siniy-velvet-lar-e2041-19 stul-barnyy-dobrin-charly-black-korichnevyy-tvid-leo45 stul-signal-katana-t-259-kapuchino-kashemir stul-signal-hugo-brego-22-svetlo-bezhevyy-chernyy-povorotnyy beskarkasnoe-kreslo-dobrin-connor-belyy-iskusstvennyy-krolik-01; do
                    printf "%s " "$slug"; curl -sS -L -k --max-time 15 -o /dev/null --resolve profikompany.ru:443:127.0.0.1 -w '%{http_code}\n' "https://profikompany.ru/$slug/"; done
                  echo "===ROOT CHECK==="; readlink -f "$ROOT"; ls -ld "$ROOT" /home/web/profikompany.ru/www 2>/dev/null
                  echo "===LOG PATH CANDIDATES==="
                  find /home/web /var/log -maxdepth 4 -type f \( -iname '*php*error*' -o -iname '*php*log*' -o -iname '*error*.log' \) -printf '%TY-%Tm-%TdT%TH:%TM %s %p\n' 2>/dev/null | sort -r | head -35
                  echo "===DATABASE READ-ONLY PRODUCT LOOKUP==="
                  cd "$ROOT" || exit 1
                  php -d display_errors=0 -r '
                  try {
                    $all=include "wa-config/db.php";
                    $db=$all["default"] ?? reset($all);
                    if (!is_array($db)) {echo "DB_CONFIG_FORMAT_UNKNOWN\n";exit;}
                    $host=$db["host"]??"localhost";$user=$db["user"]??"";$pass=$db["password"]??"";$name=$db["database"]??"";
                    $port=(int)($db["port"]??3306);
                    mysqli_report(MYSQLI_REPORT_ERROR|MYSQLI_REPORT_STRICT);
                    $m=new mysqli($host,$user,$pass,$name,$port);$m->set_charset("utf8mb4");
                    $sql="SELECT id,url,name,status,category_id,type_id FROM shop_product WHERE url IN (?,?,?,?,?,?)";
                    $q=$m->prepare($sql);
                    $one="stul-barnyy-750-venskiy-tverdyy-belenyy-dub";
                    $two="stul-barnyy-dobrin-kruger-arm-black-siniy-velvet-lar-e2041-19";
                    $three="stul-barnyy-dobrin-charly-black-korichnevyy-tvid-leo45";
                    $four="stul-signal-katana-t-259-kapuchino-kashemir";
                    $five="stul-signal-hugo-brego-22-svetlo-bezhevyy-chernyy-povorotnyy";
                    $six="beskarkasnoe-kreslo-dobrin-connor-belyy-iskusstvennyy-krolik-01";
                    $q->bind_param("ssssss",$one,$two,$three,$four,$five,$six);
                    $q->execute();
                    foreach($q->get_result() as $row){echo json_encode($row,JSON_UNESCAPED_UNICODE|JSON_INVALID_UTF8_SUBSTITUTE)."\n";}
                  } catch(Throwable $e) {echo "DATABASE_READ_ERROR ".get_class($e)."\n";}
                  '
                  echo "===CAPTURE NEW PHP ERRORS FROM SINGLE REQUEST==="
                  PHPLOG=/home/web/log/php-errors.log
                  B=$(stat -c %s "$PHPLOG" 2>/dev/null || echo 0)
                  echo "php_log_start_bytes=$B"
                  curl -sS -k -L --max-time 12 -o /dev/null --resolve profikompany.ru:443:127.0.0.1 -w 'target_response=%{http_code}\n' 'https://profikompany.ru/stul-barnyy-750-venskiy-tverdyy-belenyy-dub/'
                  sleep 2
                  A=$(stat -c %s "$PHPLOG" 2>/dev/null || echo 0)
                  echo "php_log_new_bytes=$((A-B))"
                  if [ "$A" -gt "$B" ] && [ $((A-B)) -lt 300000 ]; then
                    dd if="$PHPLOG" iflag=skip_bytes,count_bytes skip="$B" count="$((A-B))" status=none 2>/dev/null | tail -n 220 | cut -c 1-330 | sed -E 's/([[:alnum:]_.+-]+)@([[:alnum:].-]+)/[EMAIL]/g;s/(token|password|key|secret|authorization)[[:space:]]*[:=][[:space:]]*[^ ,;]+/\1=[REDACTED]/Ig;s/([?&][[:alnum:]_-]+)=([^& ]+)/\1=[REDACTED]/g' | tail -110
                  else
                    echo "===PHP ERROR LOG TAIL: FILTERED==="
                    tail -n 200 "$PHPLOG" 2>/dev/null | grep -Ei -A 9 -B 1 'Fatal|Uncaught|Error|Warning|Parse|exception|Smarty' | tail -55 | cut -c 1-280
                  fi
                  echo "===PHP AS WEB EXTENSIONS==="
                  runuser -u web -- php -r 'echo "PHP_VERSION=",PHP_VERSION," mysqli=",extension_loaded("mysqli")?"yes":"no"," pdo_mysql=",extension_loaded("pdo_mysql")?"yes":"no","\n";' 2>&1
                  echo "===COMPILED PRODUCT TEMPLATE HEADER AND FAILING LINE==="
                  C="$ROOT/wa-cache/df119d/apps/shop/templates/compiled/shop_ru_RU/91/b9/94/91b9949015c58bfd7acb172d8abad1b94efda313.file.product.html.php"
                  if [ -f "$C" ]; then
                    head -n 32 "$C" | cut -c 1-320
                    echo "--EXACT 80..104--"
                    nl -ba "$C" | sed -n '80,104p' | cut -c 1-450
                  else echo "compiled template no longer present"; fi
                  echo "===ORIGINAL PRODUCT TEMPLATE CANDIDATES==="
                  find "$ROOT/wa-data/public/shop/themes" -name product.html -type f -printf '%TY-%Tm-%Td %s %p\n' 2>/dev/null | sort -r | head -12
                  echo "===EXTERNAL IMAGE SOURCE TEMPLATE CONTEXT==="
                  SRC="$ROOT/wa-data/public/shop/themes/pureMegapolis42/product.html"
                  grep -n -E -B 14 -A 21 'preg_match_all|__extimg_matches|__has_extimg' "$SRC" | head -110 | cut -c 1-250
                  echo "===COMPILED LINE 93: RELEVANT SEGMENTS==="
                  C="$ROOT/wa-cache/df119d/apps/shop/templates/compiled/shop_ru_RU/91/b9/94/91b9949015c58bfd7acb172d8abad1b94efda313.file.product.html.php"
                  python3 -c 'import sys; s=open(sys.argv[1]).read().splitlines()[92]; print("line93_length",len(s)); needles=["preg_match_all","__extimg_matches","__has_extimg"]; [(print("term",k,"at",i,"fragment:",s[max(0,i-145):i+330])) for k in needles for i in [s.find(k)] if i>=0]' "$C"
                  echo "===FINISH==="
                  '''
                  p=subprocess.run(["ssh","-i",key,"-o","BatchMode=yes","-o","StrictHostKeyChecking=no","-o","UserKnownHostsFile=/dev/null","-o","ConnectTimeout=12","root@45.86.180.49","bash","-s"],input=script,text=True,capture_output=True,timeout=125)
                  print(p.stdout[-24000:])
                  if p.returncode:
                      print("REMOTE_SSH_FAILURE",p.returncode,p.stderr[-500:])
              finally:
                  try: api("https://api-ms.netangels.ru/api/v1/cloud/vms/44780/ssh/"+str(key_id)+"/","DELETE",None,headers)
                  except Exception as e: print("WARNING: temporary SSH key cleanup:",type(e).__name__)
          PY
