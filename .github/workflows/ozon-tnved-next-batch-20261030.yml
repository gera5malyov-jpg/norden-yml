name: Ozon TNVED next verified batch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-tnved-next-batch-20261030.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ozon-tnved-next-batch
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      APPLY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Select furniture only when material and construction support exact ten-digit code
        run: |
          python - <<'PY'
          import sys,os,json,re,time,collections
          from pathlib import Path
          sys.path.insert(0,'ozon')
          import tnved_sync as api
          snapshot=json.loads(Path('ozon/tnved_evidence_extended_20261030.json').read_text())
          by_group=collections.defaultdict(lambda:collections.defaultdict(set))
          for x in snapshot['filled']:
              if x.get('dictionary_id') and re.fullmatch(r'\d{10}',str(x.get('code') or '')):
                  by_group[tuple(x['group'])][x['code']].add(int(x['dictionary_id']))
          def height(a,key):
              try:return float(str(a.get(key) or '0').replace(',','.'))
              except:return 0.
          def adjusted(a,t):
              if re.search(r'ГАЗЛИФТ|РЕГУЛИРУ|ВРАЩА|ПОДЪЕМ|ПОДЪЁМ|LIFT|SWIVEL|ГИДРАВЛИЧ',t):return True
              lo=height(a,'Мин. высота сиденья, см')
              hi=height(a,'Макс. высота сиденья, см') or height(a,'Высота сиденья, см')
              if lo and hi and abs(hi-lo)>1.1:return True
              swing=a.get('Тип механизма качания','')
              if swing and swing not in ['Без механизма качания','Нет']:return True
              return False
          candidates=[];counts=collections.Counter()
          for x in snapshot['missing']:
              group=tuple(x['group']);t=x['name'].upper();a=x['attrs']
              mat=a.get('Материал корпуса','')
              ob=a.get('Материал обивки','')
              base=a.get('Материал подстолья','')
              code=None;why=None
              if group in [(17027916,95048),(17027916,95023)] and re.search(r'\b(СТУЛ|ТАБУРЕТ)\b',t):
                  if not adjusted(a,t) and not re.search('КРЕСЛО|ТРАНСФОРМ|РАСКЛАД',t):
                      if mat=='Металл':
                          if ob and ob!='Без обивки':code='9401710009';why='fixed metal seat with upholstery'
                          elif ob=='Без обивки':code='9401790009';why='fixed non-upholstered metal seat'
                      elif mat in ['Массив дерева','Массив березы','Дерево']:
                          if ob and ob!='Без обивки':code='9401610000';why='fixed upholstered wood-framed seat'
                          elif ob=='Без обивки':code='9401690000';why='fixed non-upholstered wood seat'
              elif group==(79164512,95041) and 'ДЛЯ ПОСЕТИТЕЛЕЙ' in t and mat=='Металл' and ob and ob!='Без обивки' and a.get('Механизм качания')=='Нет' and not adjusted(a,t):
                  code='9401710009';why='fixed visitor seat, upholstered metal frame'
              elif group==(17027918,504866270) and re.search('СТОЛ ПИСЬМЕННЫЙ',t) and not re.search('ЛОФТ|МЕТАЛЛ|СТЕКЛО',t) and a.get('Материал столешницы')=='ЛДСП' and base=='ЛДСП' and 0<height(a,'Высота, см')<=80:
                  code='9403301100';why='office writing desk, LDSP frame, up to 80 cm'
              elif group==(80731485,95098) and x['offer'].startswith('SAMS-') and 'ШКАФ (СТЕЛЛАЖ)' in t and mat=='ЛДСП' and not re.search('ДВЕРЬ|ДВЕРИ|ЗАКРЫТ|СТЕКЛО',t):
                  h=height(a,'Высота, см')
                  if h>80:code='9403309900';why='wooden office open shelving, above 80 cm'
                  elif 0<h<=80:code='9403301900';why='wooden office open shelving, at most 80 cm'
              elif group==(80375615,95024) and t.startswith('ДИВАН ДВУХМЕСТНЫЙ РЕТРО') and mat=='Массив березы' and ob and ob!='Без обивки' and not re.search('КРОВАТЬ|РАСКЛАД|ТРАНСФОРМ',t):
                  code='9401610000';why='non-convertible upholstered solid birch sofa'
              if code:
                  values=by_group[group][code]
                  if len(values)==1:
                      dictionary_id=next(iter(values))
                      reference=next((z for z in snapshot['filled'] if tuple(z['group'])==group and z['code']==code and z['dictionary_id']==dictionary_id),None)
                      if reference:
                          candidates.append({'offer_id':x['offer'],'name':x['name'],'group':list(group),'code':code,'dictionary_value_id':dictionary_id,'value_source':reference['offer'],'method':why,'material':mat,'obivka':ob})
                          counts[why]+=1
          print('CANDIDATES_JSON',json.dumps({'total':len(candidates),'by_method':dict(counts)},ensure_ascii=False),flush=True)
          # Read live card IDs, names and existing code before any write
          catalog=api.list_products()
          pid_by_offer={str(x.get('offer_id') or ''):int(x['product_id']) for x in catalog if x.get('offer_id') and x.get('product_id')}
          chosen=[x for x in candidates if x['offer_id'] in pid_by_offer]
          ids=[pid_by_offer[x['offer_id']] for x in chosen]
          live=api.get_product_attributes(ids)
          byoffer={str(x.get('offer_id') or ''):x for x in live}
          verified=[];stale=[]
          for row in chosen:
              p=byoffer.get(row['offer_id'])
              if not p or str(p.get('name') or '')!=row['name'] or (int(p.get('description_category_id') or 0),int(p.get('type_id') or 0))!=tuple(row['group']):
                  stale.append(row['offer_id']);continue
              prev=api.attr_value_tuple(api.find_product_attr(p,22232) or {})
              if prev:
                  stale.append(row['offer_id']);continue
              verified.append(row)
          remaining,lim,used,reset=api.get_daily_update_remaining()
          cap=min(len(verified),250,remaining if remaining is not None else 250)
          selected=verified[:max(0,cap)]
          report={'apply':os.environ['APPLY']=='true','catalog_total':len(catalog),'snapshot_missing':len(snapshot['missing']),'candidate_total':len(candidates),'by_method':dict(counts),'live_verified':len(verified),'stale':stale,'selected':len(selected),'quota':lim,'quota_used':used,'proposals':verified,'tasks':[],'write_errors':[],'confirmed':0}
          dictionary_cache={}
          if report['apply']:
              for batch in api.chunks(selected,35):
                  # The complete dictionary display value is required, not just the numeric code.
                  items=[]
                  for x in batch:
                      source=next(z for z in snapshot['filled'] if z['offer']==x['value_source'])
                      # Historical attribute text is not available in the snapshot; fetch the live dictionary.
                      key=(x['group'][0],x['group'][1],22232)
                      if key not in dictionary_cache:
                          dictionary_cache[key]=api.get_dictionary_values(*key)
                      val=next((v for v in dictionary_cache[key] if int(v.get('id') or 0)==x['dictionary_value_id']),None)
                      if not val:raise RuntimeError('Dictionary value missing for '+x['offer_id'])
                      items.append({'offer_id':x['offer_id'],'attributes':[{'complex_id':0,'id':22232,'values':[{'dictionary_value_id':x['dictionary_value_id'],'value':val['value']}]}]})
                  try:
                      reply=api.post('/v1/product/attributes/update',{'items':items})
                      report['tasks'].append(reply.get('task_id'))
                  except Exception as exc:report['write_errors'].append({'offers':[x['offer_id'] for x in batch],'error':str(exc)[:300]})
                  time.sleep(.4)
              time.sleep(12)
              fresh=api.get_product_attributes([pid_by_offer[x['offer_id']] for x in selected])
              check={str(x.get('offer_id')):x for x in fresh}
              report['confirmed']=sum(1 for x in selected if (lambda p: p and (lambda v: v and int(v[0])==x['dictionary_value_id'])(api.attr_value_tuple(api.find_product_attr(p,22232) or {})))(check.get(x['offer_id'])))
          Path('ozon/tnved_next_batch_20261030.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('RESULT_JSON',json.dumps({k:v for k,v in report.items() if k!='proposals'},ensure_ascii=False)[:5500],flush=True)
          PY
      - name: Save audit
        if: always()
        run: |
          if [ ! -f ozon/tnved_next_batch_20261030.json ]; then echo '{"error":"audit failed"}' > ozon/tnved_next_batch_20261030.json; fi
          cp ozon/tnved_next_batch_20261030.json /tmp/tnved_next.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/tnved_next.json ozon/tnved_next_batch_20261030.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ozon/tnved_next_batch_20261030.json
          if ! git diff --cached --quiet; then git commit -m 'Record guarded TNVED next batch audit'; git push; fi
