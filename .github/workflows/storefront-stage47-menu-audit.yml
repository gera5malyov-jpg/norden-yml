name: Storefront Stage 47 - Mobile navigation controls inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage47-menu-audit.yml'
      - 'storefront/stage47_mobile_menu_audit.py'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - name: Check what hamburger and brown catalogue buttons actually do
        run: python storefront/stage47_mobile_menu_audit.py
