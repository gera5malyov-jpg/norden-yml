name: Deploy Riva multi-image gallery once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-riva-multi-gallery-once-20261014.yml']
permissions:
  contents: read
jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy Riva multi-image gallery fix once'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Check renderer syntax
        run: python -m py_compile storefront/fix_extimg_multi_image_gallery.py
      - name: Deploy only verified Smarty template with rollback on failure
        run: python storefront/fix_extimg_multi_image_gallery.py apply
