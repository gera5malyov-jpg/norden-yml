name: ТД Андрей — аудит логики существующих карточек

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tdandrey-source-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить операции над существующими карточками
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          root=Path('tdandrey-kit')
          data=''.join((root/f'payload.{i:02d}').read_text().strip() for i in range(1,5))
          src=gzip.decompress(base64.b64decode(data)).decode()
          lines=src.splitlines()
          print('=== WEBASYST BLOCK 400-480 ===')
          for j in range(399, min(len(lines),480)):
              print(f'{j+1:04d}: {lines[j]}')
          keys=('patch_variant(', 'bulk_prices(', 'bulk_stocks(', 'update_prices(', 'update_stocks(', 'shop.product.update', 'shop.product.skus.update', 'create_variant(', 'create_product(')
          for i,line in enumerate(lines):
              if any(k in line for k in keys):
                  print('\n--- lines', max(1,i-8), 'to', min(len(lines),i+12), '---')
                  for j in range(max(0,i-8), min(len(lines),i+12)):
                      print(f'{j+1:04d}: {lines[j]}')
          PY
