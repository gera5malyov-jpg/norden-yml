name: Remove B2B purchase characteristic from Webasyst once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-b2b-purchase-webasyst-once.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Remove purchase characteristic from B2B Webasyst products
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: python maintenance/remove_b2b_purchase_webasyst_only.py
