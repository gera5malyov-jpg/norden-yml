name: Alavann YML Pro - every 14 days
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'alavann/parser.py'
      - 'alavann/requirements.txt'
      - 'alavann/tests/**'
      - '.github/workflows/alavann-yml.yml'
  schedule:
    - cron: '17 3 * * 5'

permissions:
  contents: write

concurrency:
  group: alavann-yml-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Biweekly schedule gate
        id: cadence
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' != 'schedule' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          anchor=$(date -u -d '2026-10-30 03:17:00' +%s)
          weeks=$(( (now - anchor) / 604800 ))
          if (( weeks >= 0 && weeks % 2 == 0 )); then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping off-week schedule'
          fi
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: alavann/requirements.txt
      - name: Install dependencies
        if: steps.cadence.outputs.run == 'true'
        run: pip install -r alavann/requirements.txt
      - name: Test parser
        if: steps.cadence.outputs.run == 'true'
        run: python -m unittest discover -s alavann/tests -v
      - name: Scrape public catalog
        if: steps.cadence.outputs.run == 'true'
        env:
          ALAVANN_MIN_OFFERS: '200'
          ALAVANN_WORKERS: '6'
        run: python alavann/parser.py
      - name: Validate and commit persistent YML
        if: steps.cadence.outputs.run == 'true'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('alavann/alavann.yml').getroot()
          offers=root.findall('./shop/offers/offer')
          assert len(offers)>=200, f'Too few offers: {len(offers)}'
          assert len({o.get('id') for o in offers})==len(offers)
          assert all(o.findtext('price') and o.findtext('vendorCode') for o in offers)
          print(f'Validated {len(offers)} offers')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alavann/alavann.yml
          if git diff --cached --quiet; then
            echo 'No feed changes'
            exit 0
          fi
          git commit -m 'Refresh Alavann YML feed'
          git pull --rebase origin main
          git push origin HEAD:main
