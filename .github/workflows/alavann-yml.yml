name: Alavann YML Pro - every 14 days
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'alavann/parser.py'
      - 'alavann/requirements.txt'
      - 'alavann/tests/**'
      - '.github/workflows/alavann-yml.yml'
  schedule:
    - cron: '17 3 * * 5'

permissions:
  contents: write

concurrency:
  group: alavann-yml-generator
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Biweekly schedule gate
        id: cadence
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' != 'schedule' ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          anchor=$(date -u -d '2026-10-30 03:17:00' +%s)
          weeks=$(( (now - anchor) / 604800 ))
          if (( weeks >= 0 && weeks % 2 == 0 )); then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping off-week schedule'
          fi
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: alavann/requirements.txt
      - name: Install dependencies
        if: steps.cadence.outputs.run == 'true'
        run: pip install -r alavann/requirements.txt
      - name: Test parser
        if: steps.cadence.outputs.run == 'true'
        run: python -m unittest discover -s alavann/tests -v
      - name: Scrape public catalog
        if: steps.cadence.outputs.run == 'true'
        env:
          ALAVANN_MIN_OFFERS: '140'
          ALAVANN_WORKERS: '6'
        run: python alavann/parser.py
      - name: Validate and commit persistent YML
        if: steps.cadence.outputs.run == 'true'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('alavann/alavann.yml').getroot()
          offers=root.findall('./shop/offers/offer')
          assert len(offers)>=140, f'Too few scoped offers: {len(offers)}'
          assert len({o.get('id') for o in offers})==len(offers)
          assert all(o.findtext('price') and o.findtext('vendorCode') for o in offers)
          allowed={
              '/mebel/cupboards/', '/mebel/komody/', '/mebel/zerkala-v-vannuyu/',
              '/mebel/stand/', '/mebel/set/', '/mebel/mirror-cupboard/'}
          from urllib.parse import urlparse
          actual=set()
          for o in offers:
              path=urlparse(o.findtext('url') or '').path
              category=next((c for c in allowed if path.startswith(c) and path!=c),None)
              if not category:
                  raise SystemExit(f'Unexpected category for {o.get("id")}: {path}')
              actual.add(category)
          assert actual == allowed, f'Missing expected categories: {allowed - actual}'
          print(f'Validated {len(offers)} offers from exactly {len(actual)} approved categories')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve the validated result while moving to the freshest main.
          # Concurrent runs may update the feed, so do not rebase an XML commit.
          cp alavann/alavann.yml /tmp/alavann-generated.yml
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/alavann-generated.yml alavann/alavann.yml
            git add alavann/alavann.yml
            if git diff --cached --quiet; then
              echo 'No feed changes'
              exit 0
            fi
            git commit -m 'Refresh Alavann YML feed'
            if git push origin HEAD:main; then
              echo 'Feed successfully published'
              exit 0
            fi
            echo "Push conflict, retry $attempt/3"
          done
          echo 'Could not push feed after 3 attempts'
          exit 1
