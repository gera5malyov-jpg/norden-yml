name: Probe direct Ozon promo deactivation without price changes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-promo-direct-deactivate-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ozon/promo_direct_deactivate_probe_20261109.py
