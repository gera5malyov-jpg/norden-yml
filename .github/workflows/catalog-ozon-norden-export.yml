name: Каталог — Ozon Norden → Google Sheets

on:
  push:
    paths:
      - '.github/workflows/catalog-ozon-norden-export.yml'
  workflow_dispatch:
  push:
    paths:
      - 'catalog/sheet_run_trigger.txt'
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: catalog-ozon-norden-export
  cancel-in-progress: true

jobs:
  export:
    if: github.event_name != 'issues' || github.event.issue.title == '[CATALOG-EXPORT] Ozon Norden'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install --disable-pip-version-check "gspread>=6.1,<7" "google-auth>=2.35,<3"

      - name: Выгрузить Norden из Ozon в Каталог
        id: export
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CATALOG_OWNER_EMAIL: 'gera5malyov@gmail.com'
          CATALOG_TITLE: 'Каталог'
          CATALOG_SHEET: 'Норден'
          CATALOG_SPREADSHEET_ID: '1DvMYvKRr8fX8mfLFaeJCXCccQofPViPcIP2CgIctc8w'
        shell: bash
        run: |
          set +e
          mkdir -p catalog
          python catalog/export_ozon_norden_to_sheets.py 2>&1 | tee catalog/run.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Сохранить журнал и отчёт
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/run.log catalog/last_run.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Обновить журнал выгрузки каталога Norden"
            git push
          fi

      - name: Проверить результат
        if: always()
        shell: bash
        run: |
          test "${{ steps.export.outputs.exit_code }}" = "0"
