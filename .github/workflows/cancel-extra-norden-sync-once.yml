name: Cancel obsolete Norden sync once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-extra-norden-sync-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel competing read-only branch CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/actions/runs/37333779717/cancel" || true
