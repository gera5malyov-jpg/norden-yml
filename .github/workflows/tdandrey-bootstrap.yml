name: ТД Андрей — пакетная загрузка всего каталога в KIT

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Сколько новых карточек создать за запуск'
        required: true
        default: '250'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: tdandrey-kit-write
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить payload
        run: python tdandrey-kit/loader.py --help >/dev/null
      - name: Создать следующий пакет карточек KIT
        env:
          TDANDREY_EXPORT_URL: ${{ secrets.TDANDREY_EXPORT_URL }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: python tdandrey-kit/loader.py --mode bootstrap --max-new '${{ inputs.batch_size }}' --images
      - name: Сохранить mapping и отчёт
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email actions@github.com
          mkdir -p /tmp/tdandrey-state
          cp tdandrey-kit/kit_mapping.json /tmp/tdandrey-state/kit_mapping.json 2>/dev/null || true
          cp tdandrey-kit/last_sync_report.json /tmp/tdandrey-state/last_sync_report.json 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/tdandrey-state/kit_mapping.json tdandrey-kit/kit_mapping.json 2>/dev/null || true
          cp /tmp/tdandrey-state/last_sync_report.json tdandrey-kit/last_sync_report.json 2>/dev/null || true
          git add tdandrey-kit/kit_mapping.json tdandrey-kit/last_sync_report.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Обновить состояние загрузки ТД Андрей'
          git push origin HEAD:main
      - name: Определить, нужна ли следующая пачка
        id: next
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p='tdandrey-kit/last_sync_report.json'
          if not os.path.exists(p):
              print('continue=false')
              raise SystemExit
          r=json.load(open(p,encoding='utf-8'))
          b=r.get('bootstrap') or {}
          remaining=int(b.get('remaining_total') or 0)
          created=int(b.get('created') or 0)
          print('continue=' + ('true' if remaining > 0 and created > 0 else 'false'))
          print('remaining=' + str(remaining))
          print('created=' + str(created))
          PY
      - name: Поставить следующую пачку в очередь
        if: steps.next.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/tdandrey-bootstrap.yml/dispatches'
          body=json.dumps({'ref':'main','inputs':{'batch_size':os.environ['BATCH_SIZE']}}).encode()
          req=urllib.request.Request(url,data=body,method='POST',headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json',
          })
          with urllib.request.urlopen(req,timeout=30) as resp:
              if resp.status != 204:
                  raise RuntimeError(resp.status)
          PY
