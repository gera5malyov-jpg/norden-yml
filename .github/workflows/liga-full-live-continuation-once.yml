name: Liga full live continuation once

on:
  push:
    branches:
      - feat/liga-kit-sync
    paths:
      - '.github/workflows/liga-full-live-continuation-once.yml'

permissions:
  contents: read

concurrency:
  group: liga-full-live-import
  cancel-in-progress: false

jobs:
  pass1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Continuation pass 1
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python -m liga_kit.cli --report /tmp/liga-pass1.json
          echo 'LIGA_PASS1_REPORT_BEGIN'
          cat /tmp/liga-pass1.json
          echo 'LIGA_PASS1_REPORT_END'

  pass2:
    needs: pass1
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Continuation pass 2
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python -m liga_kit.cli --report /tmp/liga-pass2.json
          echo 'LIGA_PASS2_REPORT_BEGIN'
          cat /tmp/liga-pass2.json
          echo 'LIGA_PASS2_REPORT_END'
