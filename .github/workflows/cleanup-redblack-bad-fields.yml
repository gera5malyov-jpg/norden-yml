name: Cleanup bad Red-Black Baserow fields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-redblack-bad-fields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASEROW_URL: http://147.78.67.6
      BASEROW_CATALOG_TABLE_ID: '156'
      BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
      BASEROW_EMAIL: ${{ secrets.BASEROW_EMAIL }}
      BASEROW_PASSWORD: ${{ secrets.BASEROW_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - run: python -m py_compile baserow/cleanup_redblack_bad_fields.py
      - name: Delete incorrect columns and verify
        id: cleanup
        continue-on-error: true
        run: python baserow/cleanup_redblack_bad_fields.py
      - name: Save cleanup report
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add baserow/cleanup_redblack_bad_fields_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Red-Black Baserow cleanup report"
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i*3))
            done
          fi
      - name: Fail if cleanup failed
        if: always()
        run: test "${{ steps.cleanup.outcome }}" = "success"
