name: Probe profikompany DNS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-profiko-dns.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Resolve domain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          python3 - <<'PY' > .deploy-probe/profikompany-dns.txt
          import socket
          for host in ("profikompany.ru","www.profikompany.ru"):
              try:
                  print(host+"="+",".join(sorted(set(socket.gethostbyname_ex(host)[2]))))
              except Exception as e:
                  print(host+"=ERROR:"+str(e))
          PY
          cat .deploy-probe/profikompany-dns.txt
      - name: Save report
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/profikompany-dns.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save profikompany DNS probe [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
