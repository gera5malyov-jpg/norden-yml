name: Install Universal Import on Webasyst

on:
  push:
    branches:
      - feature/universal-yml-import-20261015
    paths:
      - '.github/workflows/install-univimport.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webasyst-univimport-install
  cancel-in-progress: false

jobs:
  install-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate isolated installer and plugin metadata
        run: |
          python -m py_compile scripts/install_univimport.py
          test -f webasyst/univimport/lib/config/plugin.php
      - name: Install plugin only, without importing products
        run: python -u scripts/install_univimport.py
