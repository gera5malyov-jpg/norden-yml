name: Storefront Stage 42 - Callback actual UI behavior
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage42-callback-ui.yml'
      - 'storefront/stage42_callback_behavior_audit.py'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/stage42_callback_behavior_audit.py
      - run: python -m pip install playwright==1.55.0
      - name: Compare callback modal launch by header and product links
        run: python storefront/stage42_callback_behavior_audit.py
