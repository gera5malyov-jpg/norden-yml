name: Update Artikul-Mebel YML

on:
  push:
    branches:
      - main
    paths:
      - 'artikul-mebel/parser.py'
      - 'artikul-mebel/requirements.txt'
      - 'artikul-mebel/tests/**'
      - 'artikul-mebel/README.md'
      - '.github/workflows/artikul-mebel.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artikul-mebel-yml-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: artikul-mebel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: artikul-mebel/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect variant markup
        run: |
          python - <<'PY'
          import re
          import requests

          base = 'https://artikul-mebel.ru/catalog/detail/veshalka-garderobnaya-razbornaya-30-kryuchkov/'
          for suffix in ('', '?oID=2640', '?oID=2641'):
              url = base + suffix
              r = requests.get(url, timeout=45, headers={'User-Agent': 'Mozilla/5.0'})
              print('\n===', url, r.status_code, len(r.text), '===')
              html = r.text
              for pattern in (r'oID', r'2640', r'2641', r'БП-00006350', r'БП-00006347', r'Высота 1490', r'Высота 1760', r'OFFERS', r'JS_OFFERS', r'PRODUCT_ID'):
                  positions = [m.start() for m in re.finditer(pattern, html, flags=re.I)][:8]
                  print('PATTERN', pattern, 'COUNT', len(re.findall(pattern, html, flags=re.I)), 'POSITIONS', positions)
                  for pos in positions[:3]:
                      snippet = html[max(0, pos-350):pos+700].replace('\n', ' ').replace('\r', ' ')
                      print(snippet)
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Generate catalog
        env:
          MIN_PRODUCTS: '100'
          WORKERS: '4'
          OUTPUT: 'catalog.yml'
        run: python parser.py

      - name: Validate generated YML
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = 'catalog.yml'
          root = ET.parse(path).getroot()
          offers = root.findall('./shop/offers/offer')
          if len(offers) < 100:
              raise SystemExit(f'Unsafe feed: only {len(offers)} offers')
          if os.path.getsize(path) < 10000:
              raise SystemExit('Unsafe feed: file too small')
          print(f'Validated offers: {len(offers)}')
          PY

      - name: Commit updated catalog
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add catalog.yml
          if git diff --cached --quiet; then
            echo "Catalog has not changed"
            exit 0
          fi
          git commit -m "Update Artikul-Mebel catalog"
          git pull --rebase origin main
          git push origin HEAD:main
