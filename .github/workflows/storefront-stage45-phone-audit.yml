name: Storefront Stage 45 - Phone placement audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage45-phone-audit.yml'
      - 'storefront/stage45_phone_placement_audit.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/stage45_phone_placement_audit.py
      - run: python storefront/stage45_phone_placement_audit.py
