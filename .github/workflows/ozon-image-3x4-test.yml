name: Ozon image 3x4 test SAMS-532541

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-image-3x4-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      OFFER_ID: SAMS-532541
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Fetch Ozon images and convert only non-3x4
        shell: bash
        run: |
          python - <<'PY'
          import io
          import json
          import math
          import os
          from pathlib import Path

          import requests
          from PIL import Image, ImageOps

          offer_id = os.environ["OFFER_ID"]
          client_id = os.environ["OZON_CLIENT_ID"].strip()
          api_key = os.environ["OZON_API_KEY"].strip()
          if not client_id or not api_key:
              raise SystemExit("Missing OZON_CLIENT_ID/OZON_API_KEY")

          session = requests.Session()
          session.headers.update({
              "Client-Id": client_id,
              "Api-Key": api_key,
              "Content-Type": "application/json",
              "User-Agent": "Megapolis-Ozon-Image-3x4-Test/1.0",
          })

          def ozon_post(path, body):
              r = session.post("https://api-seller.ozon.ru" + path, json=body, timeout=60)
              if r.status_code >= 400:
                  raise RuntimeError(f"Ozon HTTP {r.status_code}: {r.text[:2000]}")
              return r.json()

          def urls(value):
              if not value:
                  return []
              if isinstance(value, str):
                  value = [value]
              out = []
              for x in value if isinstance(value, list) else []:
                  if isinstance(x, dict):
                      x = x.get("url") or x.get("file_name") or x.get("src")
                  if isinstance(x, str) and x.startswith(("https://", "http://")):
                      out.append(x)
              return out

          data = ozon_post("/v3/product/info/list", {"offer_id": [offer_id]})
          items = data.get("items") or []
          if not items:
              raise SystemExit(f"Ozon did not return offer {offer_id}")

          item = items[0]
          image_urls = []
          seen = set()
          for src in (item.get("primary_image"), item.get("images")):
              for u in urls(src):
                  if u not in seen:
                      seen.add(u)
                      image_urls.append(u)

          if not image_urls:
              raise SystemExit(f"No images found for {offer_id}")

          out_dir = Path("ozon/image_3x4_test") / offer_id
          out_dir.mkdir(parents=True, exist_ok=True)

          report = {
              "offer_id": offer_id,
              "product_id": item.get("id") or item.get("product_id"),
              "source_image_count": len(image_urls),
              "ozon_modified": False,
              "method": "pad_to_3x4_no_crop_white_background",
              "images": [],
          }

          for idx, url in enumerate(image_urls, 1):
              r = requests.get(url, timeout=90, headers={"User-Agent": "Mozilla/5.0"})
              r.raise_for_status()
              raw = r.content
              with Image.open(io.BytesIO(raw)) as im:
                  im = ImageOps.exif_transpose(im)
                  w, h = im.size
                  exact_3x4 = (w * 4 == h * 3)

                  entry = {
                      "index": idx,
                      "source_url": url,
                      "source_width": w,
                      "source_height": h,
                      "source_ratio": round(w / h, 6) if h else None,
                      "already_3x4": exact_3x4,
                  }

                  if exact_3x4:
                      entry["action"] = "skipped_already_3x4"
                      report["images"].append(entry)
                      continue

                  # Extend canvas only; never crop or stretch the product.
                  if w / h > 3 / 4:
                      new_w = w
                      new_h = math.ceil(w * 4 / 3)
                  else:
                      new_h = h
                      new_w = math.ceil(h * 3 / 4)

                  # Make dimensions mathematically exact 3:4.
                  if new_w * 4 != new_h * 3:
                      scale = max(math.ceil(new_w / 3), math.ceil(new_h / 4))
                      new_w, new_h = 3 * scale, 4 * scale

                  src = im.convert("RGB")
                  canvas = Image.new("RGB", (new_w, new_h), "white")
                  x = (new_w - w) // 2
                  y = (new_h - h) // 2
                  canvas.paste(src, (x, y))

                  filename = f"image_{idx:02d}_3x4.jpg"
                  path = out_dir / filename
                  canvas.save(path, "JPEG", quality=95, optimize=True)

                  entry.update({
                      "action": "converted",
                      "output_file": str(path),
                      "output_width": new_w,
                      "output_height": new_h,
                      "output_ratio": new_w / new_h,
                  })
                  report["images"].append(entry)

          report["converted_count"] = sum(1 for x in report["images"] if x["action"] == "converted")
          report["skipped_count"] = sum(1 for x in report["images"] if x["action"].startswith("skipped"))

          with (out_dir / "report.json").open("w", encoding="utf-8") as f:
              json.dump(report, f, ensure_ascii=False, indent=2)

          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Upload test result
        uses: actions/upload-artifact@v4
        with:
          name: SAMS-532541-3x4-test
          path: ozon/image_3x4_test/SAMS-532541/
          if-no-files-found: error
          retention-days: 30

      - name: Save test result in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ozon/image_3x4_test/SAMS-532541/
          if git diff --cached --quiet; then
            echo "No output changes to commit"
          else
            git commit -m "test: convert SAMS-532541 Ozon images to 3x4"
            git push
          fi
