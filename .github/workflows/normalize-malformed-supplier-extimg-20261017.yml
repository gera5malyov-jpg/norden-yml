name: Repair malformed Deephouse Bradex Champion external photo links
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_malformed_supplier_extimg_20261017.py'
      - '.github/workflows/normalize-malformed-supplier-extimg-20261017.yml'
permissions:
  contents: read
concurrency:
  group: bulk-screenshot-type-extimg-20261017
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Prepare exact URL-only summary normalization plan
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python -u scripts/normalize_malformed_supplier_extimg_20261017.py
      - uses: actions/upload-artifact@v4
        with:
          name: malformed-photo-backup-${{ github.run_id }}
          path: |
            reports/malformed_external_photo_links_20261017_backup.json.gz
            reports/malformed_external_photo_links_20261017_plan.json.gz
            reports/malformed_external_photo_links_20261017.json
          if-no-files-found: error
          retention-days: 60
  apply:
    runs-on: ubuntu-latest
    needs: plan
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - uses: actions/download-artifact@v4
        with:
          name: malformed-photo-backup-${{ github.run_id }}
          path: reports/
      - name: Apply verified short-description-only updates
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python -u scripts/normalize_malformed_supplier_extimg_20261017.py --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: malformed-photo-result-${{ github.run_id }}
          path: reports/malformed_external_photo_links_20261017.json
          if-no-files-found: warn
          retention-days: 60
