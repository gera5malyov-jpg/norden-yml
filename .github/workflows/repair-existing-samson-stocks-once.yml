name: Repair existing Samson stocks once
# retry after empty-response handling fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-existing-samson-stocks-once.yml'

permissions:
  contents: read

concurrency:
  group: repair-existing-samson-stocks-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
      - name: Repair current Samson stock on existing SAMS variants
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import os, json
          from samson_kit.http import SafeSession
          from samson_kit.samson_client import SamsonClient
          from samson_kit.kit_client import KitClient
          from samson_kit.mapper import normalize_sku
          from samson_kit.rules import calculate_stock
          from samson_kit.sync import build_stock_update, absent_zero_updates

          http=SafeSession()
          samson=SamsonClient(os.environ['SAMSON_API_KEY'],http)
          kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],http)
          warehouse_id=kit.resolve_warehouse_exact('СПБ')
          index,duplicates=kit.index_samson_variants()
          print('EXISTING_SAMS='+str(len(index)))
          print('DUPLICATE_SAMS='+str(len(duplicates)))

          seen=set()
          desired_by_sku={}
          batch=[]
          changed=0
          positive=0
          zero_to_100=0
          source_seen=0
          missing_stock=0

          for raw in samson.iter_skus():
              item=normalize_sku(raw)
              source_seen += 1
              seen.add(item.kit_sku)
              desired=calculate_stock(item.stock_parts,active=item.active,withdrawn=item.withdrawn)
              if desired is None:
                  missing_stock += 1
              else:
                  desired_by_sku[item.kit_sku]=desired
                  if desired > 100 or (desired > 0 and desired != 100):
                      positive += 1
                  if desired == 100 and item.stock_parts is not None and sum(item.stock_parts)==0:
                      zero_to_100 += 1

              variant=index.get(item.kit_sku)
              if not variant or item.kit_sku in duplicates:
                  continue
              update=build_stock_update(item,variant,warehouse_id)
              if update:
                  batch.append(update)
                  changed += 1
                  if len(batch)>=1000:
                      kit.bulk_update_stocks(batch)
                      print('UPDATED_PROGRESS='+str(changed),flush=True)
                      batch=[]

          if batch:
              kit.bulk_update_stocks(batch)

          absent=absent_zero_updates(index,seen,warehouse_id,complete=True)
          if absent:
              kit.bulk_update_stocks(absent)

          verify={}
          for sku in ('SAMS-106225','SAMS-106203'):
              variant=index.get(sku)
              if not variant:
                  verify[sku]={'error':'variant missing'}
                  continue
              detail=kit.get_variant(variant['id'])
              qty=None
              for st in detail.get('stocks') or []:
                  if str(st.get('warehouse_id',''))==warehouse_id:
                      qty=int(st.get('quantity',0)); break
              verify[sku]={'expected':desired_by_sku.get(sku),'actual':qty}
              if desired_by_sku.get(sku) is None or qty!=desired_by_sku.get(sku):
                  raise RuntimeError(f'{sku} stock verification failed: expected={desired_by_sku.get(sku)} actual={qty}')

          summary={
              'source_seen':source_seen,
              'existing_sams':len(index),
              'duplicates':len(duplicates),
              'stock_updates':changed,
              'absent_to_zero':len(absent),
              'missing_source_stock':missing_stock,
              'zero_source_to_100':zero_to_100,
              'verify':verify,
          }
          print('STOCK_REPAIR_SUMMARY='+json.dumps(summary,ensure_ascii=False))
          print('STOCK_REPAIR_OK=1')
          PY
