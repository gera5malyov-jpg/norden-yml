name: Force cancel obsolete Norden reconcile once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-obsolete-norden-reconcile-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel old Norden run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/actions/runs/37342742842/force-cancel" || true
