name: Database credential name check
# rerun 2026-09-30

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/database-credential-name-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASEROW_EMAIL: ${{ secrets.BASEROW_EMAIL }}
      BASEROW_PASSWORD: ${{ secrets.BASEROW_PASSWORD }}
      BASEROW_LOGIN: ${{ secrets.BASEROW_LOGIN }}
      BASEROW_PASS: ${{ secrets.BASEROW_PASS }}
      BASEROW_USERNAME: ${{ secrets.BASEROW_USERNAME }}
      BASEROW_USER: ${{ secrets.BASEROW_USER }}
      BASEROW_ADMIN_EMAIL: ${{ secrets.BASEROW_ADMIN_EMAIL }}
      BASEROW_ADMIN_PASSWORD: ${{ secrets.BASEROW_ADMIN_PASSWORD }}
      BASEROW_DB_EMAIL: ${{ secrets.BASEROW_DB_EMAIL }}
      BASEROW_DB_PASSWORD: ${{ secrets.BASEROW_DB_PASSWORD }}
      DATABASE_EMAIL: ${{ secrets.DATABASE_EMAIL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_LOGIN: ${{ secrets.DATABASE_LOGIN }}
      DATABASE_PASS: ${{ secrets.DATABASE_PASS }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_ADMIN_EMAIL: ${{ secrets.DATABASE_ADMIN_EMAIL }}
      DATABASE_ADMIN_PASSWORD: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
      DATABASE_USER_EMAIL: ${{ secrets.DATABASE_USER_EMAIL }}
      DATABASE_USER_PASSWORD: ${{ secrets.DATABASE_USER_PASSWORD }}
      DB_EMAIL: ${{ secrets.DB_EMAIL }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_LOGIN: ${{ secrets.DB_LOGIN }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_USER: ${{ secrets.DB_USER }}
    steps:
      - name: Check names without printing values
        shell: bash
        run: |
          for v in BASEROW_EMAIL BASEROW_PASSWORD BASEROW_LOGIN BASEROW_PASS BASEROW_USERNAME BASEROW_USER BASEROW_ADMIN_EMAIL BASEROW_ADMIN_PASSWORD BASEROW_DB_EMAIL BASEROW_DB_PASSWORD DATABASE_EMAIL DATABASE_PASSWORD DATABASE_LOGIN DATABASE_PASS DATABASE_USERNAME DATABASE_USER DATABASE_ADMIN_EMAIL DATABASE_ADMIN_PASSWORD DATABASE_USER_EMAIL DATABASE_USER_PASSWORD DB_EMAIL DB_PASSWORD DB_LOGIN DB_PASS DB_USERNAME DB_USER; do
            if [ -n "${!v:-}" ]; then echo "$v=PRESENT"; else echo "$v=MISSING"; fi
          done
