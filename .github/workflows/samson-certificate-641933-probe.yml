name: Probe Samson certificate 641933

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-certificate-641933-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe Samson API for SKU 641933
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          key=os.environ.get("SAMSON_API_KEY","").strip()
          if not key:
              raise SystemExit("SAMSON_API_KEY missing")
          base="https://api.samsonopt.ru/v1"
          headers={"Accept":"application/json","User-Agent":"Megapolis-Samson-Cert-Probe/1.0"}

          def get(path, params):
              q=dict(params)
              q["api_key"]=key
              q["response_format"]="json"
              url=base+path+"?"+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:
                  return r.status, json.loads(r.read().decode("utf-8"))

          def unwrap(payload):
              if isinstance(payload,list) and len(payload)==1 and isinstance(payload[0],dict):
                  payload=payload[0]
              if isinstance(payload,dict) and isinstance(payload.get("data"),list):
                  return payload["data"], ((payload.get("meta") or {}).get("pagination") or {}).get("next")
              if isinstance(payload,dict) and isinstance(payload.get("data"),dict):
                  return [payload["data"]], None
              if isinstance(payload,list):
                  return payload, None
              if isinstance(payload,dict):
                  return [payload], None
              return [], None

          found=None
          probes=[
              ("/sku/641933/",{}),
              ("/sku/",{"sku":"641933"}),
              ("/sku/",{"id":"641933"}),
              ("/sku/",{"code":"641933"}),
          ]
          for path,params in probes:
              try:
                  status,payload=get(path,params)
                  rows,_=unwrap(payload)
                  print("probe",path,params,"status",status,"rows",len(rows))
                  for row in rows:
                      if not isinstance(row,dict):
                          continue
                      vals=[row.get(k) for k in ("sku","code","id","vendor_code","article")]
                      if any(str(v).strip()=="641933" for v in vals if v is not None):
                          found=row
                          break
                  if found:
                      break
              except Exception as e:
                  print("probe_failed",path,params,type(e).__name__,str(e)[:300])

          if found is None:
              page=1
              seen=set()
              while page and page<=500:
                  status,payload=get("/sku/",{"pagination_page":page})
                  rows,next_url=unwrap(payload)
                  print("page",page,"rows",len(rows))
                  for row in rows:
                      if not isinstance(row,dict):
                          continue
                      vals=[row.get(k) for k in ("sku","code","id","vendor_code","article")]
                      if any(str(v).strip()=="641933" for v in vals if v is not None):
                          found=row
                          break
                  if found:
                      break
                  if not next_url:
                      break
                  query=urllib.parse.parse_qs(urllib.parse.urlparse(next_url).query)
                  nxt=(query.get("pagination_page") or [None])[0]
                  if nxt is None or str(nxt) in seen:
                      break
                  seen.add(str(nxt))
                  page=int(nxt)

          if found is None:
              raise SystemExit("SKU 641933 not found in Samson API")

          keep={}
          for k,v in found.items():
              kl=str(k).lower()
              if k in ("sku","code","id","name","title","brand","brand_name","vendor_code","manufacturer_code","barcode","barcodes","certificate_list","certificate_extended_list","file_list","category_list","manufacturer","description","description_ext") or "cert" in kl or "document" in kl:
                  keep[k]=v
          print("RESULT_JSON_BEGIN")
          print(json.dumps(keep,ensure_ascii=False,indent=2))
          print("RESULT_JSON_END")
          outdir="tmp/samson-cert-641933"
          os.makedirs(outdir,exist_ok=True)
          certs=found.get("certificate_extended_list") or []
          n=0
          for cert in certs:
              if not isinstance(cert,dict):
                  continue
              if "сертификат соответствия" not in str(cert.get("name","")).casefold():
                  continue
              for url in cert.get("url_list") or []:
                  if not isinstance(url,str) or not url.startswith(("http://","https://")):
                      continue
                  n+=1
                  ext=os.path.splitext(urllib.parse.urlparse(url).path)[1] or ".jpg"
                  dest=os.path.join(outdir,f"page-{n}{ext.lower()}")
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=45) as src, open(dest,"wb") as dst:
                      dst.write(src.read())
                  print("saved",dest,os.path.getsize(dest))
          if not n:
              raise SystemExit("No conformity certificate images found")
          PY
      - name: Extract certificate text for verification
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
          for f in tmp/samson-cert-641933/*; do
            echo "===== OCR $f ====="
            tesseract "$f" stdout -l eng --psm 6 2>/dev/null || true
          done
      - name: Commit certificate pages for inspection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/samson-cert-641933/
          if git diff --cached --quiet; then
            echo "No certificate image changes"
          else
            git commit -m "Add Samson 641933 certificate pages for verification"
            git push
          fi
