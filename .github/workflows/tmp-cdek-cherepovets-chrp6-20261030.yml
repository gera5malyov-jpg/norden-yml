name: CDEK SPB to Cherepovets CHRP6 20261030

on:
  push:
    paths:
      - '.github/workflows/tmp-cdek-cherepovets-chrp6-20261030.yml'

permissions:
  contents: read

jobs:
  quote:
    runs-on: ubuntu-latest
    env:
      CDEK_CLIENT_ID: ${{ secrets.CDEK_CLIENT_ID }}
      CDEK_CLIENT_SECRET: ${{ secrets.CDEK_CLIENT_SECRET }}
    steps:
      - name: Quote and destination PVZ limits
        shell: python
        run: |
          import json, os, requests
          base = 'https://api.cdek.ru/v2'
          token_response = requests.post(
              base+'/oauth/token',
              data={'grant_type':'client_credentials',
                    'client_id':os.environ['CDEK_CLIENT_ID'],
                    'client_secret':os.environ['CDEK_CLIENT_SECRET']},timeout=30)
          token_response.raise_for_status()
          h={'Authorization':'Bearer '+token_response.json()['access_token'],
              'Content-Type':'application/json'}
          for city in ('Санкт-Петербург','Череповец'):
              r=requests.get(base+'/location/cities',headers=h,
                  params={'city':city,'country_codes':'RU','size':20},timeout=30)
              r.raise_for_status()
              matches=[{'code':x.get('code'),'region':x.get('region'),'city':x.get('city')}
                for x in r.json() if x.get('city','').strip().lower()==city.lower()]
              print('CITY_LOOKUP',city,json.dumps(matches,ensure_ascii=False))
          r=requests.get(base+'/deliverypoints',headers=h,
              params={'code':'CHRP6'},timeout=30)
          print('POINT_STATUS',r.status_code)
          print('POINT_RESULT',r.text[:20000])
          from_code=137
          to_code=403
          for weight in (50000,48500):
              payload={
                  'type':1,'from_location':{'code':from_code},
                  'to_location':{'code':to_code},
                  'packages':[{'weight':weight,'length':164,'width':51,'height':17}]
              }
              r=requests.post(base+'/calculator/tarifflist',headers=h,json=payload,timeout=45)
              print('QUOTE_WEIGHT',weight,'STATUS',r.status_code)
              print('QUOTE_RESULT',r.text[:30000])
              if r.ok:
                  d=r.json()
                  matches=[t for t in d.get('tariff_codes',[]) if t.get('delivery_mode')==4]
                  print('WAREHOUSE_TO_WAREHOUSE',weight,json.dumps(matches,ensure_ascii=False))
