name: Liga read-only inventory probe once

on:
  push:
    branches:
      - feat/liga-kit-sync
    paths:
      - '.github/workflows/liga-readonly-inventory-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Count current liga variants
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python - <<'PY'
          import os, json
          from liga_kit.http import SafeSession
          from liga_kit.kit_client import KitClient
          kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],SafeSession())
          idx,dups=kit.index_liga_variants()
          sample=[]
          for sku,variant in list(idx.items())[:10]:
              d=kit.get_variant(variant['id'])
              sample.append({
                  'sku':sku,
                  'id':variant['id'],
                  'name':d.get('name'),
                  'images':len([m for m in (d.get('media') or []) if isinstance(m,dict) and str(m.get('type','')).upper()=='IMAGE']),
                  'stocks':d.get('stocks'),
                  'pricing':d.get('pricing'),
              })
          print('LIGA_EXISTING_COUNT='+str(len(idx)))
          print('LIGA_DUPLICATE_COUNT='+str(len(dups)))
          print('LIGA_SAMPLE='+json.dumps(sample,ensure_ascii=False))
          PY
