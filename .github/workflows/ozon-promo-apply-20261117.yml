name: Guarded Ozon promotion cleanup and safe enrollment 2026-11-17
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-promo-apply-20261117.yml'
permissions:
  contents: read
concurrency:
  group: ozon-promo-v2-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove under-min participants and restore any Ozon-lowered minima
        run: python ozon/promo_strategy_floor_remediation_20261109.py
      - name: Enroll only candidates whose price meets seller limits
        env:
          DRY_RUN: 'false'
        run: python ozon/promo_v2_reconcile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-promos-20261117
          path: |
            ozon/promo_strategy_floor_remediation_20261109.json
            ozon/promo_v2_reconcile_report.json
          retention-days: 14
