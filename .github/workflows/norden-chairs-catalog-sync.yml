name: "Norden — кресла и стулья: каталог → Webasyst → KIT"

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'catalog/norden_chairs_pipeline_trigger.txt'

permissions:
  contents: write

concurrency:
  group: norden-chairs-catalog-webasyst-kit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install --disable-pip-version-check requests "gspread>=6.1,<7" "google-auth>=2.35,<3"

      - name: Подготовить и проверить скрипт
        run: |
          gzip -dc catalog/sync_norden_chairs_pipeline.py.gz > catalog/sync_norden_chairs_pipeline.py
          echo "45fe78e854fcc37d644b91f9ca8f52d11a687021403f39131ce2e35fdc52a48d  catalog/sync_norden_chairs_pipeline.py" | sha256sum -c -
          python -m py_compile             catalog/sync_norden_chairs_pipeline.py             norden-kit/sync_norden_kit.py             norden-kit/webasyst_n100_to_kit_once.py             webasyst/client.py

      - name: Синхронизировать каталог, Webasyst и KIT
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CATALOG_SPREADSHEET_ID: '1DvMYvKRr8fX8mfLFaeJCXCccQofPViPcIP2CgIctc8w'
          CATALOG_SHEET: 'Норден'
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: 'https://profikompany.ru'
        run: python catalog/sync_norden_chairs_pipeline.py

      - name: Сохранить отчёт и состояние
        if: always()
        run: |
          rm -f catalog/sync_norden_chairs_pipeline.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             catalog/norden_chairs_pipeline_report.json             catalog/norden_chairs_pipeline_state.json             catalog/norden_chairs_category_review.json             catalog/norden_chairs_identity_review.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Обновить отчёт синхронизации кресел Norden"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
