name: Apply verified missing TN VED Ozon 2026-11-16
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-tnved-apply-20261116.yml'
permissions:
  contents: read
concurrency:
  group: ozon-tnved-sync
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      DRY_RUN: 'false'
      MAX_UPDATES_PER_RUN: '250'
      UPDATE_BATCH_SIZE: '50'
      TNVED_OVERRIDES: ozon/tnved_overrides.json
      TNVED_SUMMARY: ozon/tnved_summary.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact category-verified missing codes
        run: python ozon/tnved_sync.py
      - name: Allow Ozon import processing
        run: sleep 15
      - name: Read back complete Ozon product TN VED fields
        run: python ozon/tnved_verify_remaining_20261109.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-tnved-nov16-write-and-readback
          path: |
            ozon/tnved_summary.md
            ozon/tnved_final_readback_20261109.json
          retention-days: 14
