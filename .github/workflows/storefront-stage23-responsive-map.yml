name: Storefront Stage 23 - Responsive contact map
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage23-responsive-map.yml'
permissions:
  contents: read
concurrency:
  group: storefront-theme-contact
  cancel-in-progress: false
jobs:
  mobile-map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile storefront/stage23_responsive_map.py
      - run: python3 storefront/stage23_responsive_map.py
