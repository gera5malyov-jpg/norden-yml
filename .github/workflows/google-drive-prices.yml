name: Google Drive — прайсы

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - download

permissions:
  contents: read

jobs:
  prices:
    runs-on: ubuntu-latest
    env:
      GOOGLE_DRIVE_PRICES_FOLDER_URL: "https://drive.google.com/drive/folders/1iKh4RGaq1ViyWmHENjp8oeuauHmWEyj9"

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить загрузчик Google Drive
        run: pip install --disable-pip-version-check "gdown>=6.1,<7"

      - name: Проверить публичный доступ к папке Прайсы
        if: ${{ inputs.mode == 'check' }}
        run: python scripts/google_drive_prices.py --list-only

      - name: Скачать прайсы во временную рабочую папку
        if: ${{ inputs.mode == 'download' }}
        run: python scripts/google_drive_prices.py --dest runtime/prices

      - name: Проверить, что прайсы не попали в Git
        if: ${{ inputs.mode == 'download' }}
        shell: bash
        run: |
          if git status --porcelain -- runtime/prices | grep -q .; then
            echo "::error::runtime/prices не должен коммититься в Git."
            exit 1
          fi
          echo "Файлы используются только во временном runner GitHub Actions."
