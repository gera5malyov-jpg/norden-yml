name: Enable Google Docs API once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-google-docs-api-once.yml'

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install auth
        run: pip install requests google-auth

      - name: Enable Google Docs API
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          info = json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])
          creds = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/cloud-platform"],
          )
          session = AuthorizedSession(creds)
          url = "https://serviceusage.googleapis.com/v1/projects/458839719788/services/docs.googleapis.com:enable"
          r = session.post(url, json={}, timeout=60)
          print("HTTP", r.status_code)
          print(r.text[:4000])
          r.raise_for_status()
          PY
