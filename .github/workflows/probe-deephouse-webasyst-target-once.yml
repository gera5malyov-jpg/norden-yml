name: Probe DEEPHOUSE Webasyst target once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-deephouse-webasyst-target-once.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe type and stock
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'webasyst')
          from client import WebasystClient

          def s(v): return str(v or '').strip()
          wa = WebasystClient(min_request_interval=0.4)
          types = wa.call('shop.type.getList')
          stocks = wa.call('shop.stock.getList')
          if isinstance(types, dict):
              types = list(types.values())
          if isinstance(stocks, dict):
              stocks = list(stocks.values())
          type_matches = [x for x in (types or []) if isinstance(x, dict) and s(x.get('name') or x.get('title')).casefold() == 'deephouse-336'.casefold()]
          stock_matches = [x for x in (stocks or []) if isinstance(x, dict) and s(x.get('name') or x.get('title')).casefold() == 'основной склад'.casefold()]
          out = {
              'type_name': 'deephouse-336',
              'type_matches': type_matches,
              'stock_name': 'Основной склад',
              'stock_matches': stock_matches,
              'all_type_names': [s(x.get('name') or x.get('title')) for x in (types or []) if isinstance(x, dict)],
              'all_stock_names': [s(x.get('name') or x.get('title')) for x in (stocks or []) if isinstance(x, dict)],
          }
          with open('webasyst/deephouse_target_probe.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit probe
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add webasyst/deephouse_target_probe.json
          git commit -m 'Probe DEEPHOUSE Webasyst target' || exit 0
          git pull --rebase || true
          git push || true
