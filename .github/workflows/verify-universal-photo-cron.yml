name: Verify actual universal photo cron execution
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/verify-universal-photo-cron.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/verify_universal_photo_cron_state.py
