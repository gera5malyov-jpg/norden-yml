name: Database secret name audit
# rerun 2026-09-30

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/database-secret-name-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SECRET_MAP: ${{ toJSON(secrets) }}
    steps:
      - name: List relevant secret names only
        run: |
          python3 - <<'PY'
          import json, os
          data=json.loads(os.environ.get("SECRET_MAP","{}") or "{}")
          keys=sorted(k for k in data if any(x in k.upper() for x in ("BASEROW","DATABASE","DB_")))
          print("RELEVANT_SECRET_NAMES="+json.dumps(keys, ensure_ascii=False))
          PY
