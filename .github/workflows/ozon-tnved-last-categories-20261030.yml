                  elif group==(80711064,95103) and mat in wood and re.search('ОБУВНИЦ|ДЛЯ ОБУВИ|ТУМБА ДЛЯ ОБУВ',t):
                      code='9403609009';why='wooden shoe cabinet'
                  elif group in [(17027917,94995),(17027917,970713329),(17027917,94992),(17027917,970615714)] and re.search(r'КРОВАТ',t):
                      if mat=='Металл' and not re.search('МЕТАЛЛИЧЕСКОЕ ОСНОВАНИЕ',t):
                          code='9403202009';why='metal-framed bed'
                      elif mat in wood and not re.search('МЕТАЛЛИЧЕСКИЙ КАРКАС',t):
                          code='9403500009';why='wooden bedroom bed'
                  elif group==(17029020,94491) and re.search(r'ДОСКА ДЛЯ МЕЛА|ДОСКА.*МАГНИТН|МОЛЬБЕРТ.*МАРКЕР',t):
                      code='9610000000';why='writing/chalk/marker board'
                  elif group==(17027919,95083) and mat in wood and re.search(r'БУФЕТ|ПОСУД',t):
                      code='9403601009';why='wooden dining room buffet'
                  elif group==(80443823,613346845) and mat=='Массив дерева' and re.search(r'^СКАМЬЯ',t):
                      code='9401690000';why='wooden bench without upholstery'
                  elif group==(17027916,970591528) and mat=='Металл' and ob and ob!='Без обивки' and re.search('СТУЛ СКЛАДНОЙ',t):
                      code='9401710009';why='folding padded metal seat'
              if code is None:
                  top=a.get('Материал столешницы','')
                  body=a.get('Материал корпуса','')
                  wood=('ЛДСП','МДФ','Шпон','Дерево','Массив дерева','Массив сосны','Массив бука','Массив березы','Фанера','Бук')
                  othermaterials=r'РОТАН|РАТТАН|БАМБУК'
