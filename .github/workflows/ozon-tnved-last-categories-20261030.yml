                  elif group==(17027918,95002) and re.match(r'^(СТОЛИК|СТОЛ|ЖУРНАЛЬНЫЙ)\b',t) and not re.search(material_redflags,t):
                      if top in topwood and base in topwood:
                          code='9403601009';why='all-wood coffee/occasional table'
                  elif group in [(17027918,95005),(17027918,504866270)] and re.search(r'СТОЛ',t):
                      if not re.search(r'КУХОН|ОБЕД|МЕТАЛЛ|СТЕКЛО|ПЛАСТИК|КОФЕЙНЫЙ',t) and top in topwood and base in topwood and 0<height(a,'Высота, см')<=80:
                          code='9403301100';why='wooden office/computer desk under 80 cm'
                  elif group==(17027918,95006) and re.search(r'КОНСОЛЬ',t):
                      if top in topwood and base in topwood and not re.search(material_redflags,t):
                          code='9403601009';why='wooden hallway/console table'
                  elif group==(17027918,95101) and re.search(r'КОСМЕТИЧ|ТУАЛЕТН|СТОЛ',t):
                      if top in topwood and base in topwood and not re.search(material_redflags,t):
                          code='9403601009';why='wooden dressing/vanity table'
                  elif group==(80770870,95090) and mat in wood and re.search(r'ПРИХОЖАЯ|ВЕШАЛКА|ОБУВ|ГАРДЕРОБ',t) and not re.search(r'МЕТАЛЛ|РОТАНГ|РАТТАН',t):
                      code='9403609009';why='wooden hallway/entryway furniture'
                  elif group==(80711064,971162059) and mat in wood:
                      if re.search('ПРИКРОВАТ|ТУМБА ПРИКРОВАТ',t):
                          code='9403500009';why='wooden bedside table'
                      elif re.search('ТУМБА ТВ|ТУМБА ПОД ТВ|ТУМБА.*ТЕЛЕВИЗ',t):
                          code='9403601009';why='wooden television furniture'
                  elif group==(80711064,95086) and mat in wood:
                      if re.search('ТУМБА ТВ|ТУМБА ПОД ТВ|ПОД ТЕЛЕВИЗ',t):
