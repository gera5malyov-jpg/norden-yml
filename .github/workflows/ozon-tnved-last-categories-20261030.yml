                      elif re.search(r'ОФИСН|ДОКУМЕНТ|КАРТОТЕЧ|АРХИВ',t):
                          h=height(a,'Высота, см')
                          if h>80:code='9403309100';why='wooden office document cabinet above 80 cm'
                  elif group==(17027918,95015) and re.match(r'^СТОЛ(?:ИК)?\b',t) and not re.search(material_redflags,t):
