                  fabric=r'ТКАНЬ|ТКАНЕВ|ВЕЛЮР|ВЕЛЬВЕТ|ЭКОКОЖА|КОЖЗАМ|КОЖА|БУКЛЕ|МИКРОВЕЛЮР|РОГОЖК|С МЯГКИМ|МЯГКИМ СИДЕНЬЕМ|МЯГКАЯ СПИНКА'
                  swivel=r'ГАЗЛИФТ|РЕГУЛИРУ|ВРАЩА|ПОДЪЁМ|ПОДЪЕМ|ПОВОРОТН|SWIVEL|ГИДРАВЛИЧ'
                  if group in [(17027916,95048),(17027916,95023),(17027916,95053)] and re.search('СТУЛ|ТАБУРЕТ|КРЕСЛО ВЕНСКОЕ',t) and not re.search('РОТАНГ|РАТТАН|БАМБУК|ТРАНСФОРМ|КРОВАТЬ',t):
                      if mat=='Металл':
                          if ob and ob!='Без обивки' and 'На ножках' in ch and not re.search(swivel,t):
                              code='9401710009';why='upholstered metal fixed bar/dining seat'
                          elif not ob and re.search(fabric,t) and not re.search(swivel,t):
                              code='9401710009';why='upholstery indicated in title, metal fixed seat'
                          elif not ob and re.search('БЕЗ ОБИВКИ|БЕЗ МЯГКОГО',t):
                              code='9401790009';why='unupholstered metal fixed seat stated'
                      elif mat in ('Массив дерева','Дерево','Фанера') and not ob and not re.search(swivel,t):
                          if re.search(fabric,t) or re.search('КРЕСЛО ВЕНСКОЕ|МЯГК',t):
                              code='9401610000';why='wood frame, title indicates upholstered seat'
                          elif re.search('БЕЗ ОБИВКИ|ДЕРЕВЯННЫЙ СТУЛ|ВЕНСКИЙ СТУЛ',t):
                              code='9401690000';why='unupholstered wooden chair stated'
                  elif group==(17027916,95044) and (re.search('ПУФ|БАНКЕТКА|ОТТОМАН',t)) and ob and ob!='Без обивки' and not re.search('ОТДЕЛЕНИЕ ДЛЯ ХРАНЕНИЯ|ЯЩИК ДЛЯ ХРАНЕНИЯ',t):
                      if body in ('МДФ','ЛДСП','Фанера','Массив дерева','Дерево'):
                          code='9401610000';why='upholstered wooden or engineered-wood pouf'
                      elif body=='Металл':
                          code='9401710009';why='upholstered metal pouf'
                  elif group==(79164512,95041) and re.search('КРЕСЛО',t):
                      lo=height(a,'Мин. высота сиденья, см'); hi=height(a,'Макс. высота сиденья, см')
                      if (lo and hi and hi-lo>2) or re.search(swivel,t):
                          code='9401390000';why='adjustable height office swivel chair'
                      elif re.search('ПОСЕТИТЕЛЕЙ|ДЛЯ ПОСЕТИТЕЛЕЙ|КОНФЕРЕНЦ',t) and mat=='Металл' and ob and ob!='Без обивки':
                          code='9401710009';why='upholstered fixed metal visitor chair'
                  elif group==(80375615,95035) and body=='Фанера' and re.search('КРЕСЛО|ГЛЯЙДЕР',t):
                      if ob and ob!='Без обивки' or re.search(fabric,t):
                          code='9401610000';why='plywood rocker with upholstery indicated'
                  elif group==(80731485,95098) and 'СТЕЛЛАЖ' in t and not re.search('МЕТАЛЛ|СТАЛЬ|СТЕКЛО|РОТАНГ',t):
                      if body in ('ЛДСП','МДФ','Фанера','Шпон','Массив дерева','Массив сосны','Дерево'):
                          code='9403609009';why='wooden household shelf/rack'
                  elif group in [(17027917,94995),(17027917,970713329)] and body=='' and re.search('КРОВАТ',t):
                      if re.search('ДУБ|ЯСЕНЬ|ЛДСП|СОНОМА|ВЕНГЕ|МДФ|БЕЛФОРТ|АНКОР|ОРЕХ|ДЕРЕВО|КРАФТ',t) and not re.search('МЕТАЛЛИЧЕСКИЙ КАРКАС|МЕТАЛЛИЧЕСКАЯ КРОВАТЬ',t):
                          code='9403500009';why='wooden bed indicated by finish and model'
                  elif group==(17027918,504866270) and re.search('СТОЛ ПИСЬМЕННЫЙ|ПИСЬМЕННЫЙ СТОЛ',t) and a.get('Материал столешницы') in ('ЛДСП','МДФ') and not re.search('МЕТАЛЛОКАРКАС|СТАЛЬ|МЕТАЛЛИЧЕСКИЙ КАРКАС',t):
                      h=height(a,'Высота, см')
                      if 0<h<=80: code='9403301100';why='wood top writing desk below 80 cm'
                  elif group==(17027919,95108) and body=='Металл' and re.search('КАРТОТЕЧ|ДОКУМЕНТ',t):
                      code='9403109300';why='office metal filing cabinet'
                  elif group==(17027919,95108) and body=='Металл' and re.search('ШКАФ МЕТАЛЛИЧЕСКИЙ ДЛЯ ОДЕЖДЫ',t):
                      code='9403208009';why='metal clothes locker'
                  elif group==(17027919,95108) and body=='Металл' and re.search('ШКАФ',t):
                      code='9403208009';why='other metal cabinet'
                  elif group==(17028726,96029) and re.search('ШИРМА',t) and re.search('БАМБУК',t) and not re.search('МЕТАЛЛ|СТАЛЬ',t):
                      code='9403820000';why='bamboo folding screen'
                  elif group==(17029021,93292) and re.search('НАСТОЛЬНЫЙ НАБОР',t) and re.search('МЕТАЛЛ',t):
                      code='8304000000';why='office desk set made of base metal'
                  elif group==(44082285,970848956) and re.search('ЯЩИК ДЛЯ ДЕНЕГ|ЯЩИК ДЛЯ ЦЕННОСТЕЙ',t) and re.search('ЗАМОК',t):
                      code='8303004000';why='lockable cash box'
              if code:
                  values=by_group[group][code]
                  if len(values)!=1:
                      try:
                          group_key=(group[0],group[1],code)
                          if group_key not in dictionary_matches_cache:
                              options=api.get_dictionary_values(group[0],group[1],22232)
                              dictionary_matches_cache[group_key]=set(int(z.get('id') or 0) for z in options if str(z.get('value') or '').startswith(code))
                          dictionary_ids=dictionary_matches_cache[group_key]
                          if len(dictionary_ids)==1:values=dictionary_ids
                      except Exception:
                          pass
                  if len(values)==1:
                      dictionary_id=next(iter(values))
                      reference=next((z for z in snapshot['filled'] if tuple(z['group'])==group and z['code']==code and z['dictionary_id']==dictionary_id),None)
                      if reference or dictionary_id:
                          candidates.append({'offer_id':x['offer'],'name':x['name'],'group':list(group),'code':code,'dictionary_value_id':dictionary_id,'value_source':reference['offer'] if reference else '','method':why,'material':mat,'obivka':ob})
                          counts[why]+=1
          print('CANDIDATES_JSON',json.dumps({'total':len(candidates),'by_method':dict(counts)},ensure_ascii=False),flush=True)
          # Read live card IDs, names and existing code before any write
          catalog=api.list_products()
          pid_by_offer={str(x.get('offer_id') or ''):int(x['product_id']) for x in catalog if x.get('offer_id') and x.get('product_id')}
          chosen=[x for x in candidates if x['offer_id'] in pid_by_offer]
          ids=[pid_by_offer[x['offer_id']] for x in chosen]
          live=api.get_product_attributes(ids)
          byoffer={str(x.get('offer_id') or ''):x for x in live}
          verified=[];stale=[]
          for row in chosen:
              p=byoffer.get(row['offer_id'])
              if not p or str(p.get('name') or '')!=row['name'] or (int(p.get('description_category_id') or 0),int(p.get('type_id') or 0))!=tuple(row['group']):
                  stale.append(row['offer_id']);continue
              prev=api.attr_value_tuple(api.find_product_attr(p,22232) or {})
              if prev:
                  stale.append(row['offer_id']);continue
              verified.append(row)
          remaining,lim,used,reset=api.get_daily_update_remaining()
          cap=min(len(verified),remaining if remaining is not None else len(verified))
          selected=verified[:max(0,cap)]
          report={'apply':os.environ['APPLY']=='true','catalog_total':len(catalog),'snapshot_missing':len(snapshot['missing']),'candidate_total':len(candidates),'by_method':dict(counts),'live_verified':len(verified),'stale':stale,'selected':len(selected),'quota':lim,'quota_used':used,'proposals':verified,'tasks':[],'write_errors':[],'confirmed':0}
          # Validate exact code text against a second live Ozon card in the same category.
          refs=set(x['value_source'] for x in selected if x['value_source'])
          reference_attrs=api.get_product_attributes([pid_by_offer[o] for o in refs if o in pid_by_offer])
          ref_by_offer={str(p.get('offer_id') or ''):p for p in reference_attrs}
          verified_values={}
          for x in selected:
              p=ref_by_offer.get(x['value_source'])
              attr=api.attr_value_tuple(api.find_product_attr(p,22232) or {}) if p else None
              if x['value_source']:
                  if not attr or int(attr[0])!=int(x['dictionary_value_id']) or not str(attr[1]).startswith(x['code']):
                      raise RuntimeError('Source reference not verified for '+x['offer_id'])
                  verified_values[(tuple(x['group']),x['dictionary_value_id'])]=attr[1]
              else:
                  key=(tuple(x['group']),x['dictionary_value_id'])
                  if key[0] not in dictionary_values_cache:
                      dictionary_values_cache[key[0]]=api.get_dictionary_values(x['group'][0],x['group'][1],22232)
                  opts=dictionary_values_cache[key[0]]
                  matches=[z for z in opts if int(z.get('id') or 0)==x['dictionary_value_id'] and str(z.get('value') or '').startswith(x['code'])]
                  if len(matches)!=1:raise RuntimeError('Missing Ozon code dictionary for '+x['offer_id'])
                  verified_values[key]=str(matches[0]['value'])
          if report['apply']:
              for batch in api.chunks(selected,35):
                  # The complete dictionary display value is required, not just the numeric code.
                  items=[]
                  for x in batch:
                      label=verified_values[(tuple(x['group']),x['dictionary_value_id'])]
                      items.append({'offer_id':x['offer_id'],'attributes':[{'complex_id':0,'id':22232,'values':[{'dictionary_value_id':x['dictionary_value_id'],'value':label}]}]})
                  try:
                      reply=api.post('/v1/product/attributes/update',{'items':items})
                      report['tasks'].append(reply.get('task_id'))
                  except Exception as exc:report['write_errors'].append({'offers':[x['offer_id'] for x in batch],'error':str(exc)[:300]})
                  time.sleep(.4)
              time.sleep(12)
              fresh=api.get_product_attributes([pid_by_offer[x['offer_id']] for x in selected])
              check={str(x.get('offer_id')):x for x in fresh}
              report['confirmed']=sum(1 for x in selected if (lambda p: p and (lambda v: v and int(v[0])==x['dictionary_value_id'])(api.attr_value_tuple(api.find_product_attr(p,22232) or {})))(check.get(x['offer_id'])))
          Path('ozon/tnved_last_categories_20261030.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('RESULT_JSON',json.dumps({k:v for k,v in report.items() if k!='proposals'},ensure_ascii=False)[:5500],flush=True)
          PY
      - name: Save audit
        if: always()
        run: |
          if [ ! -f ozon/tnved_last_categories_20261030.json ]; then echo '{"error":"audit failed"}' > ozon/tnved_last_categories_20261030.json; fi
          cp ozon/tnved_last_categories_20261030.json /tmp/tnved_next.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/tnved_next.json ozon/tnved_last_categories_20261030.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ozon/tnved_last_categories_20261030.json
          if ! git diff --cached --quiet; then git commit -m 'Record guarded TNVED next batch audit'; git push; fi
