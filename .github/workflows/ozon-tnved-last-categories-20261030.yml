name: Ozon TNVED latest outstanding category evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-tnved-last-categories-20261030.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ozon-tnved-next-batch
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      APPLY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Select furniture only when material and construction support exact ten-digit code
        run: |
          python - <<'PY'
          import sys,os,json,re,time,collections
          from pathlib import Path
          sys.path.insert(0,'ozon')
          import tnved_sync as api
          snapshot=json.loads(Path('ozon/tnved_evidence_extended_20261030.json').read_text())
          by_group=collections.defaultdict(lambda:collections.defaultdict(set))
          for x in snapshot['filled']:
              if x.get('dictionary_id') and re.fullmatch(r'\d{10}',str(x.get('code') or '')):
                  by_group[tuple(x['group'])][x['code']].add(int(x['dictionary_id']))
          def height(a,key):
              try:return float(str(a.get(key) or '0').replace(',','.'))
              except:return 0.
          def adjusted(a,t):
              if re.search(r'ГАЗЛИФТ|РЕГУЛИРУ|ВРАЩА|ПОДЪЕМ|ПОДЪЁМ|LIFT|SWIVEL|ГИДРАВЛИЧ',t):return True
              lo=height(a,'Мин. высота сиденья, см')
              hi=height(a,'Макс. высота сиденья, см') or height(a,'Высота сиденья, см')
              if lo and hi and abs(hi-lo)>1.1:return True
              swing=a.get('Тип механизма качания','')
              if swing and swing not in ['Без механизма качания','Нет']:return True
              return False
          candidates=[];counts=collections.Counter();dictionary_matches_cache={};dictionary_values_cache={}
          for x in snapshot['missing']:
              group=tuple(x['group']);t=x['name'].upper();a=x['attrs']
              mat=a.get('Материал корпуса','')
              ob=a.get('Материал обивки','')
              base=a.get('Материал подстолья','')
              code=None;why=None
              if group in [(17027916,95048),(17027916,95023)] and re.search(r'\b(СТУЛ|ТАБУРЕТ)\b',t):
                  if not adjusted(a,t) and not re.search('КРЕСЛО|ТРАНСФОРМ|РАСКЛАД',t):
                      if mat=='Металл':
                          if ob and ob!='Без обивки':code='9401710009';why='fixed metal seat with upholstery'
                          elif ob=='Без обивки':code='9401790009';why='fixed non-upholstered metal seat'
                      elif mat in ['Массив дерева','Массив березы','Дерево']:
                          if ob and ob!='Без обивки':code='9401610000';why='fixed upholstered wood-framed seat'
                          elif ob=='Без обивки':code='9401690000';why='fixed non-upholstered wood seat'
              elif group==(79164512,95041) and 'ДЛЯ ПОСЕТИТЕЛЕЙ' in t and mat=='Металл' and ob and ob!='Без обивки' and a.get('Механизм качания')=='Нет' and not adjusted(a,t):
                  code='9401710009';why='fixed visitor seat, upholstered metal frame'
              elif group==(17027918,504866270) and re.search('СТОЛ ПИСЬМЕННЫЙ',t) and not re.search('ЛОФТ|МЕТАЛЛ|СТЕКЛО',t) and a.get('Материал столешницы')=='ЛДСП' and base=='ЛДСП' and 0<height(a,'Высота, см')<=80:
                  code='9403301100';why='office writing desk, LDSP frame, up to 80 cm'
              elif group==(80731485,95098) and x['offer'].startswith('SAMS-') and 'ШКАФ (СТЕЛЛАЖ)' in t and mat=='ЛДСП' and not re.search('ДВЕРЬ|ДВЕРИ|ЗАКРЫТ|СТЕКЛО',t):
                  h=height(a,'Высота, см')
                  if h>80:code='9403309900';why='wooden office open shelving, above 80 cm'
                  elif 0<h<=80:code='9403301900';why='wooden office open shelving, at most 80 cm'
              elif group==(80731485,95098) and x['offer'].startswith('SAMS-') and mat=='ЛДСП' and re.search(r'^ШКАФ (ПОЛУЗАКРЫТЫЙ|ЗАКРЫТЫЙ)',t) and re.search(r'БЮДЖЕТ|КАНЦ|МОНОЛИТ|ПРИОРИТЕТ',t):
                  h=height(a,'Высота, см')
                  if h>80:code='9403309100';why='wooden office cabinet with doors, over 80 cm'
              elif group==(79164512,95041) and ('КРЕСЛО' in t) and ('ПОСЕТИТЕЛ' not in t) and a.get('Материал крестовины') and height(a,'Мин. высота сиденья, см')>0 and height(a,'Макс. высота сиденья, см')-height(a,'Мин. высота сиденья, см')>3:
                  code='9401390000';why='swiveling office seat with height adjustment'
              elif group==(80375615,95024) and t.startswith('ДИВАН ДВУХМЕСТНЫЙ РЕТРО') and mat=='Массив березы' and ob and ob!='Без обивки' and not re.search('КРОВАТЬ|РАСКЛАД|ТРАНСФОРМ',t):
                  code='9401610000';why='non-convertible upholstered solid birch sofa'
              elif group==(80375615,95024) and t.startswith('ДИВАН БАРХАТ') and mat=='Массив березы' and ob and ob!='Без обивки' and not re.search('КРОВАТЬ|РАСКЛАД|ТРАНСФОРМ',t):
                  code='9401610000';why='fixed upholstered birch sofa BARHAT'
              elif group==(17027916,95044) and re.match(r'^ПУФ(?:ИК)?\b',t) and ob and ob!='Без обивки' and not re.search('КРОВАТЬ|РАСКЛАД|ТРАНСФОРМ',t):
                  if mat in ['Дерево','Массив дерева','Массив березы']:
                      code='9401610000';why='upholstered wooden ottoman'
                  elif mat=='Металл':
                      code='9401710009';why='upholstered metal ottoman'
              elif group==(17027908,93670) and x['offer'].startswith('SAMS-') and 'ВЕШАЛКА' in t and 'МЕТАЛЛ' in t:
                  code='9403208009';why='metal floor coat stand'
              elif group==(17027918,95015) and re.search(r'^СТОЛ ОБЕДЕННЫЙ\b',t):
                  # Exclude any decorative/structural glass, ceramics or metal to avoid the wrong material class.
                  forbidden=r'СТЕКЛ|КЕРАМИ|МРАМОР|КАМЕНЬ|МЕТАЛЛ|СТАЛЬ|ХРОМ|БЕТОН|СТЕКЛОКЕРАМИК|ЛОФТ|ТРАНСФОРМ'
                  wood={'МДФ','ЛДСП','Массив дерева','Дерево','Шпон','Массив сосны','Массив бука'}
                  if not re.search(forbidden,t) and a.get('Материал столешницы') in wood and base in wood:
                      code='9403601009';why='wooden dining table, wooden top and supports'
              elif group==(17027918,95002) and re.search(r'^(СТОЛ ЖУРНАЛЬНЫЙ|ЖУРНАЛЬНЫЙ СТОЛ|СТОЛИК ЖУРНАЛЬНЫЙ)\b',t):
                  forbidden=r'СТЕКЛ|КЕРАМИ|МРАМОР|КАМЕНЬ|МЕТАЛЛ|СТАЛЬ|ХРОМ|БЕТОН|ЛОФТ|ТРАНСФОРМ'
                  wood={'МДФ','ЛДСП','Массив дерева','Дерево','Шпон','Массив сосны','Массив бука'}
                  if not re.search(forbidden,t) and a.get('Материал столешницы') in wood and base in wood:
                      code='9403601009';why='wooden coffee table for living room'
              # Second-level deterministic classification for remaining families.
              if code is None:
                  top=a.get('Материал столешницы','')
                  cabinet=a.get('Материал корпуса','')
                  art=a.get('Материал','')
                  wood=('ЛДСП','МДФ','Дерево','Массив дерева','Массив березы','Массив сосны','Массив бука','Фанера','Шпон','Бук')
                  topwood=('ЛДСП','МДФ','Дерево','Массив дерева','Массив березы','Массив сосны','Массив бука','Шпон','Бук')
                  material_redflags=r'СТЕКЛ|КЕРАМИ|МРАМОР|КАМЕНЬ|СТАЛЬ|ХРОМ|МЕТАЛЛ|РАТТАН|РОТАНГ|БАМБУК|ЛОФТ|БЕТОН'
                  if group in [(17027916,95048),(17027916,95023),(17027916,95053)] and re.search(r'^(СТУЛ|ТАБУРЕТ)\b',t):
                      if mat=='Пластик' and ob=='Без обивки' and not adjusted(a,t):
                          code='9401800009';why='plastic unupholstered chair'
                      elif mat in wood and ob=='Без обивки' and not re.search(r'РОТАНГ|РАТТАН|БАМБУК',t):
                          code='9401690000';why='wooden unupholstered fixed seat'
                      elif mat in wood and ob and ob!='Без обивки' and not adjusted(a,t) and not re.search(r'РОТАНГ|РАТТАН|БАМБУК',t):
                          code='9401610000';why='wooden upholstered fixed seat'
                      elif mat=='Металл' and ob=='Без обивки' and not adjusted(a,t):
                          code='9401790009';why='unupholstered fixed metal chair'
                      elif mat=='Металл' and ob and ob!='Без обивки' and not adjusted(a,t):
                          code='9401710009';why='upholstered fixed metal chair'
                  elif group in [(80375615,95030),(80375615,95035)] and (t.startswith('КРЕСЛО') or t.startswith('ДИЗАЙНЕРСКОЕ КРЕСЛО')):
                      if not re.search('РОТАНГ|РАТТАН|БАМБУК|ПЛЕТЕН|КРОВАТЬ|СПАЛЬНОЕ',t):
                          if mat in wood and ob and ob!='Без обивки':
                              code='9401610000';why='upholstered upholstered-wood armchair, including plywood'
                          elif mat=='Металл' and ob and ob!='Без обивки' and not adjusted(a,t):
                              code='9401710009';why='upholstered static metal armchair'
                  elif group==(17027916,95044) and re.match(r'^ПУФ(?:ИК)?\b',t) and mat in ('МДФ','Фанера') and ob and ob!='Без обивки':
