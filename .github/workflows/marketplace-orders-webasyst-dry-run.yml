name: Marketplace orders to Webasyst dry run

on:
  push:
    paths:
      - 'webasyst/marketplace_order_sync.py'
      - '.github/workflows/marketplace-orders-webasyst-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить перенос заказов без записи
        env:
          DRY_RUN: '1'
          OZON_ORDER_IMPORT_CUTOFF: '2026-09-22T11:08:40Z'
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python webasyst/marketplace_order_sync.py
