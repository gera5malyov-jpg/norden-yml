name: Canonical pagination safely scoped to categories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-canonical-pagination-20261018.yml'
      - 'storefront/fix_canonical_pagination_20261018.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and validate safe patch runner
        run: python -m py_compile storefront/fix_canonical_pagination_20261018.py
      - name: Run three prechecks and ten live acceptance checks
        run: python storefront/fix_canonical_pagination_20261018.py
