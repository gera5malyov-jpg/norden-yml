name: Ozon mass tools and actions apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-mass-actions-apply.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install requests
        run: python -m pip install requests
      - name: Apply Ozon mass rules
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, requests, math
          BASE="https://api-seller.ozon.ru"
          H={"Client-Id":os.environ["OZON_CLIENT_ID"],"Api-Key":os.environ["OZON_API_KEY"],"Content-Type":"application/json"}
          S=requests.Session(); S.headers.update(H)

          def call(method,path,body=None, required=True):
              last=None
              for a in range(15):
                  try:
                      r=S.request(method,BASE+path,json=body,timeout=120)
                  except Exception as e:
                      last=e; time.sleep(min(15,1+a)); continue
                  if r.status_code==429:
                      time.sleep(float(r.headers.get("Retry-After") or min(20,1+a))); continue
                  if r.status_code>=500:
                      time.sleep(min(20,1+a)); continue
                  if r.status_code>=400:
                      print("HTTP_ERROR",method,path,r.status_code,r.text[:2500],flush=True)
                      if required: return None
                      return None
                  try: return r.json() if r.content else {}
                  except Exception: return {"raw":r.text}
              print("REQUEST_FAILED",method,path,str(last),flush=True)
              return None

          def chunks(xs,n):
              for i in range(0,len(xs),n): yield xs[i:i+n]

          # 1) Read all products/prices.
          items=[]; cursor=""; seen=set()
          while True:
              d=call("POST","/v5/product/info/prices",{"cursor":cursor,"filter":{"visibility":"ALL"},"limit":1000})
              if not d: raise SystemExit("Cannot read Ozon products")
              rows=d.get("items") or []
              for x in rows:
                  pid=x.get("product_id")
                  if pid is not None and int(pid) not in seen:
                      seen.add(int(pid)); items.append(x)
              nxt=d.get("cursor") or ""
              if not rows or not nxt or nxt==cursor: break
              cursor=nxt
          by_pid={int(x["product_id"]):x for x in items}
          pids=list(by_pid)
          min_pids=[]
          for pid,x in by_pid.items():
              try:
                  if float((x.get("price") or {}).get("min_price") or 0)>0:
                      min_pids.append(pid)
              except: pass

          report={
              "products_total":len(items),
              "timers_requested":0,"timer_batches_failed":0,
              "strategy_id":None,"strategy_add_requested":0,"strategy_failed_product_count":0,
              "strategy_errors_sample":[],
              "actions_total":0,"participants_before":0,
              "removed_below_min":0,"remove_rejected":0,"remove_rejected_sample":[],
              "stock_quantity_one_requested":0,"stock_quantity_one_rejected":0,"stock_rejected_sample":[],
              "auto_add_removed_below_min":0,"auto_add_quantity_one_requested":0,
              "auto_add_update_rejected":0,
              "timer_enabled_true":0,"timer_enabled_false":0,
              "auto_action_disabled_remaining":0,"auto_add_list_disabled_remaining":0,
              "notes":[]
          }

          # 2) Renew min-price timers for every product that has min_price > 0.
          for ch in chunks(min_pids,1000):
              d=call("POST","/v1/product/action/timer/update",{"product_ids":[str(x) for x in ch]},required=False)
              report["timers_requested"] += len(ch)
              if d is None: report["timer_batches_failed"] += 1

          # 3) Add all products to the system MIN_EXT_PRICE strategy.
          sl=call("POST","/v1/pricing-strategy/list",{"page":1,"limit":49}) or {}
          systems=[x for x in (sl.get("strategies") or []) if x.get("type")=="MIN_EXT_PRICE"]
          strategy=next((x for x in systems if x.get("enabled") is True), systems[0] if systems else None)
          if strategy:
              sid=str(strategy.get("id")); report["strategy_id"]=sid
              if not strategy.get("enabled"):
                  call("POST","/v1/pricing-strategy/status",{"strategy_id":sid,"enabled":True},required=False)
              for ch in chunks(pids,500):
                  d=call("POST","/v1/pricing-strategy/products/add",{"strategy_id":sid,"product_id":[str(x) for x in ch]},required=False)
                  report["strategy_add_requested"] += len(ch)
                  if d:
                      rr=d.get("result") or {}
                      report["strategy_failed_product_count"] += int(rr.get("failed_product_count") or 0)
                      for e in (rr.get("errors") or []):
                          if len(report["strategy_errors_sample"])<50:
                              report["strategy_errors_sample"].append(e)
                  else:
                      report["strategy_failed_product_count"] += len(ch)
          else:
              report["notes"].append("System MIN_EXT_PRICE strategy not found.")

          # 4) Current actions: remove every participant whose action_price is below min_price.
          actions=(call("GET","/v1/actions") or {}).get("result") or []
          report["actions_total"]=len(actions)
          action_meta={int(a["id"]):a for a in actions if a.get("id") is not None}
          for aid,a in action_meta.items():
              participants=[]; offset=0
              while True:
                  d=call("POST","/v1/actions/products",{"action_id":aid,"limit":1000,"offset":offset},required=False) or {}
                  rows=((d.get("result") or {}).get("products")) or []
                  participants.extend(rows)
                  if len(rows)<1000: break
                  offset += 1000
              report["participants_before"] += len(participants)

              bad=[]
              for pr in participants:
                  pid=int(pr.get("id") or pr.get("product_id") or 0)
                  info=by_pid.get(pid)
                  if not info: continue
                  try:
                      minp=float((info.get("price") or {}).get("min_price") or 0)
                      ap=float(pr.get("action_price") or 0)
                  except: continue
                  if minp>0 and ap>0 and ap<minp:
                      bad.append(pid)
              for ch in chunks(bad,500):
                  d=call("POST","/v1/actions/products/deactivate",{"action_id":aid,"product_ids":ch},required=False)
                  if d:
                      rr=d.get("result") or {}
                      report["removed_below_min"] += len(rr.get("product_ids") or [])
                      rej=rr.get("rejected") or []
                      report["remove_rejected"] += len(rej)
                      for e in rej:
                          if len(report["remove_rejected_sample"])<50:
                              report["remove_rejected_sample"].append({"action_id":aid,**e})
                  else:
                      report["remove_rejected"] += len(ch)

              # Re-read remaining participants after removals.
              remain=[]; offset=0
              while True:
                  d=call("POST","/v1/actions/products",{"action_id":aid,"limit":1000,"offset":offset},required=False) or {}
                  rows=((d.get("result") or {}).get("products")) or []
                  remain.extend(rows)
                  if len(rows)<1000: break
                  offset += 1000

              # Quantity in promo exists only for STOCK_DISCOUNT. Preserve action price, set stock=1.
              if a.get("action_type")=="STOCK_DISCOUNT":
                  payload=[]
                  for pr in remain:
                      pid=int(pr.get("id") or pr.get("product_id") or 0)
                      ap=float(pr.get("action_price") or 0)
                      if pid and ap>0:
                          payload.append({"product_id":pid,"action_price":ap,"stock":1})
                  for ch in chunks(payload,100):
                      d=call("POST","/v1/actions/products/activate",{"action_id":aid,"products":ch},required=False)
                      report["stock_quantity_one_requested"] += len(ch)
                      if d:
                          rr=d.get("result") or {}
                          rej=rr.get("rejected") or []
                          report["stock_quantity_one_rejected"] += len(rej)
                          for e in rej:
                              if len(report["stock_rejected_sample"])<50:
                                  report["stock_rejected_sample"].append({"action_id":aid,**e})
                      else:
                          report["stock_quantity_one_rejected"] += len(ch)

          # 5) Future auto-add schedules: remove entries below min_price and set quantity=1 for
          # remaining stock-discount auto-add entries so bad prices do not return on the next date.
          for aid,a in action_meta.items():
              for auto_date in (a.get("auto_add_dates") or []):
                  scheduled=[]; offset=0
                  while True:
                      d=call("POST","/v1/actions/auto-add/products/list",{
                          "action_id":aid,"auto_add_date":auto_date,"limit":1000,"offset":offset
                      },required=False)
                      if not d: break
                      rows=d.get("products") or []
                      scheduled.extend(rows)
                      if len(rows)<1000: break
                      offset += 1000
                  if not scheduled: continue
                  bad=[]; good=[]
                  for pr in scheduled:
                      pid=int(pr.get("product_id") or 0)
                      info=by_pid.get(pid)
                      if not info: continue
                      try:
                          minp=float((info.get("price") or {}).get("min_price") or 0)
                          ap=float(pr.get("action_price_to_auto_add") or 0)
                      except: continue
                      if minp>0 and ap>0 and ap<minp:
                          bad.append(str(pid))
                      else:
                          good.append(pr)
                  for ch in chunks(bad,500):
                      d=call("POST","/v1/actions/auto-add/products/delete",{
                          "action_id":aid,"auto_add_date":auto_date,"product_ids":ch
                      },required=False)
                      if d:
                          report["auto_add_removed_below_min"] += len(d.get("product_ids") or [])
                  if a.get("action_type")=="STOCK_DISCOUNT":
                      upd=[]
                      for pr in good:
                          pid=int(pr.get("product_id") or 0)
                          ap=float(pr.get("action_price_to_auto_add") or 0)
                          if pid and ap>0:
                              upd.append({"product_id":pid,"action_price":ap,"quantity":1,"currency":pr.get("currency") or "RUB"})
                      for ch in chunks(upd,100):
                          d=call("POST","/v1/actions/auto-add/products/update",{
                              "action_id":aid,"auto_add_date":auto_date,"to_update":ch
                          },required=False)
                          report["auto_add_quantity_one_requested"] += len(ch)
                          if d:
                              report["auto_add_update_rejected"] += len(d.get("rejected") or [])
                          else:
                              report["auto_add_update_rejected"] += len(ch)

          # 6) Verify timer flags (this reports protection state; does not guess/alter declared_price).
          for ch in chunks(min_pids,1000):
              d=call("POST","/v1/product/action/timer/status",{"product_ids":[str(x) for x in ch]},required=False)
              for st in ((d or {}).get("statuses") or []):
                  if st.get("min_price_for_auto_actions_enabled"):
                      report["timer_enabled_true"] += 1
                  else:
                      report["timer_enabled_false"] += 1

          # 7) Verify remaining auto-action switches.
          cur=""; final_items=[]
          while True:
              d=call("POST","/v5/product/info/prices",{"cursor":cur,"filter":{"visibility":"ALL"},"limit":1000},required=False)
              if not d: break
              rows=d.get("items") or []; final_items.extend(rows)
              nxt=d.get("cursor") or ""
              if not rows or not nxt or nxt==cur: break
              cur=nxt
          report["auto_action_disabled_remaining"]=sum(1 for x in final_items if not (x.get("price") or {}).get("auto_action_enabled"))
          report["auto_add_list_disabled_remaining"]=sum(1 for x in final_items if not (x.get("price") or {}).get("auto_add_to_ozon_actions_list_enabled"))
          if report["auto_action_disabled_remaining"] or report["auto_add_list_disabled_remaining"]:
              report["notes"].append(
                  "Ozon public ProductAPI requires declared_price to change these remaining switches; all affected products currently have no declared_price, so no arbitrary compensation value was written."
              )

          print("APPLY_REPORT",json.dumps(report,ensure_ascii=False,sort_keys=True),flush=True)
          PY
