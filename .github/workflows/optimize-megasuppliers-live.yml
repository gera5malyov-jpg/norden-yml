name: Optimize megasuppliers live

on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_megasuppliers_live.py'
      - '.github/workflows/optimize-megasuppliers-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Optimize plugin
        run: python3 scripts/optimize_megasuppliers_live.py
      - name: Save report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/megasuppliers-optimize-live.txt || echo "OPTIMIZE_STATUS=FAILED_NO_REPORT" > .deploy-probe/megasuppliers-optimize-live.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/megasuppliers-optimize-live.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save megasuppliers optimization report [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
