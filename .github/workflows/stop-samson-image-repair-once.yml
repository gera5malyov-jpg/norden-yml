name: Stop Samson image repair once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stop-samson-image-repair-once.yml'

permissions:
  contents: read

concurrency:
  group: repair-existing-samson-images-once
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stopping current Samson image repair before stock repair"
