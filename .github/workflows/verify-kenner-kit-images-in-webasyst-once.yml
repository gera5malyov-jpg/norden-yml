name: Verify Kenner KIT image links in Webasyst once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-kenner-kit-images-in-webasyst-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Verify control product summary
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'webasyst')
          from client import WebasystClient
          wa=WebasystClient(min_request_interval=0.4)
          payload=wa.call('shop.product.search',params={'hash':'type/203','limit':1000,'fields':'*,skus'})
          rows=payload.get('products') if isinstance(payload,dict) else payload
          if isinstance(rows,dict): rows=list(rows.values())
          target=None
          for product in rows or []:
              skus=product.get('skus') or {}
              if isinstance(skus,dict): skus=list(skus.values())
              if any(str(x.get('sku') or '').strip()=='334-326506' for x in skus or []):
                  target=product; break
          if not target: raise SystemExit('control SKU not found')
          info=wa.call('shop.product.getInfo',params={'id':target['id']})
          summary=str(info.get('summary') or '')
          urls=[line.strip() for line in summary.splitlines() if line.strip().startswith('http')]
          out={'product_id':target['id'],'url':info.get('url'),'summary_prefix':summary[:300],'image_urls':urls,'image_count':len(urls),'all_yandex':bool(urls) and all('avatars.mds.yandex.net/get-yastore/' in u for u in urls)}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['all_yandex']:
              raise SystemExit(2)
          PY