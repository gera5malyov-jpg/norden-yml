name: Komus KIT initial bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/komus-kit-bootstrap.yml'
  workflow_dispatch:
    inputs:
      skip_items:
        description: 'Source offer offset'
        required: true
        default: '0'
        type: string
      batch_new:
        description: 'New Komus products to create in this run'
        required: true
        default: '300'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: komus-kit-write
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt beautifulsoup4

      - name: Resolve continuation parameters
        id: params
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "offset=${{ inputs.skip_items }}" >> "$GITHUB_OUTPUT"
            echo "batch=${{ inputs.batch_new }}" >> "$GITHUB_OUTPUT"
          else
            echo "offset=0" >> "$GITHUB_OUTPUT"
            echo "batch=300" >> "$GITHUB_OUTPUT"
          fi

      - name: Create next missing Komus products
        env:
          KOMUS_LOGIN: ${{ secrets.KOMUS_LOGIN }}
          KOMUS_PASSWORD: ${{ secrets.KOMUS_PASSWORD }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          KOMUS_MAX_IMAGES: '1'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --new-only
            --skip-items "${{ steps.params.outputs.offset }}"
            --max-new "${{ steps.params.outputs.batch }}"
            --report /tmp/komus-bootstrap.json
          )
          PYTHONPATH=samson-kit python komus-kit/sync_komus_kit.py "${args[@]}"

      - name: Decide continuation
        id: next
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          path="/tmp/komus-bootstrap.json"
          if not os.path.exists(path):
              print("continue=false")
              raise SystemExit
          r=json.load(open(path,encoding="utf-8"))
          status=str(r.get("status") or "")
          errors=int(r.get("error_count") or 0)
          created=int(r.get("new_products_created") or 0)
          next_offset=int(r.get("next_offset") or 0)
          current=int("${{ steps.params.outputs.offset }}")
          batch=int("${{ steps.params.outputs.batch }}")
          image_failures=int(r.get("image_upload_failures") or 0)
          keep=(status=="ok" and next_offset>current and created>=batch and errors==0 and image_failures==0)
          print("continue="+("true" if keep else "false"))
          print("next_offset="+str(next_offset))
          print("created="+str(created))
          print("errors="+str(errors))
          print("image_failures="+str(image_failures))
          PY

      - name: Print compact report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          p="/tmp/komus-bootstrap.json"
          if not os.path.exists(p):
              raise SystemExit
          r=json.load(open(p,encoding="utf-8"))
          keys=("status","source_rows_seen","eligible_in_stock","existing_variants_seen","new_products_created","duplicate_kit_skus","image_upload_attempts","image_upload_success","image_upload_failures","error_count","warning_count","skip_items","next_offset")
          print(json.dumps({k:r.get(k) for k in keys},ensure_ascii=False,indent=2))
          if r.get("errors"):
              print(json.dumps(r["errors"][:20],ensure_ascii=False,indent=2))
          PY

      - name: Email Komus batch report to shop
        if: always()
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: bash
        run: |
          set +e
          kind="final"
          if [[ "${{ steps.next.outputs.continue }}" == "true" ]]; then
            kind="intermediate"
          fi
          python komus-kit/send_report_email.py \
            --report /tmp/komus-bootstrap.json \
            --kind "$kind" \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          rc=$?
          if [[ "$rc" != "0" ]]; then
            echo "::warning::Komus report email failed with exit code $rc"
          fi
          exit 0

      - name: Queue next Komus batch
        if: ${{ steps.next.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEXT_OFFSET: ${{ steps.next.outputs.next_offset }}
          BATCH_NEW: ${{ steps.params.outputs.batch }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url="https://api.github.com/repos/"+os.environ["REPO"]+"/actions/workflows/komus-kit-bootstrap.yml/dispatches"
          body=json.dumps({
              "ref":"main",
              "inputs":{
                  "skip_items":os.environ["NEXT_OFFSET"],
                  "batch_new":os.environ["BATCH_NEW"],
              },
          }).encode()
          req=urllib.request.Request(
              url,
              data=body,
              method="POST",
              headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "Content-Type":"application/json",
              },
          )
          with urllib.request.urlopen(req,timeout=30) as resp:
              if resp.status != 204:
                  raise RuntimeError("dispatch status "+str(resp.status))
          PY
