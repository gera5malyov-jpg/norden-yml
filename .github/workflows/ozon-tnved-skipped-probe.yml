name: Ozon TN VED skipped items diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-tnved-skipped-probe.yml'
      - 'ozon/tnved_skipped_probe.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect skipped TN VED products without modifications
        run: python ozon/tnved_skipped_probe.py
