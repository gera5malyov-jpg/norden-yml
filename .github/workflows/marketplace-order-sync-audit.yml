name: Marketplace order sync audit

on:
  push:
    paths:
      - 'scripts/marketplace_order_sync_audit.py'
      - '.github/workflows/marketplace-order-sync-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read-only marketplace/Webasyst audit
        env:
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python scripts/marketplace_order_sync_audit.py
      - name: Save sanitized audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace_order_sync_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save marketplace order sync audit"
          git push
