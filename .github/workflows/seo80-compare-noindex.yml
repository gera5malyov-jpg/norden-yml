name: SEO80 - Noindex comparison pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo80-compare-noindex.yml'
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/seo80_compare_noindex.py
      - name: Back up template and block technical comparison pages from indexing
        run: python storefront/seo80_compare_noindex.py
