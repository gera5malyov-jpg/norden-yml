name: Map91 - Remove embedded Yandex map
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map91-remove-yandex.yml'
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/map91_remove_yandex_embeds.py
      - name: Back up, remove map script from homepage, verify twelve live routes
        run: python storefront/map91_remove_yandex_embeds.py
