name: Install megasuppliers lazy thumbnails live

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install_megasuppliers_thumbs_live.py'
      - '.github/workflows/install-megasuppliers-thumbs-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lazy thumbnails
        run: python3 scripts/install_megasuppliers_thumbs_live.py
      - name: Save install report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/megasuppliers-thumbs-live.txt || echo "THUMB_INSTALL_STATUS=FAILED_NO_REPORT" > .deploy-probe/megasuppliers-thumbs-live.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/megasuppliers-thumbs-live.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save megasuppliers thumbnail install report [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || true
          fi
