name: HALT Norden automations 2026-09-29

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/halt-norden-automations-20260929.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  halt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cancel and disable every workflow related to Norden
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id,.name,.path,.state] | @tsv' \
            > /tmp/all-workflows.tsv

          : > /tmp/norden-paths.txt

          awk -F '\t' 'tolower($2 " " $3) ~ /norden/ {print $3}' /tmp/all-workflows.tsv \
            >> /tmp/norden-paths.txt

          grep -liE 'norden|NORDEN-100|NORDEN_SECRET|sync_norden|norden-kit|norden-yml' \
            .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null \
            | sed 's#^#/#' \
            >> /tmp/norden-paths.txt || true

          sort -u /tmp/norden-paths.txt -o /tmp/norden-paths.txt

          awk -F '\t' 'NR==FNR {wanted[$1]=1; next} ($3 in wanted) {print $0}' \
            /tmp/norden-paths.txt /tmp/all-workflows.tsv \
            > /tmp/norden-workflows.tsv

          echo "Matched Norden workflows:"
          cat /tmp/norden-workflows.tsv || true

          cut -f1 /tmp/norden-workflows.tsv | sort -u > /tmp/norden-workflow-ids.txt

          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending") | [.id,.workflow_id,.name,.status] | @tsv' \
            > /tmp/active-runs.tsv

          while IFS=$'\t' read -r run_id workflow_id run_name run_status; do
            [ -z "${run_id:-}" ] && continue
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              continue
            fi
            if grep -qx "$workflow_id" /tmp/norden-workflow-ids.txt; then
              echo "Cancel $run_id | $run_name | $run_status"
              gh api --method POST "repos/$REPO/actions/runs/$run_id/cancel" || true
            fi
          done < /tmp/active-runs.tsv

          while IFS=$'\t' read -r workflow_id workflow_name workflow_path workflow_state; do
            [ -z "${workflow_id:-}" ] && continue
            echo "Disable $workflow_id | $workflow_name | $workflow_path | $workflow_state"
            gh api --method PUT "repos/$REPO/actions/workflows/$workflow_id/disable" || true
          done < /tmp/norden-workflows.tsv

          gh api --paginate "repos/$REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id,.name,.path,.state] | @tsv' \
            > /tmp/workflows-after.tsv

          left=0
          while IFS= read -r workflow_id; do
            [ -z "${workflow_id:-}" ] && continue
            state="$(awk -F '\t' -v id="$workflow_id" '$1==id {print $4}' /tmp/workflows-after.tsv | head -n1)"
            if [ "$state" = "active" ]; then
              echo "STILL ACTIVE: $workflow_id"
              left=$((left+1))
            fi
          done < /tmp/norden-workflow-ids.txt

          echo "ACTIVE_NORDEN_WORKFLOWS=$left"
          test "$left" = "0"
