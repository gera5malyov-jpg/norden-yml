name: Probe KIT media URLs
on:
  push:
    paths:
      - 'catalog/probe_kit_media_urls_trigger.txt'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: python catalog/probe_kit_media_urls.py
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add catalog/kit_media_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Save KIT media URL probe"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
