name: Probe Norden seed match once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-norden-seed-match-once.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check seed against full Norden XML
        run: |
          python - <<'PY'
          import json, re, unicodedata, urllib.request, xml.etree.ElementTree as ET, os
          U='https://norden.group/index.php?dispatch=sw_user_prices.get_file&file=Norden.xml'
          data=urllib.request.urlopen(urllib.request.Request(U,headers={'User-Agent':'Mozilla/5.0'}),timeout=180).read()
          root=ET.fromstring(data)
          arts=[]
          for n in root.iter('Номенклатура'):
              a=(n.findtext('Артикул') or '').strip()
              if a: arts.append(a)
          conf=str.maketrans({'а':'a','в':'b','с':'c','е':'e','н':'h','к':'k','м':'m','о':'o','р':'p','т':'t','х':'x','у':'y','А':'a','В':'b','С':'c','Е':'e','Н':'h','К':'k','М':'m','О':'o','Р':'p','Т':'t','Х':'x','У':'y'})
          def norm(v):
              x=unicodedata.normalize('NFKC',str(v or '').strip()).translate(conf).casefold()
              return re.sub(r'[^0-9a-z]+','',x)
          bynorm={}
          for a in arts: bynorm.setdefault(norm(a),[]).append(a)
          seeds=[x.strip() for x in open('norden-kit/existing_norden_codes_seed.txt',encoding='utf-8') if x.strip()]
          resolved={}; unresolved=[]
          for code in seeds:
              n=norm(code); exact=bynorm.get(n,[])
              if len(exact)==1:
                  resolved[code]=exact[0]; continue
              if len(n)>=8:
                  pref=[a for a in arts if norm(a).startswith(n) or n.startswith(norm(a))]
                  if len(pref)==1:
                      resolved[code]=pref[0]; continue
              unresolved.append(code)
          rep={'seed_count':len(seeds),'source_articles':len(arts),'resolved':len(resolved),'unresolved':len(unresolved),'unresolved_sample':unresolved[:100]}
          os.makedirs('norden-kit',exist_ok=True)
          open('norden-kit/seed_match_probe.json','w',encoding='utf-8').write(json.dumps(rep,ensure_ascii=False,indent=2))
          print(json.dumps(rep,ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden-kit/seed_match_probe.json
          git commit -m "Probe Norden seed matching" || exit 0
          git pull --rebase
          git push
