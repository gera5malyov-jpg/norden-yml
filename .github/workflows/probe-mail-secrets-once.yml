name: Probe mail secret names once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mail-secrets-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_HOST: ${{ secrets.MAIL_HOST }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
      YANDEX_SMTP_USER: ${{ secrets.YANDEX_SMTP_USER }}
      YANDEX_SMTP_PASSWORD: ${{ secrets.YANDEX_SMTP_PASSWORD }}
      SHOP_EMAIL: ${{ secrets.SHOP_EMAIL }}
      SHOP_EMAIL_PASSWORD: ${{ secrets.SHOP_EMAIL_PASSWORD }}
      SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}
    steps:
      - name: Print configured secret names only
        shell: bash
        run: |
          python - <<'PY'
          import os
          names = [
            "SMTP_HOST","SMTP_PORT","SMTP_USER","SMTP_USERNAME","SMTP_PASSWORD","SMTP_PASS",
            "MAIL_HOST","MAIL_PORT","MAIL_USER","MAIL_USERNAME","MAIL_PASSWORD",
            "EMAIL_USER","EMAIL_PASSWORD",
            "GMAIL_USER","GMAIL_USERNAME","GMAIL_PASSWORD","GMAIL_APP_PASSWORD","GMAIL_APP_PASS",
            "YANDEX_SMTP_USER","YANDEX_SMTP_PASSWORD",
            "SHOP_EMAIL","SHOP_EMAIL_PASSWORD","SHOP_PASSWORD",
          ]
          present=[name for name in names if os.getenv(name)]
          print("CONFIGURED_MAIL_SECRET_NAMES=" + ",".join(present))
          PY
