name: Storefront Stage 20 - Footer contact email
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage20-footer-email.yml'
permissions:
  contents: read
concurrency:
  group: storefront-footer-menu
  cancel-in-progress: false
jobs:
  footer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile storefront/stage20_footer_email.py
      - name: Correct footer email link and preserve all other menu items
        run: python3 storefront/stage20_footer_email.py
