name: Ozon TNVED finish all remaining
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-tnved-finish-remaining-all-20261030.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ozon-tnved-finish-remaining-20261030
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify remaining Ozon items, update TNVED only, verify all writes
        run: |
          python ozon/tnved_finish_remaining_20261030.py
      - name: Save audit to GitHub
        if: always()
        run: |
          test -f ozon/tnved_finish_remaining_report_20261030.json || echo '{"error":"script failed before creating report"}' > ozon/tnved_finish_remaining_report_20261030.json
          cp ozon/tnved_finish_remaining_report_20261030.json /tmp/ozon-result.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ozon-result.json ozon/tnved_finish_remaining_report_20261030.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ozon/tnved_finish_remaining_report_20261030.json
          git diff --cached --quiet || (git commit -m 'Record final Ozon TNVED bulk classification results' && git push)
