name: Probe Kenner KIT media once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kenner-kit-media-once.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe Kenner media
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,time,requests
          H={'Authorization':'Bearer '+os.environ['YANDEX_KIT_TOKEN'],'Accept':'application/json'}
          def get(path,params=None):
              for i in range(12):
                  r=requests.get('https://api.kit.yandex.net'+path,headers=H,params=params,timeout=60)
                  if r.status_code==429:
                      time.sleep(float(r.headers.get('Retry-After') or 3)); continue
                  r.raise_for_status(); return r.json()
              raise RuntimeError('retry exhausted')
          chars=get('/v1/characteristics',{'status':'ACTIVE','page':1,'per_page':1000})
          rows=chars.get('characteristics') or chars.get('items') or []
          web=[x for x in rows if str(x.get('title') or '').strip().casefold()=='webasyst']
          if not web: raise SystemExit('Webasyst characteristic not found')
          cid=str(web[0]['id'])
          found=[]
          for page in range(1,8):
              p=get('/v1/variants',{'page':page,'per_page':100})
              vs=p.get('variants') or p.get('items') or []
              for v in vs:
                  val=''
                  for c in v.get('characteristics') or []:
                      if str(c.get('characteristic_id'))==cid:
                          vals=c.get('values') or []; val=str(c.get('value') or (vals[0] if vals else '')).strip()
                          break
                  if val=='334':
                      d=get('/v1/variants/'+str(v['id']))
                      found.append({'id':d.get('id'),'kit_id':d.get('kit_id'),'sku':d.get('sku'),'name':d.get('name'),'media':d.get('media') or []})
                      if len(found)>=3: break
              if len(found)>=3: break
          out={'webasyst_characteristic_id':cid,'samples':found}
          os.makedirs('kenner-kit',exist_ok=True)
          open('kenner-kit/media_probe.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add kenner-kit/media_probe.json
          git commit -m 'Probe Kenner KIT media' || exit 0
          git pull --rebase || true
          git push || true