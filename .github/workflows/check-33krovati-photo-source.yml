name: Compare 33krovati photo source and codes
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/check-33krovati-photo-source.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/check_33krovati_external_photo_feed.py
