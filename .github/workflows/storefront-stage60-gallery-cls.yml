name: Stage 60 - Mobile gallery CLS stabilization
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage60-gallery-cls.yml'
      - 'storefront/apply_mobile_gallery_cls_20261019.py'
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate guarded patch
        run: python -m py_compile storefront/apply_mobile_gallery_cls_20261019.py
      - name: Back up template, stabilize mobile gallery, verify ten storefront pages
        run: python storefront/apply_mobile_gallery_cls_20261019.py
