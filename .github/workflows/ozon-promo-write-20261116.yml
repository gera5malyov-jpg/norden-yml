name: Nov 16 Ozon add eligible and remove below floor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-promo-write-20261116.yml'
permissions:
  contents: read
concurrency:
  group: ozon-nov16-promo-changes
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      DRY_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply price-floor-safe Ozon action updates and read back
        run: python ozon/promo_v2_reconcile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promo-nov16-write-and-audit
          path: ozon/promo_v2_reconcile_report.json
          retention-days: 14
