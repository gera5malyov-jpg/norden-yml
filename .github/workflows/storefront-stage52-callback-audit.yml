name: Storefront Stage 52 - Callback template inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage52-callback-audit.yml'
      - 'storefront/stage52_callback_source_audit.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/stage52_callback_source_audit.py
      - run: python storefront/stage52_callback_source_audit.py
