name: Probe three new marketplace cards
on:
  push:
    paths: ['catalog/probe_three_marketplace_cards_trigger.txt']
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
        run: python catalog/probe_three_marketplace_cards.py
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add catalog/three_marketplace_existence_probe.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save three marketplace existence probe"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
