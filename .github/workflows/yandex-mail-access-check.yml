name: Yandex mail access check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/yandex-mail-access-check.yml'

permissions:
  contents: read

jobs:
  check-imap:
    runs-on: ubuntu-latest
    steps:
      - name: Check Yandex IMAP access
        env:
          YANDEX_MAIL_LOGIN: ${{ secrets.YANDEX_MAIL_LOGIN }}
          YANDEX_MAIL_PASSWORD: ${{ secrets.YANDEX_MAIL_PASSWORD }}
        run: |
          python3 - <<'PY'
          import imaplib, os, sys

          login = os.environ.get("YANDEX_MAIL_LOGIN", "")
          password = os.environ.get("YANDEX_MAIL_PASSWORD", "")
          if not login or not password:
              print("RESULT=ERROR")
              print("DETAIL=Missing YANDEX_MAIL_LOGIN or YANDEX_MAIL_PASSWORD secret")
              sys.exit(2)

          hosts = ["imap.yandex.ru", "imap.yandex.com"]
          last_error = None
          for host in hosts:
              try:
                  imap = imaplib.IMAP4_SSL(host, 993, timeout=20)
                  imap.login(login, password)
                  typ, data = imap.select("INBOX", readonly=True)
                  if typ != "OK":
                      raise RuntimeError("INBOX select failed")
                  total = int(data[0] or 0)
                  typ, ids = imap.search(None, "ALL")
                  if typ != "OK":
                      raise RuntimeError("SEARCH failed")
                  msg_ids = ids[0].split() if ids and ids[0] else []
                  fetch_ok = False
                  header_bytes = 0
                  if msg_ids:
                      typ, fetched = imap.fetch(msg_ids[-1], "(BODY.PEEK[HEADER.FIELDS (SUBJECT FROM DATE)])")
                      fetch_ok = typ == "OK"
                      if fetch_ok and fetched:
                          for part in fetched:
                              if isinstance(part, tuple) and isinstance(part[1], (bytes, bytearray)):
                                  header_bytes += len(part[1])
                  imap.logout()
                  print("RESULT=OK")
                  print(f"HOST={host}")
                  print(f"INBOX_MESSAGES={total}")
                  print(f"SEARCH_IDS={len(msg_ids)}")
                  print(f"LATEST_HEADER_READ={'YES' if fetch_ok else 'NO'}")
                  print(f"LATEST_HEADER_BYTES={header_bytes}")
                  sys.exit(0)
              except Exception as e:
                  last_error = f"{type(e).__name__}: {e}"
                  print(f"HOST_FAILED={host} ({type(e).__name__})")

          print("RESULT=ERROR")
          print(f"DETAIL={last_error}")
          sys.exit(1)
          PY
