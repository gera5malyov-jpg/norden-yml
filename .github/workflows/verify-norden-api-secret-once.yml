name: Verify Norden API secret once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-norden-api-secret-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Norden API access
        env:
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          secret=os.environ['NORDEN_SECRET']
          headers={'secret':secret,'Accept':'application/json'}

          def get(url):
              req=urllib.request.Request(url,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      body=r.read().decode('utf-8')
                      return {'status':r.status,'json':json.loads(body)}
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  return {'status':e.code,'body':body[:1000]}

          out={}
          out['products_page1']=get('https://norden.group/api-products/?page=1')
          out['sku_RT_2031']=get('https://norden.group/api-products/?'+urllib.parse.urlencode({'sku':'RT-2031'}))
          out['categories']=get('https://norden.group/api-categories/')

          # Reduce committed result to non-sensitive summary/sample.
          summary={}
          p=out['products_page1']
          summary['products_page1_status']=p.get('status')
          if p.get('status')==200 and isinstance(p.get('json'),dict):
              j=p['json']
              rows=j.get('products') or []
              summary['products_page1_count']=len(rows)
              summary['page_data']=j.get('page_data')
              if rows:
                  r=rows[0]
                  summary['first_product_fields']=sorted(r.keys())
                  summary['first_product_sample']={k:r.get(k) for k in ('Kod','product_code','name','price','price_rrc','qty','category')}

          s=out['sku_RT_2031']
          summary['sku_RT_2031_status']=s.get('status')
          if s.get('status')==200 and isinstance(s.get('json'),dict):
              rows=s['json'].get('products') or []
              summary['sku_RT_2031_count']=len(rows)
              summary['sku_RT_2031_products']=[
                  {k:r.get(k) for k in ('Kod','product_code','name','price','price_rrc','qty','category')}
                  for r in rows[:10]
              ]

          c=out['categories']
          summary['categories_status']=c.get('status')
          if c.get('status')==200 and isinstance(c.get('json'),list):
              summary['categories_count']=len(c['json'])
              summary['categories_sample']=c['json'][:5]

          os.makedirs('norden-kit',exist_ok=True)
          with open('norden-kit/norden_api_secret_check.json','w',encoding='utf-8') as f:
              json.dump(summary,f,ensure_ascii=False,indent=2)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if summary.get('products_page1_status') != 200 or summary.get('sku_RT_2031_status') != 200:
              raise SystemExit(2)
          PY
      - name: Commit verification result
        if: always()
        run: |
          if [ -f norden-kit/norden_api_secret_check.json ]; then
            git config user.name github-actions
            git config user.email actions@github.com
            git add norden-kit/norden_api_secret_check.json
            git commit -m "Verify Norden API secret" || exit 0
            git pull --rebase
            git push
          fi
