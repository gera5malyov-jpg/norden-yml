name: Backfill Webasyst suppliers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_megasuppliers_existing.py'
      - '.github/workflows/backfill-megasuppliers-existing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Backfill existing supplier assignments
        run: python3 scripts/backfill_megasuppliers_existing.py
      - name: Save report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/megasuppliers-backfill.txt || echo "BACKFILL_REPORT_MISSING" > .deploy-probe/megasuppliers-backfill.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/megasuppliers-backfill.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save supplier backfill report [skip ci]"
            git push origin HEAD:main || true
          fi

# trigger supplier backfill
