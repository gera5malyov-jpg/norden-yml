name: Diagnose universal importer profiles
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/diagnose-universal-photo-profiles.yml]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
      UNIVERSAL_PROFILE_IDS: '17,31'
      UNIVERSAL_APPLY: '0'
      UNIVERSAL_STRICT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/run_universal_ymlpro_photos.py
