name: Storefront Stage 33 - SEO description accuracy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage33-seo-description-fix.yml'
      - 'storefront/stage33_fix_seo_descriptions.py'
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate targeted SEO changes
        run: python -m py_compile storefront/stage33_fix_seo_descriptions.py
      - name: Back up site, fix descriptions, test live, rollback on error
        run: python storefront/stage33_fix_seo_descriptions.py
