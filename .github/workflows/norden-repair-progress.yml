name: Probe Norden repair progress

on:
  push:
    branches: [main]
    paths:
      - 'baserow/probe_norden_repair_progress_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
      BASEROW_URL: http://147.78.67.6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Count repaired Norden rows
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base=os.environ["BASEROW_URL"].rstrip("/")
          token=os.environ["BASEROW_DATABASE_TOKEN"]
          headers={"Authorization":"Token "+token,"Accept":"application/json"}
          def get(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)
          supplier_rows=[]
          page=1
          while True:
              d=get(f"/api/database/rows/table/157/?user_field_names=true&size=200&page={page}")
              supplier_rows.extend(d.get("results",[]))
              if not d.get("next"): break
              page+=1
          sid=None
          for r in supplier_rows:
              if str(r.get("Поставщик") or "").strip().casefold()=="norden":
                  sid=int(r["id"]); break
          rows=[]
          page=1
          while True:
              d=get(f"/api/database/rows/table/156/?user_field_names=true&size=200&page={page}")
              rows.extend(d.get("results",[]))
              if not d.get("next"): break
              page+=1
          def is_norden(row):
              for x in row.get("Поставщик") or []:
                  if isinstance(x,dict) and int(x.get("id") or 0)==sid:
                      return True
              return False
          scoped=[r for r in rows if int(r.get("id") or 0)>=667 and is_norden(r)]
          image_file=[r for r in scoped if r.get("Первое изображение")]
          image_url=[r for r in scoped if str(r.get("Первое изображение URL") or "").strip()]
          all_images=[r for r in scoped if str(r.get("Все изображения") or "").strip()]
          code=[r for r in scoped if str(r.get("Код Norden") or "").strip()]
          missing=[{
              "row_id":r.get("id"),
              "article":r.get("Наименование артикула") or r.get("Артикул"),
              "name":r.get("Название")
          } for r in scoped if not r.get("Первое изображение")][:25]
          out={
              "supplier_id":sid,
              "scoped_rows":len(scoped),
              "with_first_image_file":len(image_file),
              "with_first_image_url":len(image_url),
              "with_all_images":len(all_images),
              "with_norden_code":len(code),
              "missing_first_image_file":len(scoped)-len(image_file),
              "missing_first_image_sample":missing,
          }
          with open("baserow/norden_repair_progress_report.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2); f.write("\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Save progress probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baserow/norden_repair_progress_report.json
          git commit -m "Save Norden repair progress probe" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
