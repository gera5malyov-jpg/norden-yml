name: Archive Norden chair stool duplicates after audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: norden-chairs-stools-archive
  cancel-in-progress: true

jobs:
  archive:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Validate archive scripts
        run: python -m py_compile norden-kit/sync_norden_kit.py norden-kit/archive_norden_chairs_stools_duplicates.py norden-kit/audit_norden_chairs_stools_duplicates.py

      - name: Archive live-verified Norden chairs stools duplicates
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
        run: python norden-kit/archive_norden_chairs_stools_duplicates.py

      - name: Verify chairs stools duplicates after archive
        if: always()
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
        run: python norden-kit/audit_norden_chairs_stools_duplicates.py

      - name: Save archive and verification reports
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden-kit/norden_chairs_stools_archive_report.json norden-kit/norden_chairs_stools_duplicate_audit.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Archive Norden chairs stools duplicates and verify"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
