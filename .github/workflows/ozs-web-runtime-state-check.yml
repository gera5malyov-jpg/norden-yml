name: Ozon commission web-user cache audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozs-web-runtime-state-check.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 scripts/ozs_web_runtime_readonly.py
      - name: Persist result
        if: always()
        run: |
          mkdir -p .deploy-probe
          test -f .deploy-probe/ozs-web-runtime-readonly.txt || echo 'AUDIT_NOT_FINISHED' > .deploy-probe/ozs-web-runtime-readonly.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/ozs-web-runtime-readonly.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save Webasyst commission cache state [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
