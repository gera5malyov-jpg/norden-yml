name: Storefront Stage 53 - Read-only conversion source snapshot
on:
  push:
    branches: [main]
    paths:
      - 'storefront/stage53_readonly_snapshot.py'
      - '.github/workflows/storefront-stage53-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python storefront/stage53_readonly_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-stage53-snapshot
          path: storefront-stage53-snapshot/
          retention-days: 7
