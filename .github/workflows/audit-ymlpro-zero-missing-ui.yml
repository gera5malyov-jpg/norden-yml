name: Audit YML PRO missing product settings
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: ['.github/workflows/audit-ymlpro-zero-missing-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/audit_ymlpro_zero_missing_ui.py
