name: Check megasuppliers final

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_megasuppliers_final.py'
      - '.github/workflows/check-megasuppliers-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Final check
        run: python3 scripts/check_megasuppliers_final.py
      - name: Save final check report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/megasuppliers-final-check.txt || echo "FINAL_CHECK=FAILED_NO_REPORT" > .deploy-probe/megasuppliers-final-check.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/megasuppliers-final-check.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save megasuppliers final check [skip ci]"
            git push origin HEAD:main || true
          fi
