name: Storefront Stage 43 - Purchase block browser check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage43-browser-check.yml'
      - 'storefront/stage43_purchase_info_browser_check.py'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - name: Check mobile and desktop purchase copy and callback without submitting
        run: python storefront/stage43_purchase_info_browser_check.py
