name: Etazherka YML source diagnostic
on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose_etazherka_source.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect source metadata only
        run: python3 -u scripts/diagnose_etazherka_source.py
