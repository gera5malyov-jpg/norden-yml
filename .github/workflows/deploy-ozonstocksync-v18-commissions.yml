name: Deploy Ozon 1.8.0 commissions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ozonstocksync-v18-commissions.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Lint and package the plugin
        shell: bash
        run: |
          set -euo pipefail
          find webasyst/ozonstocksync -type f -name '*.php' -print0 | while IFS= read -r -d '' f; do php -l "$f"; done
          python3 -m py_compile scripts/deploy_ozonstocksync_v18.py
          tar -czf /tmp/ozonstocksync-v18.tgz -C webasyst/ozonstocksync .
      - name: Deploy with backup, smoke test and daily schedule
        run: python3 scripts/deploy_ozonstocksync_v18.py
      - name: Save deployment report
        if: always()
        run: |
          mkdir -p .deploy-probe
          test -f .deploy-probe/ozonstocksync-v18-deploy.txt || echo 'DEPLOY_STATUS=FAILED_NO_REPORT' > .deploy-probe/ozonstocksync-v18-deploy.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/ozonstocksync-v18-deploy.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save ozonstocksync v1.8.0 installation report [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
