name: Ozon one child chair audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozs-child-chair-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Read single Webasyst type and cross-check Ozon offers
        run: python3 scripts/diagnose_child_chair_ozs.py
      - name: Save diagnostic report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/ozs-child-chair-offer-audit.txt || echo 'AUDIT_FAILED' > .deploy-probe/ozs-child-chair-offer-audit.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/ozs-child-chair-offer-audit.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record child chair Ozon offer linkage audit [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
