name: ТД Андрей — ежедневное обновление KIT + Webasyst

on:
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tdandrey-kit-write
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить payload
        run: python tdandrey-kit/loader.py --help >/dev/null
      - name: Обновить цены и остатки
        env:
          TDANDREY_EXPORT_URL: ${{ secrets.TDANDREY_EXPORT_URL }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          TDANDREY_WEBASYST_WRITE_DELAY: '0.45'
        run: python tdandrey-kit/loader.py --mode daily --max-new 300
      - name: Сохранить mapping и отчёт
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email actions@github.com
          mkdir -p /tmp/tdandrey-state
          cp tdandrey-kit/kit_mapping.json /tmp/tdandrey-state/kit_mapping.json 2>/dev/null || true
          cp tdandrey-kit/last_sync_report.json /tmp/tdandrey-state/last_sync_report.json 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/tdandrey-state/kit_mapping.json tdandrey-kit/kit_mapping.json 2>/dev/null || true
          cp /tmp/tdandrey-state/last_sync_report.json tdandrey-kit/last_sync_report.json 2>/dev/null || true
          git add tdandrey-kit/kit_mapping.json tdandrey-kit/last_sync_report.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Обновить ежедневный отчёт ТД Андрей'
          git push origin HEAD:main || true
