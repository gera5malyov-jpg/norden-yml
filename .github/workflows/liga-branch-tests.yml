name: Liga branch tests

on:
  push:
    branches:
      - feat/liga-kit-sync
    paths:
      - 'liga-kit/**'
      - '.github/workflows/liga-kit-sync.yml'
      - '.github/workflows/liga-branch-tests.yml'

permissions:
  contents: read

concurrency:
  group: liga-branch-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Samson regression suite
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
      - name: Liga test suite
        shell: bash
        run: |
          if [[ -d liga-kit/tests ]]; then
            PYTHONPATH=liga-kit python -m unittest discover -s liga-kit/tests -v
          else
            echo "Liga tests not created yet"
          fi
      - name: Validate permanent Liga workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/liga-kit-sync.yml').read_text(encoding='utf-8')
          assert "cron: '0 7 * * 1'" in text
          assert 'liga-kit' in text
          assert 'YANDEX_KIT_TOKEN' in text
          assert 'SAMSON_API_KEY' not in text
          assert "default: true" in text
          assert "default: '20'" in text
          print('OK')
          PY
