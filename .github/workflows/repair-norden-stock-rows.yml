name: Repair current Norden stock rows

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_norden_stock_rows.py'
      - '.github/workflows/repair-norden-stock-rows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair explicit stock rows
        run: python3 scripts/repair_norden_stock_rows.py
      - name: Show report
        run: cat .deploy-probe/norden-stock-repair.txt
      - name: Save report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/norden-stock-repair.txt || echo "REPAIR_STATUS=FAILED_NO_REPORT" > .deploy-probe/norden-stock-repair.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/norden-stock-repair.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save Norden stock repair report [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
