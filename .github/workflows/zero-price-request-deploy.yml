name: Storefront - zero price on request
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zero-price-request-deploy.yml'
      - 'storefront/zero_price_request_deploy.py'
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  guarded-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deploy script syntax
        run: python3 -m py_compile storefront/zero_price_request_deploy.py
      - name: Back up active themes, replace zero pricing with quote request and smoke test
        run: python3 storefront/zero_price_request_deploy.py
