name: Perf67 - Read-only MariaDB socket access probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf67-admin-probe.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python storefront/perf67_admin_probe_readonly.py
