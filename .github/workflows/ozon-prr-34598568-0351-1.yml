name: Probe Ozon PRR 34598568-0351-1
on:
  push:
    paths:
      - '.github/workflows/ozon-prr-34598568-0351-1.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python scripts/probe_ozon_prr_34598568_0351_1.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add dalli/order_34598568-0351-1_prr_option.json || true
          git diff --cached --quiet || git commit -m "Store Ozon PRR 34598568-0351-1"
          git push
