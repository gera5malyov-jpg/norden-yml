          $result=array();
          foreach ($rows as $r) {
            $urls=array();preg_match_all('~https?://[^\s\[\]<>]+~u',(string)$r['summary'],$mm);
            $imageCount=(int)$m->query("SELECT COUNT(*) FROM shop_product_images WHERE product_id=".(int)$r['id'])->fetchField();
            $result[]=array('product_id'=>$r['id'],'name'=>$r['name'],'url'=>$r['url'],'status'=>$r['status'],'sku'=>$r['sku'],'sku_name'=>$r['sku_name'],'image_id'=>$r['image_id'],'image_count'=>$imageCount,'summary_size'=>strlen($r['summary']),'extimg_blocks'=>substr_count($r['summary'],'[extimg]'),'external_urls'=>count($mm[0]),'first_url'=>isset($mm[0][0])?$mm[0][0]:null);
