name: Probe 4s product brand HTML

on:
  push:
    branches: [main]
    paths:
      - '4s-kit/probe_product_brand_html.py'
      - '.github/workflows/probe-4s-product-brand-html-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 lxml
      - run: python 4s-kit/probe_product_brand_html.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 4s-kit/product_brand_html_probe.json
          git commit -m "Probe 4s product brand HTML" || exit 0
          git pull --rebase origin main
          git push
