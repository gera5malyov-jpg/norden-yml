name: Diagnose Corfu image redirects
on:
  push:
    paths: ['catalog/diag_corfu_redirects_trigger.txt']
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python catalog/diag_corfu_redirects.py
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add catalog/corfu_redirect_diag.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Corfu redirect diagnostic"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
