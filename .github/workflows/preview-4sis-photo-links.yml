name: Preview 4sis external photo links
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/preview-4sis-photo-links.yml]
permissions:
  contents: read
concurrency:
  group: webasyst-yml-photo-companion
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
      UNIVERSAL_PROFILE_IDS: '19'
      UNIVERSAL_APPLY: '0'
      UNIVERSAL_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/run_universal_ymlpro_photos.py
