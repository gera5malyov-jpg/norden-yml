name: Ozon AF-31646769 finish enable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-af31646769-finish-enable.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install requests
        run: python -m pip install requests
      - name: Finish Ozon enablement
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, requests, sys
          OFFER="AF-31646769"
          BASE="https://api-seller.ozon.ru"
          H={"Client-Id":os.environ["OZON_CLIENT_ID"],"Api-Key":os.environ["OZON_API_KEY"],"Content-Type":"application/json"}
          S=requests.Session();S.headers.update(H)
          def call(method,path,body=None):
              for a in range(8):
                  r=S.request(method,BASE+path,json=body,timeout=60)
                  print("HTTP",method,path,r.status_code)
                  if r.status_code==429:
                      time.sleep(1+a);continue
                  if r.status_code>=500:
                      time.sleep(1+a);continue
                  try:d=r.json() if r.content else {}
                  except Exception:d={"raw":r.text}
                  if r.status_code>=400: print("ERROR",json.dumps(d,ensure_ascii=False))
                  return d,r
              return None,r

          d,r=call("POST","/v5/product/info/prices",{"cursor":"","filter":{"offer_id":[OFFER],"visibility":"ALL"},"limit":100})
          it=(d or {}).get("items") or []
          if not it: raise SystemExit("not found")
          p=it[0]["price"]
          base={
              "offer_id":OFFER,
              "price":str(p.get("price")),
              "old_price":str(p.get("old_price")),
              "min_price":str(p.get("min_price")),
              "auto_action_enabled":"ENABLED",
              "auto_add_to_ozon_actions_list_enabled":"ENABLED",
              "min_price_for_auto_actions_enabled":True,
              "price_strategy_enabled":"ENABLED",
              "manage_elastic_boosting_through_price":True,
          }
          attempts=[
              ("declared_price_string",{**base,"declared_price":str(p.get("price"))}),
              ("declared_price_object",{**base,"declared_price":{"amount":str(p.get("price")),"currency":"RUB"}}),
          ]
          success=False
          for label,item in attempts:
              res,rr=call("POST","/v1/product/import/prices",{"prices":[item]})
              print("ATTEMPT",label,json.dumps(res,ensure_ascii=False,sort_keys=True))
              rows=(res or {}).get("result") or []
              if rows and rows[0].get("updated") is True:
                  success=True
                  print("SUCCESS_SHAPE",label)
                  break
          if not success:
              raise SystemExit("Could not enable remaining product-level tools")

          time.sleep(3)
          d2,_=call("POST","/v5/product/info/prices",{"cursor":"","filter":{"offer_id":[OFFER],"visibility":"ALL"},"limit":100})
          print("VERIFY",json.dumps(((d2 or {}).get("items") or [{}])[0],ensure_ascii=False,sort_keys=True))
          PY
