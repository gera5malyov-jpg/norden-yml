name: Diagnose megasuppliers bridge

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_megasuppliers_bridge.py'
      - '.github/workflows/diagnose-megasuppliers-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
      MEGASUPPLIERS_CALLBACK_SECRET: ${{ secrets.MEGASUPPLIERS_CALLBACK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose live bridge
        run: python3 scripts/diagnose_megasuppliers_bridge.py
      - name: Save diagnostic report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/megasuppliers-bridge-diagnostic.txt || echo "DIAGNOSTIC=FAILED_NO_REPORT" > .deploy-probe/megasuppliers-bridge-diagnostic.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/megasuppliers-bridge-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save megasuppliers bridge diagnostic [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
