name: Stop obsolete Riva load

on:
  push:
    branches:
      - feat/riva-kit-sync
    paths:
      - '.github/workflows/stop-obsolete-riva-load.yml'

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel old Riva import run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -L             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/runs/35345114180/cancel"
