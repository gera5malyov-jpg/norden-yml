name: Verify Yandex order 61653679298
# verify normalized buyer and deadline
# verify populated shipping interval
# diagnose current workflow state
# verify final persisted deadline

on:
  push:
    paths:
      - '.github/workflows/yandex-order-61653679298-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить заказ без вывода персональных данных
        env:
          TARGET_EXTERNAL_ID: '61653679298'
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python scripts/yandex_order_verify.py
