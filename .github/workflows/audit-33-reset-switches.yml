name: Audit 33krovati reset switches
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: ['.github/workflows/audit-33-reset-switches.yml']
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/audit_yml289_reset_switches_ui.py
