name: Probe Ozon IDs 31663537 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-ozon-ids-31663537-once.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe offer id vs Ozon SKU
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          h={"Client-Id":os.environ["OZON_CLIENT_ID"],"Api-Key":os.environ["OZON_API_KEY"],"Content-Type":"application/json"}
          def post(path,body):
              req=urllib.request.Request("https://api-seller.ozon.ru"+path,data=json.dumps(body).encode(),headers=h,method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      print(path,"HTTP",r.status,r.read().decode())
              except Exception as e:
                  if hasattr(e,"code"):
                      print(path,"HTTP",e.code,e.read().decode())
                  else:
                      print(path,"ERROR",repr(e))
          post("/v3/product/list",{"filter":{"offer_id":["31663537"],"visibility":"ALL"},"limit":1000})
          post("/v3/product/info/list",{"sku":["31663537"]})
          PY
