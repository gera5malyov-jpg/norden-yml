name: Probe Norden Ozon required attributes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-ozon-ids-31663537-once.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe category dictionaries
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          h={"Client-Id":os.environ["OZON_CLIENT_ID"],"Api-Key":os.environ["OZON_API_KEY"],"Content-Type":"application/json"}
          def post(path,body):
              req=urllib.request.Request("https://api-seller.ozon.ru"+path,data=json.dumps(body).encode(),headers=h,method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      data=json.loads(r.read().decode())
                      print(path, json.dumps(data,ensure_ascii=False))
                      return data
              except urllib.error.HTTPError as e:
                  print(path,"HTTP",e.code,e.read().decode())
          base={"description_category_id":79164512,"type_id":95041}
          post("/v1/description-category/attribute",{**base,"language":"RU"})
          post("/v1/description-category/attribute/values/search",{**base,"attribute_id":22232,"limit":100,"value":"9401"})
          post("/v1/description-category/attribute/values",{**base,"attribute_id":22232,"limit":2000,"last_value_id":0,"language":"RU"})
          PY
