name: Diagnose megasuppliers UI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_megasuppliers_ui.py'
      - '.github/workflows/diagnose-megasuppliers-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Diagnose
        run: |
          python3 scripts/diagnose_megasuppliers_ui.py
          cat .deploy-probe/megasuppliers-ui-diagnostic.txt
      - name: Save report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/megasuppliers-ui-diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save megasuppliers UI diagnostic [skip ci]"
            git push origin HEAD:main || true
          fi
