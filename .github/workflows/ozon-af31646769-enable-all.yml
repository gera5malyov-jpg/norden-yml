name: Ozon AF-31646769 enable all tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-af31646769-enable-all.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install requests
        run: python -m pip install requests
      - name: Enable Ozon tools and activate promo
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, requests, sys

          OFFER="AF-31646769"
          ACTION_ID=1977747
          ACTION_PRICE=29871.0
          BASE="https://api-seller.ozon.ru"
          H={
              "Client-Id": os.environ["OZON_CLIENT_ID"],
              "Api-Key": os.environ["OZON_API_KEY"],
              "Content-Type": "application/json",
          }
          S=requests.Session(); S.headers.update(H)

          def call(method,path,body=None):
              for a in range(10):
                  r=S.request(method,BASE+path,json=body,timeout=60)
                  print("HTTP",method,path,r.status_code)
                  if r.status_code==429:
                      time.sleep(float(r.headers.get("Retry-After") or min(10,1+a))); continue
                  if r.status_code>=500:
                      time.sleep(min(10,1+a)); continue
                  if r.status_code>=400:
                      print("ERROR",path,r.text[:3000])
                      return None,r
                  try: return (r.json() if r.content else {}),r
                  except Exception: return {"raw":r.text},r
              return None,r

          # 1) Read current product state, preserving all current price values.
          data,r=call("POST","/v5/product/info/prices",{
              "cursor":"",
              "filter":{"offer_id":[OFFER],"visibility":"ALL"},
              "limit":100,
          })
          items=(data or {}).get("items") or []
          if not items:
              raise SystemExit("Product not found")
          item=items[0]
          pid=int(item["product_id"])
          p=item.get("price") or {}
          print("BEFORE",json.dumps({
              "offer_id":item.get("offer_id"),
              "product_id":pid,
              "price":p,
              "marketing_actions":item.get("marketing_actions"),
          },ensure_ascii=False,sort_keys=True))

          # 2) Enable every product-level price/promo automation exposed by ProductAPI_ImportProductsPrices.
          payload={
              "prices":[{
                  "offer_id": OFFER,
                  "price": str(p.get("price") or 32120),
                  "old_price": str(p.get("old_price") or 48180),
                  "min_price": str(p.get("min_price") or 30779),
                  "auto_action_enabled":"ENABLED",
                  "auto_add_to_ozon_actions_list_enabled":"ENABLED",
                  "min_price_for_auto_actions_enabled": True,
                  "price_strategy_enabled":"ENABLED",
                  "manage_elastic_boosting_through_price": True
              }]
          }
          upd,rr=call("POST","/v1/product/import/prices",payload)
          print("IMPORT_PRICES_RESULT",json.dumps(upd,ensure_ascii=False,sort_keys=True))
          if rr.status_code>=400:
              raise SystemExit("Failed to enable product price/promo tools")

          # 3) Renew the min-price timer (the UI says it otherwise expires).
          timer,tr=call("POST","/v1/product/action/timer/update",{"product_ids":[str(pid)]})
          print("TIMER_UPDATE_RESULT",json.dumps(timer,ensure_ascii=False,sort_keys=True))
          if tr.status_code>=400:
              raise SystemExit("Failed to renew min price timer")

          # 4) Add to Elastic Boosting at the confirmed price.
          act,ar=call("POST","/v1/actions/products/activate",{
              "action_id": ACTION_ID,
              "products":[{"product_id":pid,"action_price":ACTION_PRICE}]
          })
          print("ACTIVATE_RESULT",json.dumps(act,ensure_ascii=False,sort_keys=True))
          if ar.status_code>=400:
              raise SystemExit("Failed to activate Elastic Boosting")

          # 5) Verify all relevant flags and timer.
          time.sleep(3)
          after,_=call("POST","/v5/product/info/prices",{
              "cursor":"",
              "filter":{"offer_id":[OFFER],"visibility":"ALL"},
              "limit":100,
          })
          aitems=(after or {}).get("items") or []
          print("AFTER",json.dumps(aitems[0] if aitems else {},ensure_ascii=False,sort_keys=True))

          ts,_=call("POST","/v1/product/action/timer/status",{"product_ids":[str(pid)]})
          print("TIMER_STATUS",json.dumps(ts,ensure_ascii=False,sort_keys=True))

          prods,_=call("POST","/v1/actions/products",{"action_id":ACTION_ID,"limit":1000,"offset":0})
          plist=((prods or {}).get("result") or {}).get("products") or []
          mine=[x for x in plist if str(x.get("id") or x.get("product_id") or "")==str(pid)]
          print("PROMO_MEMBERSHIP",json.dumps(mine,ensure_ascii=False,sort_keys=True))
          PY
