name: Analyze Riva identifiers

on:
  push:
    branches:
      - feat/riva-kit-sync
    paths:
      - '.github/workflows/riva-analyze-identifiers.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RIVA_FEED_URL: ${{ secrets.RIVA_FEED_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze Riva identifiers and stock
        shell: bash
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import xml.etree.ElementTree as ET
          from collections import Counter

          url = os.environ.get('RIVA_FEED_URL','').strip()
          if not url:
              raise SystemExit('RIVA_FEED_URL secret is empty')

          articles = Counter()
          group_ids = Counter()
          offers = 0
          missing_article = 0
          count_positive = 0
          count_zero = 0
          count_missing = 0
          available_true = 0
          available_false = 0
          available_true_count_zero = 0
          max_count = 0
          image_counts = Counter()
          sample_dupe_articles = []

          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=240) as r:
              for event, elem in ET.iterparse(r, events=('end',)):
                  tag = elem.tag.split('}')[-1]
                  if tag != 'offer':
                      continue

                  offers += 1
                  available = str(elem.attrib.get('available','')).strip().lower() == 'true'
                  if available:
                      available_true += 1
                  else:
                      available_false += 1

                  group_id = str(elem.attrib.get('group_id','')).strip()
                  if group_id:
                      group_ids[group_id] += 1

                  article_values = []
                  cnt = None
                  pics = 0
                  for child in list(elem):
                      ctag = child.tag.split('}')[-1]
                      text = (child.text or '').strip()
                      if ctag == 'param' and str(child.attrib.get('name','')).strip().casefold() == 'артикул' and text:
                          if text not in article_values:
                              article_values.append(text)
                      elif ctag == 'count':
                          try:
                              cnt = int(float(text.replace(',','.')))
                          except Exception:
                              cnt = None
                      elif ctag == 'picture' and text:
                          pics += 1

                  if article_values:
                      for article in article_values:
                          articles[article] += 1
                  else:
                      missing_article += 1

                  if cnt is None:
                      count_missing += 1
                  elif cnt > 0:
                      count_positive += 1
                      max_count = max(max_count, cnt)
                  else:
                      count_zero += 1
                      if available:
                          available_true_count_zero += 1

                  image_counts[pics] += 1
                  elem.clear()

          duplicate_articles = [(a,c) for a,c in articles.items() if c > 1]
          duplicate_articles.sort(key=lambda x:(-x[1], x[0]))
          duplicate_groups = sum(1 for c in group_ids.values() if c > 1)

          print('OFFERS', offers)
          print('UNIQUE_ARTICLES', len(articles))
          print('MISSING_ARTICLE_OFFERS', missing_article)
          print('DUPLICATE_ARTICLE_KEYS', len(duplicate_articles))
          print('DUPLICATE_ARTICLE_OFFER_COUNT', sum(c for _,c in duplicate_articles))
          print('TOP_DUPLICATE_ARTICLES', duplicate_articles[:30])
          print('UNIQUE_GROUP_IDS', len(group_ids))
          print('DUPLICATE_GROUP_IDS', duplicate_groups)
          print('AVAILABLE_TRUE', available_true)
          print('AVAILABLE_FALSE', available_false)
          print('COUNT_POSITIVE', count_positive)
          print('COUNT_ZERO', count_zero)
          print('COUNT_MISSING', count_missing)
          print('AVAILABLE_TRUE_COUNT_ZERO', available_true_count_zero)
          print('MAX_COUNT', max_count)
          print('IMAGE_COUNT_DISTRIBUTION', image_counts.most_common(20))
          PY
