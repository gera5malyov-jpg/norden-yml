name: Debug Webasyst SKU lookup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-webasyst-sku.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
      WEBASYST_BASE_URL: https://profikompany.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Diagnose AF-31651906
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'webasyst')
          from client import WebasystClient
          wa=WebasystClient(min_request_interval=0.3)
          code='AF-31651906'
          tests=[
            ('hash_search', 'shop.product.search', {'hash': f'search/query={code}', 'limit':100, 'fields':'id,name,skus,url'}),
            ('query_param', 'shop.product.search', {'query': code, 'limit':100, 'fields':'id,name,skus,url'}),
            ('plain_search', 'shop.product.search', {'hash': f'search/{code}', 'limit':100, 'fields':'id,name,skus,url'}),
            ('product_info', 'shop.product.getInfo', {'id':'1472768'}),
          ]
          for name,method,params in tests:
            print('===',name,'===')
            try:
              d=wa.call(method,params=params)
              print(json.dumps(d,ensure_ascii=False)[:12000])
            except Exception as e:
              print(type(e).__name__, str(e))
          PY
