name: Perf64 - SQL index and protected storage audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf64-readonly.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/perf64_indexes_storage_readonly.py
      - run: python storefront/perf64_indexes_storage_readonly.py
