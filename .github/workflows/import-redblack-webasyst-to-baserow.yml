name: Import RED-Black1 Webasyst to Baserow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-redblack-webasyst-to-baserow.yml'
      - 'baserow/import_redblack_webasyst.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redblack-webasyst-baserow-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASEROW_URL: http://147.78.67.6
      BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
      WEBASYST_BASE_URL: https://profikompany.ru
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Compile
        run: python -m py_compile baserow/import_redblack_webasyst.py
      - name: Import RED-Black1
        id: sync
        continue-on-error: true
        run: python baserow/import_redblack_webasyst.py
      - name: Save report
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add baserow/redblack_webasyst_import_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save RED-Black1 Webasyst import report"
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i*3))
            done
          fi
      - name: Fail if import had errors
        if: always()
        run: test "${{ steps.sync.outcome }}" = "success"
