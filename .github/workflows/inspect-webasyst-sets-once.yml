name: Inspect Webasyst sets once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-webasyst-sets-once.yml'
      - 'scripts/inspect_webasyst_sets.py'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_webasyst_sets.py
