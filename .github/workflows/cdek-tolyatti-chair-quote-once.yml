name: CDEK quote Moscow to Tolyatti chairs

on:
  push:
    paths:
      - '.github/workflows/cdek-tolyatti-chair-quote-once.yml'
      - 'scripts/cdek_tolyatti_quote.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Calculate CDEK quote
        env:
          CDEK_CLIENT_ID: ${{ secrets.CDEK_CLIENT_ID }}
          CDEK_CLIENT_SECRET: ${{ secrets.CDEK_CLIENT_SECRET }}
        run: python scripts/cdek_tolyatti_quote.py
      - name: Save sanitized result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cdek-tolyatti-quote-result.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Save CDEK Moscow-Tolyatti quote result"
            git push
          fi
