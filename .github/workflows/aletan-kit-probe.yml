name: TEMP — probe KIT brand filter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aletan-kit-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests
      - name: Проверить фильтр brand
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os, json, collections, requests
          r=requests.get(
              "https://api.kit.yandex.net/v1/variants",
              params={"brand":"Алетан","page":1,"per_page":100},
              headers={"Authorization":"Bearer "+os.environ["YANDEX_KIT_TOKEN"],"Accept":"application/json"},
              timeout=60,
          )
          print("HTTP", r.status_code)
          r.raise_for_status()
          p=r.json()
          rows=p.get("variants") or p.get("items") or p.get("results") or []
          if isinstance(rows,dict): rows=rows.get("items") or []
          print("TOTAL", p.get("total_count") or p.get("total"))
          print("ROWS", len(rows))
          print("BRANDS", json.dumps(collections.Counter(str(x.get("brand") or "") for x in rows).most_common(20), ensure_ascii=False))
          print("SAMPLE", json.dumps([{"id":x.get("id"),"sku":x.get("sku"),"brand":x.get("brand")} for x in rows[:10]], ensure_ascii=False))
          PY
