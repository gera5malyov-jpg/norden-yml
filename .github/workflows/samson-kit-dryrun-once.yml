name: Samson KIT one-shot dry run

# tdd red: real Samson field mapping test should fail before mapper fix
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/samson-kit-dryrun-once.yml'

permissions:
  contents: read

concurrency:
  group: samson-kit-dryrun-once
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
