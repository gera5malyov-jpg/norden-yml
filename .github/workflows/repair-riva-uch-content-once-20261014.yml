name: Repair single Riva UCH product description and specs once
# Retry after fixing standalone module import path; no catalog modifications were made
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-riva-uch-content-once-20261014.yml']
permissions: {contents: read}
jobs:
  repair:
    if: github.event.head_commit.message == 'Repair single Riva product content once'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEBASYST_BASE_URL: https://profikompany.ru
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Webasyst request client
        run: pip -q install requests
      - name: Check repair script syntax
        run: python -m py_compile scripts/repair_riva_uch00001998_content_once.py
      - name: One product only, description and features, verified against price and stock
        run: python scripts/repair_riva_uch00001998_content_once.py
