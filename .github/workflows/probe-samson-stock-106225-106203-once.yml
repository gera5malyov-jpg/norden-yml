name: Probe Samson stock 106225 106203 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-samson-stock-106225-106203-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe source and KIT stock
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import os, json
          from samson_kit.http import SafeSession
          from samson_kit.samson_client import SamsonClient
          from samson_kit.kit_client import KitClient
          from samson_kit.mapper import normalize_sku, extract_stock_parts, extract_withdrawn, extract_active
          from samson_kit.rules import calculate_stock

          http=SafeSession()
          samson=SamsonClient(os.environ['SAMSON_API_KEY'],http)
          kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],http)
          wid=kit.resolve_warehouse_exact('СПБ')
          targets=['106225','106203']

          # Build targeted SKU rows
          rows={}
          for code in targets:
              payload=http.request_json(
                  'GET',samson.base_url+'/sku/',
                  params={'api_key':samson.api_key,'response_format':'json','sku':code},
                  headers={'Accept':'application/json'}
              )
              env=payload[0] if isinstance(payload,list) and len(payload)==1 else payload
              for row in (env.get('data') if isinstance(env,dict) else []) or []:
                  try:
                      item=normalize_sku(row)
                  except Exception:
                      continue
                  if item.source_code==code:
                      rows[code]=row; break

          # targeted stock endpoint too
          stock_rows={}
          for code in targets:
              try:
                  payload=http.request_json(
                      'GET',samson.base_url+'/sku/stock/',
                      params={'api_key':samson.api_key,'response_format':'json','sku':code},
                      headers={'Accept':'application/json'}
                  )
                  env=payload[0] if isinstance(payload,list) and len(payload)==1 else payload
                  for row in (env.get('data') if isinstance(env,dict) else []) or []:
                      try:
                          item=normalize_sku(row)
                      except Exception:
                          continue
                      if item.source_code==code:
                          stock_rows[code]=row; break
              except Exception as exc:
                  print('STOCK_ENDPOINT_ERROR '+code+' '+str(exc)[:300])

          index,_=kit.index_samson_variants()
          for code in targets:
              row=rows.get(code)
              if row is None:
                  print('SOURCE_MISSING '+code)
                  continue
              item=normalize_sku(row)
              srow=stock_rows.get(code)
              override=extract_stock_parts(srow) if srow else None
              active=extract_active(row,extract_withdrawn(row))
              withdrawn=extract_withdrawn(row)
              source_parts=extract_stock_parts(row)
              chosen=override if override is not None else source_parts
              desired=calculate_stock(chosen,active=active,withdrawn=withdrawn)

              variant=index.get('SAMS-'+code)
              detail=kit.get_variant(variant['id']) if variant else None
              spb=None
              if detail:
                  for s in detail.get('stocks') or []:
                      if str(s.get('warehouse_id',''))==wid:
                          spb=s.get('quantity')
                          break
              print('RESULT='+json.dumps({
                  'code':code,
                  'sku_stock_list':row.get('stock_list'),
                  'stock_endpoint':srow,
                  'source_parts':source_parts,
                  'override_parts':override,
                  'chosen_parts':chosen,
                  'active':active,
                  'withdrawn':withdrawn,
                  'desired_stock':desired,
                  'kit_spb':spb,
                  'kit_variant_id':variant.get('id') if variant else None,
              },ensure_ascii=False))
          PY
