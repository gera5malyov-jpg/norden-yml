name: Каталог — заполнить Norden YML ID

on:
  push:
    paths:
      - 'catalog/yml_id_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        run: pip install --disable-pip-version-check requests "gspread>=6.1,<7" "google-auth>=2.35,<3"
      - name: Заполнить YML ID
        env:
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CATALOG_SPREADSHEET_ID: '1DvMYvKRr8fX8mfLFaeJCXCccQofPViPcIP2CgIctc8w'
          CATALOG_SHEET: 'Норден'
        run: python catalog/fill_norden_yml_id.py
      - name: Сохранить отчёт
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/norden_yml_id_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Обновить отчёт YML ID каталога Norden"
            git push
          fi
