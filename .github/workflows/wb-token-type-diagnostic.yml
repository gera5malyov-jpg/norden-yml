name: WB token type diagnostic
on:
  push:
    paths:
      - 'scripts/wb_token_type.py'
      - '.github/workflows/wb-token-type-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode safe token metadata
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python scripts/wb_token_type.py
