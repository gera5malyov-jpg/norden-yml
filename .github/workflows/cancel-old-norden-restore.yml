name: Cancel old Norden restore run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-old-norden-restore.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel old slow restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          code="$(curl -sS -o /tmp/out -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/gera5malyov-jpg/norden-yml/actions/runs/36456192736/cancel")"
          cat /tmp/out || true
          echo "HTTP $code"
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            exit 1
          fi
