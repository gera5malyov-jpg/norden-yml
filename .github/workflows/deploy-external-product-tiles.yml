name: Prefer external images on product listings
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/deploy-external-product-tiles.yml]
permissions:
  contents: read
concurrency:
  group: profikompany-storefront-theme
  cancel-in-progress: false
jobs:
  guarded:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u storefront/enable_external_product_tile_images.py
