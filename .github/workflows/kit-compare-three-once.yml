name: KIT compare three products once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kit-compare-three-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Query KIT
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, requests
          from pathlib import Path

          BASE='https://api.kit.yandex.net'
          token=os.environ['YANDEX_KIT_TOKEN']
          H={'Authorization':f'Bearer {token}','Accept':'application/json'}
          targets={'100-1538550','100-1536923','AF-30895666'}

          def get(path, params=None):
              for i in range(10):
                  r=requests.get(BASE+path,headers=H,params=params,timeout=90)
                  if r.status_code==429:
                      time.sleep(float(r.headers.get('Retry-After') or 5))
                      continue
                  r.raise_for_status()
                  return r.json()
              raise RuntimeError('rate limited')

          def items(p):
              if isinstance(p,list): return p
              if isinstance(p,dict):
                  for k in ('items','results','variants','characteristics'):
                      if isinstance(p.get(k),list): return p[k]
                  d=p.get('data')
                  if isinstance(d,list): return d
                  if isinstance(d,dict) and isinstance(d.get('items'),list): return d['items']
              return []

          chars={}
          page=1
          while True:
              p=get('/v1/characteristics',{'page':page,'per_page':100})
              rows=items(p)
              for x in rows:
                  chars[str(x.get('id'))]=x.get('title')
              if len(rows)<100: break
              page+=1

          found=[]
          seen=set()
          page=1
          while True:
              p=get('/v1/variants',{'page':page,'per_page':100})
              rows=items(p)
              if not rows: break
              for row in rows:
                  vals=[]
                  for c in row.get('characteristics') or []:
                      vals.append(str(c.get('value') or ''))
                      vals += [str(v) for v in (c.get('values') or [])]
                  keys={str(row.get('sku') or ''),str(row.get('kit_id') or ''),str(row.get('name') or '')}
                  keys.update(vals)
                  if targets.intersection(keys):
                      vid=str(row.get('id'))
                      if vid in seen: continue
                      seen.add(vid)
                      full=get('/v1/variants/'+vid)
                      out=dict(full)
                      out['characteristics_named']=[
                          {'title':chars.get(str(c.get('characteristic_id')),str(c.get('characteristic_id'))),
                           'value':c.get('value'),'values':c.get('values')}
                          for c in (full.get('characteristics') or [])
                      ]
                      found.append(out)
              total=p.get('total') if isinstance(p,dict) else None
              if total is None and isinstance(p,dict) and isinstance(p.get('meta'),dict):
                  total=p['meta'].get('total')
              if len(rows)<100: break
              if isinstance(total,int) and page*100>=total: break
              page+=1
              time.sleep(.5)

          Path('norden-kit/kit_compare_three.json').write_text(
              json.dumps({'targets':sorted(targets),'found':found},ensure_ascii=False,indent=2),
              encoding='utf-8'
          )
          print('found',len(found))
          PY
      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden-kit/kit_compare_three.json
          git commit -m "Save KIT comparison for three products" || exit 0
          git pull --rebase origin main
          git push
