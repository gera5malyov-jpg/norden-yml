name: Probe Norden KIT created now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-norden-kit-created-now.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check expected new SKUs in KIT
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ["YANDEX_KIT_TOKEN"]
          skus = ["31663505","31663506","31663507","31663508","31663509"]
          for sku in skus:
              url = "https://api.kit.yandex.net/v1/variants?" + urllib.parse.urlencode({"name": sku, "page": 1, "per_page": 100})
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  payload = json.load(r)
              rows = payload.get("items") or payload.get("variants") or payload.get("results") or payload.get("data") or []
              if isinstance(rows, dict):
                  rows = rows.get("items") or rows.get("results") or []
              exact = [x for x in rows if isinstance(x, dict) and str(x.get("sku") or "").strip() == sku]
              print("SKU=%s EXACT=%d IDS=%s" % (sku, len(exact), [str(x.get("id") or "") for x in exact[:5]]))
          PY
