name: Samson photo probe 105610 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-photo-probe-105610-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe Samson 105610 and KIT media
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import json, os
          from samson_kit.http import SafeSession
          from samson_kit.samson_client import SamsonClient
          from samson_kit.kit_client import KitClient
          from samson_kit.mapper import normalize_sku

          http=SafeSession()
          samson=SamsonClient(os.environ['SAMSON_API_KEY'],http)
          kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],http)
          target='105610'
          found=None

          # Try documented-style targeted filters first.
          for key in ('sku','code','article','id'):
              try:
                  payload=http.request_json(
                      'GET',
                      samson.base_url+'/sku/',
                      params={'api_key':samson.api_key,'response_format':'json',key:target},
                      headers={'Accept':'application/json'}
                  )
                  env=payload[0] if isinstance(payload,list) and len(payload)==1 else payload
                  rows=env.get('data') if isinstance(env,dict) else []
                  for row in rows or []:
                      if isinstance(row,dict):
                          code=str(row.get('sku') or row.get('code') or row.get('article') or row.get('vendor_code') or row.get('id') or '').strip()
                          if code==target:
                              found=row; print('TARGET_FILTER='+key); break
                  if found: break
              except Exception:
                  pass

          if found is None:
              for row in samson.iter_skus():
                  try:
                      item=normalize_sku(row)
                  except Exception:
                      continue
                  if item.source_code==target:
                      found=row; print('TARGET_FILTER=scan'); break

          if found is None:
              raise RuntimeError('Samson 105610 not found')

          item=normalize_sku(found)
          print('SOURCE_PHOTO_LIST_RAW='+json.dumps(found.get('photo_list'),ensure_ascii=False))
          print('SOURCE_NORMALIZED_IMAGES='+json.dumps(item.image_urls,ensure_ascii=False))
          print('SOURCE_IMAGE_COUNT='+str(len(item.image_urls)))

          target_variant=None
          for v in kit.iter_variants():
              if str(v.get('sku','')).strip()=='SAMS-105610':
                  target_variant=v; break
          if target_variant is None:
              raise RuntimeError('KIT SAMS-105610 not found')
          vid=str(target_variant.get('id','')).strip()
          detail=kit._get('/v1/variants/'+vid)
          print('KIT_VARIANT_ID='+vid)
          print('KIT_MEDIA='+json.dumps(detail.get('media') or [],ensure_ascii=False))
          print('KIT_MEDIA_COUNT='+str(len(detail.get('media') or [])))
          PY
