name: Probe Riva feed throughput once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-riva-feed-throughput-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe first 10 MiB
        env:
          RIVA_FEED_URL: ${{ secrets.RIVA_FEED_URL }}
        shell: bash
        run: |
          python - <<'PY'
          import os,time,urllib.request
          url=os.environ['RIVA_FEED_URL']
          start=time.monotonic()
          req=urllib.request.Request(url,headers={'Range':'bytes=0-10485759'})
          with urllib.request.urlopen(req,timeout=120) as resp:
              connected=time.monotonic()
              total=0
              while total < 10*1024*1024:
                  chunk=resp.read(min(1024*1024,10*1024*1024-total))
                  if not chunk: break
                  total += len(chunk)
              done=time.monotonic()
              print('STATUS='+str(resp.status))
              print('CONTENT_LENGTH='+str(resp.headers.get('Content-Length')))
              print('CONTENT_RANGE='+str(resp.headers.get('Content-Range')))
          print('BYTES_READ='+str(total))
          print('CONNECT_SECONDS='+str(round(connected-start,3)))
          print('READ_SECONDS='+str(round(done-connected,3)))
          print('TOTAL_SECONDS='+str(round(done-start,3)))
          PY
