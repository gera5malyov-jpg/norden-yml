name: Update PODSTOLIA feed

on:
  schedule:
    # Monday 10:00 Moscow time (UTC+3)
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podstolia-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update supplier feed
        run: python podstolia/update_feed.py

      - name: Commit only when feed changed
        shell: bash
        run: |
          if git diff --quiet -- podstolia/podstolia.xml podstolia/podstolia.yml; then
            echo "PODSTOLIA feed has no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podstolia/podstolia.xml podstolia/podstolia.yml
          git commit -m "Update PODSTOLIA feed"
          git push
