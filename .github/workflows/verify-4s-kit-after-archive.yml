name: Verify 4S KIT duplicates after archive

on:
  workflow_run:
    workflows: ["Archive 4S KIT duplicates"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить активный каталог после архивации
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import importlib.util, json, os, pathlib
          from collections import defaultdict
          from datetime import datetime, timezone

          p=pathlib.Path('4s-kit/sync_4s_kit.py')
          spec=importlib.util.spec_from_file_location('sync4s',p)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          kit=mod.Kit(os.environ['YANDEX_KIT_TOKEN'])
          chars=kit.characteristics()
          code_site_id,article_id=mod.resolve_special_characteristics(chars)
          web_rows=[
              x for x in chars
              if mod.norm(x.get('title'))==mod.norm(mod.WEBASYST_TITLE)
              and mod.s(x.get('id'))
          ]
          if len(web_rows)!=1:
              raise RuntimeError(f'Expected one Webasyst characteristic, found {len(web_rows)}')
          webasyst_id=mod.s(web_rows[0].get('id'))

          scan1=kit.variants()
          scan2=kit.variants()
          active_by_id={}
          for v in scan1+scan2:
              vid=mod.s(v.get('id'))
              if not vid or mod.s(v.get('status')).upper()=='ARCHIVED':
                  continue
              if not mod.is_likely_legacy_4s_variant(
                  v,code_site_id,article_id,webasyst_id
              ):
                  continue
              active_by_id[vid]=v

          groups=defaultdict(list)
          for v in active_by_id.values():
              name=mod.norm(v.get('name'))
              if name:
                  groups[name].append(v)

          duplicates=[]
          for _,vals in groups.items():
              unique={mod.s(x.get('id')):x for x in vals if mod.s(x.get('id'))}
              vals=sorted(unique.values(),key=mod.canonical_variant_key)
              if len(vals)<2:
                  continue
              canonical=vals[0]
              canonical_code=mod.norm(mod.char_value(canonical,code_site_id))
              dup_rows=[]
              for x in vals[1:]:
                  same_code=(
                      canonical_code
                      and canonical_code==mod.norm(mod.char_value(x,code_site_id))
                  )
                  legacy_generated_pair=(
                      not mod.generated_333_variant(canonical)
                      and mod.generated_333_variant(x)
                  )
                  if same_code or legacy_generated_pair:
                      dup_rows.append(x)
              if dup_rows:
                  duplicates.append({
                      'code_site':mod.char_value(canonical,code_site_id),
                      'name':mod.s(canonical.get('name')),
                      'kept_kit_id':mod.s(canonical.get('kit_id')),
                      'kept_sku':mod.s(canonical.get('sku')),
                      'duplicate_kit_ids':[mod.s(x.get('kit_id')) for x in dup_rows],
                      'duplicate_skus':[mod.s(x.get('sku')) for x in dup_rows],
                  })

          report={
              'checked_at':datetime.now(timezone.utc).isoformat(),
              'kit_rows_scanned':len(scan1)+len(scan2),
              'kit_variants_unique_union':len(active_by_id),
              'active_4s_variants':len(active_by_id),
              'active_exact_duplicate_groups':len(duplicates),
              'duplicates':duplicates,
              'status':'ok' if not duplicates else 'failed',
          }
          out=pathlib.Path('4s-kit/post_archive_duplicate_check.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k!='duplicates'},ensure_ascii=False,indent=2))
          if duplicates:
              for x in duplicates[:20]:
                  print('ОСТАЛСЯ ДУБЛЬ',json.dumps(x,ensure_ascii=False))
              raise RuntimeError(f"После архивации осталось точных дублей: {len(duplicates)}")
          PY
      - name: Сохранить отчёт проверки
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 4s-kit/post_archive_duplicate_check.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save post-archive 4 Seasons duplicate check"
            git pull --rebase origin main
            git push
          fi
