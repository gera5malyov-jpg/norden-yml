name: Probe Kenner Webasyst target once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kenner-webasyst-target-once.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe Webasyst types and stocks
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0,'webasyst')
          from client import WebasystClient
          wa=WebasystClient(min_request_interval=0.5)
          types=wa.call('shop.type.getList')
          stocks=wa.call('shop.stock.getList')
          out={'types':types,'stocks':stocks}
          os.makedirs('webasyst',exist_ok=True)
          open('webasyst/kenner_target_probe.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit probe
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add webasyst/kenner_target_probe.json
          git commit -m 'Probe Kenner Webasyst target' || exit 0
          git pull --rebase || true
          git push || true