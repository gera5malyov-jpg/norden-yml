name: Cancel stuck Norden run once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stuck-norden-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete long-running Norden sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST /repos/${{ github.repository }}/actions/runs/37564788488/cancel
