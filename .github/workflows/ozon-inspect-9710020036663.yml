name: Ozon inspect 9710020036663

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-inspect-9710020036663.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install requests
      - name: Inspect target
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,requests
          S=requests.Session()
          S.headers.update({"Client-Id":os.environ["OZON_CLIENT_ID"],"Api-Key":os.environ["OZON_API_KEY"],"Content-Type":"application/json"})
          cur=""
          target=None
          while True:
            r=S.post("https://api-seller.ozon.ru/v5/product/info/prices",json={"cursor":cur,"filter":{"visibility":"ALL"},"limit":1000},timeout=120)
            r.raise_for_status()
            d=r.json()
            for x in d.get("items") or []:
              if str(x.get("offer_id"))=="9710020036663":
                target=x
                break
            if target: break
            rows=d.get("items") or []
            nxt=d.get("cursor") or ""
            if not rows or not nxt or nxt==cur: break
            cur=nxt
          print("TARGET",json.dumps(target,ensure_ascii=False,sort_keys=True))
          PY

# trigger
