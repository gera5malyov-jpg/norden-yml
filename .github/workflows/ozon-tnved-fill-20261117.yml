name: Ozon TN VED verified fill Nov 17
# Second verified batch for PVC information boards, metal shelves and medical screen
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-tnved-fill-20261117.yml'
permissions:
  contents: read
concurrency:
  group: ozon-tnved-sync
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      DRY_RUN: 'false'
      MAX_UPDATES_PER_RUN: '300'
      UPDATE_BATCH_SIZE: '50'
      TNVED_OVERRIDES: ozon/tnved_overrides.json
      TNVED_SUMMARY: ozon/tnved_summary.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fill verifiable unfilled TN VED values
        run: python ozon/tnved_sync.py
      - name: Allow attribute import to settle
        run: sleep 12
      - name: Independently read every product TN VED field
        run: python ozon/tnved_verify_remaining_20261109.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tnved-fill-audit-20261117
          path: |
            ozon/tnved_summary.md
            ozon/tnved_final_readback_20261109.json
          retention-days: 14
