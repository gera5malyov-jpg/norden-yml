name: Diagnose Megasuppliers Webasyst IDs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-megasuppliers-webasyst-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBASYST_BASE_URL: https://profikompany.ru
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
      MEGASUPPLIERS_CALLBACK_SECRET: ${{ secrets.MEGASUPPLIERS_CALLBACK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install requests
      - name: Read type and stock IDs
        run: |
          python - <<'PY'
          import json, os
          from webasyst.client import WebasystClient

          wa = WebasystClient(min_request_interval=0)
          types = wa.call('shop.type.getList')
          stocks = wa.call('shop.stock.getList')

          def rows(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ('types','stocks','products','items','data','result'):
                      value=payload.get(key)
                      if isinstance(value,list):
                          return value
                  return [v for v in payload.values() if isinstance(v,dict)]
              return []

          type_rows=rows(types)
          stock_rows=rows(stocks)
          type_matches=[
              {'id':str(x.get('id') or ''),'name':str(x.get('name') or x.get('title') or '')}
              for x in type_rows
              if str(x.get('name') or x.get('title') or '').strip().casefold() == 'norden-100'.casefold()
          ]
          stock_matches=[
              {'id':str(x.get('id') or ''),'name':str(x.get('name') or x.get('title') or '')}
              for x in stock_rows
              if str(x.get('name') or x.get('title') or '').strip().casefold() == 'основной склад'.casefold()
          ]
          samples=[]
          if len(type_matches)==1:
              type_id=type_matches[0]['id']
              payload=wa.call('shop.product.search',params={'hash':'type/'+type_id,'offset':0,'limit':20,'fields':'*,skus'})
              products=rows(payload)
              feature_defs=rows(wa.call('shop.feature.getList'))
              feature_names={str(x.get('code') or ''):str(x.get('name') or x.get('title') or '') for x in feature_defs}
              for product in products[:20]:
                  info=wa.call('shop.product.getInfo',params={'id':product.get('id')})
                  feats=info.get('features') or {} if isinstance(info,dict) else {}
                  codes={}
                  if isinstance(feats,dict):
                      for code,value in feats.items():
                          title=feature_names.get(str(code),'')
                          if 'код' in title.casefold() or 'артикул' in title.casefold():
                              codes[title]={'code':str(code),'value':value}
                  skus=product.get('skus') or []
                  if isinstance(skus,dict):
                      skus=list(skus.values())
                  samples.append({
                      'product_id':str(product.get('id') or ''),
                      'name':str(product.get('name') or ''),
                      'skus':[str(x.get('sku') or '') for x in skus if isinstance(x,dict)],
                      'identity_features':codes,
                  })
          import hashlib, hmac, urllib.request
          link_sample=[]
          secret=os.environ.get('MEGASUPPLIERS_CALLBACK_SECRET','').strip()
          if secret:
              request_id='20261004025409-5cf1cf5411c0292e'
              body=json.dumps({
                  'action':'links','supplier_id':1,'request_id':request_id,'offset':0,'limit':30,
              },ensure_ascii=False,separators=(',',':')).encode('utf-8')
              sig='sha256='+hmac.new(secret.encode('utf-8'),body,hashlib.sha256).hexdigest()
              req=urllib.request.Request(
                  'https://profikompany.ru/megasuppliers-bridge/',
                  data=body,method='POST',
                  headers={'Content-Type':'application/json; charset=utf-8','X-Megasuppliers-Signature':sig},
              )
              with urllib.request.urlopen(req,timeout=30) as response:
                  link_payload=json.load(response)
              link_sample=(link_payload.get('items') or [])[:30]

          raw_identity_sample=[]
          if samples:
              for sample in samples[:3]:
                  info=wa.call('shop.product.getInfo',params={'id':sample['product_id']})
                  feats=info.get('features') or {} if isinstance(info,dict) else {}
                  raw_identity_sample.append({
                      'product_id':sample['product_id'],
                      'features':feats,
                      'skus':info.get('skus') if isinstance(info,dict) else None,
                  })

          out={
              'type_matches':type_matches,'stock_matches':stock_matches,
              'type_count':len(type_rows),'stock_count':len(stock_rows),
              'samples':samples,'link_sample':link_sample,
              'raw_identity_sample':raw_identity_sample,
          }
          os.makedirs('diagnostics',exist_ok=True)
          with open('diagnostics/megasuppliers_webasyst_ids.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False))
          if len(type_matches)!=1 or len(stock_matches)!=1:
              raise SystemExit(2)
          PY
      - name: Commit diagnostic result
        if: always()
        run: |
          if [ -f diagnostics/megasuppliers_webasyst_ids.json ]; then
            git config user.name github-actions
            git config user.email actions@github.com
            git add diagnostics/megasuppliers_webasyst_ids.json
            git commit -m "Save Webasyst IDs diagnostic [skip ci]" || exit 0
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
