name: Liga live smoke 3 once
# retry after multipart rewind fix

on:
  push:
    branches:
      - feat/liga-kit-sync
    paths:
      - '.github/workflows/liga-live-smoke-3-once.yml'

permissions:
  contents: read

concurrency:
  group: liga-live-smoke-3-once
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run all regression tests
        run: |
          PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
          PYTHONPATH=liga-kit python -m unittest discover -s liga-kit/tests -v
      - name: Create exactly 3 Liga products
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python -m liga_kit.cli             --max-items 3             --report /tmp/liga-smoke.json
          cat /tmp/liga-smoke.json
      - name: Verify created Liga products
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python - <<'PY'
          import os, tempfile, json
          from decimal import Decimal, ROUND_CEILING
          from liga_kit.config import Settings
          from liga_kit.http import SafeSession
          from liga_kit.feed import parse_feed
          from liga_kit.kit_client import KitClient

          settings=Settings.from_env()
          http=SafeSession()
          kit=KitClient(settings.kit_token,http,settings.kit_base_url)

          with tempfile.TemporaryDirectory(prefix='liga-smoke-verify-') as td:
              feed_path=td+'/feed.xml'
              http.download_to_file(settings.feed_url,feed_path)
              snapshot=parse_feed(feed_path)
              targets=snapshot.offers[:3]

          spb=kit.resolve_warehouse_exact('СПБ')
          msk=kit.resolve_warehouse_exact('МСК')
          index,dups=kit.index_liga_variants()
          out=[]
          for offer in targets:
              if offer.kit_sku in dups:
                  raise RuntimeError('duplicate KIT SKU '+offer.kit_sku)
              variant=index.get(offer.kit_sku)
              if not variant:
                  raise RuntimeError('missing KIT SKU '+offer.kit_sku)
              detail=kit.get_variant(variant['id'])
              stocks={str(x.get('warehouse_id')):int(x.get('quantity',0)) for x in detail.get('stocks') or []}
              media=[m for m in (detail.get('media') or []) if isinstance(m,dict) and str(m.get('type','')).upper()=='IMAGE']
              pricing=detail.get('pricing') or {}
              actual_price=Decimal(str(pricing.get('manual_discount_price') or pricing.get('final_price') or pricing.get('price')))
              expected_price=offer.price.quantize(Decimal('1'),rounding=ROUND_CEILING)
              if actual_price.quantize(Decimal('1'),rounding=ROUND_CEILING)!=expected_price:
                  raise RuntimeError(f'{offer.kit_sku} price mismatch expected {expected_price} got {actual_price}')
              expected_stock=100 if offer.available else 0
              if stocks.get(spb)!=expected_stock:
                  raise RuntimeError(f'{offer.kit_sku} SPB expected {expected_stock} got {stocks.get(spb)}')
              if stocks.get(msk)!=expected_stock:
                  raise RuntimeError(f'{offer.kit_sku} MSK expected {expected_stock} got {stocks.get(msk)}')
              if len(media)!=len(offer.images):
                  raise RuntimeError(f'{offer.kit_sku} images expected {len(offer.images)} got {len(media)}')
              out.append({
                  'sku':offer.kit_sku,
                  'name':offer.name,
                  'feed_price':str(offer.price),
                  'kit_effective_price':str(actual_price),
                  'spb':stocks.get(spb),
                  'msk':stocks.get(msk),
                  'source_images':len(offer.images),
                  'kit_images':len(media),
                  'variant_id':variant['id'],
              })
          print('LIGA_SMOKE_VERIFY='+json.dumps(out,ensure_ascii=False))
          print('LIGA_SMOKE_OK=3')
          PY
