name: Database Norden sync

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: database-norden-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
      NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
      YANDEX_MARKET_BUSINESS_ID: '20806099'
      YANDEX_MARKET_CAMPAIGN_ID: '89405839'
      WEBASYST_BASE_URL: https://profikompany.ru
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
      YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
      NORDEN_RESUME_APPROVED: '1'
      OZON_NORDEN_MSK_WAREHOUSE_ID: '1020005029910180'
      YANDEX_NORDEN_MSK_WAREHOUSE_ID: '1274413'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Synchronize Norden to Database
        run: python baserow/sync_norden_database.py --report-file baserow/norden_sync_report.json

      - name: Refresh live KIT IDs in Database
        run: python baserow/sync_kit_ids_to_baserow.py

      - name: Update Norden marketplace commissions in Database
        run: python baserow/sync_norden_marketplace_commissions.py

      - name: Calculate all Norden channel prices in Database
        run: python baserow/calculate_norden_prices.py

      - name: Publish Norden prices and stocks to all existing channels
        run: python baserow/publish_norden_channels.py

      - name: Create useful Baserow notifications
        if: success()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python baserow/evaluate_norden_notifications.py --manual
          else
            python baserow/evaluate_norden_notifications.py
          fi

      - name: Notify about synchronization failure
        if: failure()
        continue-on-error: true
        run: |
          python baserow/notify_baserow.py \
            --severity red \
            --code norden_sync_error \
            --title "Ошибка синхронизации Norden" \
            --message "Один из этапов обновления Database, комиссий, Webasyst или KIT завершился ошибкой. Проверь GitHub Actions." \
            --dedupe-key "norden:sync:error" \
            --target-url "/database/49/table/156/609" || true
