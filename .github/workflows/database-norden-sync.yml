name: Database Norden sync

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: database-norden-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
      NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
      YANDEX_MARKET_BUSINESS_ID: '20806099'
      YANDEX_MARKET_CAMPAIGN_ID: '89405839'
      WEBASYST_BASE_URL: https://profikompany.ru
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
      YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Synchronize Norden to Database
        run: python baserow/sync_norden_database.py

      - name: Update Norden marketplace commissions in Database
        run: python baserow/sync_norden_marketplace_commissions.py

      - name: Publish Norden stocks from Database to Webasyst and KIT
        run: python baserow/publish_norden_stocks.py
