name: Verify Ozon low-cost pricing once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ozon-low-cost-pricing-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - name: Verify production pricing thresholds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile, urllib.parse, urllib.request
          API_KEY=os.environ['NETANGELS_API_KEY'].strip(); VM_ID=44780; VM_IP='45.86.180.49'
          ROOT='/home/web/vm-23f9aff9.na4u.ru/www'
          def req(url,method='GET',data=None,headers=None):
              q=urllib.request.Request(url,data=data,method=method,headers=headers or {})
              with urllib.request.urlopen(q,timeout=30) as r:
                  raw=r.read().decode(); return json.loads(raw) if raw else {}
          token=req('https://panel.netangels.ru/api/gateway/token/','POST',urllib.parse.urlencode({'api_key':API_KEY}).encode(),{'Content-Type':'application/x-www-form-urlencoded','User-Agent':'ozs-lowcost-verify/1.0'})['token']
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json','User-Agent':'ozs-lowcost-verify/1.0'}
          with tempfile.TemporaryDirectory() as td:
              key=td+'/id'; subprocess.run(['ssh-keygen','-q','-t','ed25519','-N','','-f',key],check=True)
              pub=open(key+'.pub').read().strip()
              created=req(f'https://api-ms.netangels.ru/api/v1/cloud/vms/{VM_ID}/ssh/create/','POST',json.dumps({'key':pub,'name':'chatgpt-ozs-lowcost-verify'}).encode(),headers)
              kid=created['id']; common=['-i',key,'-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=/dev/null']
              try:
                  php=r'''<?php
          $root='/home/web/vm-23f9aff9.na4u.ru/www'; chdir($root);
          require_once $root.'/wa-config/SystemConfig.class.php';
          waSystem::getInstance(null,new SystemConfig()); wa('shop');
          $p=wa('shop')->getPlugin('ozonstocksync',true);
          $settings=array(
            'acquiring_percent'=>$p->getSettings('acquiring_percent'),
            'target_margin_percent'=>$p->getSettings('target_margin_percent'),
            'min_margin_percent'=>$p->getSettings('min_margin_percent'),
            'old_price_multiplier'=>$p->getSettings('old_price_multiplier'),
            'round_step'=>$p->getSettings('round_step'),
            'type_margin_percent'=>$p->getSettings('type_margin_percent')
          );
          require_once $root.'/wa-apps/shop/plugins/ozonstocksync/lib/classes/shopOzonstocksyncPluginSync.class.php';
          $sync=new shopOzonstocksyncPluginSync($settings);
          $rc=new ReflectionClass($sync);
          echo 'LOW_COST_THRESHOLD_RUB='.$rc->getConstant('LOW_COST_THRESHOLD_RUB')."\n";
          echo 'LOW_COST_TARGET_MARKUP_PERCENT='.$rc->getConstant('LOW_COST_TARGET_MARKUP_PERCENT')."\n";
          echo 'TARGET_DEFAULT='.(float)$settings['target_margin_percent']."\n";
          echo 'MIN_MARGIN='.(float)$settings['min_margin_percent']."\n";
          $m=new ReflectionMethod($sync,'calculatePrices'); $m->setAccessible(true);
          $comm=array(0.10,0.10,0.10,0.10);
          foreach(array(2499,2500,2000,3000) as $cost){
            $r=$m->invoke($sync,$cost,$comm,'');
            echo 'COST_'.$cost.'='.json_encode($r,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          }
          ?>''';
                  remote=f"""cat >/tmp/verify_lowcost.php <<'PHP'
          {php}
          PHP
          chown web:web /tmp/verify_lowcost.php
          su -s /bin/bash web -c 'php -d display_errors=1 -d log_errors=0 /tmp/verify_lowcost.php'
          rm -f /tmp/verify_lowcost.php
          """
                  p=subprocess.run(['ssh']+common+['root@'+VM_IP,remote],text=True,capture_output=True,timeout=120)
                  print(p.stdout)
                  if p.stderr.strip(): print('STDERR='+p.stderr.strip())
                  if p.returncode: raise SystemExit(p.returncode)
              finally:
                  try:req(f'https://api-ms.netangels.ru/api/v1/cloud/vms/{VM_ID}/ssh/{kid}/','DELETE',None,headers)
                  except Exception as e: print('cleanup='+str(e))
          PY
