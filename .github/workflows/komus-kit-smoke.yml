name: Komus KIT smoke

on:
  push:
    branches: [main]
    paths:
      - 'komus-kit/sync_komus_kit.py'
      - '.github/workflows/komus-kit-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Dry-run first 5 Komus products
        env:
          KOMUS_API: ${{ secrets.KOMUS_API }}
          KOMUS_API_KEY: ${{ secrets.KOMUS_API_KEY }}
          KOMUS_TOKEN: ${{ secrets.KOMUS_TOKEN }}
          KOMUS_API_TOKEN: ${{ secrets.KOMUS_API_TOKEN }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          PYTHONPATH=samson-kit python komus-kit/sync_komus_kit.py             --dry-run --max-items 5             --report /tmp/komus-smoke.json
      - name: Print report
        if: always()
        run: cat /tmp/komus-smoke.json || true
