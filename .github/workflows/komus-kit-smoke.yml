name: Komus KIT smoke

on:
  push:
    branches: [main]
    paths:
      - 'komus-kit/sync_komus_kit.py'
      - '.github/workflows/komus-kit-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: komus-kit-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt beautifulsoup4
      - name: Dry-run target Komus article
        env:
          KOMUS_LOGIN: ${{ secrets.KOMUS_LOGIN }}
          KOMUS_PASSWORD: ${{ secrets.KOMUS_PASSWORD }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          PYTHONPATH=samson-kit python komus-kit/sync_komus_kit.py \
            --dry-run \
            --only-art 2505358 \
            --report /tmp/komus-smoke.json
      - name: Print compact report
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p="/tmp/komus-smoke.json"
          if os.path.exists(p):
              r=json.load(open(p,encoding="utf-8"))
              keys=("status","only_art","eligible_in_stock","new_products_created","existing_variants_seen","error_count","warning_count")
              print(json.dumps({k:r.get(k) for k in keys},ensure_ascii=False,indent=2))
              if r.get("errors"):
                  print(json.dumps(r["errors"][:10],ensure_ascii=False,indent=2))
          PY
