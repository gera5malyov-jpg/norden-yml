name: Inspect KIT storefront quantity surfaces once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-kit-storefront-quantity-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout official Yandex KIT skills
        run: git clone --depth 1 https://github.com/yandex/kit-skills.git /tmp/kit-skills
      - name: Inspect storefront pages and sections
        env:
          KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          KC=/tmp/kit-skills/skills/yandex-kit-cabinet/scripts/kit.py
          KS=/tmp/kit-skills/skills/kit-storefront-constructor/scripts/kit.py
          PROMPT='Да делай и продолжи после загружать остальные товары. Настроить минимальный заказ по ПЗК и шаг по промежуточной упаковке.'
          SID='c3b223d7-6041-49cb-9b86-caf0ed67e8ba'

          python "$KC" --skill-prompt "$PROMPT" --skill-session-id "$SID" store > /tmp/store.json
          cat /tmp/store.json
          B2C=$(python - <<'PY'
          import json
          x=json.load(open('/tmp/store.json'))
          if isinstance(x,dict):
              for key in ('b2c_url','b2cUrl','url','storefront_url'):
                  if x.get(key):
                      print(x[key]); break
          PY
          )
          if [ -z "$B2C" ]; then
            echo "Could not resolve b2c_url from store response" >&2
            exit 2
          fi
          echo "B2C_URL=$B2C"

          python "$KS" --bff-url "$B2C" --skill-prompt "$PROMPT" --skill-session-id "$SID" content summary
          python "$KS" --bff-url "$B2C" --skill-prompt "$PROMPT" --skill-session-id "$SID" pages list
          echo '--- PRODUCT CARD SECTIONS ---'
          python "$KS" --bff-url "$B2C" --skill-prompt "$PROMPT" --skill-session-id "$SID" sections list --page productCard || true
          echo '--- CART SECTIONS ---'
          python "$KS" --bff-url "$B2C" --skill-prompt "$PROMPT" --skill-session-id "$SID" sections list --page cart || true
