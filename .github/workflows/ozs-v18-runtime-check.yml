name: Ozon v1.8.0 runtime state
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozs-v18-runtime-check.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - run: python3 scripts/check_ozs_v18_runtime.py
      - name: Save report
        if: always()
        run: |
          mkdir -p .deploy-probe
          test -f .deploy-probe/ozonstocksync-v18-runtime-state.txt || echo 'CHECK_FAILED' > .deploy-probe/ozonstocksync-v18-runtime-state.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/ozonstocksync-v18-runtime-state.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save independent rFBS runtime verification [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
