name: Inspect Ozon sync lock once
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, 'INSPECT_OZON_LOCK_ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - name: Inspect lock and logs read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile, urllib.parse, urllib.request
          API_KEY=os.environ['NETANGELS_API_KEY'].strip(); VM_ID=44780; VM_IP='45.86.180.49'
          ROOT='/home/web/vm-23f9aff9.na4u.ru/www'
          def req(url,method='GET',data=None,headers=None):
              q=urllib.request.Request(url,data=data,method=method,headers=headers or {})
              with urllib.request.urlopen(q,timeout=30) as r:
                  raw=r.read().decode(); return json.loads(raw) if raw else {}
          token=req('https://panel.netangels.ru/api/gateway/token/','POST',urllib.parse.urlencode({'api_key':API_KEY}).encode(),{'Content-Type':'application/x-www-form-urlencoded','User-Agent':'ozs-lock-inspect/1.0'})['token']
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json','User-Agent':'ozs-lock-inspect/1.0'}
          with tempfile.TemporaryDirectory() as td:
              key=td+'/id'; subprocess.run(['ssh-keygen','-q','-t','ed25519','-N','','-f',key],check=True)
              pub=open(key+'.pub').read().strip()
              created=req(f'https://api-ms.netangels.ru/api/v1/cloud/vms/{VM_ID}/ssh/create/','POST',json.dumps({'key':pub,'name':'chatgpt-ozs-lock-'+os.environ.get('GITHUB_RUN_ID','manual')}).encode(),headers)
              kid=created['id']; common=['-i',key,'-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=/dev/null']
              try:
                  remote=f"""set -u
          ROOT='{ROOT}'
          echo '=== TIME ==='; date -Is
          echo '=== PROCESSES ==='; ps -eo pid,ppid,etimes,user,args | grep -E '[c]li.php shop ozonstocksyncPluginSync|[f]lock .*ozonstocksync.lock' || true
          echo '=== LOCK ==='; (command -v lslocks >/dev/null && lslocks | grep ozonstocksync) || true
          echo '=== MAIN LOG ==='; tail -n 80 "$ROOT/wa-log/ozonstocksync.log" 2>/dev/null || true
          echo '=== MEGAPOLIS LOG ==='; tail -n 80 "$ROOT/wa-log/ozonstocksync_megapolis.log" 2>/dev/null || true
          """
                  p=subprocess.run(['ssh']+common+['root@'+VM_IP,remote],text=True,capture_output=True,timeout=120)
                  print(p.stdout)
                  if p.stderr.strip(): print('STDERR='+p.stderr.strip())
                  if p.returncode: raise SystemExit(p.returncode)
              finally:
                  try:req(f'https://api-ms.netangels.ru/api/v1/cloud/vms/{VM_ID}/ssh/{kid}/','DELETE',None,headers)
                  except Exception as e: print('cleanup='+str(e))
          PY
