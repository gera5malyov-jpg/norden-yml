name: Publish KIT Samson quantity guard once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-kit-samson-quantity-guard-once.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git clone --depth 1 https://github.com/yandex/kit-skills.git /tmp/kit-skills
      - name: Pull, add guard sections, dry-run and publish
        env:
          KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          K=/tmp/kit-skills/skills/kit-storefront-constructor/scripts/kit.py
          PROMPT='Да делай. Ограничить количество Samson: минимум ПЗК, далее шаг промежуточной упаковки, если ее нет шаг 1.'
          SID='c3b223d7-6041-49cb-9b86-caf0ed67e8ba'
          TEMPLATE_ID='01a0b411-f681-75be-9970-a84871b669a6'
          COMMON=(--bff-url https://megapolis-meb.ru --skill-prompt "$PROMPT" --skill-session-id "$SID")
          WORK=/tmp/kit-quantity-work.json

          python "$K" "${COMMON[@]}" content pull --out "$WORK"
          python "$K" "${COMMON[@]}" section add --work "$WORK" --page productCard --widget YandexKit.Mystique --template-id "$TEMPLATE_ID" --settings-file samson-kit/storefront/quantity-guard/settings.product.json
          python "$K" "${COMMON[@]}" section add --work "$WORK" --page cart --widget YandexKit.Mystique --template-id "$TEMPLATE_ID" --settings-file samson-kit/storefront/quantity-guard/settings.cart.json
          echo '--- DIFF ---'
          python "$K" "${COMMON[@]}" content diff --work "$WORK"
          echo '--- DRY RUN ---'
          python "$K" "${COMMON[@]}" content push --work "$WORK" --commit-message 'Samson: enforce PZK minimum and package step' --dry-run
          echo '--- PUBLISH ---'
          python "$K" "${COMMON[@]}" content push --work "$WORK" --commit-message 'Samson: enforce PZK minimum and package step' --confirm
