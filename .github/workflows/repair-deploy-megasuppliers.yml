name: Repair and deploy Webasyst megasuppliers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-deploy-megasuppliers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_FILE_ID: '129zSQGB1FKGrn1AgkbJg-EGIvQYylfxQ'
      EXPECTED_SHA256: '5538d704c8f40a5e3b3743a3af507f3b03e14356be789dcf2d8ef427245afa42'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair local deployer and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/deploy_megasuppliers.py')
          s = p.read_text(encoding='utf-8')
          marker = '"""\\n            p=ssh(key,"bash -s",stdin=remote,check=True,timeout=180)'
          fixed = '"""\n            p=ssh(key,"bash -s",stdin=remote,check=True,timeout=180)'
          s = s.replace(marker, fixed, 1)
          s = s.replace('remote = f"""set -euo pipefail', 'remote = """set -euo pipefail', 1)
          s = s.replace('{shlex.quote(ROOT)}', '/home/web/vm-23f9aff9.na4u.ru/www')
          s = s.replace('{ROOT!r}', "'/home/web/vm-23f9aff9.na4u.ru/www'")
          s = s.replace('{{}}', '{}')
          anchor = 'test -f "$STAGE/megasuppliers/lib/config/plugin.php"\necho "stage=lint php=$(php -r \'echo PHP_VERSION;\')"'
          patch = '\n'.join([
              'test -f "$STAGE/megasuppliers/lib/config/plugin.php"',
              'python3 - "$STAGE/megasuppliers/lib/models/shopMegasuppliersMeta.model.php" <<\'PYFIX\'',
              'import sys',
              'from pathlib import Path',
              'p=Path(sys.argv[1])',
              "s=p.read_text(encoding='utf-8')",
              'needle="    protected $table = \'shop_megasuppliers_meta\';"',
              'fixed=needle+"\\\\n    protected $id = \'name\';"',
              'if "protected $id = \'name\';" not in s:',
              '    s=s.replace(needle,fixed,1)',
              "p.write_text(s,encoding='utf-8')",
              'PYFIX',
              'echo "stage=lint php=$(php -r \'echo PHP_VERSION;\')"',
          ])
          if anchor in s:
              s = s.replace(anchor, patch, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile scripts/deploy_megasuppliers.py
          rm -f .deploy-probe/megasuppliers-install.txt

      - name: Install Google client
        run: pip -q install google-api-python-client google-auth

      - name: Deploy plugin
        run: python3 scripts/deploy_megasuppliers.py

      - name: Save install report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/megasuppliers-install.txt || echo "INSTALL_STATUS=FAILED_NO_REPORT" > .deploy-probe/megasuppliers-install.txt
          git checkout -- scripts/deploy_megasuppliers.py
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/megasuppliers-install.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save repaired megasuppliers install report [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

