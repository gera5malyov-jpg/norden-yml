name: Raduga mapping probe

on:
  push:
    paths:
      - 'scripts/raduga_mapping_probe.py'
      - '.github/workflows/raduga-mapping-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe Raduga products in Webasyst
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python scripts/raduga_mapping_probe.py
