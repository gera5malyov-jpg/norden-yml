name: Read-only Avalon photo inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-avalon-photo-catalog.yml'
      - 'storefront/audit_avalon_photo_catalog.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/audit_avalon_photo_catalog.py
      - name: Compare exact unique Avalon product names and image URLs (no changes)
        run: python storefront/audit_avalon_photo_catalog.py
