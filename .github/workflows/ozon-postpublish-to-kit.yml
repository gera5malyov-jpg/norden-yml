name: Ozon postpublish canonical sync to KIT
on:
  workflow_dispatch:
    inputs:
      offer_id:
        description: Exact new offer_id / internal SKU
        required: true
        type: string
      kit_variant_id:
        description: Expected KIT variant_id (optional safety check)
        required: false
        type: string
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Compile
        run: python -m py_compile catalog/sync_ozon_readback_to_kit.py norden-kit/sync_norden_kit.py norden-kit/webasyst_n100_to_kit_once.py
      - name: Sync canonical Ozon data into KIT
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          OZON_POSTPUBLISH_OFFER_ID: ${{ inputs.offer_id }}
          KIT_VARIANT_ID: ${{ inputs.kit_variant_id }}
        run: python catalog/sync_ozon_readback_to_kit.py
      - name: Save report
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add catalog/ozon_postpublish_to_kit_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Ozon postpublish KIT sync report"
            for i in 1 2 3; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i*3))
            done
          fi
