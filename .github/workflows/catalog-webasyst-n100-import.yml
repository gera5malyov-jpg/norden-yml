name: Каталог — Webasyst NORDEN-100 → Норден

on:
  push:
    paths:
      - 'catalog/webasyst_n100_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        run: pip install --disable-pip-version-check requests "gspread>=6.1,<7" "google-auth>=2.35,<3"
      - name: Импортировать только отсутствующие артикулы
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CATALOG_SPREADSHEET_ID: '1DvMYvKRr8fX8mfLFaeJCXCccQofPViPcIP2CgIctc8w'
          CATALOG_SHEET: 'Норден'
        run: python catalog/import_webasyst_n100_to_catalog.py
      - name: Сохранить отчёт
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/webasyst_n100_catalog_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Обновить отчёт импорта Webasyst NORDEN-100 в Каталог"
            git push
          fi
