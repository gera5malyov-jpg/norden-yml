name: Probe megasuppliers server target
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-megasuppliers-server.yml'
      - 'scripts/probe_megasuppliers_server.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Prepare read-only probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/probe_megasuppliers_server.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('remote_cmd=f"""set -eu', 'remote_cmd="""set -eu', 1)
          s=s.replace('ROOT={ROOT}', 'ROOT=/home/web/vm-23f9aff9.na4u.ru/www', 1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile scripts/probe_megasuppliers_server.py
      - name: Probe server
        run: python3 scripts/probe_megasuppliers_server.py
      - name: Save safe report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/megasuppliers-server-probe.txt || echo "probe did not produce report" > .deploy-probe/megasuppliers-server-probe.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/megasuppliers-server-probe.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save megasuppliers server probe [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
