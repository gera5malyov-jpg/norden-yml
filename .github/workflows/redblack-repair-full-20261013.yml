name: Red-Black verified one-time price and image repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redblack-repair-full-20261013.yml'
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      WEBASYST_BASE_URL: https://profikompany.ru
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Guarded Red-Black price and summary repairs
        run: >-
          python -m scripts.repair_redblack_zero_prices_images
          --apply
          --backup redblack-live-repair-backup.json
          --report redblack-live-repair-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redblack-live-price-image-backup-and-report
          path: |
            redblack-live-repair-backup.json
            redblack-live-repair-report.json
          if-no-files-found: error
          retention-days: 90
