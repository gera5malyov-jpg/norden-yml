name: Inspect active SEO meta sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-live-meta-head-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect active metadata template read only
        run: python storefront/audit_live_meta_head_20261018.py
