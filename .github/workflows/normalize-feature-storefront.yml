name: Normalize Webasyst feature presentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-feature-storefront.yml'
      - 'storefront/normalize_feature_storefront.py'
permissions:
  contents: read
concurrency:
  group: storefront-seo-layout
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint normalization implementation
        run: python3 -m py_compile storefront/normalize_feature_storefront.py
      - name: Backup and normalize rendered features with rollback
        run: python3 storefront/normalize_feature_storefront.py
