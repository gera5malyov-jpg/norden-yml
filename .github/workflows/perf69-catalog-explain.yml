name: Perf69 - Real slow catalog EXPLAIN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf69-catalog-explain.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/perf69_category_explain_readonly.py
      - name: Read-only explain of slow catalog feature filters
        run: python storefront/perf69_category_explain_readonly.py
