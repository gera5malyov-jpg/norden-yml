name: Probe Webasyst thumbnail source

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_webasyst_thumb_source.py'
      - '.github/workflows/probe-webasyst-thumb-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe thumbnail source
        run: python3 scripts/probe_webasyst_thumb_source.py
      - name: Save report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/webasyst-thumb-source.txt || echo "PROBE_FAILED" > .deploy-probe/webasyst-thumb-source.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/webasyst-thumb-source.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save Webasyst thumbnail source probe [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
