name: Mark marketplace flags from commissions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mark-marketplace-flags-from-commissions.yml'

permissions:
  contents: read

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
      BASEROW_URL: http://147.78.67.6
    steps:
      - name: Mark flags from verified commission/category data
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base=os.environ['BASEROW_URL'].rstrip('/')
          token=os.environ['BASEROW_DATABASE_TOKEN']
          headers={'Authorization':'Token '+token,'Accept':'application/json','Content-Type':'application/json'}
          def req(method,path,data=None):
              body=None if data is None else json.dumps(data,ensure_ascii=False).encode()
              r=urllib.request.Request(base+path,data=body,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=90) as x:
                      raw=x.read().decode()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  raise RuntimeError(f'{method} {path} HTTP {e.code}: {raw[:1000]}')
          rows=[]; page=1
          while True:
              d=req('GET',f'/api/database/rows/table/156/?user_field_names=true&size=200&page={page}')
              rows.extend(d.get('results') or [])
              if not d.get('next'): break
              page+=1
          def present(v):
              if v is None: return False
              if isinstance(v,str): return bool(v.strip())
              return True
          items=[]; oz=ya=both=0
          for r in rows:
              ozon=present(r.get('Комиссия Ozon')) or present(r.get('Категория Ozon'))
              yandex=present(r.get('Комиссия Яндекс')) or present(r.get('Категория Яндекс'))
              patch={'id':r['id']}
              changed=False
              if ozon and r.get('Загружать в Ozon') is not True:
                  patch['Загружать в Ozon']=True; changed=True
              if yandex and r.get('Загружать в Яндекс') is not True:
                  patch['Загружать в Яндекс']=True; changed=True
              if changed: items.append(patch)
              oz += int(ozon); ya += int(yandex); both += int(ozon and yandex)
          for i in range(0,len(items),100):
              req('PATCH','/api/database/rows/table/156/batch/?user_field_names=true',{'items':items[i:i+100]})
          rows2=[]; page=1
          while True:
              d=req('GET',f'/api/database/rows/table/156/?user_field_names=true&size=200&page={page}')
              rows2.extend(d.get('results') or [])
              if not d.get('next'): break
              page+=1
          print(json.dumps({
              'rows_total':len(rows2),
              'detected_ozon_from_verified_commission_data':oz,
              'detected_yandex_from_verified_commission_data':ya,
              'detected_both':both,
              'rows_updated':len(items),
              'checked_ozon_after':sum(1 for r in rows2 if r.get('Загружать в Ozon') is True),
              'checked_yandex_after':sum(1 for r in rows2 if r.get('Загружать в Яндекс') is True),
          },ensure_ascii=False,indent=2))
          PY
