name: Rename supplier stock field once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-supplier-stock-field-once.yml'

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    env:
      BASEROW_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
      BASEROW_URL: http://147.78.67.6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests

      - name: Rename stock field
        run: |
          python3 - <<'PY'
          import os, requests
          base=os.environ['BASEROW_URL'].rstrip('/')
          h={'Authorization':'Token '+os.environ['BASEROW_TOKEN'],'Accept':'application/json','Content-Type':'application/json'}
          r=requests.get(base+'/api/database/fields/table/156/',headers=h,timeout=30)
          r.raise_for_status()
          fields=r.json()
          new=[f for f in fields if f.get('name')=='Остаток поставщика']
          old=[f for f in fields if f.get('name')=='Остаток Norden']
          if new:
              print('ALREADY_RENAMED',new[0].get('id'))
              raise SystemExit(0)
          if len(old)!=1:
              raise SystemExit(f'Expected one old field, found {len(old)}')
          fid=old[0]['id']
          p=requests.patch(base+f'/api/database/fields/{fid}/',headers=h,json={'name':'Остаток поставщика'},timeout=30)
          print('PATCH_STATUS',p.status_code)
          print('PATCH_BODY',p.text[:1000])
          p.raise_for_status()
          print('RENAMED_FIELD_ID',fid)
          PY
