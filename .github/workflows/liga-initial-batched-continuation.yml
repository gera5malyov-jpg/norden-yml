          echo 'LIGA_BATCH_4918_REPORT_BEGIN'
          cat /tmp/liga-4918.json
          echo 'LIGA_BATCH_4918_REPORT_END'

  final_reconcile:
    needs: batch8
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Full reconcile after initial import
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python -m liga_kit.cli --report /tmp/liga-final.json
          echo 'LIGA_FINAL_REPORT_BEGIN'
          cat /tmp/liga-final.json
          echo 'LIGA_FINAL_REPORT_END'
