name: Liga initial batched continuation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liga-initial-batched-continuation.yml'

permissions:
  contents: read

concurrency:
  group: liga-initial-batched-continuation
  cancel-in-progress: false

jobs:
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run Liga regression tests
        run: PYTHONPATH=liga-kit python -m unittest discover -s liga-kit/tests -v
      - name: Import first 2300 Liga offers
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python -m liga_kit.cli --max-items 2300 --report /tmp/liga-2300.json
          echo 'LIGA_BATCH_2300_REPORT_BEGIN'
          cat /tmp/liga-2300.json
          echo 'LIGA_BATCH_2300_REPORT_END'

  batch2:
    needs: batch1
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Import first 2700 Liga offers
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python -m liga_kit.cli --max-items 2700 --report /tmp/liga-2700.json
          echo 'LIGA_BATCH_2700_REPORT_BEGIN'
          cat /tmp/liga-2700.json
          echo 'LIGA_BATCH_2700_REPORT_END'

  batch3:
    needs: batch2
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Import first 3100 Liga offers
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python -m liga_kit.cli --max-items 3100 --report /tmp/liga-3100.json
          echo 'LIGA_BATCH_3100_REPORT_BEGIN'
          cat /tmp/liga-3100.json
          echo 'LIGA_BATCH_3100_REPORT_END'

  batch4:
    needs: batch3
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Import first 3500 Liga offers
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python -m liga_kit.cli --max-items 3500 --report /tmp/liga-3500.json
          echo 'LIGA_BATCH_3500_REPORT_BEGIN'
          cat /tmp/liga-3500.json
          echo 'LIGA_BATCH_3500_REPORT_END'

  batch5:
    needs: batch4
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Import first 3900 Liga offers
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python -m liga_kit.cli --max-items 3900 --report /tmp/liga-3900.json
          echo 'LIGA_BATCH_3900_REPORT_BEGIN'
          cat /tmp/liga-3900.json
          echo 'LIGA_BATCH_3900_REPORT_END'

  batch6:
    needs: batch5
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Import first 4300 Liga offers
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
