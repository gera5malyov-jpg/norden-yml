name: KIT live supplier counts once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kit-live-supplier-counts-once.yml'

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count Samson and Riva variants in KIT
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error, time
          token=os.environ['YANDEX_KIT_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}

          def get_count(search):
              while True:
                  url='https://api.kit.yandex.net/v1/variants?'+urllib.parse.urlencode({
                      'page':1,'per_page':1,'name':search
                  })
                  req=urllib.request.Request(url,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=120) as resp:
                          data=json.loads(resp.read().decode('utf-8'))
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code==429:
                          time.sleep(int(exc.headers.get('Retry-After') or 3))
                          continue
                      raise
              total=(data.get('total') or data.get('total_count') or
                     (data.get('meta') or {}).get('total') or
                     (data.get('meta') or {}).get('total_count'))
              if total is not None:
                  return int(total)
              rows=data.get('variants') or data.get('items') or data.get('results') or []
              return len(rows)

          print('SAMSON_COUNT='+str(get_count('SAMS-')))
          print('RIVA_COUNT='+str(get_count('ЦБ-')))
          PY
