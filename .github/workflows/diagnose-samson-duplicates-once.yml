name: Diagnose duplicate Samson KIT variants once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-samson-duplicates-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Diagnose duplicate SAMS variants
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import os, json
          from samson_kit.http import SafeSession
          from samson_kit.kit_client import KitClient

          http=SafeSession()
          kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],http)
          index,duplicates=kit.index_samson_variants()
          print('UNIQUE_SAMS='+str(len(index)), flush=True)
          print('DUPLICATE_SKU_COUNT='+str(len(duplicates)), flush=True)
          rows=[]
          for sku,variants in sorted(duplicates.items()):
              group=[]
              for v in variants:
                  vid=str(v.get('id','')).strip()
                  detail=kit.get_variant(vid) if vid else v
                  media=detail.get('media') or []
                  images=[m for m in media if isinstance(m,dict) and str(m.get('type','')).upper()=='IMAGE']
                  stocks=detail.get('stocks') or []
                  pricing=detail.get('pricing') or {}
                  group.append({
                      'id':vid,
                      'sku':detail.get('sku'),
                      'name':detail.get('name'),
                      'status':detail.get('status'),
                      'product_id':detail.get('product_id'),
                      'images':len(images),
                      'stocks':stocks,
                      'pricing':pricing,
                      'characteristics_count':len(detail.get('characteristics') or []),
                      'description_len':len(str(detail.get('description') or '')),
                      'brand':detail.get('brand'),
                  })
              rows.append({'sku':sku,'variants':group})
          print('DUPLICATE_DETAILS='+json.dumps(rows,ensure_ascii=False), flush=True)
          PY
