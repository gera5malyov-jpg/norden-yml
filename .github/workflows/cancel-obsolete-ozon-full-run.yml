name: Cancel obsolete Ozon full run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-obsolete-ozon-full-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for id in 36487873403 36487854115; do
            gh api --method POST "/repos/$REPO/actions/runs/$id/cancel" || true
          done
