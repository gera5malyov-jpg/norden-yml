name: Diagnose masked YML 289 count SQL
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: ['.github/workflows/diagnose-yml289-sql-shape.yml','scripts/diagnose_yml289_stock_sql_shape.py']
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/diagnose_yml289_stock_sql_shape.py
