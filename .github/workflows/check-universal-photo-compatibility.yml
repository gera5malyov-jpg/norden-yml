name: Universal photo compatibility checks
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/check-universal-photo-compatibility.yml]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
      UNIVERSAL_PROFILE_IDS: '254,17,31,231'
      UNIVERSAL_APPLY: '0'
      UNIVERSAL_STRICT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/run_universal_ymlpro_photos.py
