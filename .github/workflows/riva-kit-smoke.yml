name: Riva KIT smoke
# reactivated 2026-10-07

on:
  push:
    branches: [main]
    paths:
      - 'riva-kit/riva_kit/**'
      - 'riva-kit/tests/**'
      - '.github/workflows/riva-kit-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
      RIVA_FEED_URL: ${{ secrets.RIVA_FEED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Riva tests
        run: PYTHONPATH=liga-kit:riva-kit python -m unittest discover -s riva-kit/tests -v
      - name: Riva dry-run
        run: |
          PYTHONPATH=liga-kit:riva-kit python -m riva_kit.cli             --dry-run --max-items 20 --max-new 5             --report /tmp/riva-smoke.json
      - name: Print report
        if: always()
        run: cat /tmp/riva-smoke.json || true
