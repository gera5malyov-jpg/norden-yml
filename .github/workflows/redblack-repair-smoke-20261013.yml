name: Red-Black controlled smoke price and image repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redblack-repair-smoke-20261013.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEBASYST_BASE_URL: https://profikompany.ru
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Smoke-repair exact two Red-Black SKUs with backup
        run: >-
          python -m scripts.repair_redblack_zero_prices_images
          --apply
          --sku RED-00-00004806
          --sku RED-00-00014149
          --backup redblack-smoke-backup.json
          --report redblack-smoke-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redblack-smoke-before-state
          path: |
            redblack-smoke-backup.json
            redblack-smoke-report.json
          if-no-files-found: error
