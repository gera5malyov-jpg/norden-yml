name: Probe Norden fallback files once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-norden-fallback-files-once.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe fallback URLs
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          urls = {
            "full_xml":"https://norden.group/index.php?dispatch=sw_user_prices.get_file&file=Norden.xml",
            "price_xml":"https://norden.group/index.php?dispatch=sw_user_prices.get_file&file=Norden.group+-K8%25.xml",
            "price_xlsx":"https://norden.group/index.php?dispatch=sw_user_prices.get_file&file=Norden.group+-K8%25.xlsx",
          }
          out={}
          for name,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      data=r.read(4096)
                      out[name]={
                        'status':r.status,
                        'content_type':r.headers.get('Content-Type'),
                        'content_length':r.headers.get('Content-Length'),
                        'content_disposition':r.headers.get('Content-Disposition'),
                        'final_url':r.geturl(),
                        'head_hex':data[:16].hex(),
                        'head_text':data[:200].decode('utf-8','replace')
                      }
              except urllib.error.HTTPError as e:
                  out[name]={'status':e.code,'body':e.read(500).decode('utf-8','replace')}
              except Exception as e:
                  out[name]={'error':repr(e)}
          os.makedirs('norden-kit',exist_ok=True)
          with open('norden-kit/fallback_files_probe.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden-kit/fallback_files_probe.json
          git commit -m "Probe Norden fallback files" || exit 0
          git pull --rebase
          git push
