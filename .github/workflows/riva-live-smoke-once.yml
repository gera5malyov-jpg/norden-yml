name: Riva live smoke once

on:
  push:
    branches:
      - feat/riva-kit-sync
    paths:
      - '.github/workflows/riva-live-smoke-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
      RIVA_FEED_URL: ${{ secrets.RIVA_FEED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=liga-kit:riva-kit python -m unittest discover -s riva-kit/tests -v
      - name: Import one Riva offer
        run: |
          PYTHONPATH=liga-kit:riva-kit python -m riva_kit.cli             --max-items 1             --max-new 1             --report riva-kit/state/smoke.json
      - name: Show report
        if: always()
        run: cat riva-kit/state/smoke.json || true
