name: Repair Ozon order 30268053-0302-1
# populate customer name fields

on:
  push:
    paths:
      - '.github/workflows/ozon-order-30268053-0302-1-repair.yml'
  workflow_dispatch:

concurrency:
  group: ozon-order-30268053-0302-1-repair
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Исправить заказ Ozon в Webasyst
        env:
          DRY_RUN: '0'
          SYNC_SOURCES: 'ozon'
          TARGET_EXTERNAL_ID: '30268053-0302-1'
          OZON_ORDER_IMPORT_CUTOFF: '2026-09-22T11:08:40Z'
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python webasyst/marketplace_order_sync.py
