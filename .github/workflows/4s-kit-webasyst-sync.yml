name: 4S KIT to Webasyst

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Webasyst writes)'
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'webasyst/sync_4s_kit_to_webasyst.py'
      - 'webasyst/client.py'
      - '.github/workflows/4s-kit-webasyst-sync.yml'

permissions:
  contents: read

concurrency:
  group: 4s-kit-webasyst-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Sync 4S KIT to Webasyst
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          # Every push is forced to dry-run. Only an explicit manual run with dry_run=false may write.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && '0' || '1' }}
          FOURS_WEBASYST_WRITE_DELAY: '0.65'
        run: python webasyst/sync_4s_kit_to_webasyst.py
      - name: Print report
        if: always()
        run: cat webasyst/last_4s_kit_sync_report.json || true
