name: Diagnose Etazherka YML Pro profile source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etazherka-source-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read non-secret profile source metadata
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'storefront')
          from stage52_disable_callback import execute
          remote = r"""set -euo pipefail
          cd /home/web/vm-23f9aff9.na4u.ru/www
          F="$(mktemp /tmp/photo-source-XXXXXX.php)"
          trap 'rm -f "$F"' EXIT
          cat >"$F" <<'PHP'
          <?php
          error_reporting(E_ALL & ~E_NOTICE & ~E_DEPRECATED);
          require_once 'wa-config/SystemConfig.class.php';
          waSystem::getInstance(null,new SystemConfig());wa('shop');
          $db=new waModel();
          $row=$db->query('SELECT id,name,config FROM shop_yml_profiles WHERE id=8')->fetch();
          if(!$row)throw new Exception('Profile id 8 missing');
          $c=json_decode($row['config'],true);
          $url=isset($c['url'])?trim((string)$c['url']):'';
          $p=$url?parse_url($url):array();
          $result=array(
            'id'=>(int)$row['id'],'name'=>$row['name'],
            'source_type'=>isset($c['source_type'])?$c['source_type']:'unset',
            'url_present'=>(bool)$url,'url_scheme'=>isset($p['scheme'])?$p['scheme']:'unset',
            'url_host'=>isset($p['host'])?$p['host']:'unset',
            'images_mode'=>isset($c['images'])?$c['images']:'unset',
            'http_login_nonempty'=>!empty($c['http_login']),
            'http_auth_nonempty'=>!empty($c['http_auth']),
            'config_keys'=>array_keys($c)
          );
          echo 'STAGE52_PROFILE_SOURCE='.json_encode($result,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          PHP
          chmod 644 "$F"
          su -s /bin/bash web -c "php -d display_errors=0 '$F'"
          """
          out=execute(remote)
          print('diag_received='+str('STAGE52_PROFILE_SOURCE=' in out))
          PY
