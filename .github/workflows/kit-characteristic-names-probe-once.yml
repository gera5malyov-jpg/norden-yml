name: KIT characteristic names probe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kit-characteristic-names-probe-once.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe KIT characteristic names
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error, time
          token=os.environ['YANDEX_KIT_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          out=[]; page=1
          while True:
              qs=urllib.parse.urlencode([('status','ACTIVE'),('page',page),('per_page',100)])
              url='https://api.kit.yandex.net/v1/characteristics?'+qs
              for attempt in range(12):
                  req=urllib.request.Request(url,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=120) as r:
                          data=json.loads(r.read().decode('utf-8'))
                      break
                  except urllib.error.HTTPError as e:
                      if e.code==429:
                          time.sleep(int(e.headers.get('Retry-After') or 3)); continue
                      body=e.read().decode('utf-8','replace')
                      raise RuntimeError(f'HTTP {e.code}: {body[:500]}')
              batch=data.get('characteristics') or data.get('items') or data.get('results') or data.get('data') or []
              if isinstance(batch,dict): batch=batch.get('items') or []
              out.extend([x for x in batch if isinstance(x,dict)])
              if not batch or len(batch)<100: break
              page+=1
          wanted=[x for x in out if str(x.get('title','')).strip().casefold() in {'код для сайта','код продавца'}]
          os.makedirs('norden-kit',exist_ok=True)
          with open('norden-kit/kit_code_characteristics.json','w',encoding='utf-8') as f:
              json.dump(wanted,f,ensure_ascii=False,indent=2,sort_keys=True)
          PY
      - name: Commit probe result
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden-kit/kit_code_characteristics.json
          git commit -m "Probe KIT code characteristics" || exit 0
          git pull --rebase
          git push
