name: Samson KIT live and verify 1 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-live-3-once.yml'

permissions:
  contents: read

jobs:
  live1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
      - name: Live sync exactly 1 Samson product
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python -m samson_kit.cli --max-items 1 --report /tmp/samson-live1.json
          cat /tmp/samson-live1.json
      - name: Verify SAMS-100327 in KIT read-only
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import json, os
          from samson_kit.http import SafeSession
          from samson_kit.kit_client import KitClient
          http=SafeSession(); kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],http)
          warehouse_id=kit.resolve_warehouse_exact('СПБ')
          found=[]
          for row in kit.iter_variants():
              if str(row.get('sku','')).strip()=='SAMS-100327': found.append(row)
          if len(found)!=1: raise RuntimeError(f'Expected one SAMS-100327 variant, found {len(found)}')
          row=found[0]
          stocks=[x for x in (row.get('stocks') or []) if str(x.get('warehouse_id',''))==warehouse_id]
          result={'id':row.get('id'),'sku':row.get('sku'),'name':row.get('name'),'pricing':row.get('pricing'),'spb_stock':stocks,'media_count':len(row.get('media') or []),'characteristics_count':len(row.get('characteristics') or []),'status':row.get('status')}
          print('VERIFY='+json.dumps(result,ensure_ascii=False))
          PY
