name: Samson KIT bootstrap diagnostic once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-live-3-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
      - name: Reproduce bootstrap in dry-run and print full report
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set +e
          PYTHONPATH=samson-kit python -m samson_kit.cli --dry-run --max-items 1 --report /tmp/samson-bootstrap.json
          rc=$?
          echo "CLI_RC=$rc"
          cat /tmp/samson-bootstrap.json || true
          exit 0
