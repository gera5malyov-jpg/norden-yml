name: Samson KIT live and verify 3 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-live-3-once.yml'

permissions:
  contents: read

jobs:
  live3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
      - name: Live sync first 3 Samson products
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python -m samson_kit.cli --max-items 3 --report /tmp/samson-live3.json
          cat /tmp/samson-live3.json
      - name: Verify first 3 Samson SKUs read-only
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import json, os
          from samson_kit.http import SafeSession
          from samson_kit.kit_client import KitClient
          http=SafeSession(); kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],http)
          wanted={'SAMS-100327','SAMS-100329','SAMS-100337'}
          warehouse_id=kit.resolve_warehouse_exact('СПБ')
          found={}
          for row in kit.iter_variants():
              sku=str(row.get('sku','')).strip()
              if sku in wanted: found[sku]=row
          missing=sorted(wanted-set(found))
          if missing: raise RuntimeError('Missing KIT variants: '+','.join(missing))
          out=[]
          for sku in sorted(wanted):
              row=found[sku]
              obj=kit._get('/v1/variants/'+str(row.get('id')))
              stocks=[x for x in (obj.get('stocks') or []) if str(x.get('warehouse_id',''))==warehouse_id]
              info={'sku':sku,'name':obj.get('name'),'status':obj.get('status'),'pricing':obj.get('pricing'),'spb_stock':stocks,'media_count':len(obj.get('media') or []),'characteristics_count':len(obj.get('characteristics') or [])}
              if obj.get('status')!='PUBLISHED': raise RuntimeError(f'{sku} not PUBLISHED')
              if not stocks: raise RuntimeError(f'{sku} has no СПБ stock')
              if not (obj.get('pricing') or {}).get('manual_discount_price'): raise RuntimeError(f'{sku} has no sale price')
              out.append(info)
          print('VERIFY3='+json.dumps(out,ensure_ascii=False))
          PY
