name: Samson KIT characteristic mapping inspect once

# TDD RED: duplicate titles from characteristic_list/facet_list must fail before mapper fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-live-3-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
      - name: Inspect first Samson SKU against KIT characteristics (read-only)
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import json, os
          from samson_kit.http import SafeSession
          from samson_kit.samson_client import SamsonClient
          from samson_kit.kit_client import KitClient
          from samson_kit.mapper import normalize_sku

          http=SafeSession()
          samson=SamsonClient(os.environ['SAMSON_API_KEY'],http)
          kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],http)
          raw=next(samson.iter_skus())
          item=normalize_sku(raw)
          kit_chars=kit.list_characteristics()
          rows=[]
          for title,values in item.characteristics:
              vals=[str(x).strip() for x in values if str(x).strip()]
              matches=[]
              for c in kit_chars:
                  if str(c.get('title','')).strip().casefold()==str(title).strip().casefold():
                      matches.append({k:c.get(k) for k in ('id','title','type','select_mode','unit')})
              rows.append({'title':title,'value_count':len(vals),'values':vals[:5],'desired':'MULTIPLE_STRING' if len(vals)>1 else 'STRING','kit_matches':matches})
          print('SAMSON_SKU='+item.kit_sku)
          print('CHARACTERISTIC_MAP='+json.dumps(rows,ensure_ascii=False))
          PY
