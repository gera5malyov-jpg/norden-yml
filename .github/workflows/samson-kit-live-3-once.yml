name: Samson KIT verify created SKU once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-live-3-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
      - name: Verify SAMS-100327 in KIT (read-only)
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import json, os
          from samson_kit.http import SafeSession
          from samson_kit.kit_client import KitClient
          http=SafeSession(); kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],http)
          found=[]
          for row in kit.iter_variants():
              if str(row.get('sku','')).strip()=='SAMS-100327':
                  found.append(row)
          if len(found)!=1:
              raise RuntimeError(f'Expected one SAMS-100327 variant, found {len(found)}')
          row=found[0]
          result={
              'id':row.get('id'),
              'sku':row.get('sku'),
              'name':row.get('name'),
              'product_id':row.get('product_id'),
              'pricing':row.get('pricing'),
              'stocks':row.get('stocks'),
              'media_count':len(row.get('media') or []),
              'characteristics_count':len(row.get('characteristics') or []),
              'status':row.get('status'),
          }
          print('VERIFY='+json.dumps(result,ensure_ascii=False))
          PY
