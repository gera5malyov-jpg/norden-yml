name: Verify Kenner Webasyst smoke once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-kenner-webasyst-smoke-once.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Verify smoke product
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'webasyst')
          from client import WebasystClient
          wa=WebasystClient(min_request_interval=0.4)
          p=wa.call('shop.product.search',params={'hash':'type/203','limit':1000,'fields':'*,skus,stock_counts'})
          rows=p.get('products') if isinstance(p,dict) else p
          if isinstance(rows,dict): rows=list(rows.values())
          rows=rows or []
          target=None; skurow=None
          for product in rows:
              skus=product.get('skus') or {}
              if isinstance(skus,dict): skus=list(skus.values())
              for sku in skus or []:
                  if str(sku.get('sku') or '').strip()=='334-326506':
                      target=product; skurow=sku; break
              if target: break
          if not target: raise SystemExit('334-326506 not found')
          info=wa.call('shop.product.getInfo',params={'id':target['id']})
          skus=wa.call('shop.product.skus.getList',params={'product_id':target['id']})
          out={'product_id':target['id'],'type_id':info.get('type_id'),'summary':info.get('summary'),'description_len':len(str(info.get('description') or '')),'features':info.get('features'),'skus':skus}
          open('webasyst/kenner_smoke_verify.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({'product_id':out['product_id'],'type_id':out['type_id'],'summary_prefix':str(out['summary'])[:100],'feature_count':len(out['features'] or {}),'skus':skus},ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add webasyst/kenner_smoke_verify.json
          git commit -m 'Verify Kenner Webasyst smoke' || exit 0
          git pull --rebase || true
          git push || true