name: Refresh 4s brand-only feed once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/4s-brand-refresh-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 4s-brand-refresh-once
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-4s.txt
      - run: pip install -r requirements-4s.txt
      - name: Generate brand-only feed
        run: python parse_4s.py
      - name: Validate brand-only feed
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('4s-mebel.yml').getroot()
          offers=root.findall('.//offer')
          vendors={str(x.findtext('vendor') or '').strip() for x in offers}
          if not offers:
              raise SystemExit('No offers generated')
          if vendors != {'4 Сезона'}:
              raise SystemExit(f'Unexpected vendors: {vendors}')
          print(f'Brand-only feed valid: {len(offers)} offers; vendors={vendors}')
          PY
      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 4s-mebel.yml
          git commit -m "Refresh 4s brand-only feed" || exit 0
          git pull --rebase origin main
          git push
