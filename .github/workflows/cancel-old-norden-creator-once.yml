name: Cancel current full Norden sync once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-old-norden-creator-once.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel current full Norden no-create run for targeted chairs sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/runs/36022706383/cancel || true
