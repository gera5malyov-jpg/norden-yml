name: Probe WB order 5436356732

on:
  push:
    paths:
      - '.github/workflows/wb-order-5436356732-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить данные заказа WB без вывода персональных данных
        env:
          TARGET_WB_ORDER_ID: '5436356732'
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python scripts/wb_order_detail_probe.py
