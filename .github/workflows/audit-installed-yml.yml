name: Audit installed YML importer structure
on:
  push:
    branches:
      - feature/universal-yml-import-20261015
    paths:
      - '.github/workflows/audit-installed-yml.yml'
      - 'scripts/ymlpro_structure_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/ymlpro_structure_audit.py
