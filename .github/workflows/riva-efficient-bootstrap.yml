name: Riva efficient initial bootstrap

on:
  push:
    branches:
      - feat/riva-kit-sync
    paths:
      - '.github/workflows/riva-efficient-bootstrap.yml'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Missing Riva products to create this run'
        required: true
        default: '800'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: riva-kit-write
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
      RIVA_FEED_URL: ${{ secrets.RIVA_FEED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve batch size
        id: batch
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "size=${{ inputs.batch_size }}" >> "$GITHUB_OUTPUT"
          else
            echo "size=800" >> "$GITHUB_OUTPUT"
          fi
      - name: Riva regression tests on first run only
        if: github.event_name == 'push'
        run: PYTHONPATH=liga-kit:riva-kit python -m unittest discover -s riva-kit/tests -v
      - name: Create next missing Riva products
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit:riva-kit python -m riva_kit.cli \
            --new-only \
            --max-new "${{ steps.batch.outputs.size }}" \
            --report /tmp/riva-bootstrap.json
      - name: Decide whether to continue
        id: next
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          path='/tmp/riva-bootstrap.json'
          if not os.path.exists(path):
              print('continue=false')
              raise SystemExit
          r=json.load(open(path,encoding='utf-8'))
          created=int(r.get('new_products_created') or 0)
          errors=int(r.get('error_count') or 0)
          size=int('${{ steps.batch.outputs.size }}')
          ok=(r.get('status')=='ok' and errors==0)
          print('continue=' + ('true' if ok and created>=size else 'false'))
          print('created=' + str(created))
          print('errors=' + str(errors))
          PY
      - name: Queue next Riva missing-only batch
        if: steps.next.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_SIZE: ${{ steps.batch.outputs.size }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          url=f"https://api.github.com/repos/{repo}/actions/workflows/riva-efficient-bootstrap.yml/dispatches"
          body=json.dumps({
              'ref':'feat/riva-kit-sync',
              'inputs':{'batch_size':os.environ['BATCH_SIZE']}
          }).encode()
          req=urllib.request.Request(url,data=body,method='POST',headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json',
          })
          with urllib.request.urlopen(req,timeout=30) as resp:
              if resp.status != 204:
                  raise RuntimeError(f'dispatch status {resp.status}')
          PY
