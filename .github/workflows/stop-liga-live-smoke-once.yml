name: Stop Liga live smoke once

on:
  push:
    branches:
      - feat/liga-kit-sync
    paths:
      - '.github/workflows/stop-liga-live-smoke-once.yml'

permissions:
  contents: read

concurrency:
  group: liga-live-smoke-3-once
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stopping Liga live smoke until Webasyst v0.9.7 is installed"
