name: Inspect Artikul Markup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-artikul.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect live product markup
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          url = 'https://artikul-mebel.ru/catalog/detail/stul-mini-office-2/'
          r = requests.get(url, timeout=60, headers={'User-Agent':'Mozilla/5.0'})
          r.raise_for_status()
          soup = BeautifulSoup(r.text, 'html.parser')
          for label, selector in [
              ('DETAIL DESCRIPTION', '.detail-description'),
              ('CHARS', '#chars'),
              ('DESCRIPTION', '#description'),
              ('GALLERY', '.wrapper-big-picture'),
          ]:
              node = soup.select_one(selector)
              print('\n===', label, selector, '===')
              print(node.prettify()[:25000] if node else 'NOT FOUND')
          PY
