name: Liga branch baseline tests

on:
  push:
    branches:
      - feat/liga-kit-sync
    paths:
      - '.github/workflows/liga-branch-baseline.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Samson regression baseline
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
