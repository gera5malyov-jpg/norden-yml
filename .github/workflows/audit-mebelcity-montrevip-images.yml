name: Audit Mebelcity chairs and Montre VIP images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_mebelcity_montrevip_images.py'
      - '.github/workflows/audit-mebelcity-montrevip-images.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Audit both product types using Webasyst API
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python -u scripts/audit_mebelcity_montrevip_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mebelcity-montrevip-photo-audit-${{ github.run_id }}
          path: reports/mebelcity_montrevip_native_images_20261017.json
          if-no-files-found: warn
          retention-days: 30
