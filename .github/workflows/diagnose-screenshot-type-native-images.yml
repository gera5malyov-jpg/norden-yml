name: Diagnose all screenshot product-type native images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_screenshot_type_native_images.py'
      - '.github/workflows/diagnose-screenshot-type-native-images.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Examine native photos and external galleries without changes
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python -u scripts/diagnose_screenshot_type_native_images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-image-audit-${{ github.run_id }}
          path: reports/screenshot_type_native_images_20261017.json
          if-no-files-found: warn
          retention-days: 30
