name: Ozon AF-31646769 actions probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-af31646769-actions-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install requests
        run: python -m pip install requests
      - name: Probe Ozon prices and actions
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, requests, sys
          offer="AF-31646769"
          H={"Client-Id":os.environ["OZON_CLIENT_ID"],"Api-Key":os.environ["OZON_API_KEY"],"Content-Type":"application/json"}
          S=requests.Session(); S.headers.update(H)
          def call(method,url,body=None):
              for a in range(8):
                  r=S.request(method,"https://api-seller.ozon.ru"+url,json=body,timeout=60)
                  if r.status_code==429:
                      time.sleep(1+a); continue
                  print("HTTP",method,url,r.status_code)
                  if r.status_code>=400:
                      print("ERR",url,r.text[:1200]); return None
                  return r.json() if r.content else {}
              return None
          pr=call("POST","/v5/product/info/prices",{"cursor":"","filter":{"offer_id":[offer],"visibility":"ALL"},"limit":100})
          items=(pr or {}).get("items") or []
          if not items: raise SystemExit("offer not found")
          item=items[0]
          pid=item.get("product_id")
          print("PRICE_JSON",json.dumps(item,ensure_ascii=False,sort_keys=True))
          acts=call("GET","/v1/actions") or {}
          rows=acts.get("result") or []
          print("ACTIONS_COUNT",len(rows))
          out=[]
          for a in rows:
              aid=a.get("id")
              if not aid: continue
              found=None
              offset=0
              while offset < 10000:
                  c=call("POST","/v1/actions/candidates",{"action_id":aid,"limit":1000,"offset":offset})
                  if not c: break
                  rr=(c.get("result") or {})
                  products=rr.get("products") or []
                  for p in products:
                      if str(p.get("id") or p.get("product_id") or "")==str(pid):
                          found=p; break
                  if found or len(products)<1000: break
                  offset += 1000
              participating=None
              try:
                  ap=call("POST","/v1/actions/products",{"action_id":aid,"limit":1000,"offset":0})
                  plist=((ap or {}).get("result") or {}).get("products") or []
                  participating=any(str(p.get("id") or p.get("product_id") or "")==str(pid) for p in plist)
              except Exception:
                  participating=None
              out.append({"action":a,"candidate":found,"already_participating":participating})
          print("ACTION_MATCHES_JSON",json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
