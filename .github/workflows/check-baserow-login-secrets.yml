name: Check Baserow login secret names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-baserow-login-secrets.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASEROW_EMAIL: ${{ secrets.BASEROW_EMAIL }}
      BASEROW_PASSWORD: ${{ secrets.BASEROW_PASSWORD }}
      BASEROW_LOGIN: ${{ secrets.BASEROW_LOGIN }}
      BASEROW_PASS: ${{ secrets.BASEROW_PASS }}
      BASEROW_USERNAME: ${{ secrets.BASEROW_USERNAME }}
      BASEROW_USER: ${{ secrets.BASEROW_USER }}
      BASEROW_ADMIN_EMAIL: ${{ secrets.BASEROW_ADMIN_EMAIL }}
      BASEROW_ADMIN_PASSWORD: ${{ secrets.BASEROW_ADMIN_PASSWORD }}
      BASEROW_DB_EMAIL: ${{ secrets.BASEROW_DB_EMAIL }}
      BASEROW_DB_PASSWORD: ${{ secrets.BASEROW_DB_PASSWORD }}
      DATABASE_EMAIL: ${{ secrets.DATABASE_EMAIL }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_LOGIN: ${{ secrets.DATABASE_LOGIN }}
      DATABASE_PASS: ${{ secrets.DATABASE_PASS }}
      DB_EMAIL: ${{ secrets.DB_EMAIL }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_LOGIN: ${{ secrets.DB_LOGIN }}
      DB_PASS: ${{ secrets.DB_PASS }}
      FIRSTVDS_LOGIN: ${{ secrets.FIRSTVDS_LOGIN }}
      FIRSTVDS_PASSWORD: ${{ secrets.FIRSTVDS_PASSWORD }}
      BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
    steps:
      - name: Check secret names only
        shell: bash
        run: |
          for v in BASEROW_EMAIL BASEROW_PASSWORD BASEROW_LOGIN BASEROW_PASS BASEROW_USERNAME BASEROW_USER BASEROW_ADMIN_EMAIL BASEROW_ADMIN_PASSWORD BASEROW_DB_EMAIL BASEROW_DB_PASSWORD DATABASE_EMAIL DATABASE_PASSWORD DATABASE_LOGIN DATABASE_PASS DB_EMAIL DB_PASSWORD DB_LOGIN DB_PASS FIRSTVDS_LOGIN FIRSTVDS_PASSWORD BASEROW_DATABASE_TOKEN; do
            if [ -n "${!v:-}" ]; then echo "$v=PRESENT"; else echo "$v=MISSING"; fi
          done
