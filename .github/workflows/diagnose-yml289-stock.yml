name: Diagnose YML PRO 33 beds stock failure
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: ['.github/workflows/diagnose-yml289-stock.yml', 'scripts/diagnose_ymlpro_289_batch_stock.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/diagnose_ymlpro_289_batch_stock.py

