name: Verify 33krovati live photos
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/verify-33krovati-photo-gallery.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/verify_33krovati_live_photo_gallery.py
