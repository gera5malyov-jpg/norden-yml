name: DECcon YML Pro - weekly content-only catalog

on:
  schedule:
    - cron: '12 4 * * 0' # Weekly Sunday, UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deccon/parser.py'
      - 'deccon/tests/**'
      - 'deccon/requirements.txt'
      - '.github/workflows/deccon-yml-weekly.yml'

permissions:
  contents: write

concurrency:
  group: deccon-weekly-yml
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deccon/requirements.txt
      - name: Install parser libraries
        run: pip install -r deccon/requirements.txt
      - name: Run parser tests
        run: python -m unittest discover -s deccon/tests -v
      - name: Collect the full catalog and original photos
        env:
          DECCON_OUTPUT: deccon/catalog-content.yml
          DECCON_MIN_OFFERS: '150'
          DECCON_WORKERS: '5'
        run: python -u deccon/parser.py
      - name: Validate independent SKUs and safe content-only output
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('deccon/catalog-content.yml').getroot()
          offers=root.findall('./shop/offers/offer')
          assert len(offers)>=150
          assert len({o.get('id') for o in offers})==len(offers)
          assert all(o.findall('picture') for o in offers)
          assert all(o.find('price') is None and o.find('available') is None and o.find('quantity') is None for o in offers)
          print('DECCON_VALIDATED',len(offers),'pictures',sum(len(o.findall('picture')) for o in offers))
          PY
      - name: Publish validated YML with conflict-safe retry
        shell: bash
        run: |
          set -euo pipefail
          cp deccon/catalog-content.yml /tmp/deccon-verified.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/deccon-verified.yml deccon/catalog-content.yml
            git add deccon/catalog-content.yml
            if git diff --cached --quiet; then
              echo 'DECCON_UNCHANGED'
              exit 0
            fi
            git commit -m 'Refresh DECcon complete YML Pro content feed'
            if git push origin HEAD:main; then
              echo 'DECCON_PUBLISHED'
              exit 0
            fi
            echo "Retry GitHub push $attempt"
          done
          exit 1
