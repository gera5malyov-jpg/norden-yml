name: Ozon Nov18 price-floor protected promotion reconciliation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-promo-apply-20261118.yml'
permissions:
  contents: read
concurrency:
  group: ozon-promo-v2-reconcile
  cancel-in-progress: false
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove under-minimum action participants and restore any lowered seller limits
        run: python ozon/promo_strategy_floor_remediation_20261109.py
      - name: Add eligible action candidates without reducing minimum prices
        env:
          DRY_RUN: 'false'
        run: python ozon/promo_v2_reconcile.py
      - name: Independent strict full action membership and price readback
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,"ozon")
          from promo_v2_reconcile import api,load_prices,active_prices_and_bad,num
          prices=load_prices()
          actions=api("/v1/actions",method="GET").get("result") or []
          rows,_,bad=active_prices_and_bad(actions,prices)
          unknown=sum(1 for a in actions for row in rows[int(a["id"])] if int(row.get("id") or 0) not in prices)
          zero=sum(1 for a in actions for row in rows[int(a["id"])] if num(row.get("action_price"))<=0)
          report={"catalog":len(prices),"actions":[{"id":int(a["id"]),"title":a.get("title"),"participants":len(rows[int(a["id"])])} for a in actions],
                  "participations":sum(map(len,rows.values())),"below_min_count":len(bad),"unknown_price_count":unknown,"missing_action_price_count":zero}
          print("NOV18_PROMO_INDEPENDENT_READBACK",json.dumps(report,ensure_ascii=False),flush=True)
          if bad or unknown or zero:
              raise RuntimeError("Unverified or below-limit Ozon promotion participation")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-promo-apply-nov18
          path: |
            ozon/promo_strategy_floor_remediation_20261109.json
            ozon/promo_v2_reconcile_report.json
          retention-days: 14
