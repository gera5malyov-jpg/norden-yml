name: Check Baserow Secret

on:
  push:
    branches: [main]
    paths:
      - baserow-secret-check.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret is configured
        env:
          BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
        run: |
          if [ -z "$BASEROW_DATABASE_TOKEN" ]; then
            echo "BASEROW_DATABASE_TOKEN_MISSING"
            exit 1
          fi
          echo "BASEROW_DATABASE_TOKEN_PRESENT"
