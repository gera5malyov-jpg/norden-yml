name: Check AF SKU code collisions profile 289
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: ['.github/workflows/check-af-sku-289.yml']
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/verify_af_code_289.py
