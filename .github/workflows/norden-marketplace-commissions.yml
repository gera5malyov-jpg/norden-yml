name: Norden — комиссии Ozon RFBS и Яндекс DBS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/sync_norden_marketplace_commissions.py'
      - '.github/workflows/norden-marketplace-commissions.yml'

permissions:
  contents: write

concurrency:
  group: norden-marketplace-commissions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install --disable-pip-version-check requests "gspread>=6.1,<7" "google-auth>=2.35,<3"

      - name: Проверить Python
        run: python -m py_compile catalog/sync_norden_marketplace_commissions.py

      - name: Получить комиссии и записать в Каталог
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_BUSINESS_ID: '117585391'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CATALOG_SPREADSHEET_ID: '1DvMYvKRr8fX8mfLFaeJCXCccQofPViPcIP2CgIctc8w'
          CATALOG_SHEET: 'Норден'
        run: python catalog/sync_norden_marketplace_commissions.py

      - name: Сохранить отчёт
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/norden_marketplace_commissions_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Обновить отчёт комиссий Norden"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
