name: Verify ozonstocksync live once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ozonstocksync-live-once.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Verify live UI safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile, urllib.parse, urllib.request, pathlib
          API_KEY=os.environ['NETANGELS_API_KEY'].strip(); VM_ID=44780; VM_IP='45.86.180.49'
          REPORT=pathlib.Path('.deploy-probe/ozonstocksync-live-verify.txt')
          def req(url,method='GET',data=None,headers=None):
              q=urllib.request.Request(url,data=data,method=method,headers=headers or {})
              with urllib.request.urlopen(q,timeout=30) as r:
                  raw=r.read().decode('utf-8'); return json.loads(raw) if raw else {}
          tok=req('https://panel.netangels.ru/api/gateway/token/','POST',urllib.parse.urlencode({'api_key':API_KEY}).encode(),{'Content-Type':'application/x-www-form-urlencoded','User-Agent':'ozs-verify/1.0'})['token']
          headers={'Authorization':'Bearer '+tok,'Content-Type':'application/json','Accept':'application/json','User-Agent':'ozs-verify/1.0'}
          with tempfile.TemporaryDirectory() as td:
              key=td+'/id'; subprocess.run(['ssh-keygen','-q','-t','ed25519','-N','','-f',key],check=True)
              pub=open(key+'.pub',encoding='utf-8').read().strip()
              created=req(f'https://api-ms.netangels.ru/api/v1/cloud/vms/{VM_ID}/ssh/create/','POST',json.dumps({'key':pub,'name':'chatgpt-ozs-verify-'+os.environ.get('GITHUB_RUN_ID','manual')}).encode(),headers)
              kid=created['id']
              try:
                  php=r'''<?php
          $root='/home/web/vm-23f9aff9.na4u.ru/www'; chdir($root);
          require_once $root.'/wa-config/SystemConfig.class.php';
          waSystem::getInstance(null,new SystemConfig()); wa('shop');
          $p=wa('shop')->getPlugin('ozonstocksync',true);
          $controls=$p->getControls(array('namespace'=>'shop_ozonstocksync'));
          $html=isset($controls['ozonstocksync_ui'])?(string)$controls['ozonstocksync_ui']:'';
          preg_match_all('/class="ozs-type-row(?:[^"]*)"/',$html,$m);
          $tm=$p->getSettings('type_margin_percent');
          if(is_string($tm)){$d=json_decode($tm,true);if(is_array($d))$tm=$d;}
          echo 'VERSION='.$p->getVersion()."\n";
          // Read-only audit of the commissions materialized after price synchronization.
          $rate_path=wa()->getDataPath('plugins/ozonstocksync/rfbs_live_rates.json',false,'shop',true);
          $rate_raw=is_readable($rate_path)?file_get_contents($rate_path):'';
          $rate_json=json_decode($rate_raw,true);
          $rate_types=is_array($rate_json) && isset($rate_json['types']) && is_array($rate_json['types'])?$rate_json['types']:array();
          $rate_updated=is_array($rate_json)&&isset($rate_json['updated_at'])?(int)$rate_json['updated_at']:0;
          $office_rate=isset($rate_types['офисное кресло'])?$rate_types['офисное кресло']:null;
          echo 'LIVE_RATE_CACHE='.(is_array($rate_json)?'YES':'NO')."\n";
          echo 'LIVE_RATE_CACHE_UPDATED='.($rate_updated?date('Y-m-d H:i:s',$rate_updated):'none')."\n";
          echo 'LIVE_RATE_CACHE_AGE_SECONDS='.($rate_updated?(time()-$rate_updated):'unknown')."\n";
          echo 'LIVE_RATE_CACHED_TYPES='.count($rate_types)."\n";
          echo 'OFFICE_CHAIR_COMMISSION='.(is_array($office_rate)?json_encode($office_rate,JSON_UNESCAPED_UNICODE):'not_in_cache')."\n";
          echo 'LIVE_RATE_NOT_STALE='.($rate_updated>0 && $rate_updated>=time()-86400?'YES':'NO')."\n";
          // Read only the tail of current plugin logs. Output aggregated counts, no offer IDs or secrets.
          $logfiles=glob($root.'/wa-log/ozonstocksync*.log');
          echo 'OZS_LOG_FILES='.count($logfiles)."\n";
          foreach(array_slice($logfiles,0,12) as $logfile){
              $size=@filesize($logfile);
              if($size===false || $size<1)continue;
              $bytes=@file_get_contents($logfile,false,null,max(0,$size-300000),300000);
              if(!is_string($bytes))continue;
              $lines=preg_split('/\\r?\\n/',$bytes);
              $last_rfbs='';$last_account='';$last_finish='';$last_price='';$rfbs_count=0;$price_errors=0;
              foreach($lines as $line){
                  if(strpos($line,'LIVE_RFBS_')!==false){$last_rfbs=substr($line,0,19);$rfbs_count++;}
                  if(strpos($line,'ACCOUNT_MODE:')!==false)$last_account=substr($line,0,19);
                  if(strpos($line,'FINISH_ACCOUNTS:')!==false)$last_finish=substr($line,0,19);
                  if(strpos($line,'ACCOUNT_PRICES_FINISH:')!==false)$last_price=substr($line,0,19);
                  if(strpos($line,'PRICE_SKIP_NO_LIVE_RFBS')!==false)$price_errors++;
              }
              echo 'OZS_LOG_SUMMARY='.basename($logfile).' / bytes='.$size.' / last_rfbs='.$last_rfbs.' / rfbs_hits='.$rfbs_count.' / last_mode='.$last_account.' / last_finish='.$last_finish.' / last_price='.$last_price.' / missing_rate_skips='.$price_errors."\n";
          }



          require_once $root.'/wa-apps/shop/plugins/ozonstocksync/lib/classes/shopOzonstocksyncPluginSync.class.php';
          $rc=new ReflectionClass('shopOzonstocksyncPluginSync');
          $create_set_id=$rc->getConstant('CREATE_SET_ID');
          $create_set_name=$rc->getConstant('CREATE_SET_NAME');
          $model=new waModel();
          $create_set=$model->query("SELECT id,name,type,count FROM shop_set WHERE id=s:id LIMIT 1",array('id'=>$create_set_id))->fetchAssoc();
          $allowlist_ok=($create_set && (string)$create_set['name']===$create_set_name && (int)$create_set['type']===0);
          echo 'CREATE_SET_ID='.(string)$create_set_id."\n";
          echo 'CREATE_SET_NAME='.(string)$create_set_name."\n";
          echo 'CREATE_SET_COUNT='.($create_set?(int)$create_set['count']:-1)."\n";
          echo 'CREATE_ALLOWLIST='.($allowlist_ok?'OK':'FAIL')."\n";

          $sync_source=file_get_contents($root.'/wa-apps/shop/plugins/ozonstocksync/lib/classes/shopOzonstocksyncPluginSync.class.php');
          $create_pos=strpos($sync_source,'createMissingProductsForAccount($account');
          $mapping_pos=strpos($sync_source,'foreach ($account[\'mappings\'] as $mapping)');
          $create_before_sync=($create_pos!==false && $mapping_pos!==false && $create_pos<$mapping_pos);
          $saved_remote_guard=(strpos($sync_source,'PRODUCT_INFO_LIST_URL')!==false && strpos($sync_source,'saved_ozon_product_id')!==false);
          $second_guard=(strpos($sync_source,'CREATE_ABORT_SECOND_EXISTENCE_CHECK')!==false);
          echo 'CREATE_BEFORE_STOCK_PRICE='.($create_before_sync?'OK':'FAIL')."\n";
          echo 'SAVED_ID_REMOTE_GUARD='.($saved_remote_guard?'OK':'FAIL')."\n";
          echo 'SECOND_PREIMPORT_GUARD='.($second_guard?'OK':'FAIL')."\n";
          echo 'TYPE_ROWS='.count($m[0])."\n";
          echo 'SAVED_TYPE_MARGINS='.(is_array($tm)?count($tm):0)."\n";
          echo 'ACQUIRING_PERCENT='.(string)$p->getSettings('acquiring_percent')."\n";
          echo 'TARGET_MARGIN_PERCENT='.(string)$p->getSettings('target_margin_percent')."\n";
          echo 'MIN_MARGIN_PERCENT='.(string)$p->getSettings('min_margin_percent')."\n";
          echo 'UPDATE_STOCKS='.(string)$p->getSettings('update_stocks')."\n";
          echo 'UPDATE_PRICES='.(string)$p->getSettings('update_prices')."\n";
          echo 'DRY_RUN='.(string)$p->getSettings('dry_run')."\n";

          $stocks=$model->query("SELECT id,name FROM shop_stock ORDER BY id")->fetchAll();
          echo 'WEBASYST_STOCKS='.count($stocks)."\n";
          foreach($stocks as $s){echo 'STOCK_'.(int)$s['id'].'='.(string)$s['name']."\n";}

          $rm=new ReflectionMethod($p,'serializeMappingRows');
          $rm->setAccessible(true);
          $sample=$rm->invoke($p,array(
              array('set_id'=>'sample_set','ozon_warehouse_id'=>123456,'webasyst_stock_ids'=>array('1','2'),'reserve'=>1),
              array('set_id'=>'sample_general','ozon_warehouse_id'=>654321,'webasyst_stock_ids'=>array('general'),'reserve'=>0)
          ));
          echo 'SERIALIZE_SAMPLE='.str_replace("\n",' | ',$sample)."\n";
          $serializer_ok=(strpos($sample,'sample_set;123456;1,2;1')!==false && strpos($sample,'sample_general;654321;;0')!==false);

          $sync=new shopOzonstocksyncPluginSync(array());
          $rpm=new ReflectionMethod($sync,'parseMappings');
          $rpm->setAccessible(true);
          $parsed=$rpm->invoke($sync,"sample_set;123456;1,2;1");
          $parser_ok=(isset($parsed[0]['webasyst_stock_id']) && $parsed[0]['webasyst_stock_id']==='1,2');

          // Read-only live probe of the new duplicate guard. No product/import call is made.
          $guard_api_ok=false;
          $guard_detected=false;
          $client_id=trim((string)$p->getSettings('client_id'));
          $api_key=trim((string)$p->getSettings('api_key'));
          if($client_id!=='' && $api_key!==''){
              $samples=$model->query("
                  SELECT e.ozon_product_id,e.ozon_offer_id,e.shop_sku_id,s.sku
                  FROM ozon_exported_product e
                  INNER JOIN shop_product_skus s ON s.id=e.shop_sku_id
                  WHERE e.ozon_product_id>0 AND s.sku IS NOT NULL AND s.sku<>''
                  ORDER BY e.id DESC
                  LIMIT 10
              ")->fetchAll();
              $grm=new ReflectionMethod($sync,'getRemoteExistingOfferIds');
              $grm->setAccessible(true);
              foreach($samples as $sample){
                  $offers=array((string)$sample['sku']);
                  if(isset($sample['ozon_offer_id']) && (string)$sample['ozon_offer_id']!=='' && (string)$sample['ozon_offer_id']!=='0'){
                      $offers[]=(string)$sample['ozon_offer_id'];
                  }
                  $skus=array();
                  if(isset($sample['ozon_offer_id']) && ctype_digit((string)$sample['ozon_offer_id']) && (string)$sample['ozon_offer_id']!=='0'){
                      $skus[]=(string)$sample['ozon_offer_id'];
                  }
                  $guard=$grm->invoke($sync,$offers,$client_id,$api_key,array((string)$sample['ozon_product_id']),$skus);
                  if(!empty($guard['ok'])){
                      $guard_api_ok=true;
                      if(!empty($guard['existing'])){
                          $guard_detected=true;
                          break;
                      }
                  }
              }
          }
          echo 'DUPLICATE_GUARD_API='.($guard_api_ok?'OK':'FAIL')."\n";
          echo 'DUPLICATE_GUARD_DETECTED='.($guard_detected?'YES':'NO_MATCH_IN_SAMPLE')."\n";

          $ui_ok=(strpos($html,'ozs-stock-picker')!==false && strpos($html,'_mapping_rows_present')!==false);
          $ok=($p->getVersion()==='1.7.1' && count($m[0])>0 && $serializer_ok && $parser_ok && $ui_ok && $allowlist_ok && $create_before_sync && $saved_remote_guard && $second_guard && $guard_api_ok);
          echo 'SERIALIZER='.($serializer_ok?'OK':'FAIL')."\n";
          echo 'PARSER='.($parser_ok?'OK':'FAIL')."\n";
          echo 'MULTI_STOCK_UI='.($ui_ok?'OK':'FAIL')."\n";
          echo 'VERIFY_STATUS='.($ok?'OK':'FAIL')."\n";
          exit($ok?0:2);
          ?>'''
                  remote="cat >/tmp/ozs_verify.php <<'PHP'\n"+php+"\nPHP\nchown web:web /tmp/ozs_verify.php\nsu -s /bin/bash web -c 'php -d display_errors=1 -d log_errors=0 /tmp/ozs_verify.php'\nrm -f /tmp/ozs_verify.php"
                  p=subprocess.run(['ssh','-i',key,'-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=/dev/null','root@'+VM_IP,remote],text=True,capture_output=True,timeout=120)
                  if p.returncode: raise SystemExit(p.stderr)
                  REPORT.parent.mkdir(parents=True,exist_ok=True); REPORT.write_text(p.stdout,encoding='utf-8')
              finally:
                  try:req(f'https://api-ms.netangels.ru/api/v1/cloud/vms/{VM_ID}/ssh/{kid}/','DELETE',None,headers)
                  except Exception:pass
          PY
      - name: Save verify report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          test -f .deploy-probe/ozonstocksync-live-verify.txt || echo "VERIFY_STATUS=FAILED_NO_REPORT" > .deploy-probe/ozonstocksync-live-verify.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/ozonstocksync-live-verify.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save ozonstocksync live verification [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
