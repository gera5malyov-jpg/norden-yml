name: Kitimages Webasyst diagnostic once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kitimages-webasyst-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Webasyst and Installer API
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, requests
          base = "https://profikompany.ru"
          token = (os.environ.get("WEBASYST_API_TOKEN") or "").strip()
          if not token:
              raise SystemExit("WEBASYST_API_TOKEN missing")
          s = requests.Session()
          s.headers.update({"Accept":"application/json","User-Agent":"kitimages-diagnostic/1.0"})
          def call(method, params=None):
              q = dict(params or {})
              q["format"] = "json"
              q["access_token"] = token
              r = s.get(f"{base}/api.php/{method}", params=q, timeout=60, allow_redirects=True)
              try:
                  data = r.json()
              except Exception:
                  data = {"non_json": r.text[:300]}
              safe = data
              if isinstance(data, dict) and "error" in data:
                  safe = {"error": data.get("error"), "error_description": data.get("error_description")}
              print(json.dumps({"method":method,"status":r.status_code,"data":safe}, ensure_ascii=False))
              return r.status_code, data
          call("shop.type.getList")
          call("installer.product.list", {"slugs":"shop/plugins/kitimages","fields":"requirements,tags"})
          PY
