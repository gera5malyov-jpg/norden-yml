name: Diagnose Norden duplicate supplier codes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-norden-duplicate-supplier-codes-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBASYST_BASE_URL: https://profikompany.ru
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install requests
      - name: Inspect duplicate Norden supplier codes read-only
        run: |
          python - <<'PY'
          import json
          from webasyst.client import WebasystClient

          TARGETS = {
              "CH-226C-OA2016-OS800",
              "CH-202A-OA2000-OS800",
              "815A-AF03-T09",
              "A2067 black leather",
              "216A-Chrome-2D-B-BB",
              "216B-Chrome-2D-B-BB",
              "C2067 black leather",
              "HY-815C",
              "HY-815CL",
          }

          wa = WebasystClient(min_request_interval=0)
          out = {code: [] for code in sorted(TARGETS)}
          offset = 0
          while True:
              payload = wa.call('shop.product.search', params={
                  'hash': 'type/142',
                  'offset': offset,
                  'limit': 1000,
                  'fields': '*,skus,stock_counts',
              })
              if isinstance(payload, dict):
                  rows = payload.get('products') or payload.get('items') or []
                  if isinstance(rows, dict):
                      rows = list(rows.values())
              elif isinstance(payload, list):
                  rows = payload
              else:
                  rows = []
              for product in rows:
                  skus = product.get('skus') or []
                  if isinstance(skus, dict):
                      skus = list(skus.values())
                  for sku in skus:
                      code = str(sku.get('name') or '').strip()
                      if code not in TARGETS:
                          continue
                      out[code].append({
                          'product_id': str(product.get('id') or ''),
                          'product_name': str(product.get('name') or ''),
                          'product_status': product.get('status'),
                          'sku_id': str(sku.get('id') or ''),
                          'internal_sku': str(sku.get('sku') or ''),
                          'supplier_code': code,
                          'sku_status': sku.get('status'),
                          'available': sku.get('available'),
                          'purchase_price': sku.get('purchase_price'),
                          'price': sku.get('price'),
                          'compare_price': sku.get('compare_price'),
                      })
              if len(rows) < 1000:
                  break
              offset += len(rows)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
