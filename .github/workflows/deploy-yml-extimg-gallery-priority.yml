name: Prefer external images in storefront gallery
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths:
      - .github/workflows/deploy-yml-extimg-gallery-priority.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profikompany-storefront-theme
  cancel-in-progress: false
jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guarded theme patch with automatic rollback
        run: python -u storefront/yml_extimg_priority_fix.py
