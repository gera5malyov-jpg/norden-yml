name: Perf65 - MySQL index inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf65-readonly.yml'
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/perf65_db_index_readonly.py
      - run: python storefront/perf65_db_index_readonly.py
