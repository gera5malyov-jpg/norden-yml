name: Samson KIT document API probe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-doc-api-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect KIT variant and product document-related fields
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, requests
          base='https://api.kit.yandex.net'
          h={'Authorization':'Bearer '+os.environ['YANDEX_KIT_TOKEN'],'Accept':'application/json'}
          r=requests.get(base+'/v1/variants',headers=h,params={'page':1,'per_page':100},timeout=60)
          r.raise_for_status(); p=r.json(); rows=p.get('variants',[]) if isinstance(p,dict) else p
          found=[x for x in rows if str(x.get('sku','')).strip()=='SAMS-100327']
          if len(found)!=1: raise RuntimeError(f'Expected one SAMS-100327, found {len(found)}')
          v=found[0]; vid=str(v.get('id')); pid=str(v.get('product_id'))
          vd=requests.get(base+'/v1/variants/'+vid,headers=h,timeout=60); vd.raise_for_status(); vo=vd.json()
          pd=requests.get(base+'/v1/products/'+pid,headers=h,timeout=60); print('PRODUCT_STATUS='+str(pd.status_code)); po=pd.json() if pd.ok else {'text':pd.text[:500]}
          def inspect(label,obj):
              if not isinstance(obj,dict):
                  print(label+'_TYPE='+type(obj).__name__); return
              print(label+'_KEYS='+json.dumps(sorted(obj.keys()),ensure_ascii=False))
              interesting={}
              for k,val in obj.items():
                  kl=str(k).lower()
                  if any(word in kl for word in ('doc','file','media','attach','cert')):
                      interesting[k]=val
              print(label+'_INTERESTING='+json.dumps(interesting,ensure_ascii=False)[:8000])
          inspect('VARIANT',vo)
          inspect('PRODUCT',po)
          PY
