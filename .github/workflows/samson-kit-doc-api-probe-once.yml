name: Samson KIT document API probe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-doc-api-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect KIT file and document-related shapes
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, requests, time
          base='https://api.kit.yandex.net'
          h={'Authorization':'Bearer '+os.environ['YANDEX_KIT_TOKEN'],'Accept':'application/json'}

          fr=requests.get(base+'/v1/files',headers=h,params={'page':1,'per_page':20},timeout=60)
          print('FILES_STATUS='+str(fr.status_code))
          if fr.ok:
              fp=fr.json()
              print('FILES_KEYS='+json.dumps(sorted(fp.keys()) if isinstance(fp,dict) else ['<list>'],ensure_ascii=False))
              rows=fp.get('files',[]) if isinstance(fp,dict) else fp
              print('FILES_SAMPLE='+json.dumps(rows[:3],ensure_ascii=False)[:12000])
          else:
              print('FILES_ERROR='+fr.text[:1000])

          for path in ('/v1/files','/v1/variants'):
              op=requests.options(base+path,headers=h,timeout=60)
              print('OPTIONS '+path+' status='+str(op.status_code)+' allow='+str(op.headers.get('Allow'))+' body='+op.text[:500])

          examples=[]
          total_seen=0
          for page in range(1,21):
              r=requests.get(base+'/v1/variants',headers=h,params={'page':page,'per_page':100},timeout=60)
              r.raise_for_status(); p=r.json(); rows=p.get('variants',[]) if isinstance(p,dict) else p
              if not rows: break
              total_seen += len(rows)
              for row in rows:
                  media=row.get('media') or []
                  unusual=[m for m in media if isinstance(m,dict) and str(m.get('type','')).upper()!='IMAGE']
                  if unusual:
                      examples.append({'id':row.get('id'),'sku':row.get('sku'),'media':unusual})
                      if len(examples)>=5: break
              if len(examples)>=5: break
              time.sleep(0.4)
          print('SCANNED_VARIANTS='+str(total_seen))
          print('NON_IMAGE_MEDIA='+json.dumps(examples,ensure_ascii=False)[:16000])
          PY
