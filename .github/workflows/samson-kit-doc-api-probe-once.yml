name: Samson KIT document API probe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-doc-api-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read current KIT attachments
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, requests
          base='https://api.kit.yandex.net'
          h={'Authorization':'Bearer '+os.environ['YANDEX_KIT_TOKEN'],'Accept':'application/json'}
          r=requests.get(base+'/v1/variants',headers=h,params={'page':1,'per_page':100},timeout=60)
          r.raise_for_status(); p=r.json(); rows=p.get('variants',[]) if isinstance(p,dict) else p
          found=[x for x in rows if str(x.get('sku','')).strip()=='SAMS-100327']
          if len(found)!=1: raise RuntimeError(f'Expected one SAMS-100327, found {len(found)}')
          vid=str(found[0].get('id'))
          rr=requests.get(base+f'/v1/variants/{vid}/attachments',headers=h,timeout=60)
          print('ATTACHMENTS_STATUS='+str(rr.status_code))
          print('ATTACHMENTS_BODY='+rr.text[:12000])
          rr.raise_for_status()
          PY
      - name: Read exact attachment OpenAPI schemas offline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ztemerbekov/a1-yandex-kit-skills.git /tmp/a1-kit
          cd /tmp/a1-kit
          node skills/a1-yandex-kit-catalog/scripts/search_docs.mjs --operation GetVariantAttachments
          node skills/a1-yandex-kit-catalog/scripts/search_docs.mjs --operation CreateVariantAttachment
          node skills/a1-yandex-kit-catalog/scripts/search_docs.mjs --operation UpdateVariantAttachment
          node skills/a1-yandex-kit-catalog/scripts/search_docs.mjs --operation DeleteVariantAttachment
          node skills/a1-yandex-kit-catalog/scripts/search_docs.mjs --operation UploadFile
