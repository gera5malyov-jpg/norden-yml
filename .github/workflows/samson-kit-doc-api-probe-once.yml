name: Samson KIT document API probe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-doc-api-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect KIT product-card and file document shapes
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, requests
          base='https://api.kit.yandex.net'
          h={'Authorization':'Bearer '+os.environ['YANDEX_KIT_TOKEN'],'Accept':'application/json'}

          r=requests.get(base+'/v1/variants',headers=h,params={'page':1,'per_page':100},timeout=60)
          r.raise_for_status(); p=r.json(); rows=p.get('variants',[]) if isinstance(p,dict) else p
          found=[x for x in rows if str(x.get('sku','')).strip()=='SAMS-100327']
          if len(found)!=1: raise RuntimeError(f'Expected one SAMS-100327, found {len(found)}')
          card_id=str(found[0].get('product_card_id') or '').strip()
          print('PRODUCT_CARD_ID='+card_id)

          candidates=[
              '/v1/product_cards/'+card_id,
              '/v1/product-cards/'+card_id,
              '/v1/product_cards',
              '/v1/product-cards',
          ]
          for path in candidates:
              params={'id':card_id} if path.endswith(('product_cards','product-cards')) else None
              rr=requests.get(base+path,headers=h,params=params,timeout=60)
              print('GET '+path+' STATUS='+str(rr.status_code))
              print('BODY='+rr.text[:12000])

          for typ in ('DOCUMENT','FILE','CERTIFICATE','OTHER'):
              fr=requests.get(base+'/v1/files',headers=h,params={'page':1,'per_page':10,'type':typ},timeout=60)
              print('FILES_TYPE_'+typ+'_STATUS='+str(fr.status_code))
              print('FILES_TYPE_'+typ+'_BODY='+fr.text[:6000])
          PY
