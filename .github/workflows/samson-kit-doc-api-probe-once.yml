name: Samson KIT document API probe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-doc-api-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspect Samson certificates and KIT current card read-only
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import json, os
          from samson_kit.http import SafeSession
          from samson_kit.samson_client import SamsonClient
          from samson_kit.kit_client import KitClient, extract_items
          from samson_kit.mapper import normalize_sku

          http=SafeSession()
          samson=SamsonClient(os.environ['SAMSON_API_KEY'],http)
          kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],http)

          source=None
          for i,row in enumerate(samson.iter_skus(),1):
              if str(row.get('sku','')).strip()=='100327':
                  source=row; break
              if i>=1000: break
          if source is None: raise RuntimeError('Samson SKU 100327 not found in first 1000 rows')
          item=normalize_sku(source)
          print('SAMSON_DOCUMENT_URLS='+json.dumps(item.document_urls,ensure_ascii=False))
          print('SAMSON_CERT_LIST='+json.dumps(source.get('certificate_list'),ensure_ascii=False)[:12000])
          print('SAMSON_CERT_EXT_LIST='+json.dumps(source.get('certificate_extended_list'),ensure_ascii=False)[:12000])

          vp=kit._get('/v1/variants',{'page':1,'per_page':100})
          variants=[v for v in extract_items(vp) if str(v.get('sku','')).strip()=='SAMS-100327']
          if len(variants)!=1: raise RuntimeError(f'Expected one SAMS-100327 on first KIT page, found {len(variants)}')
          variant=variants[0]; vid=str(variant.get('id'))
          detail=kit._get('/v1/variants/'+vid)

          wanted_chars=[]
          for text in ('Сертификаты','Расширенные сертификаты'):
              cp=kit._get('/v1/characteristics',{'page':1,'per_page':100,'search_text':text})
              wanted_chars.extend(extract_items(cp))
          char_titles={str(c.get('id')):str(c.get('title')) for c in wanted_chars}
          mapped=[]
          for row in detail.get('characteristics') or []:
              cid=str(row.get('characteristic_id') or row.get('id') or '')
              if cid in char_titles:
                  mapped.append({'characteristic_id':cid,'title':char_titles.get(cid),'row':row})
          print('KIT_LEGACY_CERT_CHARACTERISTICS='+json.dumps(mapped,ensure_ascii=False)[:12000])
          attachments=kit.list_variant_attachments(vid)
          print('KIT_ATTACHMENTS='+json.dumps(attachments,ensure_ascii=False))
          for a in attachments:
              fid=str(a.get('file_id') or '')
              if fid:
                  try: print('KIT_FILE_'+fid+'='+json.dumps(kit._get('/v1/files/'+fid),ensure_ascii=False))
                  except Exception as exc: print('KIT_FILE_ERROR_'+fid+'='+str(exc))
          PY
      - name: Read exact UpdateVariant characteristic schema offline
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ztemerbekov/a1-yandex-kit-skills.git /tmp/a1-kit
          cd /tmp/a1-kit
          node skills/a1-yandex-kit-catalog/scripts/search_docs.mjs --operation UpdateVariant > /tmp/update-variant.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/update-variant.json'))
          req=(d.get('request') or {}).get('schema') or {}
          props=req.get('properties') or {}
          print('UPDATE_VARIANT_CONTENT_TYPE='+str((d.get('request') or {}).get('contentType')))
          print('CHARACTERISTICS_SCHEMA='+json.dumps(props.get('characteristics'),ensure_ascii=False,indent=2))
          print('UPDATE_VARIANT_REQUIRED='+json.dumps(req.get('required'),ensure_ascii=False))
          PY
