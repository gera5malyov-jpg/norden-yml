name: Inspect KIT characteristic payload once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-kit-characteristic-payload-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Read variant characteristic shape
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          PYTHONPATH=samson-kit python - <<'PY'
          import os,json
          from samson_kit.http import SafeSession
          from samson_kit.kit_client import KitClient
          kit=KitClient(os.environ['YANDEX_KIT_TOKEN'],SafeSession())
          d=kit.get_variant('01a0b3a8-6f1c-76a0-8701-83fd8c83173b')
          print('CHAR_SAMPLE='+json.dumps((d.get('characteristics') or [])[:3],ensure_ascii=False))
          PY
