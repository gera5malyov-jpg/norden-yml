name: WB DBS chat diagnostic

on:
  push:
    paths:
      - 'scripts/check_wb_order_chats.py'
      - '.github/workflows/wb-dbs-chat-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить связь DBS-заказов и чатов
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
        run: python scripts/check_wb_order_chats.py
