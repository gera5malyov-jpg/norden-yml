name: Universal YML PRO photo diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
      UNIVERSAL_PROFILE_IDS: '20'
      UNIVERSAL_APPLY: '0'
      UNIVERSAL_STRICT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/universal-yml-import-20261015
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only single supplier diagnostic
        run: python -u scripts/run_universal_ymlpro_photos.py
