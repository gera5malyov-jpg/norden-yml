name: Report new Norden chairs/stools for table only

on:
  push:
    paths:
      - 'catalog/report_new_norden_chairs_stools_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests "gspread>=6.1,<7" "google-auth>=2.35,<3"
      - name: Build read-only report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CATALOG_SPREADSHEET_ID: '1DvMYvKRr8fX8mfLFaeJCXCccQofPViPcIP2CgIctc8w'
          CATALOG_SHEET: 'Норден'
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
        run: python catalog/report_new_norden_chairs_stools_table_only.py
      - name: Save report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/norden_new_chairs_stools_table_only_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save new Norden chairs/stools table-only report'
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i * 3))
            done
          fi
