name: AtlasPage ID login check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/atlaspage-login-check.yml"

permissions:
  contents: read

jobs:
  check-login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLASPAGE_ID: ${{ secrets.ATLASPAGE_ID }}
    steps:
      - name: Check ID secret is available
        shell: bash
        run: |
          test -n "$ATLASPAGE_ID" || { echo "ATLASPAGE_ID: MISSING"; exit 11; }
          echo "ATLASPAGE_ID: present"

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium --with-deps >/dev/null

      - name: Test AtlasPage login by ID only
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          const userId = process.env.ATLASPAGE_ID || '';
          if (!userId) {
            console.error('ATLASPAGE_ID is unavailable.');
            process.exit(20);
          }

          const norm = s => (s || '').replace(/\s+/g, ' ').trim();
          const escapedId = userId.replace(/[.*+?^$()|[\]\\{}]/g, '\\$&');
          const safe = s => norm(s).replace(new RegExp(escapedId, 'g'), '[ID]');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              locale: 'ru-RU',
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
            });
            const page = await context.newPage();

            try {
              const response = await page.goto('https://atlaspage51.com/lk', {
                waitUntil: 'domcontentloaded',
                timeout: 45000
              });

              console.log('SITE_HTTP:', response ? response.status() : 'no-response');
              console.log('SITE_REACHABLE:', response && response.status() < 500 ? 'yes' : 'no');
              await page.waitForTimeout(1800);

              const visibleButtons = await page.locator('button:visible, [role="button"]:visible, [role="tab"]:visible').allTextContents();
              console.log('VISIBLE_CONTROLS:', JSON.stringify(visibleButtons.map(safe).filter(Boolean).slice(0, 40)));

              const idModeCandidates = [
                page.getByRole('button', { name: /^по\s+id$/i }),
                page.getByRole('tab', { name: /^по\s+id$/i }),
                page.getByText(/^по\s+id$/i, { exact: true }),
                page.getByRole('button', { name: /вход\s+по\s+id/i }),
                page.getByRole('tab', { name: /вход\s+по\s+id/i }),
                page.getByText(/вход\s+по\s+id/i, { exact: false }),
                page.getByRole('button', { name: /^id$/i }),
                page.getByRole('tab', { name: /^id$/i }),
                page.getByText(/^id$/i, { exact: true })
              ];

              let idModeSelected = false;
              for (const locator of idModeCandidates) {
                try {
                  const first = locator.first();
                  if (await first.isVisible({ timeout: 800 })) {
                    await first.click({ timeout: 3000 });
                    idModeSelected = true;
                    await page.waitForTimeout(700);
                    break;
                  }
                } catch (_) {}
              }
              console.log('ID_MODE_SELECTED:', idModeSelected ? 'yes' : 'not-found');

              const visibleInputs = page.locator('input:visible');
              const count = await visibleInputs.count();
              const meta = [];
              for (let i = 0; i < count; i++) {
                const el = visibleInputs.nth(i);
                meta.push({
                  type: (await el.getAttribute('type')) || '',
                  name: (await el.getAttribute('name')) || '',
                  id: (await el.getAttribute('id')) || '',
                  placeholder: (await el.getAttribute('placeholder')) || ''
                });
              }
              console.log('VISIBLE_INPUTS:', JSON.stringify(meta));

              let idInput = page.locator([
                'input:visible[name="id"]',
                'input:visible[name*="user_id" i]',
                'input:visible[name*="account_id" i]',
                'input:visible[id="id"]',
                'input:visible[id*="user_id" i]',
                'input:visible[placeholder*="ID" i]'
              ].join(',')).first();

              if (await idInput.count() === 0 || !(await idInput.isVisible().catch(() => false))) {
                idInput = page.locator(
                  'input:visible:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="password"])'
                ).first();
              }

              if (await idInput.count() === 0 || !(await idInput.isVisible().catch(() => false))) {
                console.error('LOGIN_FORM: ID input not found');
                process.exitCode = 31;
                return;
              }

              await idInput.fill(userId);

              let submit = page.locator('button:visible[type="submit"], input:visible[type="submit"]').first();
              if (await submit.count() === 0 || !(await submit.isVisible().catch(() => false))) {
                submit = page.getByRole('button', { name: /войти|продолжить|login|далее/i }).first();
              }
              if (await submit.count() === 0 || !(await submit.isVisible().catch(() => false))) {
                console.error('LOGIN_FORM: submit control not found');
                process.exitCode = 33;
                return;
              }

              await submit.click({ timeout: 5000 });
              await Promise.race([
                page.waitForLoadState('networkidle', { timeout: 20000 }).catch(() => {}),
                page.waitForTimeout(5000)
              ]);
              await page.waitForTimeout(1800);

              const finalUrl = page.url();
              const bodyText = safe(await page.locator('body').innerText().catch(() => ''));
              const controlsAfter = await page.locator('button:visible, [role="button"]:visible, [role="tab"]:visible').allTextContents();

              console.log('FINAL_URL:', finalUrl.replace(/[?#].*$/, ''));
              console.log('POST_LOGIN_CONTROLS:', JSON.stringify(controlsAfter.map(safe).filter(Boolean).slice(0, 40)));

              const loginFormStillVisible =
                (await page.locator('input:visible').count()) > 0 &&
                /(телефон|почт|email|вход\s+по\s+id|номер телефона)/i.test(bodyText);

              const authenticatedSignals =
                /(подписк|сервер|vpn|wireguard|amnezia|локац|конфиг|выйти|личный кабинет)/i.test(bodyText);

              const looksAuthenticated = authenticatedSignals && !loginFormStillVisible;
              console.log('LOGIN_SUCCESS:', looksAuthenticated ? 'yes' : 'no');

              if (!looksAuthenticated) {
                const errorVisible = /(неверн|ошибк|invalid|incorrect|не найден|ист[её]к|заблок)/i.test(bodyText);
                console.log('AUTH_ERROR_VISIBLE:', errorVisible ? 'yes' : 'no');
                console.log('PAGE_TEXT_SAMPLE:', bodyText.slice(0, 1200));
                process.exitCode = 40;
              }
            } catch (err) {
              console.error('CHECK_ERROR:', err && err.message ? err.message : String(err));
              process.exitCode = 50;
            } finally {
              await browser.close();
            }
          })();
          NODE
