name: Samson resume complete import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-resume-complete.yml'
  workflow_dispatch:
    inputs:
      start_offset:
        description: 'Source SKU offset to continue from'
        required: true
        default: '0'
        type: string
      source_batch:
        description: 'Maximum Samson source rows to scan in this run'
        required: true
        default: '5000'
        type: string
      max_new:
        description: 'Maximum new KIT products to create in this run'
        required: true
        default: '550'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: samson-kit-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve continuation parameters
        id: params
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "offset=${{ inputs.start_offset }}" >> "$GITHUB_OUTPUT"
            echo "batch=${{ inputs.source_batch }}" >> "$GITHUB_OUTPUT"
            echo "max_new=${{ inputs.max_new }}" >> "$GITHUB_OUTPUT"
          else
            echo "offset=0" >> "$GITHUB_OUTPUT"
            echo "batch=5000" >> "$GITHUB_OUTPUT"
            echo "max_new=550" >> "$GITHUB_OUTPUT"
          fi
      - name: Create missing Samson products in current source window
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python -m samson_kit.cli             --new-only             --skip-items "${{ steps.params.outputs.offset }}"             --max-items "${{ steps.params.outputs.batch }}"             --max-new "${{ steps.params.outputs.max_new }}"             --report /tmp/samson-resume.json
      - name: Evaluate progress
        id: progress
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          path='/tmp/samson-resume.json'
          if not os.path.exists(path):
              print('continue=false')
              print('reason=no_report')
              raise SystemExit
          r=json.load(open(path,encoding='utf-8'))
          offset=int('${{ steps.params.outputs.offset }}')
          batch=int('${{ steps.params.outputs.batch }}')
          max_new=int('${{ steps.params.outputs.max_new }}')
          seen=int(r.get('samson_products_seen') or 0)
          created=int(r.get('new_products_created') or 0)
          errors=int(r.get('error_count') or 0)
          status=str(r.get('status') or '')
          next_offset=offset+seen
          # Continue when this run stopped because either scan-window or create-cap was reached.
          more=(seen>=batch or created>=max_new)
          ok=(status=='ok' and errors==0 and seen>0)
          print('continue=' + ('true' if ok and more else 'false'))
          print('next_offset=' + str(next_offset))
          print('seen=' + str(seen))
          print('created=' + str(created))
          print('errors=' + str(errors))
          print('status=' + status)
          print('reason=' + ('continue' if ok and more else 'complete_or_needs_review'))
          PY
      - name: Print compact continuation report
        if: always()
        shell: bash
        run: |
          cat /tmp/samson-resume.json || true
          echo "next_offset=${{ steps.progress.outputs.next_offset }}"
          echo "continue=${{ steps.progress.outputs.continue }}"
      - name: Queue next continuation window
        if: steps.progress.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_OFFSET: ${{ steps.progress.outputs.next_offset }}
          SOURCE_BATCH: ${{ steps.params.outputs.batch }}
          MAX_NEW: ${{ steps.params.outputs.max_new }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          url=f"https://api.github.com/repos/{repo}/actions/workflows/samson-resume-complete.yml/dispatches"
          body=json.dumps({
              'ref':'main',
              'inputs':{
                  'start_offset':os.environ['NEXT_OFFSET'],
                  'source_batch':os.environ['SOURCE_BATCH'],
                  'max_new':os.environ['MAX_NEW'],
              }
          }).encode()
          req=urllib.request.Request(url,data=body,method='POST',headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json',
          })
          with urllib.request.urlopen(req,timeout=30) as resp:
              if resp.status != 204:
                  raise RuntimeError(f'dispatch status {resp.status}')
          PY
