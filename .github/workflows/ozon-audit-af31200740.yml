name: Ozon audit AF-31200740 promo flag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-audit-af31200740.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: python -m pip install requests
      - name: Audit target and all disabled auto-action flags
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, requests, time
          S=requests.Session()
          S.headers.update({
            "Client-Id":os.environ["OZON_CLIENT_ID"],
            "Api-Key":os.environ["OZON_API_KEY"],
            "Content-Type":"application/json"
          })
          BASE="https://api-seller.ozon.ru"
          def post(path, body):
            for i in range(10):
              r=S.post(BASE+path,json=body,timeout=120)
              if r.status_code==429:
                time.sleep(float(r.headers.get("Retry-After") or 2)); continue
              r.raise_for_status()
              return r.json()
            raise SystemExit("rate limit")
          items=[]; cur=""
          while True:
            d=post("/v5/product/info/prices",{"cursor":cur,"filter":{"visibility":"ALL"},"limit":1000})
            rows=d.get("items") or []
            items.extend(rows)
            nxt=d.get("cursor") or ""
            if not rows or not nxt or nxt==cur: break
            cur=nxt
          target=next((x for x in items if str(x.get("offer_id"))=="AF-31200740"),None)
          disabled=[x for x in items if not (x.get("price") or {}).get("auto_action_enabled")]
          print("TARGET_JSON",json.dumps(target,ensure_ascii=False,sort_keys=True))
          print("DISABLED_COUNT",len(disabled))
          print("DISABLED_SAMPLE",json.dumps([
            {"offer_id":x.get("offer_id"),"product_id":x.get("product_id"),"price":x.get("price")}
            for x in disabled[:20]
          ],ensure_ascii=False,sort_keys=True))
          PY
