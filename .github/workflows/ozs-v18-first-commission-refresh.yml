name: Ozon v1.8.0 first commission refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozs-v18-first-commission-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Commission-only API read, without changing prices or stocks
        run: python3 scripts/run_ozs_commissions_once.py
      - name: Save read-only report
        if: always()
        run: |
          mkdir -p .deploy-probe
          test -f .deploy-probe/ozonstocksync-v18-initial-rfbs-refresh.txt || echo 'REFRESH_NOT_COMPLETED' > .deploy-probe/ozonstocksync-v18-initial-rfbs-refresh.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/ozonstocksync-v18-initial-rfbs-refresh.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save initial Ozon commission-only refresh report [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
