name: PEK private quote Moscow to Tolyatti chairs

on:
  push:
    paths:
      - '.github/workflows/pek-private-tolyatti-quote-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate PEK private API quote
        env:
          PEK_LOGIN: ${{ secrets.PEK_LOGIN }}
          PEK_API_KEY: ${{ secrets.PEK_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, base64

          login=os.environ['PEK_LOGIN']; key=os.environ['PEK_API_KEY']
          auth='Basic '+base64.b64encode(f'{login}:{key}'.encode()).decode()
          base='https://kabinet.pecom.ru/api/v1'

          def post(path, body):
              data=json.dumps(body,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(base+path,data=data,headers={
                  'Authorization':auth,
                  'Content-Type':'application/json; charset=utf-8',
                  'User-Agent':'Mozilla/5.0'
              },method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read().decode('utf-8','replace')
                      return {'http':r.status,'data':json.loads(raw)}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: payload=json.loads(raw)
                  except: payload={'raw':raw}
                  return {'http':e.code,'data':payload}

          zone=post('/branches/findzonebyaddress/',{'address':'Россия, Самарская область, Тольятти'})
          zdata=zone['data']
          wid=None
          if isinstance(zdata,dict):
              wid=zdata.get('mainWarehouseId') or zdata.get('MainWarehouseId')
          if not wid:
              # tolerate wrapped response shapes
              def walk(x):
                  if isinstance(x,dict):
                      for k,v in x.items():
                          if k.lower()=='mainwarehouseid' and v: return v
                          r=walk(v)
                          if r: return r
                  elif isinstance(x,list):
                      for v in x:
                          r=walk(v)
                          if r: return r
              wid=walk(zdata)

          results={'zone_lookup':zone,'receiverWarehouseId':wid,'quotes':[]}
          scenarios=[
            ('working_053',0.60,0.58,1.52,0.53,64.0),
            ('conservative_0643',0.60,0.58,1.85,0.643,64.0)
          ]
          for name,w,l,h,vol,weight in scenarios:
              body={
                'currencyCode':'643',
                'types':[3],
                'receiverWarehouseId':wid,
                'isOpenCarSender':False,
                'isOpenCarReceiver':False,
                'isHyperMarket':False,
                'isInsurance':False,
                'isPickUp':True,
                'isDelivery':False,
                'needReturnDocuments':False,
                'needArrangeTransportationDocuments':False,
                'pickupServices':{'isLoading':False,'floor':0,'carryingDistance':0,'isElevator':False},
                'pickup':{'address':'Россия, Москва'},
                'cargos':[{
                  'length':l,'width':w,'height':h,'volume':vol,
                  'isHP':False,'sealingPositionsCount':0,'weight':weight
                } for _ in range(3)]
              }
              ans=post('/calculator/calculateprice/',body)
              results['quotes'].append({'scenario':name,'request':body,'response':ans})

          with open('pek-private-tolyatti-quote-result.json','w',encoding='utf-8') as f:
              json.dump(results,f,ensure_ascii=False,indent=2)
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Save private quote result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pek-private-tolyatti-quote-result.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Save private PEK Tolyatti quote result"
            git push
          fi
