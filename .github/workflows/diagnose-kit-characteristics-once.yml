name: Validate KIT characteristic fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-kit-characteristics-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pytest openpyxl requests pdfplumber reportlab
      - name: Syntax check
        run: python -m py_compile supplier_engine/kit_sync.py
      - name: Full supplier regression suite
        run: python -m pytest -q tests/test_supplier_engine.py tests/test_megasuppliers_contract.py
# trigger validation v4
