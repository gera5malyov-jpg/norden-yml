name: Central API health alert - one email only on confirmed failures
on:
  schedule:
    - cron: '38 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: central-api-health-alert
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      API_ALERT_DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install request client
        run: python -m pip install 'requests>=2.31,<3'
      - name: Compile and validate
        run: python -m py_compile scripts/central_api_health_notifier.py scripts/daily_api_health_check.py
      - name: Aggregate 20 API status checks and email only on failures
        run: python scripts/central_api_health_notifier.py
