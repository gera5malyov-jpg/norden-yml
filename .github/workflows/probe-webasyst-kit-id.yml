name: Probe Webasyst KIT ID feature
on:
  push:
    paths: ['catalog/probe_webasyst_kit_id_trigger.txt']
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - env:
          WEBASYST_BASE_URL: ${{ secrets.WEBASYST_BASE_URL }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: python catalog/probe_webasyst_kit_id.py
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add catalog/webasyst_kit_id_probe.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Webasyst KIT ID probe"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
