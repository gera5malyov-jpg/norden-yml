name: Ozon full catalog images to 3x4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-full-catalog-3x4.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ozon-full-catalog-3x4
  cancel-in-progress: false

jobs:
  range_00:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      START_BATCH: 0
      END_BATCH: 19
    steps:
      - name: Checkout fixed pipeline revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Process batches 0-19 sequentially
        run: bash ozon/catalog_3x4/run_range.sh
      - name: Upload range report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ozon-3x4-range-0-19
          path: ozon/catalog_3x4/range_reports_*/
          if-no-files-found: warn
          retention-days: 14

