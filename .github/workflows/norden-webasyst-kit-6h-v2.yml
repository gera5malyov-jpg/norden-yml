# Active guarded 6-hour Webasyst -> KIT synchronization
name: Norden Webasyst to KIT every 6 hours

on:
  schedule:
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/norden-webasyst-kit-6h-v2.yml'

permissions:
  contents: read

concurrency:
  group: norden-webasyst-kit-6h-v2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout pinned supplier sync code
        uses: actions/checkout@v4
        with:
          ref: 9ddf57e463ba40a7229fdbf0ad4233aa70a680bc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check openpyxl requests pdfplumber reportlab

      - name: Compile scheduled sync
        run: python -m py_compile supplier_engine/live_kit_scheduled_sync.py supplier_engine/kit_sync.py supplier_engine/live_kit_readonly_preflight.py

      - name: Preflight and sync categorized NORDEN-100 products
        id: sync
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python -m supplier_engine.live_kit_scheduled_sync \
            --mode apply \
            --type-name NORDEN-100 \
            --brand Norden \
            --max-create 100 \
            --max-eligible 5000 \
            --output scheduled-kit-sync.json

      - name: Save run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norden-webasyst-kit-${{ github.run_id }}
          path: scheduled-kit-sync.json
          if-no-files-found: warn
          retention-days: 14
