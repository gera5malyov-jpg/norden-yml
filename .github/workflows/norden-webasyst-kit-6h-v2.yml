# Active guarded 6-hour Webasyst -> KIT synchronization
name: Norden Webasyst to KIT every 6 hours

on:
  schedule:
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/norden-webasyst-kit-6h-v2.yml'

permissions:
  contents: read

concurrency:
  group: supplier-webasyst-1
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout pinned supplier sync code
        uses: actions/checkout@v4
        with:
          ref: c2ea8cf7861679801d6c6c4d69ec9669ea18ef79

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check openpyxl requests pdfplumber reportlab

      - name: Compile scheduled sync
        run: python -m py_compile supplier_engine/live_norden_scheduled_reconcile.py supplier_engine/live_kit_scheduled_sync.py supplier_engine/kit_sync.py scripts/dump_megasuppliers_links.py

      - name: Read current Norden supplier links
        env:
          NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
        run: |
          python scripts/dump_megasuppliers_links.py \
            --supplier-id 1 \
            --output norden-links.json

      - name: Reconcile Norden source with Webasyst
        id: webasyst_reconcile
        env:
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: |
          python -m supplier_engine.live_norden_scheduled_reconcile \
            --mode apply \
            --config supplier_engine/configs/norden_scheduled.json \
            --links norden-links.json \
            --max-create 3000 \
            --max-repair 500 \
            --output norden-webasyst-reconcile.json

      - name: Preflight and sync categorized NORDEN-100 products to KIT
        id: kit_sync
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python -m supplier_engine.live_kit_scheduled_sync \
            --mode apply \
            --type-name NORDEN-100 \
            --brand Norden \
            --max-create 5000 \
            --max-eligible 6000 \
            --output scheduled-kit-sync.json

      - name: Save run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norden-full-chain-${{ github.run_id }}
          path: |
            norden-webasyst-reconcile.json
            scheduled-kit-sync.json
          if-no-files-found: warn
          retention-days: 14
