name: Perf63 - Deep disk and SQL source audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf63-readonly.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/perf63_disk_sql_sources_readonly.py
      - run: python storefront/perf63_disk_sql_sources_readonly.py
