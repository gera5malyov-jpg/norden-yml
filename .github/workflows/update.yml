name: Update Norden YML

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate YML
        env:
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
        run: |
          sed -i "s/\${NORDEN_SECRET}/$NORDEN_SECRET/" generate_yml.py
          python generate_yml.py

      - name: Commit YML
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden.yml
          git commit -m "Update Norden YML" || exit 0
          git push
