name: TREEZ — проверить и дозагрузить фото

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Treez → KIT — каталог раз в 2 недели"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'treez-kit/repair_treez_images.py'
      - '.github/workflows/treez-repair-images.yml'

permissions:
  contents: write

concurrency:
  group: treez-repair-images
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: python -m pip install --disable-pip-version-check requests openpyxl playwright

      - name: Проверить все карточки TREEZ и дозагрузить фото
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: python treez-kit/repair_treez_images.py

      - name: Сохранить отчёт проверки фото
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          cp treez-kit/image_repair_report.json /tmp/treez-image-report.json 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/treez-image-report.json treez-kit/image_repair_report.json 2>/dev/null || true
          git add treez-kit/image_repair_report.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Обновить отчёт проверки фото TREEZ'
          git push origin HEAD:main || true
