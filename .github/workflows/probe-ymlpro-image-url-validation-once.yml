name: Diagnose YML Pro photo URL HEAD vs GET
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-ymlpro-image-url-validation-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe three pending supplier sources with no writes
        run: python3 scripts/probe_ymlpro_image_url_validation.py
