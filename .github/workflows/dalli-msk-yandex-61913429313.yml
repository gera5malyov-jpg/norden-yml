name: Create Dalli MSK Yandex 61913429313 v2
on:
  push:
    paths:
      - '.github/workflows/dalli-msk-yandex-61913429313.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - env:
          TARGET_EXTERNAL_ID: '61913429313'
          YANDEX_CAMPAIGN_ID: '93424614'
          SAFE_RESULT_PATH: 'dalli/yandex_order_61913429313_msk_basket_result.json'
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          DALLI_TOKEN_MSK: ${{ secrets.DALLI_TOKEN_MSK }}
        run: python scripts/create_dalli_msk_basket_from_yandex.py
      - name: Save result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add dalli/yandex_order_61913429313_msk_basket_result.json || true
          git diff --cached --quiet || git commit -m "Store Yandex Dalli result 61913429313"
          git push
