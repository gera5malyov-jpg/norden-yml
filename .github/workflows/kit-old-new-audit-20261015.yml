name: KIT old-new safe API readiness audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kit-old-new-audit-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-old-new-readonly-audit-20261015
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OLD_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
      NEW_TOKEN: ${{ secrets.KIT_New }}
    steps:
      - name: Read only audit of separate stores
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.parse,urllib.error
          tokens={'old':os.environ.get('OLD_TOKEN','').strip(),'new':os.environ.get('NEW_TOKEN','').strip()}
          print('Secret availability:',{k:bool(v) for k,v in tokens.items()})
          if not all(tokens.values()):
              raise SystemExit('Missing one of the secrets (YANDEX_KIT_TOKEN or KIT_New); no writes performed')
          if tokens['old']==tokens['new']:
              raise SystemExit('Old and new secrets hold the SAME token; no writes performed')
          endpoints=['/v1/warehouses','/v1/categories','/v1/characteristics','/v1/products','/v1/variants']
          for label,token in tokens.items():
              print('STORE:',label,flush=True)
              for path in endpoints:
                  q=urllib.parse.urlencode({'page':1,'per_page':5})
                  req=urllib.request.Request('https://api.kit.yandex.net'+path+'?'+q,headers={
                      'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'megapolis-kit-migration-audit/1.0'
                  })
                  try:
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          data=json.loads(resp.read().decode())
                      if isinstance(data,dict):
                          rows=next(((k,v) for k,v in data.items() if isinstance(v,list)),('',[]))
                          count=data.get('total_count',data.get('total',None))
                          res={'status':200,'count':count,'page_size':len(rows[1]),'list_key':rows[0],'top_keys':list(data.keys())[:12]}
                          if path in ('/v1/warehouses','/v1/categories'):
                              res['sample_titles']=[str(x.get('title') or x.get('name') or '')[:60] for x in rows[1][:3] if isinstance(x,dict)]
                      else:res={'status':200,'type':type(data).__name__}
                      print(path,json.dumps(res,ensure_ascii=False),flush=True)
                  except urllib.error.HTTPError as e:
                      print(path,json.dumps({'status':e.code},ensure_ascii=False),flush=True)
                  except Exception as e:
                      print(path,json.dumps({'error_type':type(e).__name__},ensure_ascii=False),flush=True)
          PY
