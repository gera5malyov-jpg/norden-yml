name: Audit all YML PRO image profiles
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/audit-all-ymlpro-photo-profiles.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/audit_all_ymlpro_photo_profiles.py
