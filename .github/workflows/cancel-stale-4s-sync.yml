name: Cancel stale 4S runs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-4s-sync.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale 4S runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN_ID in 35602742176 35618604987; do
            gh api --method POST repos/${{ github.repository }}/actions/runs/${RUN_ID}/cancel || true
            echo "Requested cancellation of stale run ${RUN_ID}"
          done
