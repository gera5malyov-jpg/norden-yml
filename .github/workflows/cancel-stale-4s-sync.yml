name: Cancel stale 4S sync once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-4s-sync.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale 4S KIT sync run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/runs/35602742176/cancel
          echo "Requested cancellation of stale run 35602742176"
