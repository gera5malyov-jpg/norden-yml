name: Sync numeric KIT ID to Webasyst
on:
  workflow_dispatch:
    inputs:
      target_articles:
        description: Comma-separated articles, empty = all rows with both IDs
        required: false
        type: string
permissions: {contents: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests "gspread>=6.1,<7" "google-auth>=2.35,<3"
      - env:
          CATALOG_SPREADSHEET_ID: '1DvMYvKRr8fX8mfLFaeJCXCccQofPViPcIP2CgIctc8w'
          CATALOG_SHEET: 'Норден'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          WEBASYST_BASE_URL: ${{ secrets.WEBASYST_BASE_URL }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          TARGET_ARTICLES: ${{ inputs.target_articles }}
        run: python catalog/sync_webasyst_kit_id.py
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add catalog/webasyst_kit_id_sync_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Webasyst KIT ID sync report"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
