name: Source-only stock probe 106225 106203 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-only-stock-probe-106225-106203-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Source-only probe
        env:
          SAMSON_API_KEY: ${{ secrets.SAMSON_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=samson-kit python - <<'PY'
          import os, json
          from samson_kit.http import SafeSession
          from samson_kit.samson_client import SamsonClient
          from samson_kit.mapper import normalize_sku, extract_stock_parts, extract_withdrawn, extract_active
          from samson_kit.rules import calculate_stock

          http=SafeSession()
          samson=SamsonClient(os.environ['SAMSON_API_KEY'],http)
          for code in ('106225','106203'):
              def get(path):
                  payload=http.request_json(
                      'GET',samson.base_url+path,
                      params={'api_key':samson.api_key,'response_format':'json','sku':code},
                      headers={'Accept':'application/json'})
                  env=payload[0] if isinstance(payload,list) and len(payload)==1 else payload
                  return (env.get('data') if isinstance(env,dict) else []) or []

              skurow=None
              for row in get('/sku/'):
                  if not isinstance(row,dict): continue
                  try: item=normalize_sku(row)
                  except Exception: continue
                  if item.source_code==code:
                      skurow=row; break

              stockrow=None
              for row in get('/sku/stock/'):
                  if not isinstance(row,dict): continue
                  try: item=normalize_sku(row)
                  except Exception: continue
                  if item.source_code==code:
                      stockrow=row; break

              if skurow is None:
                  print('MISSING '+code); continue

              wd=extract_withdrawn(skurow)
              ac=extract_active(skurow,wd)
              direct=extract_stock_parts(skurow)
              override=extract_stock_parts(stockrow) if stockrow else None
              chosen=override if override is not None else direct
              print('SOURCE_RESULT='+json.dumps({
                  'code':code,
                  'out_of_stock':skurow.get('out_of_stock'),
                  'status':skurow.get('status'),
                  'state':skurow.get('state'),
                  'active_field':skurow.get('active'),
                  'is_active':skurow.get('is_active'),
                  'remove_date':skurow.get('remove_date'),
                  'sku_stock_list':skurow.get('stock_list'),
                  'stock_endpoint_row':stockrow,
                  'direct_parts':direct,
                  'override_parts':override,
                  'chosen_parts':chosen,
                  'withdrawn':wd,
                  'active':ac,
                  'desired':calculate_stock(chosen,active=ac,withdrawn=wd)
              },ensure_ascii=False))
          PY
