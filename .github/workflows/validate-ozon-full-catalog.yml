name: Validate Ozon full-catalog pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-ozon-full-catalog.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate shell and Python syntax
        run: |
          bash -n ozon/catalog_3x4/run_range.sh
          python -m py_compile ozon/catalog_3x4/process_batch.py
          python -m py_compile ozon/catalog_3x4/build_selection.py
          python -m py_compile ozon/replace_images_3x4_batch.py
