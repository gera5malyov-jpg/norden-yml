name: Perf78 - Theme icon and comparison audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf78-icons-compare.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/perf78_icons_compare_readonly.py
      - run: python storefront/perf78_icons_compare_readonly.py
