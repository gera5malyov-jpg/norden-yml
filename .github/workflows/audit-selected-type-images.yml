name: Audit selected Webasyst product-type external images
# Manual verification 2026-10-17: 4sis HTTPS mixed-content repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-selected-type-images.yml'
      - 'scripts/audit_selected_type_images.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read type counts, image URLs, and identifiers
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: python -u scripts/audit_selected_type_images.py
      - name: Archive complete read-only summary backup and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-webasyst-type-images-${{ github.run_id }}
          path: |
            reports/selected_type_images_inventory.json.gz
            reports/selected_type_images_audit.json
          if-no-files-found: warn
          retention-days: 30
