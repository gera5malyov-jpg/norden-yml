name: Publish approved new Norden to Ozon and Yandex
on:
  workflow_dispatch:
    inputs:
      target_articles:
        description: Optional comma-separated exact articles
        required: false
        type: string
  push:
    paths:
      - 'catalog/approved_norden_marketplace_publish_trigger.txt'
permissions: {contents: write}
concurrency:
  group: norden-new-marketplace-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests "gspread>=6.1,<7" "google-auth>=2.35,<3"
      - name: Compile
        run: python -m py_compile catalog/publish_approved_norden_marketplaces.py catalog/sync_ozon_readback_to_kit.py
      - name: Publish only approved new rows
        env:
          CATALOG_SPREADSHEET_ID: '1DvMYvKRr8fX8mfLFaeJCXCccQofPViPcIP2CgIctc8w'
          CATALOG_SHEET: 'Норден'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          WEBASYST_BASE_URL: ${{ secrets.WEBASYST_BASE_URL }}
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_MARKET_API_KEY: ${{ secrets.YANDEX_MARKET_API_KEY }}
          YANDEX_MARKET_BUSINESS_ID: '20806099'
          YANDEX_MARKET_CAMPAIGN_ID: '89405839'
          TARGET_ARTICLES: ${{ inputs.target_articles }}
        run: python catalog/publish_approved_norden_marketplaces.py
      - name: Save report
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add catalog/norden_marketplace_publish_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Norden marketplace publish report"
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i*3))
            done
          fi
