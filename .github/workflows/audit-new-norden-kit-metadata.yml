name: Audit new Norden KIT metadata
on:
  push:
    paths: ['catalog/audit_three_new_norden_metadata_trigger.txt']
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: python catalog/audit_three_new_norden_metadata.py
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add catalog/audit_three_new_norden_metadata.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save new Norden KIT metadata audit"
            for i in 1 2 3; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((i*3))
            done
          fi
