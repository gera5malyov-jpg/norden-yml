name: Repair Ozon below-floor promo participants by strategy detachment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-promo-strategy-floor-repair.yml'
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detach only below-min SKUs from conflicting Ozon strategy
        run: python ozon/promo_strategy_floor_remediation_20261109.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-strategy-floor-repair
          path: ozon/promo_strategy_floor_remediation_20261109.json
          retention-days: 7
