name: Samson KIT regression tests once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/samson-kit-debug-shape-once.yml'
      - 'samson-kit/tests/test_core.py'
      - 'samson-kit/samson_kit/mapper.py'
      - 'samson-kit/samson_kit/kit_client.py'
      - 'samson-kit/samson_kit/sync.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run Samson tests
        run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
