name: Audit failed TNVED imports for seven cards
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-tnved-final479-failures-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Ozon async errors and seven missing products
        run: |
          python - <<'PY'
          import json,sys,collections
          sys.path.insert(0,'ozon')
          import tnved_sync as m
          first=json.load(open('ozon/tnved_final479_result_20261030.json'))
          second=json.load(open('ozon/tnved_final479_pass2_result_20261030.json'))
          for source,data in [('first',first),('second',second)]:
              for tid in data.get('tasks') or []:
                  try:
                      result=m.post('/v1/product/import/info',{'task_id':int(tid)}).get('result') or {}
                      items=result.get('items') or []
                      states=collections.Counter(str(i.get('status')) for i in items)
                      bad=[{'offer':i.get('offer_id'),'errors':i.get('errors')} for i in items if i.get('errors')]
                      print('TASK',source,tid,'status',dict(states),'errors',json.dumps(bad,ensure_ascii=False)[:1800],flush=True)
                  except Exception as e:print('TASK_ERROR',source,tid,str(e)[:300],flush=True)
          names=set(first.get('unconfirmed') or [])|set(second.get('unconfirmed') or [])
          cat=m.list_products()
          idx={str(x.get('offer_id')):int(x['product_id']) for x in cat if x.get('product_id')}
          cards=m.get_product_attributes([idx[s] for s in names if s in idx])
          for p in cards:
              v=m.attr_value_tuple(m.find_product_attr(p,22232) or {})
              print('CARD',p['offer_id'],p.get('name'),'TNVED',v,flush=True)
          PY
