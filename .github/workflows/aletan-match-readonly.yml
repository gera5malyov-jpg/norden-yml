name: Aletan YML Pro matching audit (read only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/aletan_match_readonly.py'
      - 'scripts/aletan_ymlpro_link_plan.py'
      - '.github/workflows/aletan-match-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect existing Aletan products, read only
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
          WEBASYST_BASE_URL: https://profikompany.ru
        run: |
          python scripts/aletan_match_readonly.py
          python scripts/aletan_ymlpro_link_plan.py
