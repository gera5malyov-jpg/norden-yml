name: Clean up abandoned NetAngels photo deploy SSH key
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/cleanup-photo-ssh.yml]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/cleanup_netangels_photo_ssh.py
