name: Probe Liga smoke state once

on:
  push:
    branches:
      - feat/liga-kit-sync
    paths:
      - '.github/workflows/probe-liga-smoke-state-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Probe exact Liga SKUs
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=liga-kit python - <<'PY'
          import os, json
          from liga_kit.http import SafeSession
          from liga_kit.kit_client import KitClient
          from liga_kit.config import Settings

          settings=Settings.from_env()
          http=SafeSession()
          kit=KitClient(settings.kit_token,http,settings.kit_base_url)
          for sku in ('liga-109775','liga-109778','liga-109780'):
              rows=list(kit.iter_variants({'sku':sku}))
              exact=[x for x in rows if str(x.get('sku','')).strip()==sku]
              details=[]
              for row in exact:
                  d=kit.get_variant(row['id'])
                  details.append({
                      'id':row['id'],
                      'sku':d.get('sku'),
                      'pricing':d.get('pricing'),
                      'stocks':d.get('stocks'),
                      'image_count':len([m for m in (d.get('media') or []) if isinstance(m,dict) and str(m.get('type','')).upper()=='IMAGE']),
                  })
              print('PROBE='+json.dumps({'sku':sku,'count':len(exact),'details':details},ensure_ascii=False))
          PY
