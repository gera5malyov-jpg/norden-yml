name: Site84 menu source inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site84-menu-source.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python storefront/site84_menu_source_readonly.py
