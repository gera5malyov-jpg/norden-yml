name: Read-only canonical emitter diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-canonical-emitters.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile storefront/audit_canonical_emitter_sources.py
      - run: python storefront/audit_canonical_emitter_sources.py
