name: Fill Olivia stool set TN VED
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-tnved-olivia.yml'
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ozon/tnved_olivia_fix.py
