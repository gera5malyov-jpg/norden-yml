name: Ozon marking management verified TN VED 31-SKU Nov18
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-marking-31-apply-20261118.yml'
permissions:
  contents: read
concurrency:
  group: ozon-tnved-sync
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only verified code to exact marking SKU and keep archive status
        run: python ozon/marking_31_code_apply_20261118.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-marking-31-applied
          path: ozon/marking_code_batch_report_20261118.json
          retention-days: 14
