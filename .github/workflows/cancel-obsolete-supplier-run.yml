name: Cancel obsolete supplier run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-obsolete-supplier-run.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api             --method POST             repos/${{ github.repository }}/actions/runs/37360122255/cancel
