name: WB chat and returns monitor

on:
  push:
    paths:
      - 'scripts/wb_chat_return_monitor_v2.py'
      - '.github/workflows/wb-chat-return-monitor.yml'
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

concurrency:
  group: wb-chat-return-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Проверить чаты и возвраты Wildberries
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: shop@office-mag.com
          LOOKBACK_HOURS: '24'
          STATE_FILE: state/wb_chat_return_monitor_v2.json
          SUMMARY_FILE: state/wb_chat_return_summary_v2.json
        run: python scripts/wb_chat_return_monitor_v2.py
      - name: Сохранить состояние
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/wb_chat_return_monitor_v2.json state/wb_chat_return_summary_v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update WB chat monitor state"
          git pull --rebase origin main
          git push origin HEAD:main
