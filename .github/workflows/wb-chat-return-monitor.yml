name: WB chat and returns monitor

on:
  push:
    paths:
      - 'scripts/wb_chat_return_monitor.py'
      - '.github/workflows/wb-chat-return-monitor.yml'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: wb-chat-return-monitor-v2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install requests

      - name: Проверить синтаксис
        run: python -m py_compile scripts/wb_chat_return_monitor.py

      - name: Проверить новые чаты и возвраты Wildberries
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          INITIAL_LOOKBACK_HOURS: '24'
          STATE_FILE: state/wb_chat_return_monitor.json
          SUMMARY_FILE: state/wb_chat_return_summary.json
          CHAT_PAGE_DELAY_SECONDS: '10.2'
          MAX_CHAT_PAGES: '20'
        run: python scripts/wb_chat_return_monitor.py

      - name: Сохранить безопасную сводку
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/wb_chat_return_monitor.json state/wb_chat_return_summary.json
          if git diff --cached --quiet; then
            echo "STATE_CHANGED=0"
            exit 0
          fi
          git commit -m "chore: update WB monitor state"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "STATE_CHANGED=1"
