name: WB alternate token presence
on:
  push:
    paths:
      - '.github/workflows/wb-alt-token-presence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
      WB_TOKEN: ${{ secrets.WB_TOKEN }}
      WILDBERRIES_API_KEY: ${{ secrets.WILDBERRIES_API_KEY }}
      WILDBERRIES_TOKEN: ${{ secrets.WILDBERRIES_TOKEN }}
      WB_PERSONAL_TOKEN: ${{ secrets.WB_PERSONAL_TOKEN }}
      WB_RETURNS_TOKEN: ${{ secrets.WB_RETURNS_TOKEN }}
      WB_RETURNS_API_TOKEN: ${{ secrets.WB_RETURNS_API_TOKEN }}
    steps:
      - name: Show presence only
        shell: bash
        run: |
          for n in WB_API_TOKEN WB_TOKEN WILDBERRIES_API_KEY WILDBERRIES_TOKEN WB_PERSONAL_TOKEN WB_RETURNS_TOKEN WB_RETURNS_API_TOKEN; do
            if [ -n "${!n:-}" ]; then echo "$n=SET"; else echo "$n=EMPTY"; fi
          done
