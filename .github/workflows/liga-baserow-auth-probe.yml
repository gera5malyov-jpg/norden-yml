name: Liga Baserow schema auth probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liga-baserow-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      BASEROW_ADMIN_TOKEN: ${{ secrets.BASEROW_ADMIN_TOKEN }}
      BASEROW_USER_TOKEN: ${{ secrets.BASEROW_USER_TOKEN }}
      BASEROW_JWT: ${{ secrets.BASEROW_JWT }}
      BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
      BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
      BASEROW_ACCESS_TOKEN: ${{ secrets.BASEROW_ACCESS_TOKEN }}
      BASEROW_EMAIL: ${{ secrets.BASEROW_EMAIL }}
      BASEROW_PASSWORD: ${{ secrets.BASEROW_PASSWORD }}
      BASEROW_USER_EMAIL: ${{ secrets.BASEROW_USER_EMAIL }}
      BASEROW_USER_PASSWORD: ${{ secrets.BASEROW_USER_PASSWORD }}
      BASEROW_ADMIN_EMAIL: ${{ secrets.BASEROW_ADMIN_EMAIL }}
      BASEROW_ADMIN_PASSWORD: ${{ secrets.BASEROW_ADMIN_PASSWORD }}
      BASEROW_DATABASE_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
    steps:
      - name: Print configured names only
        shell: bash
        run: |
          for v in BASEROW_ADMIN_TOKEN BASEROW_USER_TOKEN BASEROW_JWT BASEROW_API_TOKEN BASEROW_TOKEN BASEROW_ACCESS_TOKEN BASEROW_EMAIL BASEROW_PASSWORD BASEROW_USER_EMAIL BASEROW_USER_PASSWORD BASEROW_ADMIN_EMAIL BASEROW_ADMIN_PASSWORD BASEROW_DATABASE_TOKEN; do
            if [ -n "${!v:-}" ]; then echo "$v=PRESENT"; else echo "$v=MISSING"; fi
          done

      - name: Print relevant existing Database fields
        env:
          DB_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          u='http://147.78.67.6/api/database/fields/table/156/'
          r=urllib.request.Request(u,headers={'Authorization':'Token '+os.environ['DB_TOKEN'],'Accept':'application/json'})
          with urllib.request.urlopen(r,timeout=30) as x:
              data=json.load(x)
          needles=('цена','закуп','остат','склад','kit','артикул','бренд','опис','штрих','вес','габар','категор','изображ','поставщик')
          for f in data:
              n=str(f.get('name') or '')
              if any(k in n.casefold() for k in needles):
                  print(f.get('id'), '|', n, '|', f.get('type'))
          PY

      - name: Count Liga rows
        env:
          DB_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, requests, unicodedata
          h={'Authorization':'Token '+os.environ['DB_TOKEN']}
          base='http://147.78.67.6'
          def n(v): return unicodedata.normalize('NFKC',str(v or '').strip()).casefold()
          s=requests.get(base+'/api/database/rows/table/157/?user_field_names=true&size=200',headers=h,timeout=30)
          s.raise_for_status()
          matches=[r for r in s.json().get('results',[]) if n(r.get('Поставщик'))==n('Лига диванов')]
          print('SUPPLIER_MATCHES',len(matches))
          sid=matches[0]['id'] if len(matches)==1 else None
          rows=[]; page=1
          while True:
              r=requests.get(f'{base}/api/database/rows/table/156/?user_field_names=true&size=200&page={page}',headers=h,timeout=30)
              r.raise_for_status(); j=r.json(); rows.extend(j.get('results',[]))
              if not j.get('next'): break
              page += 1
          def supplier_ids(row):
              out=set()
              for x in row.get('Поставщик') or []:
                  if isinstance(x,dict) and x.get('id') is not None:
                      try: out.add(int(x['id']))
                      except: pass
              return out
          liga=[r for r in rows if sid is not None and int(sid) in supplier_ids(r)]
          print('CATALOG_ROWS',len(rows))
          print('LIGA_ROWS',len(liga))
          print('LIGA_WITH_KIT_ID',sum(bool(str(r.get('Артикул KIT') or '').strip()) for r in liga))
          print('LIGA_SAMPLE',[(r.get('id'),r.get('Артикул'),r.get('Артикул KIT')) for r in liga[:5]])
          PY

      - name: Audit Liga article and prices
        env:
          DB_TOKEN: ${{ secrets.BASEROW_DATABASE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, requests, unicodedata, math
          h={'Authorization':'Token '+os.environ['DB_TOKEN']}
          base='http://147.78.67.6'
          def n(v): return unicodedata.normalize('NFKC',str(v or '').strip()).casefold()
          s=requests.get(base+'/api/database/rows/table/157/?user_field_names=true&size=200',headers=h,timeout=60)
          s.raise_for_status()
          matches=[r for r in s.json().get('results',[]) if n(r.get('Поставщик'))==n('Лига диванов')]
          sid=int(matches[0]['id']) if len(matches)==1 else None
          rows=[]; page=1
          while True:
              r=requests.get(f'{base}/api/database/rows/table/156/?user_field_names=true&size=200&page={page}',headers=h,timeout=60)
              r.raise_for_status(); j=r.json(); rows += j.get('results',[])
              if not j.get('next'): break
              page += 1
          def sids(row):
              out=set()
              for x in row.get('Поставщик') or []:
                  if isinstance(x,dict) and x.get('id') is not None:
                      try: out.add(int(x['id']))
                      except: pass
              return out
          liga=[r for r in rows if sid is not None and sid in sids(r)]
          prefix=0; price_ok=0; priced=0
          sample=None
          for row in liga:
              vendor=str(row.get('Артикул поставщика') or row.get('Наименование артикула') or '').strip()
              article=str(row.get('Артикул') or '').strip()
              if vendor and article == 'Liga-'+vendor: prefix += 1
              try:
                  sale=float(row.get('Цена KIT со скидкой'))
                  old=float(row.get('Цена KIT до скидки'))
                  priced += 1
                  if abs(old - round(sale*1.30,2)) < 0.011: price_ok += 1
              except: pass
              if vendor=='109775': sample={
                  'id':row.get('id'),'article':article,'kit_id':row.get('Артикул KIT'),
                  'sale':row.get('Цена KIT со скидкой'),'old':row.get('Цена KIT до скидки'),
                  'available':row.get('Наличие')
              }
          print('LIGA_ROWS',len(liga))
          print('ARTICLE_PREFIX_OK',prefix)
          print('PRICED_ROWS',priced)
          print('PRICE_PAIR_OK',price_ok)
          print('WITH_KIT_ID',sum(bool(str(r.get('Артикул KIT') or '').strip()) for r in liga))
          print('SAMPLE_109775',sample)
          PY
