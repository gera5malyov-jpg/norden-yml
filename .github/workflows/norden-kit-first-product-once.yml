name: Norden KIT first product test
# rerun after minimal-card fix
# rerun after create-before-images fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/norden-kit-first-product-once.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Create exactly one missing Norden product
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
          NORDEN_SECRET: ${{ secrets.NORDEN_SECRET }}
        run: |
          python norden-kit/sync_norden_kit.py \
            --mode full \
            --rebuild-map \
            --max-new 1 \
            --time-budget-seconds 1200
      - name: Show report
        if: always()
        run: |
          cat norden-kit/last_sync_report.json || true
      - name: Commit mapping and report
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden-kit/kit_mapping.json norden-kit/last_sync_report.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Record first Norden KIT product test"
          git pull --rebase origin main
          git push origin main
