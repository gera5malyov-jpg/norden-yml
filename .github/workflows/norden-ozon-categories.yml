name: Norden — категории Ozon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/sync_ozon_categories.py'
      - '.github/workflows/norden-ozon-categories.yml'

permissions:
  contents: write

concurrency:
  group: norden-ozon-categories
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        run: pip install --disable-pip-version-check requests "gspread>=6.1,<7" "google-auth>=2.35,<3"
      - name: Синхронизировать категории Ozon
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CATALOG_SPREADSHEET_ID: '1DvMYvKRr8fX8mfLFaeJCXCccQofPViPcIP2CgIctc8w'
          CATALOG_SHEET: 'Норден'
        run: python catalog/sync_ozon_categories.py
      - name: Сохранить отчёт
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/ozon_categories_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Обновить отчёт категорий Ozon"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
