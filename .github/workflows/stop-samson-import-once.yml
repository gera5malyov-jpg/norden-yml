name: Stop Samson full live import once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stop-samson-import-once.yml'

permissions:
  contents: read

concurrency:
  group: samson-kit-full-live-import
  cancel-in-progress: true

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Cancelling previous Samson full import via concurrency replacement"
