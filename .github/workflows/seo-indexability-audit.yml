name: SEO indexability audit (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-indexability-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - name: Check production template sources and category flags
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time, urllib.request, urllib.parse, pathlib
          key=os.environ["NETANGELS_API_KEY"].strip()
          def request(url, method="GET", data=None, headers=None):
              req=urllib.request.Request(url,data=data,headers=headers or {},method=method)
              with urllib.request.urlopen(req,timeout=30) as f: return json.load(f)
          t=request("https://panel.netangels.ru/api/gateway/token/","POST",urllib.parse.urlencode({"api_key":key}).encode(),{"Content-Type":"application/x-www-form-urlencoded"})
          hdr={"Authorization":"Bearer "+t["token"],"Content-Type":"application/json","Accept":"application/json"}
          remote=r'''set -uo pipefail
          ROOT=/home/web/vm-23f9aff9.na4u.ru/www
          echo "=== SEO PLUGIN FILE RULES ==="
          for d in "$ROOT/wa-apps/shop/plugins/seo" "$ROOT/wa-data/public/shop/themes/pureMegapolis42" "$ROOT/wa-data/public/site/themes/pureMegapolis42"; do
          if [ -d "$d" ]; then echo "DIR $d"; find "$d" -type f \( -name '*.php' -o -name '*.html' -o -name '*.xml' \) -print0 | xargs -0 -r grep -inEi 'noindex|nofollow|robots|indexing' | head -90 | cut -c1-250 || true; fi
          done
          echo "=== SELECTED TEMPLATE CONTEXT ==="
          f="$ROOT/wa-data/public/site/themes/pureMegapolis42/index.html"
          [ ! -f "$f" ] || sed -n '115,145p' "$f" | cut -c1-200
          echo "=== SEO TABLES AND CONFIG COLUMNS ==="
          cat >/tmp/chatgpt_seo_audit2.php <<'PHP'
          <?php
          $root='/home/web/vm-23f9aff9.na4u.ru/www';
          chdir($root);
          require_once $root.'/wa-config/SystemConfig.class.php';
          waSystem::getInstance(null,new SystemConfig()); wa('shop');
          $m=new waModel();
          foreach($m->query("SHOW TABLES")->fetchAll() as $t) {
           $name=array_values($t)[0];
           if(stripos($name,'seo')===false) continue;
           echo "SEO_TABLE $name\n";
           if(!preg_match('/(setting|param|category)/i',$name)) continue;
           $cols=$m->query("SHOW COLUMNS FROM ".$name)->fetchAll();
           $names=array_column($cols,'Field');
           echo " COLUMNS ".implode(',',$names)."\n";
           if(in_array('name',$names) && in_array('value',$names)) {
            foreach($m->query("SELECT name,value FROM ".$name." WHERE name REGEXP 'robot|index|follow|category' LIMIT 15")->fetchAll() as $r) {
             echo " FLAG ".$r['name']."=".substr($r['value'],0,100)."\n";
            }
           }
          }
          PHP
          su -s /bin/bash web -c 'php -d display_errors=0 -d log_errors=0 /tmp/chatgpt_seo_audit2.php' 2>&1 | head -110
          rm -f /tmp/chatgpt_seo_audit2.php
          '''
          with tempfile.TemporaryDirectory() as d:
              priv=d+"/id_ed25519"
              subprocess.run(["ssh-keygen","-q","-t","ed25519","-N","","-f",priv],check=True)
              pub=pathlib.Path(priv+".pub").read_text().strip()
              obj=request("https://api-ms.netangels.ru/api/v1/cloud/vms/44780/ssh/create/","POST",json.dumps({"key":pub,"name":"seo-readonly-"+os.environ.get("GITHUB_RUN_ID","run")}).encode(),hdr)
              kid=obj["id"]
              try:
                for attempt in range(14):
                  p=subprocess.run(["ssh","-i",priv,"-o","BatchMode=yes","-o","StrictHostKeyChecking=no","-o","UserKnownHostsFile=/dev/null","-o","ConnectTimeout=8","root@45.86.180.49","bash -s"],input=remote,text=True,capture_output=True,timeout=55)
                  if p.returncode==0:
                    print(p.stdout[-18000:]); print("AUDIT_FINISHED=yes"); break
                  if attempt==13: print("SSH_ERROR",p.stderr[-1200:]); raise RuntimeError("Unable to connect")
                  time.sleep(5)
              finally:
                request("https://api-ms.netangels.ru/api/v1/cloud/vms/44780/ssh/"+str(kid)+"/","DELETE",None,hdr)
                print("TEMP_KEY_REMOVED=yes")
          PY
