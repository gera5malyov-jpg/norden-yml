name: SEO indexability audit (read only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-indexability-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - name: Check production template sources and category flags
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time, urllib.request, urllib.parse, pathlib
          key=os.environ["NETANGELS_API_KEY"].strip()
          def request(url, method="GET", data=None, headers=None):
              req=urllib.request.Request(url,data=data,headers=headers or {},method=method)
              with urllib.request.urlopen(req,timeout=30) as f: return json.load(f)
          t=request("https://panel.netangels.ru/api/gateway/token/","POST",urllib.parse.urlencode({"api_key":key}).encode(),{"Content-Type":"application/x-www-form-urlencoded"})
          hdr={"Authorization":"Bearer "+t["token"],"Content-Type":"application/json","Accept":"application/json"}
          remote=r'''set -uo pipefail
          ROOT=/home/web/vm-23f9aff9.na4u.ru/www
          echo "=== SEO PLUGIN FILE SHAPE ==="
          find "$ROOT/wa-apps/shop/plugins/seo" -maxdepth 4 -type f | head -35 | cut -c1-190
          echo "=== SEO DB OVERRIDES ==="
          cat >/tmp/chatgpt_seo_audit3.php <<'PHP'
          <?php
          $root='/home/web/vm-23f9aff9.na4u.ru/www';chdir($root);require_once $root.'/wa-config/SystemConfig.class.php';waSystem::getInstance(null,new SystemConfig());wa('shop');$m=new waModel();
          $queries=[
          "SELECT group_storefront_id,category_id,name,value FROM shop_seo_category_settings WHERE category_id IN (4204,1002) LIMIT 100",
          "SELECT group_id,name,value FROM shop_seo_group_category_settings WHERE name REGEXP 'index|robot|follow|enabled' LIMIT 70",
          "SELECT group_id,name,value FROM shop_seo_storefront_settings WHERE name REGEXP 'index|robot|follow|enabled|category_ignore' LIMIT 100",
          "SELECT name,value FROM shop_seo_plugin_settings WHERE name REGEXP 'index|robot|follow|enabled|category_ignore' LIMIT 90",
          "SELECT category_id,name,value FROM shop_seo_category_settings WHERE name REGEXP 'index|robot|follow' LIMIT 50"
          ];
          foreach($queries as $i=>$sql) {echo "QUERY $i\n";try {foreach($m->query($sql)->fetchAll() as $r){foreach($r as $k=>$v){$v=str_replace(["\n","\r"]," ",(string)$v);$r[$k]=mb_substr($v,0,120);}echo json_encode($r,JSON_UNESCAPED_UNICODE|JSON_INVALID_UTF8_SUBSTITUTE)."\n";}}catch(Throwable $e){echo "ERROR ".get_class($e)." ".$e->getMessage()."\n";}}
          PHP
          su -s /bin/bash web -c 'php -d display_errors=0 -d log_errors=0 /tmp/chatgpt_seo_audit3.php' 2>&1 | head -190
          rm -f /tmp/chatgpt_seo_audit3.php
          '''
          with tempfile.TemporaryDirectory() as d:
              priv=d+"/id_ed25519"
              subprocess.run(["ssh-keygen","-q","-t","ed25519","-N","","-f",priv],check=True)
              pub=pathlib.Path(priv+".pub").read_text().strip()
              obj=request("https://api-ms.netangels.ru/api/v1/cloud/vms/44780/ssh/create/","POST",json.dumps({"key":pub,"name":"seo-readonly-"+os.environ.get("GITHUB_RUN_ID","run")}).encode(),hdr)
              kid=obj["id"]
              try:
                for attempt in range(14):
                  p=subprocess.run(["ssh","-i",priv,"-o","BatchMode=yes","-o","StrictHostKeyChecking=no","-o","UserKnownHostsFile=/dev/null","-o","ConnectTimeout=8","root@45.86.180.49","bash -s"],input=remote,text=True,errors="replace",capture_output=True,timeout=55)
                  if p.returncode==0:
                    print(p.stdout[-18000:]); print("AUDIT_FINISHED=yes"); break
                  if attempt==13: print("SSH_ERROR",p.stderr[-1200:]); raise RuntimeError("Unable to connect")
                  time.sleep(5)
              finally:
                request("https://api-ms.netangels.ru/api/v1/cloud/vms/44780/ssh/"+str(kid)+"/","DELETE",None,hdr)
                print("TEMP_KEY_REMOVED=yes")
          PY
