name: Samson stock semantics tests once

on:
  push:
    branches: [main]
    paths:
      - 'samson-kit/tests/test_stock_semantics.py'
      - 'samson-kit/tests/test_core.py'
      - 'samson-kit/samson_kit/mapper.py'
      - '.github/workflows/samson-stock-tests-once.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=samson-kit python -m unittest discover -s samson-kit/tests -v
