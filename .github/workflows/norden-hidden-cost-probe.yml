name: Norden hidden purchase price probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/norden-hidden-cost-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install requests
        run: python -m pip install requests
      - name: Probe hidden characteristic support safely
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: |
          python - <<'PY'
          import html, json, os, re, sys, time
          import requests

          BASE = "https://api.kit.yandex.net"
          token = (os.getenv("YANDEX_KIT_TOKEN") or "").strip()
          if not token:
              raise SystemExit("YANDEX_KIT_TOKEN missing")
          H = {"Authorization": f"Bearer {token}", "Accept": "application/json"}
          S = requests.Session()
          S.headers.update(H)

          def req(method, path, *, body=None, params=None, ctype=None):
              h = {}
              if body is not None:
                  h["Content-Type"] = ctype or "application/json"
              r = S.request(method, BASE + path, json=body, params=params, headers=h, timeout=60)
              print("HTTP", method, path, r.status_code)
              if r.status_code >= 400:
                  return r, None
              return r, (r.json() if r.content else {})

          # Choose a mapped Norden variant, so we never touch an unrelated supplier.
          mapping = json.load(open("norden-kit/kit_mapping.json", encoding="utf-8"))
          chosen = None
          for article, rows in (mapping.get("variants") or {}).items():
              for row in rows or []:
                  vid = str(row.get("variant_id") or "").strip()
                  if not vid:
                      continue
                  r, v = req("GET", f"/v1/variants/{vid}")
                  if r.status_code == 200 and str((v or {}).get("brand") or "").strip().casefold() == "norden":
                      chosen = (article, vid, v)
                      break
              if chosen:
                  break
          if not chosen:
              raise SystemExit("No mapped Norden variant found")
          article, vid, original = chosen
          print("PROBE_ARTICLE", article)
          print("PROBE_VARIANT", vid)
          print("PROBE_LINK", original.get("relative_link_url"))

          # Find/create a supplier-scoped characteristic to avoid collisions with other brands.
          title = "Закупочная цена Norden"
          cid = None
          page = 1
          while True:
              r, data = req("GET", "/v1/characteristics", params={"page":page,"per_page":100,"status":["ACTIVE","ARCHIVED"]})
              if r.status_code != 200: raise SystemExit(r.text[:1000])
              rows = (data or {}).get("characteristics") or (data or {}).get("items") or []
              for x in rows:
                  if str(x.get("title") or "").strip().casefold() == title.casefold():
                      cid = x.get("id"); char_status=x.get("status"); break
              if cid or len(rows)<100: break
              page += 1
          if cid and char_status == "ARCHIVED":
              rr,_=req("POST", f"/v1/characteristics/{cid}/unarchive")
              if rr.status_code >= 400: raise SystemExit(rr.text[:1000])
          if not cid:
              r, data = req("POST", "/v1/characteristics", body={"title":title,"type":"STRING","select_mode":"SINGLE"})
              if r.status_code >= 400: raise SystemExit(r.text[:1000])
              cid=(data or {}).get("id")
          if not cid: raise SystemExit("Characteristic id missing")
          print("CHARACTERISTIC_ID", cid)

          base_chars = [x for x in (original.get("characteristics") or []) if str(x.get("characteristic_id") or "") != str(cid)]
          sentinel = "987654.32"
          base_entry = {"characteristic_id":cid,"value":sentinel,"values":[sentinel]}
          candidates = [
              ("hidden", {**base_entry, "hidden": True}),
              ("is_hidden", {**base_entry, "is_hidden": True}),
              ("visible", {**base_entry, "visible": False}),
              ("is_visible", {**base_entry, "is_visible": False}),
              ("show_on_storefront", {**base_entry, "show_on_storefront": False}),
              ("is_public", {**base_entry, "is_public": False}),
          ]

          # Storefront base URL
          rr, store = req("GET", "/v1/store")
          b2c = ((store or {}).get("b2c_url") or "").rstrip("/")
          rel = original.get("relative_link_url") or ""
          url = b2c + rel if b2c and rel else ""
          print("STOREFRONT_URL", url)

          # Resolve one known existing characteristic value to check whether HTML is SSR enough.
          char_titles={}
          p=1
          while True:
              rx, dd=req("GET","/v1/characteristics",params={"page":p,"per_page":100,"status":["ACTIVE"]})
              if rx.status_code!=200: break
              rows=(dd or {}).get("characteristics") or []
              for x in rows: char_titles[str(x.get("id"))]=str(x.get("title") or "")
              if len(rows)<100: break
              p+=1
          known_value=""
          known_title=""
          for c in base_chars:
              val=str(c.get("value") or ((c.get("values") or [""])[0]) or "").strip()
              t=char_titles.get(str(c.get("characteristic_id")),"")
              if val and t:
                  known_value=val; known_title=t; break
          print("KNOWN_VISIBLE_CANDIDATE", known_title, known_value)

          def visible_text(page_html):
              page_html=re.sub(r"(?is)<script\b.*?</script>"," ",page_html)
              page_html=re.sub(r"(?is)<style\b.*?</style>"," ",page_html)
              page_html=re.sub(r"(?s)<[^>]+>"," ",page_html)
              return re.sub(r"\s+"," ",html.unescape(page_html)).strip()

          accepted = None
          for label, entry in candidates:
              body={"characteristics": base_chars+[entry]}
              r, data = req("PATCH", f"/v1/variants/{vid}", body=body, ctype="application/merge-patch+json")
              if r.status_code >= 400:
                  print("CANDIDATE_REJECTED",label,r.text[:500].replace("\n"," "))
                  continue
              time.sleep(2)
              gr, gv=req("GET",f"/v1/variants/{vid}")
              persisted=[x for x in ((gv or {}).get("characteristics") or []) if str(x.get("characteristic_id"))==str(cid)]
              print("CANDIDATE_ACCEPTED", label, json.dumps(persisted, ensure_ascii=False))
              if not persisted:
                  print("CANDIDATE_IGNORED", label)
                  continue

              storefront_ok=False
              if url:
                  pg=requests.get(url,timeout=60,headers={"User-Agent":"Mozilla/5.0"})
                  txt=visible_text(pg.text) if pg.status_code==200 else ""
                  known_present=bool(known_value and known_value in txt)
                  sentinel_present=sentinel in txt or title in txt
                  print("STOREFRONT_CHECK", label, "http",pg.status_code,"known_present",known_present,"cost_present",sentinel_present)
                  # Strong confirmation requires SSR/visible text to contain another known characteristic,
                  # while the purchase price characteristic is absent.
                  storefront_ok = known_present and not sentinel_present
              if storefront_ok:
                  accepted=label
                  print("HIDDEN_CONFIRMED", label)
                  break

              # Restore clean original state before trying another candidate.
              rr,_=req("PATCH",f"/v1/variants/{vid}",body={"characteristics":base_chars},ctype="application/merge-patch+json")
              if rr.status_code>=400:
                  raise SystemExit("Failed to restore probe product: "+rr.text[:500])
              time.sleep(1)

          if not accepted:
              # Ensure no purchase-price value remains on the product.
              rr,_=req("PATCH",f"/v1/variants/{vid}",body={"characteristics":base_chars},ctype="application/merge-patch+json")
              print("CLEANUP_STATUS",rr.status_code)
              # Archive unused characteristic so it cannot appear accidentally.
              ar,_=req("POST",f"/v1/characteristics/{cid}/archive")
              print("ARCHIVE_UNUSED_CHARACTERISTIC",ar.status_code)
              raise SystemExit("No API field for hidden characteristic was verified")

          print("RESULT_JSON", json.dumps({"characteristic_id":cid,"hide_field":accepted,"article":article,"variant_id":vid},ensure_ascii=False))
          PY
