name: Deploy Megasuppliers editable profile fix once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-megasuppliers-profile-save-fix-once-20261014.yml']
permissions:
  contents: write
jobs:
  deploy:
    if: github.event.head_commit.message == 'Deploy Megasuppliers editable profile fix once'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_FILE_ID: '129zSQGB1FKGrn1AgkbJg-EGIvQYylfxQ'
      EXPECTED_SHA256: '5538d704c8f40a5e3b3743a3af507f3b03e14356be789dcf2d8ef427245afa42'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Google client
        run: pip -q install google-api-python-client google-auth
      - name: Wait for NetAngels
        run: python3 scripts/wait_netangels_ready.py
      - name: Augment deployment
        run: python3 scripts/augment_deploy_megasuppliers.py
      - name: Deploy corrected plugin without touching catalog
        run: python3 scripts/deploy_megasuppliers.py
      - name: Store installer report without failing successful deployment on git conflict
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .deploy-probe
          if ! test -f .deploy-probe/megasuppliers-install.txt; then
            echo 'INSTALL_STATUS=FAILED_NO_REPORT' > .deploy-probe/megasuppliers-install.txt
          fi
          cp .deploy-probe/megasuppliers-install.txt /tmp/ms-editable-profile-install.txt
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ms-editable-profile-install.txt .deploy-probe/megasuppliers-install.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add .deploy-probe/megasuppliers-install.txt
          if ! git diff --cached --quiet; then
            git commit -m "Report editable supplier profile installation [skip ci]"
            git push origin HEAD:main || echo 'REPORT_COMMIT_CONFLICT; installation stage remains separately logged'
          fi
