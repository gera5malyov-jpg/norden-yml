name: Audit NetAngels temporary SSH slots
on:
  push:
    branches: [feature/universal-yml-import-20261015]
    paths: [.github/workflows/audit-netangels-ssh-slots.yml, scripts/audit_netangels_ephemeral_keys.py]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -u scripts/audit_netangels_ephemeral_keys.py
