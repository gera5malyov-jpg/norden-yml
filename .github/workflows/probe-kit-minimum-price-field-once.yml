name: Probe KIT minimum price field once

on:
  push:
    branches:
      - feat/riva-kit-sync
    paths:
      - '.github/workflows/probe-kit-minimum-price-field-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe accepted price field names using nonexistent variant
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          token=os.environ['YANDEX_KIT_TOKEN'].strip()
          endpoint='https://api.kit.yandex.net/v1/variants/prices/bulk_update'
          candidates=['minimum_price','min_price','manual_minimum_price','minimum_allowed_price']
          for field in candidates:
              body={'items':[{
                  'variant_id':'00000000-0000-0000-0000-000000000000',
                  'price':'180.00',
                  'manual_discount_price':'126.00',
                  field:'120.00',
              }]}
              req=urllib.request.Request(
                  endpoint,
                  data=json.dumps(body).encode(),
                  method='POST',
                  headers={
                      'Authorization':f'Bearer {token}',
                      'Accept':'application/json',
                      'Content-Type':'application/json',
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      text=r.read().decode('utf-8','replace')[:1000]
                      print('FIELD',field,'STATUS',r.status,'BODY',text)
              except urllib.error.HTTPError as e:
                  text=e.read().decode('utf-8','replace')[:1500]
                  print('FIELD',field,'STATUS',e.code,'BODY',text)
          PY
