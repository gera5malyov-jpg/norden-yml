name: Inspect KIT Norden media

on:
  push:
    branches: [main]
    paths:
      - kit-norden-media-inspect.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect one Norden variant media
        run: |
          python3 - <<'PY'
          import os, json, requests
          h={'Authorization':'Bearer '+os.environ['YANDEX_KIT_TOKEN'],'Accept':'application/json'}
          base='https://api.kit.yandex.net'
          r=requests.get(base+'/v1/variants',headers=h,params={'name':'AF-31662421','page':1,'per_page':100},timeout=60)
          r.raise_for_status()
          d=r.json()
          rows=d.get('items') or d.get('results') or d.get('variants') or d.get('data') or []
          if isinstance(rows,dict): rows=rows.get('items') or []
          rows=[x for x in rows if isinstance(x,dict) and str(x.get('sku') or '').strip()=='AF-31662421']
          print('MATCHES=',len(rows))
          for x in rows[:1]:
              vid=x.get('id')
              rr=requests.get(base+f'/v1/variants/{vid}',headers=h,timeout=60)
              rr.raise_for_status()
              full=rr.json()
              media=full.get('media') or []
              print('FULL_MEDIA=',json.dumps(media,ensure_ascii=False,indent=2))
              if media:
                  fid=media[0].get('image_id')
                  for path in [
                      f'/v1/files/{fid}',
                      f'/v1/files/{fid}/download',
                      f'/v1/files/{fid}/url'
                  ]:
                      resp=requests.get(base+path,headers=h,timeout=60,allow_redirects=False)
                      print('FILE_TEST',path,'HTTP',resp.status_code,'CTYPE',resp.headers.get('Content-Type'),'LOCATION',resp.headers.get('Location'))
                      print('BODY',resp.text[:1000] if 'json' in (resp.headers.get('Content-Type') or '') or 'text' in (resp.headers.get('Content-Type') or '') else '<binary>')
          PY
