name: Build full Ozon catalog 3x4 queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ozon-build-full-catalog-queue.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - run: python -m pip install --disable-pip-version-check requests

      - name: Build complete oldest-to-newest queue
        run: python ozon/catalog_3x4/build_selection.py

      - name: Commit queue
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ozon/catalog_3x4/selection.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: rebuild full Ozon 3x4 queue including archive [skip ci]"
            git push
          fi

# rebuild complete queue
