name: Inspect Norden fallback XML once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-norden-fallback-xml-once.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect XML structure
        run: |
          python - <<'PY'
          import json, os, urllib.request, xml.etree.ElementTree as ET
          urls={
            'full_xml':'https://norden.group/index.php?dispatch=sw_user_prices.get_file&file=Norden.xml',
            'price_xml':'https://norden.group/index.php?dispatch=sw_user_prices.get_file&file=Norden.group+-K8%25.xml',
          }
          def clean(s):
              return (s or '').strip().replace('\r',' ').replace('\n',' ')[:500]
          def flatten(el, depth=0, max_depth=4, out=None):
              if out is None: out=[]
              if depth>max_depth: return out
              out.append({'depth':depth,'tag':el.tag,'attrs':dict(el.attrib),'text':clean(el.text)})
              for ch in list(el)[:80]:
                  flatten(ch,depth+1,max_depth,out)
              return out
          report={}
          for name,url in urls.items():
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=120).read()
              root=ET.fromstring(data)
              parent={c:p for p in root.iter() for c in p}
              match=None
              for el in root.iter():
                  vals=[el.text or '']+list(el.attrib.values())
                  if any('RT-2031' in str(v) for v in vals):
                      match=el; break
              ancestor=match
              if match is not None:
                  for _ in range(4):
                      p=parent.get(ancestor)
                      if p is None: break
                      ancestor=p
              report[name]={
                'bytes':len(data),
                'root_tag':root.tag,
                'root_attrs':dict(root.attrib),
                'top_children':[{'tag':c.tag,'attrs':dict(c.attrib),'text':clean(c.text)} for c in list(root)[:20]],
                'rt2031_match': None if match is None else {'tag':match.tag,'attrs':dict(match.attrib),'text':clean(match.text)},
                'rt2031_context': [] if match is None else flatten(ancestor,max_depth=6)[:250],
              }
          os.makedirs('norden-kit',exist_ok=True)
          with open('norden-kit/fallback_xml_structure.json','w',encoding='utf-8') as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          print(json.dumps(report,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add norden-kit/fallback_xml_structure.json
          git commit -m "Inspect Norden fallback XML structure" || exit 0
          git pull --rebase
          git push
