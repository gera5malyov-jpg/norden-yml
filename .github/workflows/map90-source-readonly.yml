name: Map90 contact template read-only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map90-source-readonly.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python storefront/map90_contact_template_readonly.py
