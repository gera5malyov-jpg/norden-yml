name: Ozon bind Norden to declaration 3123534

on:
  push:
    paths:
      - 'ozon/certificates/norden-bind-trigger.txt'

permissions:
  contents: write

concurrency:
  group: ozon-norden-certificate-3123534
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Ozon credentials
        shell: bash
        run: |
          test -n "$OZON_CLIENT_ID"
          test -n "$OZON_API_KEY"
      - name: Bind Norden products
        run: python ozon/certificates/bind_norden.py
      - name: Save report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ozon/certificates/norden_bind_report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Сохранить результат привязки Norden к декларации Ozon"
            git push
          fi
