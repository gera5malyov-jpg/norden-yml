name: Ozon Vario 2 quality-document check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-vario2-quality-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check AF-31364181 only (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,time,sys
          H={"Client-Id":os.environ["OZON_CLIENT_ID"],"Api-Key":os.environ["OZON_API_KEY"],"Content-Type":"application/json"}
          def post(path,data):
              for i in range(3):
                  req=urllib.request.Request("https://api-seller.ozon.ru"+path,data=json.dumps(data,ensure_ascii=False).encode(),headers=H,method="POST")
                  try:
                      with urllib.request.urlopen(req,timeout=45) as resp:return json.load(resp)
                  except urllib.error.HTTPError as e:
                      body=e.read().decode("utf-8","replace")
                      if (e.code==429 or e.code>=500) and i<2:time.sleep(2**i);continue
                      print("ERROR",path,e.code,body[:1000]);return {"error":body,"http_status":e.code}
          offer="AF-31364181"
          r=post("/v3/product/info/list",{"offer_id":[offer]})
          items=r.get("items") or (r.get("result") or {}).get("items") or []
          print("PRODUCT_LOOKUP",json.dumps(r,ensure_ascii=False)[:8000])
          if not items:sys.exit("Ozon API did not return the exact offer_id")
          p=items[0]
          pid=int(p.get("id") or p.get("product_id") or 0)
          print("TARGET",json.dumps({"offer_id":p.get("offer_id"),"id":pid,"sku":p.get("sku"),"statuses":p.get("statuses"),"visibility_details":p.get("visibility_details"),"errors":p.get("errors"),"name":p.get("name")},ensure_ascii=False)[:8000])
          if pid:
              a=post("/v4/product/info/attributes",{"filter":{"product_id":[pid],"visibility":"ALL"},"limit":100})
              results=a.get("result") or []
              for one in results:
                  atts=[{"id":x.get("id"),"values":x.get("values")} for x in one.get("attributes") or [] if int(x.get("id") or 0) in (85,22232,9048)]
                  print("ATTRIBUTES",json.dumps({"name":one.get("name"),"offer_id":one.get("offer_id"),"atts":atts},ensure_ascii=False)[:4000])
          cert=post("/v1/product/certificate/products/list",{"certificate_id":5483296,"limit":1000})
          rows=(cert.get("result") or {}).get("items") or []
          hits=[x for x in rows if int(x.get("product_id") or 0)==pid]
          print("CERTIFICATE_LINK",json.dumps({"certificate_id":5483296,"returned_count":len(rows),"target":hits,"target_found":bool(hits),"raw_meta":{k:v for k,v in (cert.get("result") or {}).items() if k!="items"}},ensure_ascii=False)[:8000])
          PY
