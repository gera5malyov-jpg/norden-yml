name: Ozon ensure promotion controls and pricing strategy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ozon-ensure-controls-20261029.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
concurrency:
  group: ozon-ensure-controls
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - run: pip install requests
      - name: Apply and verify controls for catalog
        env:
          CLIENT: ${{ secrets.OZON_CLIENT_ID }}
          KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python - <<'PY'
          import os,requests,json,time
          s=requests.Session();s.headers.update({'Client-Id':os.environ['CLIENT'],'Api-Key':os.environ['KEY'],'Content-Type':'application/json'})
          def api(path,body):
              for attempt in range(12):
                  try:r=s.post('https://api-seller.ozon.ru'+path,json=body,timeout=120)
                  except requests.RequestException:
                      time.sleep(2+attempt);continue
                  if r.status_code in (429,500,502,503,504):
                      time.sleep(2+attempt);continue
                  try:d=r.json() if r.content else {}
                  except:d={'message':r.text[:200]}
                  if r.status_code>=400:print('API_ERROR',path,r.status_code,str(d)[:500],flush=True)
                  return r.status_code,d
              return 599,{}
          def batches(a,n):
              for i in range(0,len(a),n):yield a[i:i+n]
          def catalog():
              out=[];seen=set();cursor=''
              while True:
                  status,d=api('/v5/product/info/prices',{'cursor':cursor,'filter':{'visibility':'ALL'},'limit':1000})
                  if status>=400:raise RuntimeError('Catalog read failed')
                  rows=d.get('items') or []
                  for x in rows:
                      if x.get('product_id') is not None and x['product_id'] not in seen:
                          seen.add(x['product_id']);out.append(x)
                  nxt=d.get('cursor') or ''
                  if not rows or not nxt or nxt==cursor:break
                  cursor=nxt
              return out
          def amount(v):
              try:return float(v or 0)
              except:return 0
          report={'floor_fixed':[],'floor_failed':[],'flag_updated':0,'flag_failed':[],'attached':0,'attach_failed':[],'timer_fail':0}
          products=catalog()
          # An existing price floor is never decreased. For the five missing floors,
          # use their current Ozon price so automated discounts cannot undercut it.
          for x in products:
              p=x.get('price') or {}
              if amount(p.get('min_price'))>0:continue
              oid=str(x.get('offer_id') or '');v=amount(p.get('price'))
              if not oid or v<=0:
                  report['floor_failed'].append(oid);continue
              val=str(int(v)) if v.is_integer() else str(v)
              status,d=api('/v1/product/import/prices',{'prices':[{'offer_id':oid,'min_price':val}]})
              if status<400 and any(z.get('updated') for z in d.get('result') or []):report['floor_fixed'].append(oid)
              else:report['floor_failed'].append(oid)
          products=catalog()
          protected=[x for x in products if amount((x.get('price') or {}).get('min_price'))>0 and amount((x.get('price') or {}).get('price'))>0 and x.get('offer_id')]
          status,d=api('/v1/pricing-strategy/list',{'page':1,'limit':49})
          if status>=400:raise RuntimeError('Strategies unavailable')
          strategies=d.get('strategies') or []
          preferred=[x for x in strategies if x.get('type')=='MIN_EXT_PRICE' and x.get('enabled')]
          if len(preferred)!=1:raise RuntimeError('No unique preferred strategy')
          selected=str(preferred[0]['id']);assigned=set()
          for strat in strategies:
              if not strat.get('id'):continue
              code,rows=api('/v1/pricing-strategy/products/list',{'strategy_id':str(strat['id'])})
              if code>=400:raise RuntimeError('Cannot inspect existing strategy assignment')
              assigned.update(str(z) for z in (rows.get('result') or {}).get('product_id') or [])
          missing=[str(x['product_id']) for x in protected if str(x['product_id']) not in assigned]
          for group in batches(missing,100):
              code,d=api('/v1/pricing-strategy/products/add',{'strategy_id':selected,'product_id':group})
              res=d.get('result') or {}
              if code<400 and not res.get('failed_product_count'):report['attached']+=len(group)
              else:report['attach_failed'].append({'count':len(group),'error':str(res)[:250]})
          # Sending flags only preserves all numeric prices.
          for group in batches(protected,250):
              payload={'prices':[{'offer_id':str(x['offer_id']),'auto_action_enabled':'ENABLED','auto_add_to_ozon_actions_list_enabled':'ENABLED','min_price_for_auto_actions_enabled':True,'price_strategy_enabled':'ENABLED'} for x in group]}
              code,d=api('/v1/product/import/prices',payload)
              results={str(z.get('offer_id')):z for z in d.get('result') or []}
              for x in group:
                  oid=str(x['offer_id'])
                  if code<400 and results.get(oid,{}).get('updated'):report['flag_updated']+=1
                  else:report['flag_failed'].append(oid)
          for group in batches([str(x['product_id']) for x in protected],1000):
              code,d=api('/v1/product/action/timer/update',{'product_ids':group})
              if code>=400:report['timer_fail']+=len(group)
          time.sleep(5)
          final=catalog()
          report['total']=len(final)
          report['auto_action_off']=sum(not (x.get('price') or {}).get('auto_action_enabled') for x in final)
          report['auto_add_off']=sum(not (x.get('price') or {}).get('auto_add_to_ozon_actions_list_enabled') for x in final)
          report['no_floor']=sum(amount((x.get('price') or {}).get('min_price'))<=0 for x in final)
          new_assigned=set()
          for strat in strategies:
              if not strat.get('id'):continue
              code,rows=api('/v1/pricing-strategy/products/list',{'strategy_id':str(strat['id'])})
              if code<400:new_assigned.update(str(z) for z in (rows.get('result') or {}).get('product_id') or [])
          report['without_strategy']=sum(str(x['product_id']) not in new_assigned for x in final)
          print('FINAL_REPORT_JSON',json.dumps(report,ensure_ascii=False,sort_keys=True),flush=True)
          if any((report['auto_action_off'],report['auto_add_off'],report['no_floor'],report['without_strategy'],report['timer_fail'],len(report['flag_failed']),len(report['attach_failed']))):
              raise SystemExit('Review failures in FINAL_REPORT_JSON')
          PY
