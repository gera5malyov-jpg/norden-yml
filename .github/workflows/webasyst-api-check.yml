name: Webasyst API check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webasyst-api-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Verify secret exists
        env:
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: |
          if [ -z "$WEBASYST_API_TOKEN" ]; then
            echo "::error::Repository secret WEBASYST_API_TOKEN is not configured."
            exit 1
          fi

      - name: Check Webasyst API
        env:
          WEBASYST_BASE_URL: https://profikompany.ru
          WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
        run: python webasyst/check_connection.py
