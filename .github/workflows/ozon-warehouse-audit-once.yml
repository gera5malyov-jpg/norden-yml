name: Ozon Norden MSK audit once

on:
  push:
    paths:
      - ".github/workflows/ozon-warehouse-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - name: Audit Norden MSK warehouse
        shell: bash
        run: |
          set -euo pipefail
          WID=1020005029910180

          printf '{"limit":200,"warehouse_ids":[%s]}' "$WID" > /tmp/warehouse_req.json
          curl --fail --silent --show-error \
            --request POST "https://api-seller.ozon.ru/v2/warehouse/list" \
            --header "Client-Id: $OZON_CLIENT_ID" \
            --header "Api-Key: $OZON_API_KEY" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/warehouse_req.json \
            > /tmp/warehouse.json

          echo "WAREHOUSE:"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/warehouse.json'))
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY

          printf '{"filter":{"warehouse_id":%s},"limit":100}' "$WID" > /tmp/methods_req.json
          curl --fail --silent --show-error \
            --request POST "https://api-seller.ozon.ru/v2/delivery-method/list" \
            --header "Client-Id: $OZON_CLIENT_ID" \
            --header "Api-Key: $OZON_API_KEY" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/methods_req.json \
            > /tmp/methods.json

          echo "DELIVERY_METHODS:"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/methods.json'))
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
