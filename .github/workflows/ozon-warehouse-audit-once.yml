name: Ozon Norden MSK delivery audit once

on:
  push:
    paths:
      - ".github/workflows/ozon-warehouse-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
      OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
    steps:
      - name: Audit Norden MSK delivery polygons
        shell: bash
        run: |
          set -euo pipefail
          WID=1020005029910180
          MID=46440111

          printf '{"delivery_method_id":%s,"warehouse_id":%s}' "$MID" "$WID" > /tmp/polygon_req.json
          code=$(curl --silent --show-error --output /tmp/polygons.json --write-out "%{http_code}" \
            --request POST "https://api-seller.ozon.ru/v1/polygon/list" \
            --header "Client-Id: $OZON_CLIENT_ID" \
            --header "Api-Key: $OZON_API_KEY" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/polygon_req.json)
          echo "POLYGON_LIST_HTTP=$code"
          cat /tmp/polygons.json
