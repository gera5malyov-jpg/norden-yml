name: Storefront Stage 20 - Conversion and brands audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage20-conversion-audit.yml'
      - 'storefront/stage20_conversion_admin_audit.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile storefront/stage20_conversion_admin_audit.py
      - run: python3 storefront/stage20_conversion_admin_audit.py
