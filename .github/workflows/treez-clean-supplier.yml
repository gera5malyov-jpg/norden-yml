name: TREEZ — убрать Поставщик из KIT

on:
  workflow_run:
    workflows: ["Treez → KIT — каталог раз в 2 недели"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'treez-kit/cleanup_supplier_characteristic.py'
      - '.github/workflows/treez-clean-supplier.yml'

permissions:
  contents: write

concurrency:
  group: treez-clean-supplier
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: python -m pip install --disable-pip-version-check requests openpyxl

      - name: Удалить характеристику Поставщик у TREEZ
        env:
          YANDEX_KIT_TOKEN: ${{ secrets.YANDEX_KIT_TOKEN }}
        run: python treez-kit/cleanup_supplier_characteristic.py

      - name: Сохранить отчёт
        if: always()
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          cp treez-kit/supplier_cleanup_report.json /tmp/treez-supplier-cleanup.json 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/treez-supplier-cleanup.json treez-kit/supplier_cleanup_report.json 2>/dev/null || true
          git add treez-kit/supplier_cleanup_report.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Обновить отчёт очистки Поставщик TREEZ'
          git push origin HEAD:main || true
