name: Storefront Stage 49 - Complete public CMS contact phone coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage49-cms-contacts.yml'
      - 'storefront/stage49_cms_public_contacts.py'
permissions:
  contents: read
concurrency:
  group: storefront-cms-contacts
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scoped update script
        run: python -m py_compile storefront/stage49_cms_public_contacts.py
      - name: Back up two CMS pages, add both phone numbers, smoke test and roll back on failure
        run: python storefront/stage49_cms_public_contacts.py
