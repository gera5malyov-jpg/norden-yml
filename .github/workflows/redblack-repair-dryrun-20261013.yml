name: Red-Black existing catalog repair dry-run (no writes)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/redblack-repair-dryrun-20261013.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      WEBASYST_BASE_URL: https://profikompany.ru
      WEBASYST_API_TOKEN: ${{ secrets.WEBASYST_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Python syntax check
        run: python -m py_compile scripts/repair_redblack_zero_prices_images.py
      - name: Dry-run prices and images migration
        run: python scripts/repair_redblack_zero_prices_images.py --backup redblack-backup-preview.json --report redblack-repair-preview.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redblack-migration-readonly-preview
          path: |
            redblack-backup-preview.json
            redblack-repair-preview.json
          if-no-files-found: warn
