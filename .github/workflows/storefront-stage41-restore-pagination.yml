name: Storefront Stage 41 - Restore paginated category pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storefront-stage41-restore-pagination.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NETANGELS_API_KEY: ${{ secrets.NETANGELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax validation
        run: python -m py_compile storefront/stage41_restore_pagination_cache.py
      - name: Force verified healthy template recompile and check page 2
        run: python storefront/stage41_restore_pagination_cache.py
