name: KIT Google credential probe once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kit-google-credential-probe-once.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Google credential presence
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON=PRESENT"
          else
            echo "GOOGLE_SERVICE_ACCOUNT_JSON=MISSING"
          fi
