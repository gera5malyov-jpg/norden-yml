services:
  playwright:
    image: mcr.microsoft.com/playwright/mcp
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    entrypoint: ["node", "/app/cli.js"]
    command:
      - "--headless"
      - "--browser"
      - "chromium"
      - "--no-sandbox"
      - "--port"
      - "8931"
      - "--host"
      - "0.0.0.0"
      - "--allowed-hosts"
      - "*"
      - "--user-data-dir"
      - "/data/profile"
      - "--shared-browser-context"
      - "--idle-timeout"
      - "0"
      - "--timeout-action"
      - "10000"
      - "--timeout-navigation"
      - "90000"
      - "--output-dir"
      - "/data/output"
      - "--image-responses"
      - "allow"
      - "--no-webmcp"
    volumes:
      - ./browser-profile:/data/profile
      - ./playwright-output:/data/output
    expose:
      - "8931"

  auth:
    image: python:3.12-slim
    restart: unless-stopped
    environment:
      MCP_BASE_URL: "https://${MCP_HOST}"
      LOGIN_PASSWORD: "${LOGIN_PASSWORD}"
      STATE_FILE: "/data/state.json"
    volumes:
      - ./auth_server.py:/app/auth_server.py:ro
      - ./auth-data:/data
    command: ["python", "/app/auth_server.py"]
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - auth
      - playwright
    environment:
      MCP_HOST: "${MCP_HOST}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
