server {
    listen 45.86.180.49:80;
    server_name browser-45-86-180-49.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chatgpt-browser-acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 45.86.180.49:443 ssl;
    server_name browser-45-86-180-49.sslip.io;

    ssl_certificate /etc/nginx/ssl/chatgpt-browser/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/chatgpt-browser/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location = /_mcp_validate {
        internal;
        proxy_pass http://127.0.0.1:18000/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    location /mcp {
        auth_request /_mcp_validate;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://127.0.0.1:18931;
    }

    location /.well-known/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:18000;
    }

    location = /authorize {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:18000;
    }

    location = /token {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:18000;
    }

    location = /register {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:18000;
    }

    location = /health {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:18000;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:18000;
    }
}
